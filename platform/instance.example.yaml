# Instance settings. Copy to instance.yaml (ignored by git). Secrets are not
# written here: settings ending in Env name an environment variable instead.
name: Globulation 2

guests:
  enabled: true

# Sign-in. Every provider's redirect URI is <PUBLIC_ORIGIN>/auth/<id>/callback.
auth:
  providers:
    - id: google
      kind: oidc
      preset: google
      displayName: Google
      clientId: your-client-id.apps.googleusercontent.com
      clientSecretEnv: GOOGLE_CLIENT_SECRET
    # - id: microsoft
    #   kind: oidc
    #   preset: microsoft
    #   tenant: common            # or consumers, organizations, a tenant id
    #   displayName: Microsoft
    #   clientId: 00000000-0000-0000-0000-000000000000
    #   clientSecretEnv: MICROSOFT_CLIENT_SECRET
    # - id: forgejo               # any OpenID Connect issuer
    #   kind: oidc
    #   issuer: https://code.example.org
    #   displayName: Example Code
    #   clientId: glob2
    #   clientSecretEnv: FORGEJO_CLIENT_SECRET
    # - id: apple
    #   kind: apple
    #   displayName: Apple
    #   clientId: org.example.glob2.signin   # Services ID
    #   teamId: ABCDE12345
    #   keyId: KEY1234567
    #   privateKeyEnv: APPLE_SIGNIN_KEY      # contents of the .p8 key
  # Username and password accounts (argon2id), for instances without SSO.
  local:
    enabled: false
    # allowRegistration: true
  # accessTokenMinutes: 10
  # refreshTokenDays: 60
  # handoffMinutes: 10
  # webSessionDays: 30

# accounts:
#   renameIntervalDays: 30   # 0: no limit

# Extra browser origins allowed to use /realtime and cookie sessions (the
# PUBLIC_ORIGIN is always allowed; native clients send no Origin).
# web:
#   allowedOrigins: [https://web.example.org]

# Per-replica limits (defaults shown).
# limits:
#   authPerMinute: 30
#   guestsPerHour: 20
#   apiPerMinute: 600
#   realtimePerSecond: 10
#   realtimeBurst: 40
#   realtimeConnectionsPerIp: 20

# AccessPolicy implementation gating hosting, joining and queueing.
access:
  policy: allow-all

# Quick-match queues. Each rated queue is its own ladder (named by the id).
# Omitted settings take the defaults in docs/multiplayer/ratings-and-matchmaking.md;
# without mapPool a queue uses the 128x128 fair-by-construction generators.
queues:
  - id: ranked-1v1
    name: Ranked 1v1
    mode: 1v1
    rated: true
    # Seats still empty after this many seconds are filled with the AI whose
    # rating on this ladder is closest (players can opt out). Omit to never backfill.
    aiBackfillSeconds: 90
    # All-human ranked groups must accept within this many seconds (default 10
    # for rated queues, 0 = start at once).
    acceptSeconds: 10
    declineCooldownSeconds: 60
    # Soft relay preference: players sharing a relay within initialMs (+ perSecondMs
    # per second waited) are paired first; after anyRegionAfterSeconds any relay
    # will do. Round trips never make a player unmatchable: the group always plays
    # on the best relay that exists, even a far one.
    rttPreference: { initialMs: 100, perSecondMs: 5, anyRegionAfterSeconds: 30 }
    # maxRttMs: 150   # opt-in hard cap, off by default; only for instances with
    #                 # relays near every player (others then rely on AI backfill)
    ratingWindow: { initial: 100, perSecond: 5, max: 800 }
  - id: ranked-2v2
    name: Ranked 2v2
    mode: 2v2
    rated: true
    aiBackfillSeconds: 120
  - id: casual-1v1
    name: Casual 1v1
    mode: 1v1
    rated: false
    aiBackfillSeconds: 45
    mapPool:
      - generatorId: even-ground
        revision: 2
        params: { width: 7, height: 7, teams: 2 }
        candidates: 5
        startingUnitLevel: 0
