<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2f6526" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1229" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Globulation 2 online: play the free real-time strategy game in your browser, climb the leaderboards and share maps."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/glob2-sans.woff2" as="font" type="font/woff2" crossorigin />
    <title>Globulation 2</title>
    <script>
      // Apply a stored theme choice before the first paint (theme.tsx owns it afterwards).
      try {
        var t = localStorage.getItem('glob2-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
