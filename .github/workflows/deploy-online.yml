name: Deploy app.glob2online.com

# Public source of truth; runs only in the owner's mirror genixpro/glob2-release.
# Mirror a reviewed commit there: every job below is skipped in any other
# repository, for any other actor, and off the mirror's master branch.
#
# A dispatch deploys `ref` (default: the newest public commit the mirror's master
# contains). A push to the mirror's master deploys that commit when the
# repository variable AUTO_DEPLOY_ONLINE is 'true'. The deploy itself runs
# detached on the host (deploy/online-deploy.sh starts deploy/update-host.sh),
# so a cancelled run never interrupts it. See docs/hosting/README.md,
# "Automatic deployment".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit to deploy: 'master' for the newest public commit in this mirror's
          master, or a public Globulation2/glob2 branch, tag or full commit id
          (e.g. the previous deployed revision to roll back)
        required: true
        default: master
        type: string
      allow_unmerged:
        description: Allow a ref that is not on public master
        required: false
        default: false
        type: boolean
  push:
    branches: [master]

permissions:
  contents: read

# One deploy at a time. A deploy in progress is never cancelled; a newer
# request replaces one that is still waiting.
concurrency:
  group: deploy-online
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the commit to deploy
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY_ONLINE == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - name: Resolve and check the commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref || 'master' }}
          ALLOW_UNMERGED: ${{ inputs.allow_unmerged && 'true' || 'false' }}
          MIRROR: ${{ github.repository }}
          MIRROR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          public=https://github.com/Globulation2/glob2.git
          git init -q resolve && cd resolve
          # Commits only: enough for ancestry, a few MB.
          git fetch -q --filter=tree:0 "$public" +refs/heads/master:refs/remotes/public/master
          if [ "$EVENT" = push ] || [ "$REF" = master ]; then
            # The mirror's master merges reviewed public commits; the host can
            # only check out public ones, so deploy the newest it contains.
            git fetch -q --filter=tree:0 "https://github.com/$MIRROR.git" "$MIRROR_SHA"
            if ! commit=$(git merge-base "$MIRROR_SHA" public/master); then
              echo "::error::$MIRROR master ($MIRROR_SHA) contains no public master commit"
              exit 1
            fi
            source="newest public master commit in $MIRROR master ${MIRROR_SHA:0:12}"
          else
            if ! [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::ref '$REF' is not a branch, tag or commit id"
              exit 1
            fi
            if ! git fetch -q --filter=tree:0 "$public" "$REF"; then
              echo "::error::'$REF' is not a branch, tag or full commit id of Globulation2/glob2"
              exit 1
            fi
            commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            source="ref $REF"
            if git merge-base --is-ancestor "$commit" public/master; then
              source+=" (on public master)"
            elif [ "$ALLOW_UNMERGED" = true ]; then
              source+=" (NOT on public master; allowed by allow_unmerged)"
            else
              echo "::error::$REF ($commit) is not on public master; re-run with allow_unmerged to deploy it anyway"
              exit 1
            fi
          fi
          subject=$(git log -1 --format=%s "$commit")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Deploying $commit $subject"
          echo "Source: $source"
          {
            echo "### Deploy target"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | [\`${commit:0:12}\`](https://github.com/Globulation2/glob2/commit/$commit) $subject |"
            echo "| Source | $source |"
            echo "| Trigger | $EVENT by $GITHUB_TRIGGERING_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to app.glob2online.com
    needs: preflight
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # Mostly waiting: the host rebuilds the images and the web client (30-50 min).
    timeout-minutes: 120
    environment:
      name: online-production
      url: https://app.glob2online.com
    permissions:
      contents: read
      id-token: write
    env:
      GLOB2_ONLINE_PROJECT: ${{ vars.GLOB2_ONLINE_PROJECT }}
      GLOB2_ONLINE_ZONE: ${{ vars.GLOB2_ONLINE_ZONE }}
      GLOB2_ONLINE_INSTANCE: ${{ vars.GLOB2_ONLINE_INSTANCE }}
      GLOB2_ONLINE_SSH_USER: ${{ vars.GLOB2_ONLINE_SSH_USER }}
      ENV_FILE: ${{ vars.GLOB2_ONLINE_ENV_FILE }}
      WEBSITE: ${{ vars.GLOB2_ONLINE_WEBSITE }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - name: Check configuration
        env:
          PROVIDER: ${{ vars.GLOB2_ONLINE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GLOB2_ONLINE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in PROVIDER SERVICE_ACCOUNT GLOB2_ONLINE_PROJECT GLOB2_ONLINE_ZONE \
                      GLOB2_ONLINE_INSTANCE GLOB2_ONLINE_SSH_USER ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable for $name is not set (see docs/hosting/README.md)"
              exit 1
            fi
          done
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOB2_ONLINE_WIF_PROVIDER }}
          service_account: ${{ vars.GLOB2_ONLINE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GLOB2_ONLINE_PROJECT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Add a short-lived SSH key
        run: |
          set -euo pipefail
          KEY=$RUNNER_TEMP/online-deploy-key
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          ssh-keygen -q -t ed25519 -N '' -C glob2-online-deploy -f "$KEY"
          python3 deploy/online_remote.py add-key --key "$KEY.pub" --hours 3
      - name: Check the host
        id: host
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 deploy/online_remote.py run --key "$KEY" -- current "$ENV_FILE" "$COMMIT" | tee "$RUNNER_TEMP/current"
          deployed=$(sed -n 's/^deployed=//p' "$RUNNER_TEMP/current")
          echo "previous=$deployed" >> "$GITHUB_OUTPUT"
          if grep -qx 'busy=yes' "$RUNNER_TEMP/current"; then
            echo "::error::another deploy is running on the host; not starting (re-run once it has finished)"
            exit 1
          fi
          # An automatic deploy never moves the host back to an older commit
          # (a stale mirror); a dispatch can, to roll back.
          if [ "$EVENT" = push ] && grep -qx 'contains=yes' "$RUNNER_TEMP/current"; then
            echo "::notice::the deployed $deployed already contains $COMMIT; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the deploy on the host
        id: start
        if: steps.host.outputs.skip != 'true'
        run: python3 deploy/online_remote.py run --key "$KEY" -- start "$ENV_FILE" "$COMMIT" "$RUN"
      - name: Wait for the deploy
        id: wait
        if: steps.host.outputs.skip != 'true'
        timeout-minutes: 110
        run: |
          set -uo pipefail
          polls=0
          while true; do
            sleep 60
            polls=$((polls + 1))
            if ! python3 deploy/online_remote.py run --key "$KEY" -- status "$ENV_FILE" "$RUN" > "$RUNNER_TEMP/status"; then
              echo "status check failed; retrying"
              continue
            fi
            state=$(sed -n 's/^state=//p' "$RUNNER_TEMP/status")
            if [ "$state" != running ]; then
              break
            fi
            if [ $((polls % 5)) -eq 0 ]; then
              echo "[$polls min] $(python3 deploy/online_remote.py run --key "$KEY" -- log "$ENV_FILE" "$RUN" 1 || true)"
            fi
          done
          cat "$RUNNER_TEMP/status"
          status=$(sed -n 's/^exit=//p' "$RUNNER_TEMP/status")
          if [ "$state" != "done" ] || [ "$status" != 0 ]; then
            echo "::group::End of the deploy log"
            python3 deploy/online_remote.py run --key "$KEY" -- log "$ENV_FILE" "$RUN" 80 || true
            echo "::endgroup::"
            echo "::error::the deploy finished as '$state' with exit '$status' (rollback: $(sed -n 's/^rollback=//p' "$RUNNER_TEMP/status"))"
            exit 1
          fi
      - name: Smoke test the live stack
        id: smoke
        if: steps.host.outputs.skip != 'true'
        run: python3 deploy/online_remote.py run --key "$KEY" -- smoke "$ENV_FILE" "$RUN" "$WEBSITE"
      - name: Summarize
        if: always() && steps.host.outcome == 'success'
        env:
          SKIPPED: ${{ steps.host.outputs.skip }}
          PREVIOUS: ${{ steps.host.outputs.previous }}
          STARTED: ${{ steps.start.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -uo pipefail
          status() { sed -n "s/^$1=//p" "$RUNNER_TEMP/final"; }
          if [ "$SKIPPED" = true ]; then
            echo "Nothing started: the deployed \`$PREVIOUS\` already contains \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 deploy/online_remote.py run --key "$KEY" -- status "$ENV_FILE" "$RUN" > "$RUNNER_TEMP/final" || true
          state=$(status state)
          case "$state:$(status exit)" in
            done:0) result="deployed" ;;
            done:75) result="not started: another deploy held the lock" ;;
            done:*) result="FAILED (exit $(status exit))" ;;
            running:) result="still running on the host (this run stopped waiting)" ;;
            missing:) result="not started ($STARTED)" ;;
            *) result="$state" ;;
          esac
          {
            echo "### Deploy result"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | $result |"
            echo "| Requested | \`$COMMIT\` |"
            echo "| Deployed revision now | \`$(status deployed)\` |"
            echo "| Previous revision | \`${PREVIOUS}\` |"
            echo "| Rollback | $(status rollback) |"
            echo "| Smoke test (--attach) | ${SMOKE} |"
            echo "| Sim version | $(status sim_version) |"
            echo "| Started / finished (UTC) | $(status started) / $(status finished) |"
            echo "| Host backup | $(status backup) |"
            echo "| Host run directory | \`deploys/$RUN\` |"
            echo
            echo "To roll back, dispatch this workflow with \`ref\` = the previous revision."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the SSH key
        if: always()
        run: |
          if [ -n "${KEY:-}" ] && [ -f "$KEY.pub" ]; then
            python3 deploy/online_remote.py remove-key
          fi
