name: Deploy app.glob2.online

# Public source of truth; runs only in the owner's mirror genixpro/glob2-release.
# Mirror a reviewed commit there: every job below is skipped in any other
# repository, for any other actor, and off the mirror's master branch.
#
# A dispatch deploys `ref` (default: the newest public commit the mirror's master
# contains). A push to the mirror's master deploys that commit when the
# repository variable AUTO_DEPLOY_ONLINE is 'true'. The deploy itself runs
# detached on the host (deploy/online-deploy.sh starts deploy/update-host.sh),
# so a cancelled run never interrupts it. See docs/hosting/README.md,
# "Automatic deployment".
#
# With the repository variable GLOB2_ONLINE_IMAGE_REGISTRY set, the images and the
# WebAssembly client are built here, in parallel on GitHub-hosted runners, pushed
# by digest to Artifact Registry, and the host only pulls them
# (deploy/prebuilt_images.py), so a deploy takes minutes on the host instead of
# hours of compiling. The build jobs run in their own environment (online-images)
# whose identity can only push images; only the deploy job (online-production)
# can reach the host. See docs/hosting/upgrades.md, "Prebuilt images".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit to deploy: 'master' for the newest public commit in this mirror's
          master, or a public Globulation2/glob2 branch, tag or full commit id
          (e.g. the previous deployed revision to roll back)
        required: true
        default: master
        type: string
      allow_unmerged:
        description: Allow a ref that is not on public master
        required: false
        default: false
        type: boolean
      build_on_host:
        description: >-
          Build the images on the host instead of pulling CI-built ones (needed to
          roll back to a commit from before prebuilt images)
        required: false
        default: false
        type: boolean
  push:
    branches: [master]

permissions:
  contents: read

# One deploy at a time. A deploy in progress is never cancelled; a newer
# request replaces one that is still waiting.
concurrency:
  group: deploy-online
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the commit to deploy
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY_ONLINE == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      design_system: ${{ steps.target.outputs.design_system }}
      prebuilt: ${{ steps.target.outputs.prebuilt }}
      on_master: ${{ steps.target.outputs.on_master }}
    steps:
      - name: Resolve and check the commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref || 'master' }}
          ALLOW_UNMERGED: ${{ inputs.allow_unmerged && 'true' || 'false' }}
          BUILD_ON_HOST: ${{ inputs.build_on_host && 'true' || 'false' }}
          REGISTRY: ${{ vars.GLOB2_ONLINE_IMAGE_REGISTRY }}
          DESIGN_SYSTEM: ${{ vars.GLOB2_DESIGN_SYSTEM_SHA }}
          MIRROR: ${{ github.repository }}
          MIRROR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          public=https://github.com/Globulation2/glob2.git
          git init -q resolve && cd resolve
          # Commits only: enough for ancestry, a few MB.
          git fetch -q --filter=tree:0 "$public" +refs/heads/master:refs/remotes/public/master
          if [ "$EVENT" = push ] || [ "$REF" = master ]; then
            # The mirror's master merges reviewed public commits; the host can
            # only check out public ones, so deploy the newest it contains.
            git fetch -q --filter=tree:0 "https://github.com/$MIRROR.git" "$MIRROR_SHA"
            if ! commit=$(git merge-base "$MIRROR_SHA" public/master); then
              echo "::error::$MIRROR master ($MIRROR_SHA) contains no public master commit"
              exit 1
            fi
            source="newest public master commit in $MIRROR master ${MIRROR_SHA:0:12}"
          else
            if ! [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::ref '$REF' is not a branch, tag or commit id"
              exit 1
            fi
            if ! git fetch -q --filter=tree:0 "$public" "$REF"; then
              echo "::error::'$REF' is not a branch, tag or full commit id of Globulation2/glob2"
              exit 1
            fi
            commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            source="ref $REF"
            if git merge-base --is-ancestor "$commit" public/master; then
              source+=" (on public master)"
            elif [ "$ALLOW_UNMERGED" = true ]; then
              source+=" (NOT on public master; allowed by allow_unmerged)"
            else
              echo "::error::$REF ($commit) is not on public master; re-run with allow_unmerged to deploy it anyway"
              exit 1
            fi
          fi
          subject=$(git log -1 --format=%s "$commit")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$commit" public/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
          fi
          # One theme revision for every image of this deploy (as update-host.sh resolves it).
          if [ -z "$DESIGN_SYSTEM" ]; then
            DESIGN_SYSTEM=$(git ls-remote https://github.com/Globulation2/glob2-design-system.git refs/heads/main | cut -f1)
          fi
          [[ "$DESIGN_SYSTEM" =~ ^[0-9a-f]{40}$ ]]
          echo "design_system=$DESIGN_SYSTEM" >> "$GITHUB_OUTPUT"
          if [ -n "$REGISTRY" ] && [ "$BUILD_ON_HOST" != true ]; then
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
            build="prebuilt in CI, pushed to $REGISTRY"
          else
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
            build="on the host"
          fi
          echo "Deploying $commit $subject"
          echo "Source: $source"
          {
            echo "### Deploy target"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | [\`${commit:0:12}\`](https://github.com/Globulation2/glob2/commit/$commit) $subject |"
            echo "| Source | $source |"
            echo "| Images | $build |"
            echo "| Trigger | $EVENT by $GITHUB_TRIGGERING_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Build ${{ matrix.group }} images
    needs: preflight
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master' &&
      needs.preflight.outputs.prebuilt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # Its own environment: the identity it gets can push images, nothing else.
    # The build runs this commit's code and its npm dependencies, so it must not
    # be able to reach the host (only online-production can).
    environment:
      name: online-images
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Images built FROM engine-agent share its compile in one builder.
          - group: engine
            targets: engine-agent skin-render-worker ai-map-worker ai-terrain-worker ai-building-worker
          - group: relay
            targets: relay
          - group: platform
            targets: platform music-worker caddy
          - group: ai-music
            targets: ai-music-worker
          - group: web
            targets: web-client
    env:
      COMMIT: ${{ needs.preflight.outputs.commit }}
      DESIGN_SYSTEM: ${{ needs.preflight.outputs.design_system }}
      REGISTRY: ${{ vars.GLOB2_ONLINE_IMAGE_REGISTRY }}
      CACHE: ${{ vars.GLOB2_ONLINE_IMAGE_CACHE }}
      WEBSITE_URL: ${{ vars.GLOB2_ONLINE_BUILD_WEBSITE_URL }}
      DOWNLOAD_URL: ${{ vars.GLOB2_ONLINE_BUILD_DOWNLOAD_URL }}
      TARGETS: ${{ matrix.targets }}
      GROUP: ${{ matrix.group }}
      TAG: ${{ needs.preflight.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The public commit the host will check out, never the mirror's tree. In
      # src/: the auth step writes its credential file into the workspace root,
      # which must never be part of a build context (or the exported cache).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.commit }}
          path: src
          persist-credentials: false
      - name: Check configuration and free disk space
        env:
          SERVICE_ACCOUNT: ${{ vars.GLOB2_ONLINE_IMAGE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in REGISTRY CACHE SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable for $name is not set (see docs/hosting/upgrades.md)"
              exit 1
            fi
          done
          [ "$(git -C src rev-parse HEAD)" = "$COMMIT" ]
          # The engine build tree and images need more than the runner's free space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOB2_ONLINE_WIF_PROVIDER }}
          service_account: ${{ vars.GLOB2_ONLINE_IMAGE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GLOB2_ONLINE_PROJECT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build and push
        working-directory: src
        env:
          # Only reviewed public master commits may write the shared layer cache
          # that later builds trust; an allow_unmerged build only reads it.
          WRITE_CACHE: ${{ needs.preflight.outputs.on_master }}
        run: |
          set -euo pipefail
          # The auth step's credential file must stay outside the build context.
          if [ -n "$(find . -name 'gha-creds-*.json' -print -quit)" ]; then
            echo "::error::a credential file is inside the build context"
            exit 1
          fi
          # The credential helper mints a fresh token for each push, so builds
          # longer than one token's hour still push.
          gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
          docker buildx create --name glob2 --driver docker-container --use > /dev/null
          sim=$(python3 deploy/sim_version.py "$PWD")
          echo "sim version $sim"
          mkdir -p "$RUNNER_TEMP/digests"
          push() {  # target, then buildx arguments
            local target=$1; shift
            docker buildx build "$@" --provenance=false --push \
              --tag "$REGISTRY/$target:$TAG" --metadata-file "$RUNNER_TEMP/$target.json"
            digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/$target.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$target $digest"
            printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$target"
          }
          # Compiler caches between runs, kept as images in the cache repository
          # (never in the Actions cache, which every workflow of the mirror can
          # write). Like the layer cache, only public-master builds update them.
          ccache_image="$CACHE/ccache-$GROUP:latest"
          toolchain_image="$CACHE/web-toolchain:latest"
          case "$GROUP" in
            engine|relay)
              # Into this builder's glob2-ccache cache mount (deploy/ccache.Dockerfile).
              if docker buildx imagetools inspect "$ccache_image" > /dev/null 2>&1; then
                docker buildx build -f deploy/ccache.Dockerfile --target import \
                  --build-arg SEED="$ccache_image" --progress plain deploy
              else
                echo "no compiler cache for $GROUP yet"
              fi
              ;;
            web)
              # The glob2-web-toolchain volume: the SDK, Emscripten's caches and ccache.
              if docker pull -q "$toolchain_image" > /dev/null 2>&1; then
                id=$(docker create "$toolchain_image" none)
                docker cp "$id:/toolchain.tar" "$RUNNER_TEMP/toolchain.tar"
                docker rm "$id" > /dev/null
                docker image rm "$toolchain_image" > /dev/null
                docker run --rm -v glob2-web-toolchain:/toolchain -v "$RUNNER_TEMP:/seed:ro" ubuntu:24.04 \
                  tar -xf /seed/toolchain.tar -C /toolchain
                rm "$RUNNER_TEMP/toolchain.tar"
              else
                echo "no web toolchain cache yet"
              fi
              ;;
          esac
          for target in $TARGETS; do
            if [ "$target" = web-client ]; then
              # The tree update-host.sh would build, as an image holding only files.
              GLOB2_WEB_INSTALL=0 GLOB2_BUILD_JOBS=4 deploy/build-web-client.sh "$RUNNER_TEMP/unused"
              printf 'FROM scratch\nCOPY . /web-client/\n' > "$RUNNER_TEMP/web.Dockerfile"
              push web-client -f "$RUNNER_TEMP/web.Dockerfile" build/emscripten/client/release
              continue
            fi
            cache=(--cache-from "type=registry,ref=$CACHE/$target")
            if [ "$WRITE_CACHE" = true ]; then
              cache+=(--cache-to "type=registry,ref=$CACHE/$target,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true")
            fi
            push "$target" -f deploy/Dockerfile --target "$target" \
              --build-arg JOBS=4 \
              --build-arg GLOB2_DESIGN_SYSTEM_SHA="$DESIGN_SYSTEM" \
              --build-arg GLOB2_SIM_VERSION="$sim" \
              --build-arg GLOB2_WEBSITE_URL="$WEBSITE_URL" \
              --build-arg GLOB2_DOWNLOAD_URL="$DOWNLOAD_URL" \
              "${cache[@]}" \
              .
          done
          printf '%s\n' "$sim" > "$RUNNER_TEMP/digests/sim-version"
          if [ "$WRITE_CACHE" = true ]; then
            case "$GROUP" in
              engine|relay)
                docker buildx build -f deploy/ccache.Dockerfile --target export --build-arg STAMP="$TAG" \
                  --provenance=false --push --tag "$ccache_image" --progress plain deploy
                ;;
              web)
                mkdir -p "$RUNNER_TEMP/toolchain"
                docker run --rm -v glob2-web-toolchain:/toolchain -v "$RUNNER_TEMP/toolchain:/out" ubuntu:24.04 \
                  tar -cf /out/toolchain.tar -C /toolchain .
                printf 'FROM scratch\nCOPY toolchain.tar /toolchain.tar\n' > "$RUNNER_TEMP/toolchain.Dockerfile"
                docker buildx build -f "$RUNNER_TEMP/toolchain.Dockerfile" --provenance=false --push \
                  --tag "$toolchain_image" "$RUNNER_TEMP/toolchain"
                ;;
            esac
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.group }}
          path: ${{ runner.temp }}/digests
          retention-days: 30

  manifest:
    name: Collect the image manifest
    needs: [preflight, images]
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master' &&
      needs.preflight.outputs.prebuilt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: digests
      - name: Merge
        env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
          DESIGN_SYSTEM: ${{ needs.preflight.outputs.design_system }}
          REGISTRY: ${{ vars.GLOB2_ONLINE_IMAGE_REGISTRY }}
          WEBSITE_URL: ${{ vars.GLOB2_ONLINE_BUILD_WEBSITE_URL }}
          DOWNLOAD_URL: ${{ vars.GLOB2_ONLINE_BUILD_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          images, sims = {}, set()
          for group in sorted(Path('digests').iterdir()):
              for item in sorted(group.iterdir()):
                  value = item.read_text().strip()
                  if item.name == 'sim-version':
                      sims.add(value)
                  elif item.name in images:
                      raise SystemExit(f'{item.name} was built twice')
                  else:
                      images[item.name] = value
          if len(sims) != 1:
              raise SystemExit(f'the groups disagree on the sim version: {sorted(sims)}')
          manifest = {
              'version': 1, 'commit': os.environ['COMMIT'], 'simVersion': sims.pop(),
              'designSystem': os.environ['DESIGN_SYSTEM'], 'registry': os.environ['REGISTRY'],
              'buildArgs': {'GLOB2_WEBSITE_URL': os.environ['WEBSITE_URL'],
                            'GLOB2_DOWNLOAD_URL': os.environ['DOWNLOAD_URL']},
              'images': dict(sorted(images.items())),
          }
          Path('images.json').write_text(json.dumps(manifest, indent=1) + '\n')
          PY
          cat images.json
          {
            echo "### Images"
            echo
            echo '```json'
            cat images.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-manifest
          path: images.json
          retention-days: 90

  deploy:
    name: Deploy to app.glob2.online
    needs: [preflight, manifest]
    # After the images, or straight away when the host builds them.
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (needs.manifest.result == 'success' ||
       (needs.manifest.result == 'skipped' && needs.preflight.outputs.prebuilt != 'true')) &&
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # Mostly waiting. With prebuilt images the host only pulls and swaps
    # (minutes); building on the host takes about five hours. GitHub-hosted jobs
    # stop at 360 minutes whatever this says, so the wait below ends first.
    timeout-minutes: 360
    environment:
      name: online-production
      url: https://app.glob2.online
    permissions:
      contents: read
      id-token: write
    env:
      GLOB2_ONLINE_PROJECT: ${{ vars.GLOB2_ONLINE_PROJECT }}
      GLOB2_ONLINE_ZONE: ${{ vars.GLOB2_ONLINE_ZONE }}
      GLOB2_ONLINE_INSTANCE: ${{ vars.GLOB2_ONLINE_INSTANCE }}
      GLOB2_ONLINE_SSH_USER: ${{ vars.GLOB2_ONLINE_SSH_USER }}
      ENV_FILE: ${{ vars.GLOB2_ONLINE_ENV_FILE }}
      WEBSITE: ${{ vars.GLOB2_ONLINE_WEBSITE }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.preflight.outputs.prebuilt == 'true'
        with:
          name: image-manifest
          path: ${{ runner.temp }}/images
      - name: Check configuration
        env:
          PROVIDER: ${{ vars.GLOB2_ONLINE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GLOB2_ONLINE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in PROVIDER SERVICE_ACCOUNT GLOB2_ONLINE_PROJECT GLOB2_ONLINE_ZONE \
                      GLOB2_ONLINE_INSTANCE GLOB2_ONLINE_SSH_USER ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable for $name is not set (see docs/hosting/README.md)"
              exit 1
            fi
          done
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOB2_ONLINE_WIF_PROVIDER }}
          service_account: ${{ vars.GLOB2_ONLINE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GLOB2_ONLINE_PROJECT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Add a short-lived SSH key
        run: |
          set -euo pipefail
          KEY=$RUNNER_TEMP/online-deploy-key
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          ssh-keygen -q -t ed25519 -N '' -C glob2-online-deploy -f "$KEY"
          python3 deploy/online_remote.py add-key --key "$KEY.pub" --hours 6.5
      - name: Check the host
        id: host
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 deploy/online_remote.py run --key "$KEY" -- current "$ENV_FILE" "$COMMIT" | tee "$RUNNER_TEMP/current"
          deployed=$(sed -n 's/^deployed=//p' "$RUNNER_TEMP/current")
          echo "previous=$deployed" >> "$GITHUB_OUTPUT"
          if grep -qx 'busy=yes' "$RUNNER_TEMP/current"; then
            echo "::error::another deploy is running on the host; not starting (re-run once it has finished)"
            exit 1
          fi
          # An automatic deploy never moves the host back to an older commit
          # (a stale mirror); a dispatch can, to roll back.
          if [ "$EVENT" = push ] && grep -qx 'contains=yes' "$RUNNER_TEMP/current"; then
            echo "::notice::the deployed $deployed already contains $COMMIT; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the deploy on the host
        id: start
        if: steps.host.outputs.skip != 'true'
        run: |
          set -euo pipefail
          images=
          if [ -f "$RUNNER_TEMP/images/images.json" ]; then
            images=$(base64 -w0 "$RUNNER_TEMP/images/images.json")
          fi
          python3 deploy/online_remote.py run --key "$KEY" -- start "$ENV_FILE" "$COMMIT" "$RUN" $images
      - name: Wait for the deploy
        id: wait
        if: steps.host.outputs.skip != 'true'
        timeout-minutes: 330
        run: |
          set -uo pipefail
          polls=0
          while true; do
            sleep 60
            polls=$((polls + 1))
            if ! python3 deploy/online_remote.py run --key "$KEY" -- status "$ENV_FILE" "$RUN" > "$RUNNER_TEMP/status"; then
              echo "status check failed; retrying"
              continue
            fi
            state=$(sed -n 's/^state=//p' "$RUNNER_TEMP/status")
            if [ "$state" != running ]; then
              break
            fi
            if [ $((polls % 5)) -eq 0 ]; then
              echo "[$polls min] $(python3 deploy/online_remote.py run --key "$KEY" -- log "$ENV_FILE" "$RUN" 1 || true)"
            fi
          done
          cat "$RUNNER_TEMP/status"
          status=$(sed -n 's/^exit=//p' "$RUNNER_TEMP/status")
          if [ "$state" != "done" ] || [ "$status" != 0 ]; then
            echo "::group::End of the deploy log"
            python3 deploy/online_remote.py run --key "$KEY" -- log "$ENV_FILE" "$RUN" 80 || true
            echo "::endgroup::"
            echo "::error::the deploy finished as '$state' with exit '$status' (rollback: $(sed -n 's/^rollback=//p' "$RUNNER_TEMP/status"))"
            exit 1
          fi
      - name: Smoke test the live stack
        id: smoke
        if: steps.host.outputs.skip != 'true'
        run: python3 deploy/online_remote.py run --key "$KEY" -- smoke "$ENV_FILE" "$RUN" "$WEBSITE"
      - name: Summarize
        if: always() && steps.host.outcome == 'success'
        env:
          SKIPPED: ${{ steps.host.outputs.skip }}
          PREVIOUS: ${{ steps.host.outputs.previous }}
          STARTED: ${{ steps.start.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -uo pipefail
          status() { sed -n "s/^$1=//p" "$RUNNER_TEMP/final"; }
          if [ "$SKIPPED" = true ]; then
            echo "Nothing started: the deployed \`$PREVIOUS\` already contains \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 deploy/online_remote.py run --key "$KEY" -- status "$ENV_FILE" "$RUN" > "$RUNNER_TEMP/final" || true
          state=$(status state)
          case "$state:$(status exit)" in
            done:0) result="deployed" ;;
            done:75) result="not started: another deploy held the lock" ;;
            done:*) result="FAILED (exit $(status exit))" ;;
            running:) result="still running on the host (this run stopped waiting)" ;;
            missing:) result="not started ($STARTED)" ;;
            *) result="$state" ;;
          esac
          {
            echo "### Deploy result"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | $result |"
            echo "| Requested | \`$COMMIT\` |"
            echo "| Deployed revision now | \`$(status deployed)\` |"
            echo "| Previous revision | \`${PREVIOUS}\` |"
            echo "| Rollback | $(status rollback) |"
            echo "| Smoke test (--attach) | ${SMOKE} |"
            echo "| Sim version | $(status sim_version) |"
            echo "| Images | $(status images) |"
            echo "| Started / finished (UTC) | $(status started) / $(status finished) |"
            echo "| Host backup | $(status backup) |"
            echo "| Host run directory | \`deploys/$RUN\` |"
            echo
            echo "To roll back, dispatch this workflow with \`ref\` = the previous revision."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the SSH key
        if: always()
        run: |
          if [ -n "${KEY:-}" ] && [ -f "$KEY.pub" ]; then
            python3 deploy/online_remote.py remove-key
          fi
