name: Publish GitHub desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag at the mirrored HEAD
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-desktop-release
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$TRIGGERING_ACTOR" != genixpro || "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/master ]]; then
            echo '::error::GitHub publication requires a manual dispatch from the release repository master by its owner.'
            exit 1
          fi

  credentials:
    needs: context
    runs-on: ubuntu-24.04
    environment: github-release
    steps:
      - name: Require public-release token
        env:
          RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo '::error::Missing PUBLIC_RELEASE_GH_TOKEN in the github-release environment.'
            exit 1
          fi

  packages:
    needs: credentials
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      build_flatpak: true
    permissions:
      contents: read

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/release-output
      - name: Publish tagged source and packages to public GitHub release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_GH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          cd artifacts/release-output
          rm -f SHA256SUMS
          sha256sum glob2-*.tar.gz glob2-*.zip glob2-*.rpm glob2.flatpak globulation2_*.snap Glob2-*.dmg > SHA256SUMS
          gh release create "$TAG" --repo Globulation2/glob2 \
            --verify-tag --generate-notes \
            glob2-*.tar.gz glob2-*.zip glob2-*.rpm glob2.flatpak globulation2_*.snap Glob2-*.dmg SHA256SUMS
          echo "Published GitHub release $TAG from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
