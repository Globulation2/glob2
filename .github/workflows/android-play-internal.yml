name: Android Play internal release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable public vVERSION tag
        required: true
        type: string
      track:
        description: Play channel (production requires its protected environment)
        type: choice
        default: internal
        options: [internal, production]
      release_notes:
        description: English notes shown to internal testers
        required: false
        default: Automated Globulation 2 internal test build.
        type: string
  workflow_call:
    inputs:
      source_commit:
        required: false
        default: ''
        type: string
      tag:
        required: true
        type: string
      track:
        required: false
        default: internal
        type: string
      release_notes:
        required: false
        default: Globulation 2 release.
        type: string

# Release credentials exist only in the owner's release mirror. Public read
# access does not grant write access, workflow dispatch, or environment approval.
concurrency:
  group: android-play-internal
  cancel-in-progress: false

env:
  GLOB2_DEV_MODE: isolated

jobs:
  credentials:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.track == 'production' && 'google-play-production' || 'google-play-internal' }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require channel configuration before building
        env:
          GLOB2_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GLOB2_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GLOB2_PLAY_STORE_PASSWORD: ${{ secrets.GLOB2_PLAY_STORE_PASSWORD }}
          GLOB2_PLAY_KEY_PASSWORD: ${{ secrets.GLOB2_PLAY_KEY_PASSWORD }}
          GLOB2_PLAY_WIF_PROVIDER: ${{ vars.GLOB2_PLAY_WIF_PROVIDER }}
          GLOB2_PLAY_SERVICE_ACCOUNT: ${{ vars.GLOB2_PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PYCODE'
          import os
          required = ['GLOB2_PLAY_UPLOAD_KEYSTORE_BASE64', 'GLOB2_PLAY_STORE_PASSWORD', 'GLOB2_PLAY_KEY_PASSWORD', 'GLOB2_PLAY_WIF_PROVIDER', 'GLOB2_PLAY_SERVICE_ACCOUNT']
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit('Missing release configuration: ' + ', '.join(missing))
          PYCODE

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the exact public tag once
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python3 tools/release/release.py check --tag "$RELEASE_TAG"
          if [[ -n "$EXPECTED_COMMIT" ]]; then test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"; fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      code: ${{ steps.version.outputs.code }}
      commit: ${{ needs.credentials.outputs.commit }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.credentials.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact public release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release/release.py check --tag "$RELEASE_TAG"

      - name: Validate requested Play track
        env:
          TRACK: ${{ inputs.track }}
        run: '[[ "$TRACK" == internal || "$TRACK" == production ]]'

      - name: Install build utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            scons pkg-config unzip zip autoconf automake libtool python3-venv

      - name: Install pinned Android tools
        run: |
          python3 mobile/setup_ndk.py
          python3 mobile/setup_tools.py

      - name: Accept SDK licenses and install Android packages
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          import sys; sys.path.insert(0, str(root/'scons'))
          from dev_store import paths
          dev=paths(root)
          sdk=pathlib.Path(dev['android_sdk'])
          lock = json.loads((root / 'mobile/toolchain.json').read_text())['android']
          java=pathlib.Path(dev['java_home'])
          env = dict(os.environ, JAVA_HOME=str(java), ANDROID_HOME=str(sdk), ANDROID_SDK_ROOT=str(sdk))
          manager = sdk / 'cmdline-tools/19.0/bin/sdkmanager'
          subprocess.run([str(manager), f'--sdk_root={sdk}', '--licenses'],
                         input='y\n' * 100, text=True, env=env, check=True)
          subprocess.run([str(manager), f'--sdk_root={sdk}',
                          f"platforms;android-{lock['compile_api']}",
                          f"build-tools;{lock['build_tools']}", 'platform-tools'],
                         env=env, check=True)
          PY

      - name: Build pinned Android dependencies
        run: python3 mobile/dependencies.py --arch arm64-v8a --release

      - name: Assign unique Play version code
        id: version
        run: echo "code=$(python3 mobile/play_release.py version-code)" >> "$GITHUB_OUTPUT"

      - name: Build and verify Android App Bundle
        run: python3 mobile/android.py bundle --arch arm64-v8a --release --version-code '${{ steps.version.outputs.code }}'

      - name: Hand off unsigned bundle to isolated signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glob2-unsigned-${{ steps.version.outputs.code }}
          path: |
            build/android/device/arm64-v8a/24/client/release/android-project/app/build/outputs/bundle/release/app-release.aab
            build/android/device/arm64-v8a/24/client/release/android-project/app/build/outputs/bundle/release/app-release.json
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.track == 'production' && 'google-play-production' || 'google-play-internal' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact public release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release/release.py check --tag "$RELEASE_TAG"

      - name: Download verified unsigned bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glob2-unsigned-${{ needs.build.outputs.code }}
          path: build/android/device/arm64-v8a/24/client/release/android-project/app/build/outputs/bundle/release

      - name: Install pinned signing JDK
        run: python3 mobile/setup_tools.py

      - name: Decode private upload key
        env:
          GLOB2_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GLOB2_PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = ''.join(os.environ['GLOB2_PLAY_UPLOAD_KEYSTORE_BASE64'].split())
          if not encoded:
              raise ValueError('The Play upload keystore secret is missing')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'glob2-upload.p12'
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          PY

      - name: Sign and verify Play upload bundle
        env:
          GLOB2_PLAY_STORE_PASSWORD: ${{ secrets.GLOB2_PLAY_STORE_PASSWORD }}
          GLOB2_PLAY_KEY_PASSWORD: ${{ secrets.GLOB2_PLAY_KEY_PASSWORD }}
        run: |
          python3 mobile/android.py sign-bundle --arch arm64-v8a --release \
            --keystore "$RUNNER_TEMP/glob2-upload.p12" --key-alias glob2-upload

      - name: Remove private upload key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/glob2-upload.p12"

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOB2_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.GLOB2_PLAY_SERVICE_ACCOUNT }}

      - name: Install Google Play API client
        run: |
          python3 -m venv build/play-api-venv
          build/play-api-venv/bin/python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: -r mobile/play-api-requirements.txt

      - name: Upload and publish to internal testing
        env:
          GLOB2_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          # Google Play may process a large resumable upload longer than 60 seconds.
          build/play-api-venv/bin/python -c 'import runpy, socket; socket.setdefaulttimeout(300); runpy.run_path("mobile/play_release.py", run_name="__main__")' publish \
            --bundle build/android/device/arm64-v8a/24/client/release/android-project/app/build/outputs/bundle/release/app-release-play.aab \
            --version-code '${{ needs.build.outputs.code }}' \
            --release-notes "$GLOB2_RELEASE_NOTES" --track "${{ inputs.track }}"
