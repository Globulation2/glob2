name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable public vVERSION tag
        required: true
        type: string
      audience:
        description: TestFlight audience
        required: true
        type: choice
        default: internal
        options:
          - internal
          - external
  workflow_call:
    inputs:
      source_commit:
        required: false
        default: ''
        type: string
      tag:
        required: true
        type: string
      audience:
        required: false
        default: external
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  credentials:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: ios-testflight
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require channel configuration before building
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_P8_BASE64: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import os
          required = ['IOS_ASC_KEY_ID', 'IOS_ASC_ISSUER_ID', 'IOS_ASC_KEY_P8_BASE64']
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit('Missing release configuration: ' + ', '.join(missing))
          PYCODE

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the exact public tag once
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python3 tools/release/release.py check --tag "$RELEASE_TAG"
          python3 -c 'import sys; sys.path.insert(0,"mobile"); sys.path.insert(0,"scons"); from ios_release import marketing_version; from build_layout import PACKAGE_VERSION; print(marketing_version(PACKAGE_VERSION))'
          if [[ -n "$EXPECTED_COMMIT" ]]; then test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"; fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: credentials
    name: Build unsigned iPhone archive
    runs-on: xcode-27
    timeout-minutes: 180
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      commit: ${{ needs.credentials.outputs.commit }}
    env:
      TEAM_ID: CL2MNNYQX3
      BUNDLE_ID: org.globulation2.glob2
      TESTFLIGHT_AUDIENCE: ${{ inputs.audience }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.credentials.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact public release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release/release.py check --tag "$RELEASE_TAG"

      - name: Require the default branch
        run: test "$GITHUB_REF" = refs/heads/master

      - name: Check toolchain and choose build number
        id: version
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          python3 mobile/doctor.py ios
          build_number=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Build number: $build_number"

      - name: Install pinned build drivers
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ios-build-tools"
          "$RUNNER_TEMP/ios-build-tools/bin/pip" install scons==4.11.1 cmake==4.4.3
          echo "$RUNNER_TEMP/ios-build-tools/bin" >> "$GITHUB_PATH"

      - name: Build pinned iPhone dependencies
        run: python3 mobile/dependencies.py --target ios --environment device --release --jobs 2

      - name: Compile game and generate Xcode project
        run: |
          python3 mobile/ios.py configure --environment device --release \
            --unsigned --build-number "$BUILD_NUMBER" --jobs 2

      - name: Archive iPhone app
        run: |
          set -euo pipefail
          project=build/ios/device/arm64/15.0/client/release/xcode-project/build/Glob2.xcodeproj
          archive="$GITHUB_WORKSPACE/artifacts/ios-testflight/Glob2.xcarchive"
          mkdir -p "$(dirname "$archive")"
          xcodebuild -project "$project" -scheme Glob2 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" archive
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Verify archive and retain matching symbols
        run: |
          set -euo pipefail
          app="$ARCHIVE_PATH/Products/Applications/Glob2.app"
          source_symbols=build/ios/device/arm64/15.0/client/release/xcode-project/build/Release-iphoneos/Glob2.app.dSYM
          symbols="$ARCHIVE_PATH/dSYMs/Glob2.app.dSYM"
          test -x "$app/Glob2"
          test -d "$source_symbols"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false
          ditto "$source_symbols" "$symbols"
          binary_uuid="$(dwarfdump --uuid "$app/Glob2" | awk '{print $2}')"
          symbol_uuid="$(dwarfdump --uuid "$symbols" | awk '{print $2}')"
          test "$binary_uuid" = "$symbol_uuid"
          plutil -p "$ARCHIVE_PATH/Info.plist"

      - name: Preserve archive permissions
        run: tar -C artifacts/ios-testflight -czf artifacts/ios-testflight/archive.tar.gz Glob2.xcarchive
      - name: Hand off verified unsigned archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glob2-ios-archive
          path: artifacts/ios-testflight/archive.tar.gz
          if-no-files-found: error
          retention-days: 14


  upload:
    needs: build
    name: Sign and upload the exact tagged archive
    environment: ios-testflight
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TEAM_ID: CL2MNNYQX3
      BUNDLE_ID: org.globulation2.glob2
      TESTFLIGHT_AUDIENCE: ${{ inputs.audience }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
      ARCHIVE_PATH: ${{ github.workspace }}/artifacts/ios-testflight/Glob2.xcarchive
    steps:
      - name: Check requested App Store eligibility
        env:
          AUDIENCE: ${{ inputs.audience }}
        run: '[[ "$AUDIENCE" == internal || "$AUDIENCE" == external ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glob2-ios-archive
          path: artifacts/ios-testflight
      - name: Restore archive permissions
        run: tar -xzf artifacts/ios-testflight/archive.tar.gz -C artifacts/ios-testflight
      - name: Prepare App Store Connect authentication key
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          for name in ('ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_KEY_P8_BASE64'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing GitHub secret for {name}')
          key = base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True)
          path = Path(os.environ['RUNNER_TEMP']) / 'glob2-ios-auth.p8'
          path.write_bytes(key)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print(f'ASC_KEY_PATH={path}', file=output)
          PY
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Export and validate signed iPhone app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'destination': 'export',
              'method': 'app-store-connect',
              'signingStyle': 'automatic',
              'teamID': os.environ['TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'testFlightInternalTestingOnly': os.environ['TESTFLIGHT_AUDIENCE'] == 'internal',
              'uploadSymbols': True,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'Glob2-ValidateOptions.plist').write_bytes(
              plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/glob2-signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/Glob2-ValidateOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(find "$RUNNER_TEMP/glob2-signed-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          ditto -xk "$ipa" "$RUNNER_TEMP/glob2-signed-inspect"
          app="$RUNNER_TEMP/glob2-signed-inspect/Payload/Glob2.app"
          test -s "$app/embedded.mobileprovision"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false
          codesign --verify --deep --strict "$app"
          xcrun altool --validate-app "$ipa" \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH"

      - name: Upload build to TestFlight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'destination': 'upload',
              'method': 'app-store-connect',
              'signingStyle': 'automatic',
              'teamID': os.environ['TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'testFlightInternalTestingOnly': os.environ['TESTFLIGHT_AUDIENCE'] == 'internal',
              'uploadSymbols': True,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'Glob2-ExportOptions.plist').write_bytes(
              plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/glob2-export" \
            -exportOptionsPlist "$RUNNER_TEMP/Glob2-ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Record provenance only after eligible build upload succeeds
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, plistlib
          from pathlib import Path
          app=Path(os.environ['ARCHIVE_PATH'])/'Products/Applications/Glob2.app'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          record=dict(schemaVersion=1,tag=os.environ['RELEASE_TAG'],sourceCommit=os.environ['SOURCE_COMMIT'],
              buildNumber=os.environ['BUILD_NUMBER'],marketingVersion=info['CFBundleShortVersionString'],
              bundleId=info['CFBundleIdentifier'],appStoreEligible=os.environ['TESTFLIGHT_AUDIENCE']=='external',
              archiveBinarySha256=hashlib.sha256((app/'Glob2').read_bytes()).hexdigest(),runId=os.environ['GITHUB_RUN_ID'])
          Path('artifacts/ios-upload-provenance.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-upload-provenance
          path: artifacts/ios-upload-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary authentication key and signed exports
        if: always()
        run: rm -rf "$RUNNER_TEMP/glob2-ios-auth.p8" "$RUNNER_TEMP/glob2-signed-export" "$RUNNER_TEMP/glob2-signed-inspect" "$RUNNER_TEMP/glob2-export"
