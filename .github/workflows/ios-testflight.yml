name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      audience:
        description: TestFlight audience
        required: true
        type: choice
        default: internal
        options:
          - internal
          - external

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    name: Build, sign, and upload iPhone app
    environment: ios-testflight
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TEAM_ID: CL2MNNYQX3
      BUNDLE_ID: org.globulation2.glob2
      TESTFLIGHT_AUDIENCE: ${{ inputs.audience }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require the default branch
        run: test "$GITHUB_REF" = refs/heads/master

      - name: Check toolchain and choose build number
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          python3 mobile/doctor.py ios
          build_number=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Build number: $build_number"

      - name: Install pinned build drivers
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ios-build-tools"
          "$RUNNER_TEMP/ios-build-tools/bin/pip" install scons==4.11.1 cmake==4.4.3
          echo "$RUNNER_TEMP/ios-build-tools/bin" >> "$GITHUB_PATH"

      - name: Prepare App Store Connect authentication key
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          for name in ('ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_KEY_P8_BASE64'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing GitHub secret for {name}')
          key = base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True)
          path = Path(os.environ['RUNNER_TEMP']) / 'glob2-ios-auth.p8'
          path.write_bytes(key)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print(f'ASC_KEY_PATH={path}', file=output)
          PY
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build pinned iPhone dependencies
        run: python3 mobile/dependencies.py --target ios --environment device --release --jobs 2

      - name: Compile game and generate Xcode project
        run: |
          python3 mobile/ios.py configure --environment device --release \
            --unsigned --build-number "$BUILD_NUMBER" --jobs 2

      - name: Archive iPhone app
        run: |
          set -euo pipefail
          project=build/ios/device/arm64/15.0/client/release/xcode-project/build/Glob2.xcodeproj
          archive="$GITHUB_WORKSPACE/artifacts/ios-testflight/Glob2.xcarchive"
          mkdir -p "$(dirname "$archive")"
          xcodebuild -project "$project" -scheme Glob2 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" archive
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Verify archive and retain matching symbols
        run: |
          set -euo pipefail
          app="$ARCHIVE_PATH/Products/Applications/Glob2.app"
          source_symbols=build/ios/device/arm64/15.0/client/release/xcode-project/build/Release-iphoneos/Glob2.app.dSYM
          symbols="$ARCHIVE_PATH/dSYMs/Glob2.app.dSYM"
          test -x "$app/Glob2"
          test -d "$source_symbols"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false
          ditto "$source_symbols" "$symbols"
          binary_uuid="$(dwarfdump --uuid "$app/Glob2" | awk '{print $2}')"
          symbol_uuid="$(dwarfdump --uuid "$symbols" | awk '{print $2}')"
          test "$binary_uuid" = "$symbol_uuid"
          plutil -p "$ARCHIVE_PATH/Info.plist"

      - name: Export and validate signed iPhone app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'destination': 'export',
              'method': 'app-store-connect',
              'signingStyle': 'automatic',
              'teamID': os.environ['TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'testFlightInternalTestingOnly': os.environ['TESTFLIGHT_AUDIENCE'] == 'internal',
              'uploadSymbols': True,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'Glob2-ValidateOptions.plist').write_bytes(
              plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/glob2-signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/Glob2-ValidateOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(find "$RUNNER_TEMP/glob2-signed-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          ditto -xk "$ipa" "$RUNNER_TEMP/glob2-signed-inspect"
          app="$RUNNER_TEMP/glob2-signed-inspect/Payload/Glob2.app"
          test -s "$app/embedded.mobileprovision"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false
          codesign --verify --deep --strict "$app"
          xcrun altool --validate-app "$ipa" \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH"

      - name: Upload build to TestFlight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'destination': 'upload',
              'method': 'app-store-connect',
              'signingStyle': 'automatic',
              'teamID': os.environ['TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'testFlightInternalTestingOnly': os.environ['TESTFLIGHT_AUDIENCE'] == 'internal',
              'uploadSymbols': True,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'Glob2-ExportOptions.plist').write_bytes(
              plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/glob2-export" \
            -exportOptionsPlist "$RUNNER_TEMP/Glob2-ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Save archive for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glob2-ios-archive
          path: artifacts/ios-testflight/Glob2.xcarchive
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary authentication key
        if: always()
        run: rm -f "$RUNNER_TEMP/glob2-ios-auth.p8"
