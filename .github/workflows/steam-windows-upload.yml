name: Upload Steam Windows depot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'genixpro/glob2-release' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/steam-windows-package.yml
    permissions:
      contents: read

  upload:
    needs: package
    if: github.repository == 'genixpro/glob2-release' && github.ref == 'refs/heads/master'
    runs-on: windows-2022
    environment: steam-release
    permissions:
      contents: read
    concurrency:
      group: steam-windows-upload
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glob2-steam-windows-${{ github.sha }}
          path: ${{ runner.temp }}/glob2-depot
      - name: Verify depot manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depot = Join-Path $env:RUNNER_TEMP 'glob2-depot'
          $manifest = Join-Path $depot 'SHA256SUMS.txt'
          if (!(Test-Path $manifest)) { throw 'Depot manifest is missing' }
          foreach ($line in Get-Content $manifest) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid depot manifest entry' }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $file = Join-Path $depot $relative
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing depot file: $relative" }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            if ($actual -ine $expected) { throw "Depot checksum mismatch: $relative" }
          }
      - name: Upload unpublished build with SteamPipe
        shell: pwsh
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_WINDOWS_DEPOT_ID: ${{ vars.STEAM_WINDOWS_DEPOT_ID }}
          STEAM_BUILD_USERNAME: ${{ vars.STEAM_BUILD_USERNAME }}
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:STEAM_APP_ID -notmatch '^\d+$') { throw 'STEAM_APP_ID must be numeric' }
          if ($env:STEAM_WINDOWS_DEPOT_ID -notmatch '^\d+$') { throw 'STEAM_WINDOWS_DEPOT_ID must be numeric' }
          if ($env:STEAM_BUILD_USERNAME -notmatch '^[A-Za-z0-9_]+$') { throw 'STEAM_BUILD_USERNAME is missing or invalid' }
          if (!$env:STEAM_CONFIG_VDF_BASE64) { throw 'STEAM_CONFIG_VDF_BASE64 is missing' }
          $root = Join-Path $env:RUNNER_TEMP 'steampipe'
          $steamcmd = Join-Path $root 'steamcmd'
          $output = Join-Path $root 'output'
          New-Item -ItemType Directory -Force $steamcmd, $output | Out-Null
          $archive = Join-Path $root 'steamcmd.zip'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $steamcmd
          Push-Location $steamcmd
          try {
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD setup failed: $LASTEXITCODE" }
            $configDir = Join-Path $steamcmd 'config'
            New-Item -ItemType Directory -Force $configDir | Out-Null
            [IO.File]::WriteAllBytes((Join-Path $configDir 'config.vdf'), [Convert]::FromBase64String($env:STEAM_CONFIG_VDF_BASE64))
            $depot = Join-Path $env:RUNNER_TEMP 'glob2-depot'
            $script = Join-Path $root 'app_build.vdf'
            @"
          "AppBuild"
          {
            "AppID" "$env:STEAM_APP_ID"
            "Desc" "Globulation 2 Windows $env:GITHUB_SHA"
            "ContentRoot" "$depot"
            "BuildOutput" "$output"
            "Depots"
            {
              "$env:STEAM_WINDOWS_DEPOT_ID"
              {
                "FileMapping"
                {
                  "LocalPath" "*"
                  "DepotPath" "."
                  "Recursive" "1"
                }
              }
            }
          }
          "@ | Set-Content -LiteralPath $script -Encoding ascii
            & .\steamcmd.exe +login $env:STEAM_BUILD_USERNAME +run_app_build $script +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamPipe upload failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          "SteamPipe command completed for Windows commit $env:GITHUB_SHA. Verify the new build in Steamworks before setting it live." | Out-File -Append $env:GITHUB_STEP_SUMMARY
