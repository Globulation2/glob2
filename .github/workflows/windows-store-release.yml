name: Windows Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part Store package version, ending in .0 (increase for every upload)
        required: true
        default: 1.0.0.0
      upload:
        description: Upload the package to the configured Partner Center branch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-store-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    # The release mirror is public, but only its owner can dispatch this job.
    # Signing and upload credentials stay in its master-only environment.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'genixpro/glob2-release' && github.repository_id == 1397722696 && github.actor_id == 6193625 && github.triggering_actor == 'genixpro' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-store
    env:
      STORE_ID: ${{ vars.STORE_ID }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_BRANCH: ${{ vars.STORE_BRANCH }}
      STORE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check Partner Center identity
        shell: pwsh
        run: |
          foreach ($name in @('STORE_ID', 'STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Configure $name in the release mirror's windows-store GitHub environment."
            }
          }

      - name: Check PC package version
        shell: pwsh
        run: |
          if ($env:STORE_VERSION -notmatch '^[1-9]\d*\.\d+\.\d+\.0$') {
            throw 'PC Store package versions must have four numeric parts, a nonzero major version, and end in .0.'
          }
          foreach ($part in ($env:STORE_VERSION -split '\.')) {
            if ([bigint]::Parse($part) -gt 65535) {
              throw 'Each PC Store package version component must be at most 65535.'
            }
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned asset encoder
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: Pillow==12.2.0
          $encoder = (Get-Command python).Source
          "GLOB2_ASSET_ENCODER_PYTHON=$encoder" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make mingw-w64-x86_64-nasm mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Check release staging logic
        shell: msys2 {0}
        run: python test/test_windows_store_release.py -v

      - name: Build Windows client
        shell: msys2 {0}
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1 server=0 lean_images=1 build/mingw/client/release/lean-images/src/glob2.exe

      - name: Stage game, DLLs, assets and Store identity
        shell: msys2 {0}
        run: |
          python .github/scripts/windows_store_release.py \
            --root . \
            --exe build/mingw/client/release/lean-images/src/glob2.exe \
            --sdl-runtime build/sdl3-ci/prefix/bin \
            --dll-dir /mingw64/bin \
            --dest artifacts/windows-store/content \
            --identity-name "$STORE_IDENTITY_NAME" \
            --publisher "$STORE_PUBLISHER" \
            --publisher-display-name "$STORE_PUBLISHER_DISPLAY_NAME" \
            --store-id "$STORE_ID" \
            --version "$STORE_VERSION" \
            --commit "$GITHUB_SHA"

      - name: Install Microsoft GDK
        shell: pwsh
        run: |
          winget install --id Microsoft.Gaming.GDK --exact --source winget --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "GDK installation failed: $LASTEXITCODE" }

      - name: Build and validate MSIXVC package
        id: package
        shell: pwsh
        env:
          STORE_UPLOAD: ${{ inputs.upload }}
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Microsoft GDK' -Recurse -Filter MakePkg.exe |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'MakePkg.exe was not found in the GDK installation.' }
          $content = (Resolve-Path artifacts/windows-store/content).Path
          $output = Join-Path $PWD 'artifacts/windows-store/package'
          New-Item -ItemType Directory -Force $output | Out-Null
          $layout = Join-Path $PWD 'artifacts/windows-store/layout.xml'
          & $tool.FullName genmap /f $layout /d $content
          if ($LASTEXITCODE -ne 0) { throw 'MakePkg genmap failed.' }
          # /lt is installable for local testing; /l produces the encrypted
          # submission package and EKB, which must stay out of public artifacts.
          $encryption = if ($env:STORE_UPLOAD -eq 'true') { '/l' } else { '/lt' }
          & $tool.FullName pack /f $layout /d $content /pd $output /pc /nogameos $encryption
          if ($LASTEXITCODE -ne 0) { throw 'MakePkg pack failed.' }
          $package = Get-ChildItem $output -Filter *.msixvc | Select-Object -First 1
          $ekb = Get-ChildItem $output -Filter *.ekb | Select-Object -First 1
          $validator = Get-ChildItem $output -Filter Validator_*.xml | Select-Object -First 1
          if (-not $package -or -not $validator -or ($env:STORE_UPLOAD -eq 'true' -and -not $ekb)) {
            throw 'Expected MSIXVC, validator report and (for upload) EKB in the package directory.'
          }
          "package_path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "ekb_path=$($ekb.FullName)" >> $env:GITHUB_OUTPUT
          "validator_path=$($validator.FullName)" >> $env:GITHUB_OUTPUT

      - name: Retain package for install testing and review
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glob2-windows-store-${{ inputs.version }}
          path: |
            artifacts/windows-store/package/*.msixvc
            artifacts/windows-store/package/Validator_*.xml
            artifacts/windows-store/layout.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Partner Center
        if: ${{ inputs.upload }}
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          EKB_PATH: ${{ steps.package.outputs.ekb_path }}
          VALIDATOR_PATH: ${{ steps.package.outputs.validator_path }}
        run: |
          foreach ($name in @('STORE_TENANT_ID', 'STORE_CLIENT_ID', 'STORE_CLIENT_SECRET', 'STORE_BRANCH')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name for Partner Center upload." }
          }
          $version = '3.2.1'
          $archive = Join-Path $env:RUNNER_TEMP 'PackageUploader.zip'
          Invoke-WebRequest "https://github.com/microsoft/PackageUploader/releases/download/v$version/PackageUploader.$version.win-x64.zip" -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '80d6f9475ef3fccdd79659b034c876338acae73dfb42de34d750ad9c413c0184') {
            throw 'PackageUploader checksum mismatch.'
          }
          $toolDir = Join-Path $env:RUNNER_TEMP 'PackageUploader'
          Expand-Archive $archive $toolDir
          $uploader = Get-ChildItem $toolDir -Recurse -Filter PackageUploader.exe | Select-Object -First 1
          if (-not $uploader) { throw 'PackageUploader.exe is missing from its archive.' }
          $config = @{
            operationName = 'UploadXvcPackage'
            aadAuthInfo = @{ tenantId = $env:STORE_TENANT_ID; clientId = $env:STORE_CLIENT_ID }
            bigId = $env:STORE_ID
            branchFriendlyName = $env:STORE_BRANCH
            marketGroupName = 'default'
            packageFilePath = $env:PACKAGE_PATH
            deltaUpload = $false
            gameAssets = @{
              ekbFilePath = $env:EKB_PATH
              subValFilePath = $env:VALIDATOR_PATH
            }
            minutesToWaitForProcessing = 60
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'UploadXvcPackage.json'
          $config | ConvertTo-Json -Depth 5 | Set-Content $configPath
          & $uploader.FullName UploadXvcPackage -c $configPath -a AppSecret -s $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "Partner Center upload failed: $LASTEXITCODE" }
