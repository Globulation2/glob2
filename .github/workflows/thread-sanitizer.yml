name: Renderer capture crash diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GLOB2_DEV_MODE: isolated
  VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
  VK_LAYER_VALIDATE_SYNC: "1"
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e04711348d27238e3f21c3ea42179e383ac422ec
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38861165281
          name: linux-test-programs-ubuntu-24.04
          path: artifacts/ci-native
      - name: Restore exact CI program and runtime
        run: |
          tar -xzf artifacts/ci-native/linux-test-programs.tar.gz
          python3 .github/scripts/ci_build_provenance.py verify --compiler g++-13
          echo "LD_LIBRARY_PATH=$PWD/build/sdl3-ci/prefix/lib" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          xargs sudo apt-get install -y --no-install-recommends < artifacts/ci-native/runtime-packages.txt
          sudo apt-get install -y --no-install-recommends python3 libgl1 libglu1-mesa libepoxy0 libgl1-mesa-dri mesa-vulkan-drivers xvfb xauth openbox x11-utils gdb vulkan-validationlayers
          curl -fL --max-time 60 -o "$RUNNER_TEMP/mesa-symbols.ddeb" http://ddebs.ubuntu.com/pool/main/m/mesa/mesa-vulkan-drivers-dbgsym_25.2.8-0ubuntu0.24.04.4_amd64.ddeb
          dpkg-deb -x "$RUNNER_TEMP/mesa-symbols.ddeb" "$RUNNER_TEMP/mesa-symbols"
      - name: Configure software Vulkan mapping budget
        run: sudo sysctl -w vm.max_map_count=1048576
      - name: Replay large-map capture under debugger
        run: |
          python3 - <<'DIAGNOSTIC'
          from pathlib import Path
          import json,sys,types,os
          sys.path.insert(0,str(Path('test').resolve()))
          import run_tests as registry
          build=Path('build/linux/client/release').resolve()
          out=Path('artifacts/renderer-debug').resolve();out.mkdir(parents=True,exist_ok=True)
          cases=[c for c in registry.list_cases(registry.binary_path(build,'engine'),'engine') if c.suite=='TorusRender' and (c.name.startswith('SDL GPU captures large logical maps') or c.name.startswith('SDL GPU retries a submitted final torus overlay'))]
          assert len(cases)==2
          original_prefix=registry.xvfb_prefix
          registry.xvfb_prefix=lambda job:original_prefix(job)+['gdb','--batch','-ex','set pagination off','-ex','set print thread-events off','-ex','set auto-solib-add off','-ex','set debuginfod enabled off','-ex','set debug-file-directory '+os.environ['RUNNER_TEMP']+'/mesa-symbols/usr/lib/debug','-ex','handle SIGSEGV stop print nopass','-ex','run','-ex','sharedlibrary libvulkan_lvp','-ex','info sharedlibrary','-ex','p $_siginfo','-ex','frame 2','-ex','p *set','-ex','python import gdb; print("VMA_COUNT",len(open("/proc/%d/maps"%gdb.selected_inferior().pid).readlines())); print("VM_MAX_MAP_COUNT",open("/proc/sys/vm/max_map_count").read())','-ex','thread apply all bt full','--args']
          rows=[]
          for index in range(3):
              args=types.SimpleNamespace(keep_profiles=False,fullscreen=True,update_fixtures=False,artifacts=out/str(index),verbose=False)
              result=registry.run_job(registry.Job('engine',cases),args,build)
              (out/f'{index}.log').write_text(result.output)
              row={'index':index,'status':result.status,'seconds':result.seconds};rows.append(row);print(json.dumps(row),flush=True)
              (out/'results.json').write_text(json.dumps(rows,indent=2)+'\n')
          sys.exit(any(r['status']!='pass' for r in rows))
          DIAGNOSTIC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-capture-debug
          path: artifacts/renderer-debug
          if-no-files-found: warn
