name: Windows recovery crash and wait diagnostics
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source revision to build and diagnose
        required: true
        type: string
concurrency:
  group: windows-recovery-diagnostics-${{ github.ref }}-${{ inputs.revision }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}
permissions:
  contents: read
env:
  GLOB2_DEV_MODE: isolated
  GLOB2_GENERATOR_PROTOTYPE_DIAGNOSTICS: "1"
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # MinGW Python builds the engine; standard CPython supplies compatible
      # binary wheels for the private, pinned build-time asset encoder.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: asset_encoder_python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        id: msys2_setup_msys2_v2_1
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ccache

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Prepare pinned asset encoder
        shell: pwsh
        run: |
          $encoder = & "${{ steps.asset_encoder_python.outputs.python-path }}" tools/package_assets.py --encoder-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GLOB2_ASSET_ENCODER_PYTHON=$encoder" >> $env:GITHUB_ENV

      # Checkout uses Git for Windows; MSYS Git otherwise defaults to different
      # newline handling and reports unchanged CRLF source files as modifications.
      - name: Align Git newline handling for Windows builds
        run: git config --local core.autocrlf true

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record Windows checkout before compilation
        run: |
          mkdir -p artifacts/windows-source
          {
            command -v git
            git --version
            git config --show-origin --get-regexp '^core\.(symlinks|filemode|autocrlf)$' || true
            git status --porcelain=v1 --untracked-files=all
          } > artifacts/windows-source/before-build.log 2>&1
          cat artifacts/windows-source/before-build.log

      - name: Retain Windows checkout diagnostics before compilation
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-source-before-build
          path: artifacts/windows-source/before-build.log

      - uses: ./.github/actions/sdl3
        with:
          shell: msys2 {0}
          cc: gcc
          cxx: g++
      - name: Build glob2 and the regression harnesses
        id: build_glob2_and_the_regression_harnesses
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          cygpath -w "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1 server=0 engine-tests
          # MSYS2 starts each step with its own PATH; colocate the pinned
          # SDL DLLs so Windows can load the client and every harness directly.
          for directory in build/mingw/client/release/src build/mingw/client/release/test; do
            mkdir -p "$directory"
            cp build/sdl3-ci/prefix/bin/*.dll "$directory/"
          done

      - name: Capture crashes and blocked thread stacks
        run: |
          python3 - <<'DIAG'
          from pathlib import Path
          import subprocess,os,json,time,tempfile
          out=Path('artifacts/windows-recovery');out.mkdir(parents=True,exist_ok=True)
          binary=Path('build/mingw/client/release/test/glob2-engine-tests.exe').resolve()
          rows=[]
          for suite,name in [('', 'MCP/HTTP restrictions bounded bodies restart and disconnect cancellation [network]'),('TurretTargeting','indexed encounter order covers custom footprints repeated wraps and temporary chunks'),('WssTransport','a reader that stops reading resumes with every message in order'),('LanMatchHarness','an idle LAN host sleeps and wakes at once for guests and the host [network][artifacts]')]:
           with tempfile.TemporaryDirectory(prefix='glob2-recovery-') as profile:
            index=len(rows);env=dict(os.environ,GLOB2_USER_DATA_DIR=profile,SDL_VIDEODRIVER='dummy',SDL_AUDIODRIVER='dummy',GLOB2_TEST_ARTIFACTS=str((out/str(index)).resolve()));args=[str(binary),'--no-breaks=true','-tc='+name]+(['-ts='+suite] if suite else [])
            if index<2:
             command=['gdb','--nx','--batch','--quiet','-ex','set pagination off','-ex','run','-ex','thread apply all bt','--args',*args]
             try:r=subprocess.run(command,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=90);data=r.stdout;code=r.returncode
             except subprocess.TimeoutExpired as e:data=(e.stdout or b'')+b'\nDebugger timed out';code=None
             (out/f'{index}-debug.log').write_bytes(data)
            else:
             with (out/f'{index}-run.log').open('wb') as log:
              p=subprocess.Popen(args,env=env,stdout=log,stderr=subprocess.STDOUT)
              try:code=p.wait(timeout=30)
              except subprocess.TimeoutExpired:
               try:r=subprocess.run(['gdb','--nx','--batch','--quiet','-ex','set pagination off','-ex','thread apply all bt','-ex','detach','-p',str(p.pid)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=45);(out/f'{index}-wait-stack.log').write_bytes(r.stdout)
               except subprocess.TimeoutExpired as e:(out/f'{index}-wait-stack.log').write_bytes((e.stdout or b'')+b'\nAttach debugger timed out')
               p.kill();p.wait();code=None
            row={'suite':suite,'name':name,'exit':code};rows.append(row);print(json.dumps(row),flush=True);(out/'results.json').write_text(json.dumps(rows,indent=2)+'\n')
          DIAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-recovery-diagnostics
          path: artifacts/windows-recovery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-recovery-program
          path: |
            build/mingw/client/release/test/glob2-engine-tests.exe
            build/mingw/client/release/test/*.dll
          if-no-files-found: ignore
