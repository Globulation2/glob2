name: mobile foundations
on:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ""
      architectures:
        type: string
        default: '["arm64-v8a","armeabi-v7a","x86_64"]'
  workflow_dispatch:

# A newer push supersedes an Android build for the same pull request. The
# literal prefix keeps this group distinct from its caller's: when called,
# github.workflow names the caller, and a shared group would deadlock it.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

env:
  GLOB2_DEV_MODE: isolated

jobs:
  android-release-apk:
    name: Android release APK (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-android-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures || '["arm64-v8a","armeabi-v7a","x86_64"]') }}
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Install build utilities
        id: install_build_utilities
        run: sudo apt-get update -qq && sudo apt-get install -y python3-venv scons pkg-config nasm unzip zip autoconf automake libtool ccache
      - name: Restore checksum-pinned Android build tools
        id: android_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            build/mobile-tools/android-sdk/ndk
            build/mobile-tools/android-sdk/cmdline-tools
            build/mobile-tools/android-sdk/build-tools
            build/mobile-tools/android-sdk/platforms
            build/mobile-tools/android-sdk/platform-tools
            build/mobile-tools/gradle-8.13
          key: android-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/android-tools.json', 'mobile/setup_ndk.py', 'mobile/setup_tools.py', 'scons/tool_archives.py') }}
      - name: Verify restored Android tool content
        env:
          TOOL_KEY: ${{ hashFiles('mobile/toolchain.json', 'mobile/android-tools.json', 'mobile/setup_ndk.py', 'mobile/setup_tools.py', 'scons/tool_archives.py') }}
        run: |
          for prefix in build/mobile-tools/android-sdk/{ndk,cmdline-tools,build-tools,platforms,platform-tools} build/mobile-tools/gradle-8.13; do
            python3 .github/scripts/ci_dependency_cache.py verify --prefix "$prefix" --key "$TOOL_KEY"
          done
      - name: Install verified NDK
        id: install_verified_ndk
        run: python3 mobile/setup_ndk.py
      - name: Install pinned Android packaging tools
        run: |
          python3 mobile/setup_tools.py
          sdk="$(python3 tools/dev_environment.py paths --field android_sdk)"
          "$sdk/cmdline-tools/19.0/bin/sdkmanager" --sdk_root="$sdk" --licenses < <(yes)
          "$sdk/cmdline-tools/19.0/bin/sdkmanager" --sdk_root="$sdk" \
            'platforms;android-36' 'build-tools;35.0.0' platform-tools
      - name: Restore pinned Android target dependencies
        id: android_dependencies
        uses: actions/cache/restore@v4
        with:
          path: build/android/device/${{ matrix.arch }}/24/client/release/vcpkg-installed
          key: android-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/dependencies.py', 'mobile/triplets/**', 'scons/vcpkg-ports/**', 'scons/mobile_toolchain.py') }}
      - name: Verify restored Android dependency content
        env:
          DEPENDENCY_KEY: ${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/dependencies.py', 'mobile/triplets/**', 'scons/vcpkg-ports/**', 'scons/mobile_toolchain.py') }}
        run: python3 .github/scripts/ci_dependency_cache.py verify --prefix 'build/android/device/${{ matrix.arch }}/24/client/release/vcpkg-installed' --key "$DEPENDENCY_KEY"
      - name: Build pinned target dependencies
        id: build_pinned_target_dependencies
        run: python3 mobile/dependencies.py --arch '${{ matrix.arch }}' --release --jobs 2
      - name: Seal and save pinned Android dependencies
        env:
          DEPENDENCY_KEY: ${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/dependencies.py', 'mobile/triplets/**', 'scons/vcpkg-ports/**', 'scons/mobile_toolchain.py') }}
        run: python3 .github/scripts/ci_dependency_cache.py seal --prefix 'build/android/device/${{ matrix.arch }}/24/client/release/vcpkg-installed' --key "$DEPENDENCY_KEY"
      - name: Seal verified Android tools
        env:
          TOOL_KEY: ${{ hashFiles('mobile/toolchain.json', 'mobile/android-tools.json', 'mobile/setup_ndk.py', 'mobile/setup_tools.py', 'scons/tool_archives.py') }}
        run: |
          for prefix in build/mobile-tools/android-sdk/{ndk,cmdline-tools,build-tools,platforms,platform-tools} build/mobile-tools/gradle-8.13; do
            python3 .github/scripts/ci_dependency_cache.py seal --prefix "$prefix" --key "$TOOL_KEY"
          done
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.android_dependencies.outputs.cache-hit != 'true' }}
        with:
          path: build/android/device/${{ matrix.arch }}/24/client/release/vcpkg-installed
          key: android-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/dependencies.py', 'mobile/triplets/**', 'scons/vcpkg-ports/**', 'scons/mobile_toolchain.py') }}
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && matrix.arch == 'arm64-v8a' && steps.android_tools.outputs.cache-hit != 'true' }}
        with:
          path: |
            build/mobile-tools/android-sdk/ndk
            build/mobile-tools/android-sdk/cmdline-tools
            build/mobile-tools/android-sdk/build-tools
            build/mobile-tools/android-sdk/platforms
            build/mobile-tools/android-sdk/platform-tools
            build/mobile-tools/gradle-8.13
          key: android-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/android-tools.json', 'mobile/setup_ndk.py', 'mobile/setup_tools.py', 'scons/tool_archives.py') }}
      - name: Restore Android compiler cache
        id: restore_android_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ matrix.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-${{ matrix.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/triplets/**') }}-
      - name: Reset Android compiler cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compile and stage native application
        id: compile_and_stage_native_application
        run: |
          set -o pipefail
          python3 mobile/android.py build --arch '${{ matrix.arch }}' --release --fdroid --jobs 2 2>&1 \
            | tee "build/android-${{ matrix.arch }}-build.log"
      - name: Exercise x86_64 release APK in an emulator
        if: matrix.arch == 'x86_64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 mobile/setup_tools.py --emulator
          python3 mobile/emulator.py configure --arch x86_64
          nohup python3 mobile/emulator.py adb-server > build/mobile-adb-server.log 2>&1 &
          nohup python3 mobile/emulator.py run --arch x86_64 > build/mobile-emulator.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if python3 mobile/emulator.py status --arch x86_64 >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          python3 mobile/android.py sign --arch x86_64 --release --fdroid
          python3 mobile/android.py install --arch x86_64 --release --fdroid --serial emulator-5580 --adb-port 15037
          python3 mobile/smoke.py --serial emulator-5580 --avd glob2-api35-x64 --package org.globulation2.glob2
          python3 mobile/emulator.py stop --arch x86_64
      - name: Report Android compiler cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s
      - name: Keep Android cache entries used by this run
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.cache_ready.outcome == 'success' && steps.compile_and_stage_native_application.outcome == 'success' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"
      - name: Save Android compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.cache_ready.outcome == 'success' && steps.compile_and_stage_native_application.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ matrix.arch }}-${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.arch }}-release-apk
          path: |
            build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.apk
            build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.sha256
            build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.symbols.json
            build/mobile-smoke/**
            build/mobile-emulator.log
            build/android-${{ matrix.arch }}-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        id: actions_upload_artifact_v4_1
        if: always()
        with:
          name: android-${{ matrix.arch }}-diagnostics
          path: |
            build/android/**/toolchain.json
            build/android/**/compile_commands.json
            build/android/**/vcpkg-buildtrees/**/*.log
            build/android/**/android-project/glob2-build.json
          if-no-files-found: ignore
      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
