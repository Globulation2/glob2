name: Publish desktop downloads to itch.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact tag of the latest public stable GitHub release
        required: true
        type: string
      mode:
        description: Verify packages, create hidden channels, or update existing channels
        type: choice
        options:
          - verify
          - create-hidden
          - publish
        default: verify
      channel:
        description: Update all channels or retry one channel after a partial upload
        type: choice
        options:
          - all
          - windows-x86-64
          - osx-arm64
          - osx-x86-64
          - linux-x86-64
        default: all

permissions:
  contents: read

concurrency:
  group: itch-desktop-release
  cancel-in-progress: false

jobs:
  desktop:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master'
    environment: itch-release
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - name: Verify and stage the public release packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_DIR: ${{ runner.temp }}/itch-release
          MACOS_TEAM: ${{ vars.MACOS_DOWNLOAD_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          repository=Globulation2/glob2
          latest=$(gh api "repos/$repository/releases/latest")
          jq -e --arg tag "$TAG" '.tag_name == $tag and (.draft or .prerelease | not)' <<< "$latest" >/dev/null
          mkdir -p "$RELEASE_DIR"
          cd "$RELEASE_DIR"
          version=${TAG#v}
          packages=(
            "windows-x86-64|glob2-$version-windows-x86_64.zip"
            "osx-arm64|Glob2-$version-macos-arm64.dmg"
            "osx-x86-64|Glob2-$version-macos-x86_64.dmg"
            "linux-x86-64|glob2-$version-linux-x86_64-ubuntu22.04.tar.gz"
          )
          download_and_verify() {
            local file=$1 digest
            digest=$(jq -er --arg file "$file" '
              [.assets[] | select(.name == $file and .state == "uploaded") | .digest]
              | select(length == 1) | .[0] | strings | select(test("^sha256:[0-9a-f]{64}$"))
            ' <<< "$latest")
            gh release download "$TAG" --repo "$repository" --pattern "$file"
            echo "${digest#sha256:}  $file" | shasum -a 256 -c
          }
          download_and_verify package-inventory.json
          for package in "${packages[@]}"; do
            IFS='|' read -r channel file <<< "$package"
            jq -e --arg file "$file" '
              .schemaVersion == 1 and ([.packages[] | select(.filename == $file)] | length == 1)
            ' package-inventory.json >/dev/null
            download_and_verify "$file"
            case "$channel" in
              windows-x86-64)
                unzip -q "$file" -d "$channel"
                test -f "$channel/Globulation2/glob2.exe"
                cat > "$channel/.itch.toml" <<'TOML'
          [[actions]]
          name = "play"
          path = "Globulation2/glob2.exe"
          platform = "windows"

          [[actions]]
          name = "Play (software renderer)"
          path = "Globulation2/glob2.exe"
          platform = "windows"
          args = ["play", "--renderer", "software"]
          TOML
                ;;
              osx-*)
                architecture=${channel#osx-}
                architecture=${architecture/x86-64/x86_64}
                mount=$(mktemp -d)
                hdiutil attach "$file" -mountpoint "$mount" -readonly -nobrowse
                trap 'hdiutil detach "$mount"' EXIT
                mkdir "$channel"
                app="$channel/Glob2.app"
                ditto "$mount/Glob2.app" "$app"
                hdiutil detach "$mount"
                trap - EXIT
                test "$(lipo -archs "$app/Contents/MacOS/glob2")" = "$architecture"
                codesign --verify --deep --strict "$app"
                test -n "$MACOS_TEAM"
                codesign -dv --verbose=4 "$app" 2>&1 | grep -Fx "TeamIdentifier=$MACOS_TEAM"
                xcrun stapler validate "$app"
                ;;
              linux-x86-64)
                mkdir "$channel"
                tar -xzf "$file" -C "$channel" usr
                test -x "$channel/usr/bin/glob2"
                test -d "$channel/usr/share/glob2/data"
                cat > "$channel/.itch.toml" <<'TOML'
          [[actions]]
          name = "play"
          path = "usr/bin/glob2"
          platform = "linux"
          TOML
                tar -xOzf "$file" INSTALL.txt | sed -n '/^Required linked library filenames/,$p' > "$channel/SYSTEM-LIBRARIES.txt"
                ;;
            esac
            printf '%s\t%s\n' "$channel" "$channel" >> channels.tsv
            printf -- '- `%s` → `%s`\n' "$file" "$channel" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Install pinned Butler
        if: inputs.mode != 'verify'
        env:
          BUTLER_DIR: ${{ runner.temp }}/itch-butler
        run: |
          set -euo pipefail
          mkdir -p "$BUTLER_DIR"
          cd "$BUTLER_DIR"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://broth.itch.zone/butler/darwin-arm64/15.32.0/archive/default --output butler.zip
          echo 'f1c460f08c02686b49f8da74344e5578ece9ea1a8bae1779445b5d98e0a794b3  butler.zip' | shasum -a 256 -c
          unzip -q butler.zip
          ./butler -V
          echo "$BUTLER_DIR" >> "$GITHUB_PATH"

      - name: Confirm the selected release is still latest
        if: inputs.mode != 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Globulation2/glob2/releases/latest --jq .tag_name)" = "$TAG"

      - name: Push verified packages to itch.io
        if: inputs.mode != 'verify'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ inputs.tag }}
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_DIR: ${{ runner.temp }}/itch-release
        run: |
          set -euo pipefail
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo '::error::Set BUTLER_API_KEY in the itch-release environment.'
            exit 1
          fi
          cd "$RELEASE_DIR"
          options=(--userversion "${TAG#v}")
          if [[ "$MODE" == create-hidden ]]; then
            options+=(--hidden)
          fi
          while IFS=$'\t' read -r channel file; do
            [[ "$CHANNEL" == all || "$CHANNEL" == "$channel" ]] || continue
            butler push "$file" "genixpro/globulation-2:$channel" "${options[@]}"
            printf 'Pushed `%s` to `%s`.\n\n' "$file" "$channel" >> "$GITHUB_STEP_SUMMARY"
          done < channels.tsv
