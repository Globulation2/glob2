name: CI measurements
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Measure one build; empty batches recent completed runs
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-measurements
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Batch completed build observations
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.run_id }}
        run: python3 .github/scripts/ci_batch_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-batch
          path: artifacts/ci-metrics/
          retention-days: 30
