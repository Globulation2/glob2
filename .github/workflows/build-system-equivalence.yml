name: build-system equivalence

# Builds the native Linux dev tier (glob2, both test binaries, the test programs
# and the harnesses) with SCons and with the experimental CMake build, then
# compares every compilation (tools/compare_build_systems.py). Any difference
# in a compile command or in the set of compiled sources fails; object-hash
# differences are summarised without failing until parity is exact. See
# "Experimental CMake build" in docs/development/build-options.md.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - buildsys/**
      - SConstruct
      - '**/SConscript'
      - test/tests.py
      - tools/compare_build_systems.py
      - .github/workflows/build-system-equivalence.yml
  workflow_dispatch:

concurrency:
  group: build-system-equivalence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

permissions:
  contents: read

env:
  GLOB2_DEV_MODE: isolated

jobs:
  build-system-equivalence:
    name: build-system-equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 6G
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -Ei 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++-13 python3 python3-venv scons pkg-config nasm libva-dev ccache \
            cmake ninja-build binutils \
            libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libopusfile-dev libopus-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdl3
        with:
          cc: gcc-13
          cxx: g++-13
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-equivalence-ubuntu-24.04-gcc13-${{ github.sha }}
          restore-keys: ccache-equivalence-ubuntu-24.04-gcc13-
      - name: Build with both systems and compare
        id: compare
        run: |
          ccache -z
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          export GLOB2_SDL3_PREFIX="$PWD/build/sdl3-ci/prefix"
          python3 tools/compare_build_systems.py --jobs 4 --json artifacts/build-system-equivalence.json \
            --summary "$GITHUB_STEP_SUMMARY"
          ccache -s
      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' && github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-equivalence-ubuntu-24.04-gcc13-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: build-system-equivalence
          path: artifacts/build-system-equivalence.json
          retention-days: 14
