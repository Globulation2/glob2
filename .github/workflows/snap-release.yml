name: Publish Snap stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag at the mirrored HEAD
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: snap-stable-release
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$TRIGGERING_ACTOR" != genixpro || "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/master ]]; then
            echo '::error::Snap publication requires a manual dispatch from the release repository master by its owner.'
            exit 1
          fi

  credentials:
    needs: context
    runs-on: ubuntu-24.04
    environment: snap-release
    steps:
      - name: Require Snap Store credentials
        env:
          STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [[ -z "$STORE_CREDENTIALS" ]]; then
            echo '::error::Missing SNAPCRAFT_STORE_CREDENTIALS in the snap-release environment.'
            exit 1
          fi

  build:
    needs: credentials
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify public tag at mirrored HEAD
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git \
            "refs/tags/$TAG:refs/tags/$TAG"
          python3 tools/release/release.py check --tag "$TAG"
      - uses: snapcore/action-build@v1
        id: snap
      - name: Test installed snap
        env:
          SNAP: ${{ steps.snap.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP"
          snap run globulation2 --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snap-candidate
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: snap-release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snap-candidate
          path: artifacts/snap
      - name: Find candidate
        id: snap
        run: |
          mapfile -t files < <(find artifacts/snap -maxdepth 1 -name 'globulation2_*.snap' -type f)
          test "${#files[@]}" -eq 1
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable
      - run: echo "Published Snap stable from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
