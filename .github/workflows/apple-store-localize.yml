name: Inspect or apply reviewed Apple listing translations

on:
  workflow_dispatch:
    inputs:
      tooling_ref:
        description: Exact 40-hex public Globulation2/glob2 tooling commit
        required: true
        type: string
      marketing_ref:
        description: Exact 40-hex reviewed Globulation2/glob2-marketing commit
        required: true
        type: string
      platform:
        required: true
        type: choice
        options: [IOS, MAC_OS]
        default: IOS
      version:
        description: Exact existing editable platform version (Mac currently 0.11.6)
        required: true
        type: string
        default: '0.11.601'
      build_number:
        description: Exact already-attached build (Mac currently 2026111801)
        required: true
        type: string
        default: '1002501'
      stage:
        required: true
        type: choice
        options: [inspect, apply]
        default: inspect
      baseline_sha256:
        description: Required for apply; exact baseline digest from inspect
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: apple-store-localization
  cancel-in-progress: false

jobs:
  context:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor == 'genixpro' && github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate immutable inputs before checkout
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
          MARKETING_REF: ${{ inputs.marketing_ref }}
          STAGE: ${{ inputs.stage }}
          BASELINE: ${{ inputs.baseline_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MARKETING_REF" =~ ^[0-9a-f]{40}$ ]]
          if [ "$STAGE" = apply ]; then [[ "$BASELINE" =~ ^[0-9a-f]{64}$ ]]; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tooling_ref }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2-marketing
          ref: ${{ inputs.marketing_ref }}
          path: marketing
          sparse-checkout: translations
          persist-credentials: false
      - name: Validate reviews and prepare public translation fields without store credentials
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
          MARKETING_REF: ${{ inputs.marketing_ref }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_REF"
          mkdir -p artifacts/apple-localization
          python3 platforms/mobile/apple_store_localize.py prepare \
            --marketing-root marketing --marketing-ref "$MARKETING_REF" \
            --platform "$PLATFORM" --version "$VERSION" --build-number "$BUILD_NUMBER" \
            --plan artifacts/apple-localization/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-apple-localization-plan
          path: artifacts/apple-localization/plan.json
          if-no-files-found: error
          retention-days: 1

  metadata:
    needs: context
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor == 'genixpro' && github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    environment: ios-testflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tooling_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-apple-localization-plan
          path: artifacts/apple-localization
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing pinned authentication dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/apple-localization-tools"
          "$RUNNER_TEMP/apple-localization-tools/bin/pip" install --require-hashes --only-binary=:all: \
            -r platforms/mobile/play-api-requirements.txt
      - name: Perform only the selected metadata action and emit safe receipts
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_P8_BASE64: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
          STAGE: ${{ inputs.stage }}
          BASELINE: ${{ inputs.baseline_sha256 }}
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_REF"
          test -n "$IOS_ASC_KEY_ID" && test -n "$IOS_ASC_ISSUER_ID" && test -n "$IOS_ASC_KEY_P8_BASE64"
          "$RUNNER_TEMP/apple-localization-tools/bin/python" platforms/mobile/apple_store_localize.py "$STAGE" \
            --plan artifacts/apple-localization/plan.json --baseline-sha256 "$BASELINE" \
            | tee artifacts/apple-localization/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-localization-safe-receipt
          path: artifacts/apple-localization/receipt.json
          if-no-files-found: error
          retention-days: 14
