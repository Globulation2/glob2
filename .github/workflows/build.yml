name: Accepted macOS resource fingerprint integration
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GLOB2_DEV_MODE: isolated
jobs:
  accepted-macos-fingerprints:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve dependency audit helper
        run: cp .github/scripts/resource_epoch_dependencies.py "$RUNNER_TEMP/resource_epoch_dependencies.py"
      - uses: actions/checkout@v4
        with:
          ref: 914a1e5088b817a5993b5ffc8f2601aa58e0c642
          persist-credentials: false
      - name: Install development dependencies
        run: brew install cmake freetype libpng jpeg-turbo scons pkgconf opusfile opus libogg speex openssl@3 boost fribidi libepoxy
      - uses: ./.github/actions/sdl3
        with:
          cc: clang
          cxx: clang++
      - name: Record source, compiler and dependency identities
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          mkdir -p artifacts/mac-integration-inputs
          git rev-parse HEAD > artifacts/mac-integration-inputs/revision.txt
          python3 test/build_provenance.py > artifacts/mac-integration-inputs/source-before.json
          g++ --version > artifacts/mac-integration-inputs/compiler.txt
          clang++ --version > artifacts/mac-integration-inputs/dependency-compiler.txt
          brew --version > artifacts/mac-integration-inputs/brew-version.txt
          brew list --versions > artifacts/mac-integration-inputs/brew-packages.txt
          brew info --json=v2 --installed > artifacts/mac-integration-inputs/brew-installed.json
          sw_vers > artifacts/mac-integration-inputs/os.txt
          uname -a >> artifacts/mac-integration-inputs/os.txt
          xcrun --show-sdk-version > artifacts/mac-integration-inputs/sdk.txt
          cp "$RUNNER_TEMP/resource_epoch_dependencies.py" artifacts/mac-integration-inputs/dependencies.py
          python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/mac-integration-inputs/dependencies-initial.json --verify-seal
      - name: Build integrated generator and design harness
        id: build
        run: |
          openssl="$(brew --prefix openssl@3)"
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons release=1 server=0 -j2 \
            engine-tests map-generator-golden-test \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > artifacts/mac-integration-inputs/build.log 2>&1
      - name: Record final dependency prefix after build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: built_inputs
        run: |
          python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/mac-integration-inputs/dependencies-before-observations.json --previous artifacts/mac-integration-inputs/dependencies-initial.json
      - name: Verify accepted catalog and explicit design fingerprints
        if: ${{ !cancelled() && steps.built_inputs.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          mkdir -p artifacts/generator-check-profile
          python3 test/ci_run_commands.py \
            --check 'accepted generator fingerprints' 'build/darwin/client/release/src/MapGeneratorGoldenTest artifacts/generator-check-profile --require-rows' \
            --check 'generator observations' 'python3 test/collect_generator_evidence.py collect build/darwin/client/release/src/MapGeneratorGoldenTest artifacts/generator-evidence --platform macos-arm64' \
            --check 'resource design fingerprints' "python3 test/run_tests.py --binary engine --build-dir build/darwin/client/release --in-process --no-display --filter 'MapGeneratorDefaults/Explicit designs preserve topology*' --artifacts artifacts/generator-evidence/designs --junit artifacts/generator-evidence/designs-junit.xml" > artifacts/mac-integration-inputs/verification.log 2>&1
      - name: Audit observation dependency stability
        if: ${{ !cancelled() && steps.built_inputs.outcome == 'success' }}
        run: |
          python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/mac-integration-inputs/dependencies-after-observations.json --previous artifacts/mac-integration-inputs/dependencies-before-observations.json --require-match
      - name: Audit source stability independently
        if: always()
        run: |
          python3 test/build_provenance.py > artifacts/mac-integration-inputs/source-after.json
          cmp artifacts/mac-integration-inputs/source-before.json artifacts/mac-integration-inputs/source-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accepted-macos-fingerprints-final-integration
          path: |
            artifacts/generator-evidence/
            artifacts/mac-integration-inputs/
          if-no-files-found: error
          retention-days: 14
