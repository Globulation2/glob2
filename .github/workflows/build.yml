name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_only:
        description: Run only browser, transport, gateway, and deployment checks
        required: false
        type: boolean
        default: false

# A new push to a pull request supersedes its running checks. Master runs are
# never cancelled: relevant builds save the compiler caches the next PRs restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.select.outputs.native }}
      browser: ${{ steps.select.outputs.browser }}
      map_generators: ${{ steps.select.outputs.map_generators }}
      deployment: ${{ steps.select.outputs.deployment }}
      cross_platform: ${{ steps.select.outputs.cross_platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Test changed-path selection
        run: python3 -m unittest discover -s tests/build_system -p test_ci_changed_paths.py -v
      - name: Select checks for changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BROWSER_ONLY: ${{ inputs.browser_only }}
        run: python3 .github/scripts/ci_changed_paths.py --base "$BASE_SHA"

  linux-build:
    name: linux build (${{ matrix.image }}, ${{ matrix.compiler }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}

    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
            c_compiler: gcc-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
            c_compiler: gcc-13
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: clang-18
            c_compiler: clang-18
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      - name: Validate translations
        id: validate_translations
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'translation catalog' 'python3 data/check_translations.py --strict' \
            --check 'translation tests' 'python3 test/test_translations.py' \
            --check 'font coverage' 'python3 test/test_font_coverage.py'
      - name: Test compiler cache integration
        id: test_compiler_cache_integration
        continue-on-error: true
        run: python3 test/test-ccache.py

      - name: Test CI failure aggregation and the test runner
        id: test_ci_failure_aggregation
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'CI failure aggregation' 'python3 test/test_ci_failure_aggregation.py' \
            --check 'native test runner' 'python3 test/test_run_tests.py' \
            --check 'scripting evidence provenance and retrieval' 'python3 -m unittest discover -s test -p test_javascript_evidence.py -v'

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-${{ matrix.runner }}-

      - name: Identify Linux compiler
        id: linux_compiler
        run: |
          digest=$(sha256sum "$(command -v ${{ matrix.compiler }})" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Linux object tree
        id: restore_linux_object_tree
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux/client/release/.sconsign.dblite
            build/linux/client/release/identity.json
            build/linux/client/release/configure
            build/linux/client/release/include/glob2/BuildConfig.h
            build/linux/client/release/**/*.o
            build/linux/client/release/**/*.a
          key: linux-objects-v1-${{ matrix.runner }}-${{ steps.linux_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-objects-v1-${{ matrix.runner }}-${{ steps.linux_compiler.outputs.digest }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          rm -f build/linux/client/release/src/GlobalContainerArgs.o
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build glob2 and the regression harnesses
        id: build_glob2_and_the_regression_harnesses
        run: |
          scons CC=${{ matrix.c_compiler }} CXX=${{ matrix.compiler == 'clang-18' && 'clang++-18' || matrix.compiler }} -j$(nproc) release=1 server=0 build/linux/client/release/src/glob2 \
            unit-tests \
            engine-tests \
            maxima-strategy-dump \
            map-report-test \
            map-generator-golden-test \
            lan-test \
            menu-colony-harness

      - name: Reconstruct scripting vendors
        run: python3 tools/javascript/verify-vendor.py

      - name: Execute shared JavaScript corpus
        id: execute_shared_javascript_corpus
        run: python3 test/check_javascript_corpus.py --build-dir build/linux/client/release --output artifacts/javascript-corpus

      - name: Verify frozen JavaScript simulation profile
        id: verify_frozen_javascript_simulation_profile
        run: python3 test/check_javascript.py build/linux/client/release/src/glob2 --output artifacts/javascript-profile

      - name: Retain released simulation compatibility evidence
        run: python3 test/check_telemetry_simulation.py build/linux/client/release/src/glob2 --output artifacts/released-compatibility

      - name: Upload JavaScript simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-profile-linux-${{ matrix.compiler }}
          path: |
            artifacts/javascript-profile
            artifacts/javascript-corpus
            artifacts/released-compatibility

      - name: Test Maxima strategy configuration and policies
        id: test_maxima_strategy_configuration_and_policies
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'Maxima strategy config' 'MAXIMA_STRATEGY_DUMP=build/linux/client/release/test/MaximaStrategyDump GLOB2_BUILD_DIR=build/linux/client/release GLOB2_USER_DIR="$(mktemp -d)" python3 test/maxima/MaximaStrategyConfigTest.py' \
            --check 'Maxima policy tests' 'python3 -m unittest discover -s test/maxima -p "*Test.py"'

      - name: Package built Linux test programs
        id: package_linux_test_programs
        if: steps.build_glob2_and_the_regression_harnesses.outcome == 'success'
        run: |
          test -x build/linux/client/release/src/glob2
          mkdir -p artifacts/ci-native
          find build/linux/client/release -type f \( -perm /111 -o -name '*.so*' \) -print0 |
            tar --null -czf artifacts/ci-native/linux-test-programs.tar.gz -T -
      - uses: actions/upload-artifact@v4
        id: upload_linux_test_programs
        if: steps.package_linux_test_programs.outcome == 'success'

        with:
          name: linux-test-programs-${{ matrix.runner }}${{ matrix.compiler == 'clang-18' && '-clang-18' || '' }}
          path: artifacts/ci-native/linux-test-programs.tar.gz
          retention-days: 2
          if-no-files-found: error

      - name: Save Linux object tree
        id: save_linux_object_tree
        if: ${{ !cancelled() && steps.package_linux_test_programs.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux/client/release/.sconsign.dblite
            build/linux/client/release/identity.json
            build/linux/client/release/configure
            build/linux/client/release/include/glob2/BuildConfig.h
            build/linux/client/release/**/*.o
            build/linux/client/release/**/*.a
          key: linux-objects-v1-${{ matrix.runner }}-${{ steps.linux_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        id: report_the_cache_statistics
        continue-on-error: true
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  linux-tests:
    name: linux tests (${{ matrix.platform }}, shard ${{ matrix.shard }}/4)
    needs: [changes, linux-build]
    if: ${{ needs.changes.outputs.native == 'true' && needs.linux-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 1
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 2
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 3
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 4
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 1
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 2
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 3
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 4
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      - uses: actions/download-artifact@v4
        id: download_linux_test_programs
        with:
          name: linux-test-programs-${{ matrix.runner }}
          path: artifacts/ci-native
      - name: Unpack built Linux test programs
        id: unpack_linux_test_programs
        run: tar -xzf artifacts/ci-native/linux-test-programs.tar.gz

      - name: Run the unit tests
        if: ${{ matrix.shard == 4 }}
        id: run_the_unit_tests
        continue-on-error: true
        run: python3 test/run_tests.py --binary unit --build-dir build/linux/client/release --junit artifacts/tests/unit-junit.xml
      - name: Run the engine tests
        id: run_the_engine_tests
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        # The [map-generators] contract runs in the linux-map-generators telemetry job.
        run: python3 test/run_tests.py --binary engine --build-dir build/linux/client/release --fullscreen --shard ${{ matrix.shard }}/4 --exclude-tag map-generators --junit artifacts/tests/engine-junit.xml
      - name: Upload native test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-${{ matrix.runner }}-${{ matrix.shard }}
          path: artifacts/tests/
          if-no-files-found: ignore

      - name: Test map JSON reports
        if: ${{ matrix.shard == 2 }}
        id: test_map_json_reports
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map report' 'python3 test/test_map_report.py build/linux/client/release/src/glob2 build/linux/client/release/test/MapReportHarness' \
            --check 'map telemetry' 'python3 test/test_map_telemetry.py'
      - name: Upload map JSON reports and command log
        id: upload_map_json_reports_and_command_log
        continue-on-error: true
        if: ${{ always() && matrix.shard == 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: map-report-${{ matrix.runner }}
          path: artifacts/map-report/

      - name: Test headless map CLI with the shared preview renderer
        if: ${{ matrix.shard == 3 }}
        id: test_headless_map_cli_with_the_shared_preview_renderer
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'generation only' 'python3 test/test_map_cli.py build/linux/client/release/src/glob2 --generation-only' \
            --check 'map CLI' 'python3 test/test_map_cli.py build/linux/client/release/src/glob2' \
            --check 'map image conversion' 'python3 test/test_map_image.py build/linux/client/release/src/glob2'
      - name: Upload map CLI previews and command log
        id: upload_map_cli_previews_and_command_log
        continue-on-error: true
        if: ${{ always() && matrix.shard == 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-${{ matrix.runner }}
          path: |
            artifacts/map-cli/
            artifacts/map-image/

      - name: Test tournament protocol, AI configuration and main CLI
        if: ${{ matrix.shard == 1 }}
        id: test_tournament_protocol_ai_configuration_and_main_cli
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check tournaments 'python3 test/test_tournaments.py' \
            --check 'tournament pipeline' 'python3 test/test_tournament_pipeline.py' \
            --check 'distributed map telemetry' 'python3 test/test_distributed_map_telemetry.py' \
            --check 'distributed game telemetry' 'python3 test/test_distributed_game_telemetry.py' \
            --check 'map fairness' 'python3 test/test_map_fairness_tournament.py' \
            --check 'map generation study' 'python3 test/test_map_generation_study.py' \
            --check 'fairness model' 'python3 test/test_fairness_model.py' \
            --check 'tournament CLI' 'python3 test/tournament_cli_integration.py --binary build/linux/client/release/src/glob2 --output artifacts/tournament-cli'
      - name: Retain tournament CLI compatibility evidence
        id: retain_tournament_cli_compatibility_evidence
        continue-on-error: true
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: tournament-cli-${{ matrix.runner }}
          path: artifacts/tournament-cli/
          if-no-files-found: ignore

      - name: Verify save continuation traces
        if: ${{ matrix.shard == 3 }}
        id: verify_save_continuation_traces
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'shared runtime save continuation' 'python3 test/check_shared_runtime_save_continuation.py build/linux/client/release/src/glob2' \
            --check 'Maxima save continuation fixture' 'python3 test/maxima/check_save_continuation_fixture.py build/linux/client/release/src/glob2'

      - name: Verify default gradient schedule against cross-platform checksums
        if: ${{ matrix.shard == 4 }}
        id: verify_default_gradient_schedule_against_cross_platform
        continue-on-error: true
        run: python3 test/check_telemetry_simulation.py build/linux/client/release/src/glob2

      - name: Verify parallel compute and save continuation
        if: ${{ matrix.shard == 1 }}
        id: verify_parallel_compute_and_save_continuation
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'parallel compute' 'python3 test/check_parallel_compute.py build/linux/client/release/src/glob2' \
            --check 'gradient pipeline' 'python3 test/check_gradient_pipeline.py build/linux/client/release/src/glob2'
      - name: Build and run the LAN session regression
        if: ${{ matrix.shard == 3 }}
        id: build_and_run_the_lan_session_regression
        continue-on-error: true
        run: |
          python3 test/run_lan_session_test.py build/linux/client/release/src/LANSessionHarness

      - name: Test front-end colony isolation and menu navigation
        if: ${{ matrix.shard == 2 }}
        id: test_front_end_colony_isolation_and_menu_navigation
        continue-on-error: true
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/linux/client/release/test/MenuColonyHarness check data/menu/colony.bin
          ./build/linux/client/release/test/MenuColonyHarness navigation unused

      - name: Retain browser/native simulation trace
        if: ${{ matrix.shard == 4 }}
        id: retain_browser_native_simulation_trace
        continue-on-error: true
        run: python3 test/run-browser-determinism.py build/linux/client/release/src/glob2 artifacts/browser-determinism/native
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.shard == 4 }}
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: browser-determinism-${{ matrix.runner }}
          path: artifacts/browser-determinism/native/

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  linux:
    name: linux (${{ matrix.image }})
    needs: [changes, linux-build, linux-tests]
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - name: Require every Linux build and test shard
        env:
          BUILD_RESULT: ${{ needs.linux-build.result }}
          TEST_RESULT: ${{ needs.linux-tests.result }}
        run: |
          echo "Linux builds: $BUILD_RESULT; Linux test shards: $TEST_RESULT"
          test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  linux-variants:
    name: linux variants (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-variants-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-variants-${{ matrix.runner }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build the YOG server
        id: build_the_yog_server
        continue-on-error: true
        run: scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=1 --build=build-server

      - name: Build without OpenGL
        id: build_without_opengl
        continue-on-error: true
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 opengl=0 wss=0 --build=build-software build-software/src/glob2 engine-tests
          python3 test/SoftwareStartupTest.py build-software/src/glob2
          python3 test/run_tests.py --binary engine --build-dir build-software --no-display --filter 'TorusRender/*software*' --junit artifacts/tests/software-junit.xml

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        id: report_the_cache_statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-variants-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  linux-map-generators:
    name: linux map generators (${{ matrix.image }}, ${{ matrix.suite }})
    needs: [changes, linux-build]
    if: ${{ !cancelled() && needs.changes.outputs.map_generators == 'true' && (needs.linux-build.result == 'success' || needs.linux-build.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
            suite: sweep-a
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
            suite: sweep-a
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
            suite: sweep-b
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
            suite: sweep-b
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
            suite: telemetry
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
            suite: telemetry
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      # Main builds already include both programs. Reuse the exact binaries;
      # map-only diffs skip that build and keep the standalone path below.
      - uses: actions/download-artifact@v4
        id: download_linux_test_programs
        if: ${{ needs.linux-build.result == 'success' }}
        with:
          name: linux-test-programs-${{ matrix.runner }}
          path: artifacts/ci-native
      - name: Unpack built Linux test programs
        id: unpack_linux_test_programs
        if: ${{ needs.linux-build.result == 'success' }}
        run: tar -xzf artifacts/ci-native/linux-test-programs.tar.gz

      # Reads the main job's cache and never saves on the standalone path.
      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        if: ${{ needs.linux-build.result == 'skipped' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-${{ matrix.runner }}-

      - name: Build the map generator golden test
        id: build_the_map_generator_golden_test
        if: ${{ needs.linux-build.result == 'skipped' }}
        run: |
          targets=(map-generator-golden-test)
          if [ '${{ matrix.suite }}' = telemetry ]; then
            targets+=(engine-tests)
          fi
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 "${targets[@]}"

      - name: Check golden maps and sweep colony counts
        id: check_golden_maps_and_sweep_colony_counts
        if: ${{ startsWith(matrix.suite, 'sweep-') }}
        continue-on-error: true
        run: |
          # The two jobs divide the four independent sweep shards between runners.
          # Run golden rows alongside the first pair of shards.
          golden() { log=$1; shift; timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest "$@" > "$log" 2>&1; }
          if [ '${{ matrix.suite }}' = sweep-a ]; then
            golden /tmp/golden-rows.log glob2-golden-rows --require-rows & rows=$!
            shards=(0 1)
          else
            shards=(2 3)
          fi
          sweeps=()
          for shard in "${shards[@]}"; do
            golden /tmp/golden-sweep-$shard.log glob2-golden-sweep-$shard --sweep $shard/4 & sweeps+=($!)
          done
          status=0
          if [ '${{ matrix.suite }}' = sweep-a ]; then
            if ! wait $rows; then
              status=1
              golden /tmp/golden-print.log glob2-golden-print --print || true
              cat /tmp/golden-print.log
            fi
            cat /tmp/golden-rows.log
          fi
          for i in "${!shards[@]}"; do
            wait ${sweeps[$i]} || status=1
            cat /tmp/golden-sweep-${shards[$i]}.log
          done
          [ $status = 0 ]

      - name: Check generator telemetry equivalence and cost
        id: check_generator_telemetry_equivalence_and_cost
        if: ${{ matrix.suite == 'telemetry' }}
        continue-on-error: true
        run: |
          # These checks use separate profiles and can share the runner's cores.
          timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest glob2-telemetry-ci --telemetry > /tmp/map-telemetry.log 2>&1 & telemetry=$!
          python3 test/run_tests.py --binary engine --build-dir build/linux/client/release --tag map-generators --junit artifacts/tests/map-generators-junit.xml > /tmp/map-defaults.log 2>&1 & defaults=$!
          status=0
          wait "$telemetry" || status=1
          wait "$defaults" || status=1
          cat /tmp/map-telemetry.log /tmp/map-defaults.log
          [ "$status" -eq 0 ]

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  windows:
    name: windows (mingw-w64)
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: windows-latest
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        id: msys2_setup_msys2_v2_1
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_net
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-ccache

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      # Checkout uses Git for Windows; MSYS Git otherwise defaults to different
      # newline handling and reports unchanged CRLF source files as modifications.
      - name: Align Git newline handling for Windows builds
        run: git config --local core.autocrlf true

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record Windows checkout before compilation
        run: |
          mkdir -p artifacts/windows-source
          {
            command -v git
            git --version
            git config --show-origin --get-regexp '^core\.(symlinks|filemode|autocrlf)$' || true
            git status --porcelain=v1 --untracked-files=all
          } > artifacts/windows-source/before-build.log 2>&1
          cat artifacts/windows-source/before-build.log

      - name: Retain Windows checkout diagnostics before compilation
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-source-before-build
          path: artifacts/windows-source/before-build.log

      - name: Build glob2 and the regression harnesses
        id: build_glob2_and_the_regression_harnesses
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 build/mingw/client/release/src/glob2.exe \
            unit-tests \
            engine-tests \
            map-report-test

      - name: Record Windows checkout after compilation
        if: ${{ !cancelled() && steps.actions_checkout_v4_1.outcome == 'success' }}
        run: |
          mkdir -p artifacts/windows-source
          {
            command -v git
            git --version
            git config --show-origin --get-regexp '^core\.(symlinks|filemode|autocrlf)$' || true
            git status --porcelain=v1 --untracked-files=all
            git diff --summary
          } > artifacts/windows-source/after-build.log 2>&1
          cat artifacts/windows-source/after-build.log

      - name: Execute shared JavaScript corpus
        id: execute_shared_javascript_corpus
        run: python3 test/check_javascript_corpus.py --build-dir build/mingw/client/release --output artifacts/javascript-corpus

      - name: Verify frozen JavaScript simulation profile
        id: verify_frozen_javascript_simulation_profile
        run: python3 test/check_javascript.py build/mingw/client/release/src/glob2.exe --output artifacts/javascript-profile

      - name: Upload JavaScript simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-profile-mingw
          path: |
            artifacts/javascript-profile
            artifacts/javascript-corpus
            artifacts/windows-source

      - name: Run the unit tests
        id: run_the_unit_tests
        continue-on-error: true
        run: python3 test/run_tests.py --binary unit --build-dir build/mingw/client/release --junit artifacts/tests/unit-junit.xml
      - name: Run the engine tests
        id: run_the_engine_tests
        continue-on-error: true
        # The [map-generators] contract stays on Linux, as before this runner existed.
        run: python3 test/run_tests.py --binary engine --build-dir build/mingw/client/release --exclude-tag map-generators --junit artifacts/tests/engine-junit.xml
      - name: Upload native test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-windows
          path: artifacts/tests/
          if-no-files-found: ignore

      - name: Test map JSON reports
        id: test_map_json_reports
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map report' 'python3 test/test_map_report.py build/mingw/client/release/src/glob2.exe build/mingw/client/release/test/MapReportHarness.exe' \
            --check 'map telemetry' 'python3 test/test_map_telemetry.py'
      - name: Upload map JSON reports and command log
        id: upload_map_json_reports_and_command_log
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-report-windows
          path: artifacts/map-report/

      - name: Test headless map CLI
        id: test_headless_map_cli
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map CLI' 'python3 test/test_map_cli.py build/mingw/client/release/src/glob2.exe' \
            --check 'map image conversion' 'python3 test/test_map_image.py build/mingw/client/release/src/glob2.exe'
      - name: Upload map CLI previews and command log
        id: upload_map_cli_previews_and_command_log
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-windows
          path: |
            artifacts/map-cli/
            artifacts/map-image/

      - name: Verify save continuation traces
        id: verify_save_continuation_traces
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'shared runtime save continuation' 'python3 test/check_shared_runtime_save_continuation.py build/mingw/client/release/src/glob2.exe' \
            --check 'Maxima save continuation fixture' 'python3 test/maxima/check_save_continuation_fixture.py build/mingw/client/release/src/glob2.exe'

      - name: Verify default gradient schedule against cross-platform checksums
        id: verify_default_gradient_schedule_against_cross_platform
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'default AI gradient schedule' 'python3 test/check_telemetry_simulation.py build/mingw/client/release/src/glob2.exe --output artifacts/released-compatibility/serial' \
            --check 'parallel AI gradient schedule' 'python3 test/check_telemetry_simulation.py build/mingw/client/release/src/glob2.exe --parallel-ai --output artifacts/released-compatibility/parallel'

      - name: Upload released compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: released-compatibility-windows
          path: artifacts/released-compatibility/

      - name: Report the cache statistics
        id: report_the_cache_statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      - name: Retain browser/native simulation trace
        id: retain_browser_native_simulation_trace
        continue-on-error: true
        run: python3 test/run-browser-determinism.py build/mingw/client/release/src/glob2.exe artifacts/browser-determinism/native
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: browser-determinism-windows
          path: artifacts/browser-determinism/native/

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      # Master pushes and authenticated manual runs may retain successful builds.
      # Ordinary PRs only restore caches; later test failures do not discard objects.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && steps.build_glob2_and_the_regression_harnesses.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && steps.build_glob2_and_the_regression_harnesses.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

