      - name: Restore WebAssembly object tree
        id: restore_webassembly_object_tree
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/emscripten/client/release/.sconsign.dblite
            build/emscripten/client/release/identity.json
            build/emscripten/client/release/include/glob2/BuildConfig.h
            build/emscripten/client/release/obj
          key: wasm-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wasm-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-
      - name: Build WebAssembly client
        id: build_web
        env:
          # Emscripten wraps its underlying clang, not the Python compiler driver.
          EM_COMPILER_WRAPPER: ccache
        run: |
          ccache -z
          echo "WASM_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
          # This source embeds __DATE__ and __TIME__. Refresh it after restoring
          # objects so the binary still reports the current compilation time.
          rm -f build/emscripten/client/release/obj/src/GlobalContainerArgs.cpp.o
          scons target=web release=1 web-tests build/emscripten/client/release/index.html -j$(nproc)
          ccache -s -v
      - name: Save WebAssembly object tree
        id: save_webassembly_object_tree
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/emscripten/client/release/.sconsign.dblite
            build/emscripten/client/release/identity.json
            build/emscripten/client/release/include/glob2/BuildConfig.h
            build/emscripten/client/release/obj
          key: wasm-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prune WebAssembly compiler cache
        id: prune_webassembly_compiler_cache
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: ccache --evict-older-than "$(( $(date +%s) - WASM_CACHE_START + 60 ))s"
      - name: Save WebAssembly compiler cache
        id: save_webassembly_compiler_cache
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Serve the game and scripting harness; retain compiler identity for the
      # scripting evidence collected by the browser test jobs.
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: web-client
          retention-days: 3
          if-no-files-found: error
          path: |
            build/emscripten/client/release/identity.json
            build/emscripten/client/release/index.html
            build/emscripten/client/release/index.js
            build/emscripten/client/release/index.wasm
            build/emscripten/client/release/index.data
            build/emscripten/client/release/script-tests.html
            build/emscripten/client/release/script-tests.js
            build/emscripten/client/release/script-tests.wasm
            build/emscripten/client/release/script-tests.data
      - uses: actions/upload-artifact@v4
        id: upload_artifact_2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        with:
          name: glob2-web-development
          retention-days: 7
          path: |
            build/emscripten/client/release/index.html
            build/emscripten/client/release/index.js
            build/emscripten/client/release/index.wasm
            build/emscripten/client/release/index.data

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  web-native:
    name: browser gateway, router and transport
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
      - name: Install native build dependencies
        id: install_native_build_dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y scons ccache g++-13 libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev libvorbis-dev libogg-dev libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      # Reuse the native client objects already populated by the main Linux job.
      # This job only reads that cache; transport-specific misses stay local.
      - name: Restore native compiler cache
        id: restore_native_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-ubuntu-24.04-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-ubuntu-24.04-
      - name: Identify native compiler
        id: native_compiler
        run: |
          digest=$(sha256sum "$(command -v g++-13)" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore native object tree
        id: restore_native_object_tree
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux/**/.sconsign.dblite
            build/linux/**/identity.json
            build/linux/**/configure
            build/linux/**/include/glob2/BuildConfig.h
            build/linux/**/*.o
            build/linux/**/*.a
          key: native-objects-v2-ubuntu-24.04-${{ steps.native_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-objects-v2-ubuntu-24.04-${{ steps.native_compiler.outputs.digest }}-
      - name: Reset native compiler cache statistics
        id: reset_native_compiler_cache_statistics
        run: |
          ccache -z
          # Keep the build banner current even when every other object is reused.
          find build/linux -name GlobalContainerArgs.o -delete 2>/dev/null || true
      - name: Build gateway
        id: build_gateway
        continue-on-error: true
        run: scons role=gateway release=1 -j$(nproc)
      - name: Test gateway
        id: test_gateway
        continue-on-error: true
        if: steps.build_gateway.outcome == 'success'
        run: python3 -m unittest discover -s tests/gateway -v
      - name: Build headless router
        id: build_headless_router
        continue-on-error: true
        run: scons CXX=g++-13 role=router release=1 -j$(nproc)
      - name: Build transport integration fixture
        id: build_transport_integration_fixture
        continue-on-error: true
        run: |
          # The browser's editor tests read the native generator catalog, then
          # navigate the visible picker with real keyboard/pointer events.
          scons CXX=g++-13 release=1 transport-test build/linux/client/release/src/glob2 -j$(nproc)
      - name: Test network transport
        id: test_network_transport
        continue-on-error: true
        if: steps.build_transport_integration_fixture.outcome == 'success'
        run: |
          python3 test/ci_run_commands.py \
            --check 'network transport' 'python3 test/run-network-transport-tests.py' \
            --check 'transport unit tests' 'python3 -m unittest discover -s tests/transport -v' \
            --check 'compiler cache statistics' 'ccache -s -v'
      - name: Package the programs the browser tests drive
        id: package_the_programs_the_browser_tests_drive
        if: steps.build_gateway.outcome == 'success' && steps.build_transport_integration_fixture.outcome == 'success'
        run: |
          mkdir -p artifacts/ci-native
          tar -czf artifacts/ci-native/web-native.tar.gz \
            build/linux/client/release/src/glob2 \
            build/linux/client/release/src/net-connection-test \
            build/linux/client/release/src/native-multiplayer-peer \
            build/linux/gateway/release/glob2-ws-gateway
      - name: Save native object tree
        id: save_native_object_tree
        if: ${{ !cancelled() && steps.package_the_programs_the_browser_tests_drive.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux/**/.sconsign.dblite
            build/linux/**/identity.json
            build/linux/**/configure
            build/linux/**/include/glob2/BuildConfig.h
            build/linux/**/*.o
            build/linux/**/*.a
          key: native-objects-v2-ubuntu-24.04-${{ steps.native_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: web-native
          retention-days: 3
          if-no-files-found: error
          path: artifacts/ci-native/web-native.tar.gz

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  web-deploy:
    name: browser self-hosting deployment
    needs: [changes, web-build]
    if: ${{ needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
      - uses: actions/download-artifact@v4
        id: download_web_client
        with:
          name: web-client
          path: build/emscripten/client/release
      - name: Test self-hosting with real TLS and persistent volumes
        id: test_self_hosting_with_real_tls_and_persistent_volumes
        continue-on-error: true
        run: |
          docker compose -f deploy/compose.yaml build lobby
          python3 -m unittest discover -s tests/deployment -v

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  web-test:
    name: browser tests (${{ matrix.name }})
    needs: [changes, web-build, web-native]
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Leave runner capacity for Linux test shards once the browser build
      # finishes; all browser cases still run before the required check passes.
      max-parallel: 10
      matrix:
        include:
          # The main suite keeps file order and includes build-artifact.spec.js
          # once. Long renderer and storage specs run in dedicated jobs.
          - name: chromium 1/5
            browsers: chromium
            command: xvfb-run -a npx playwright test --project=chromium --shard=1/5 --grep-invert='torus\.spec\.js|rendering\.spec\.js|settings-storage\.spec\.js'
          - name: chromium 2/5
            browsers: chromium
            command: xvfb-run -a npx playwright test --project=chromium --shard=2/5 --grep-invert='torus\.spec\.js|rendering\.spec\.js|settings-storage\.spec\.js'
          - name: chromium 3/5
            browsers: chromium
            command: xvfb-run -a npx playwright test --project=chromium --shard=3/5 --grep-invert='torus\.spec\.js|rendering\.spec\.js|settings-storage\.spec\.js'
          - name: chromium 4/5
            browsers: chromium
            command: xvfb-run -a npx playwright test --project=chromium --shard=4/5 --grep-invert='torus\.spec\.js|rendering\.spec\.js|settings-storage\.spec\.js'
          - name: chromium torus
            browsers: chromium
            command: xvfb-run -a npx playwright test torus.spec.js --project=chromium
          - name: chromium 5/5
            browsers: chromium
            command: xvfb-run -a npx playwright test --project=chromium --shard=5/5 --grep-invert='torus\.spec\.js|rendering\.spec\.js|settings-storage\.spec\.js'
          # Start the longest renderer checks in the first browser wave. The
          # shorter lifecycle and storage checks take the slots they release.
          - name: chromium webgl2 match reload
            browsers: chromium
            renderer: webgl2
            command: xvfb-run -a npx playwright test session-reload.spec.js --project=chromium --grep-invert='@webgl2-reload-(b|c)'
          - name: chromium webgl2 replay reload
            browsers: chromium
            renderer: webgl2
            command: xvfb-run -a npx playwright test session-reload.spec.js --project=chromium --grep='@webgl2-reload-c'
          - name: chromium webgl2 viewport
            browsers: chromium
            renderer: webgl2
            command: xvfb-run -a npx playwright test viewport.spec.js --project=chromium
          - name: chromium webgl2 damaged load
            browsers: chromium
            renderer: webgl2
            command: xvfb-run -a npx playwright test session-reload.spec.js --project=chromium --grep='@webgl2-reload-b'
          - name: lifecycle
            browsers: chromium
            command: |
              python3 ../test/ci_run_commands.py \
                --check 'browser unit tests' 'node --test unit/*.test.js' \
                --check 'software visibility' 'GLOB2_TEST_RENDERER=software xvfb-run -a npx playwright test --config visibility.config.js' \
                --check 'WebGL visibility' 'GLOB2_TEST_RENDERER=webgl2 xvfb-run -a npx playwright test --config visibility.config.js'
          - name: chromium settings storage
            browsers: chromium
            command: xvfb-run -a npx playwright test settings-storage.spec.js --project=chromium
          - name: chromium webgl2 responsive and startup
            browsers: chromium
            renderer: webgl2
            command: xvfb-run -a npx playwright test responsive-presentation.spec.js runtime-build.spec.js --project=chromium
          - name: webkit
            browsers: webkit
            command: xvfb-run -a npx playwright test runtime-build.spec.js viewport.spec.js responsive-presentation.spec.js campaign-editor-storage.spec.js --project=webkit
          - name: webkit scripting
            browsers: webkit
            command: xvfb-run -a npx playwright test determinism.spec.js --project=webkit --grep='shared scripting corpus'
          - name: chromium rendering
            browsers: chromium
            command: xvfb-run -a npx playwright test rendering.spec.js --project=chromium
          - name: firefox
            browsers: firefox
            command: GLOB2_FIREFOX_HEADED=1 xvfb-run -a npx playwright test runtime-build.spec.js viewport.spec.js responsive-presentation.spec.js campaign-editor-storage.spec.js --project=firefox
          - name: firefox scripting
            browsers: firefox
            command: GLOB2_FIREFOX_HEADED=1 xvfb-run -a npx playwright test determinism.spec.js --project=firefox --grep='shared scripting corpus'
          # Repeat the remaining renderer-sensitive tests on WebGL2. New
          # untagged reload cases stay with the match reload group by default.
          - name: chromium webgl2 input
            browsers: chromium
            renderer: webgl2
            command: xvfb-run -a npx playwright test input.spec.js --project=chromium
    env:
      GLOB2_TEST_RENDERER: ${{ matrix.renderer || 'software' }}
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
      - name: Install the libraries the native programs link against
        id: install_the_libraries_the_native_programs_link_against
        run: |
          # The hosted image adds an unpinned Chrome repository, while this job
          # installs its pinned browsers through Playwright below.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y scons ccache g++-13 libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev libvorbis-dev libogg-dev libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev xvfb xauth
      - uses: actions/download-artifact@v4
        id: actions_download_artifact_v4_1
        with:
          name: web-client
          path: build/emscripten/client/release
      - uses: actions/download-artifact@v4
        id: actions_download_artifact_v4_2
        with:
          name: web-native
          path: artifacts/ci-native
      - name: Unpack the native programs
        id: unpack_the_native_programs
        run: tar -xzf artifacts/ci-native/web-native.tar.gz
      - uses: actions/setup-node@v4
        id: actions_setup_node_v4_1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Install browser test dependencies
        id: install_browser_test_dependencies
        working-directory: browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browsers }}
      # Firefox needs an X display and an audio service. A null sink is silent.
      - name: Start a silent audio service
        id: start_a_silent_audio_service
        if: contains(matrix.browsers, 'firefox')
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load='module-null-sink sink_name=glob2_ci'
      - name: Run ${{ matrix.name }}
        id: run_matrix_name
        continue-on-error: true
        working-directory: browser
        run: ${{ matrix.command }}
      # Baseline replay and per-browser scripting results share this artifact
      # family; the comparison job selects each corpus explicitly.
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: browser-determinism-wasm-${{ strategy.job-index }}
          path: artifacts/browser-determinism/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        id: upload_artifact_2
        continue-on-error: true
        if: steps.run_matrix_name.outcome == 'failure'
        with:
          name: browser-failure-traces-${{ strategy.job-index }}
          retention-days: 7
          path: |
            build/browser-test-results
            build/browser-test-report

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  browser-determinism:
    name: browser/native simulation equivalence
    needs: [changes, linux, windows, web-test]
    if: ${{ needs.changes.outputs.cross_platform == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
      - uses: actions/download-artifact@v4
        id: actions_download_artifact_v4_1
        with:
          pattern: browser-determinism-*
          path: artifacts/ci-traces
      - name: Compare every per-tick trace across Linux, Windows and WebAssembly
        id: compare_every_per_tick_trace_across_linux_windows_and_w
        run: |
          python3 - <<'PY'
          from pathlib import Path
          traces = sorted(path for path in Path('artifacts/ci-traces').rglob('*.checksums')
                          if path.name in {'native.replay.checksums', 'wasm.replay.checksums'})
          assert len(traces) == 4, f'Expected four platform traces, got {traces}'
          reference = traces[0].read_bytes()
          assert len(reference) > 1000
          for trace in traces[1:]:
              assert trace.read_bytes() == reference, f'Simulation differs: {trace}'
          print('All four per-tick simulation traces match')
          PY

      - uses: actions/download-artifact@v4
        with:
          pattern: javascript-profile-*
          path: artifacts/ci-scripting
      - name: Compare shared scripting results across native builds and every browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          native = sorted(Path('artifacts/ci-scripting').glob('*/javascript-corpus'))
          browsers = sorted(path.parent for path in Path('artifacts/ci-traces').glob('*/script-corpus/*/manifest.json'))
          assert any('mingw' in path.parts[-2] for path in native), 'Missing Windows scripting evidence'
          assert any('linux' in path.parts[-2] for path in native), 'Missing Linux scripting evidence'
          assert {path.name for path in browsers} == {'chromium', 'firefox', 'webkit'}, browsers
          assert len(browsers) == 3, f'Duplicate browser scripting runs: {browsers}'
          reference = native[0]
          for index, candidate in enumerate(native[1:] + browsers):
              subprocess.run(['python3', 'test/check_javascript_evidence.py', str(reference),
                              str(candidate), '--output', f'artifacts/javascript-ci/comparison-{index}.json'],
                             check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-cross-platform-comparisons
          path: artifacts/javascript-ci/
          if-no-files-found: ignore

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  ci-result:
    name: Relevant checks passed
    needs: [changes, linux, linux-variants, linux-map-generators, windows, windows-server, web-build, web-native, web-deploy, web-test, browser-determinism]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify all selected jobs completed successfully
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ['NEEDS_JSON'])
          assert needs['changes']['result'] == 'success', 'Change detection failed'
          selected = needs['changes']['outputs']
          expected = {
              'linux': selected['native'] == 'true',
              'linux-variants': selected['native'] == 'true',
              'linux-map-generators': selected['map_generators'] == 'true',
              'windows': selected['native'] == 'true',
              'windows-server': selected['native'] == 'true',
              'web-build': selected['browser'] == 'true',
              'web-native': selected['browser'] == 'true',
              'web-deploy': selected['deployment'] == 'true',
              'web-test': selected['browser'] == 'true',
              'browser-determinism': selected['cross_platform'] == 'true',
          }
          for job, should_run in expected.items():
              required = 'success' if should_run else 'skipped'
              actual = needs[job]['result']
              print(f'{job}: {actual} (expected {required})')
              assert actual == required, f'{job}: {actual}, expected {required}'
          PY
