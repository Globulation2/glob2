name: Focused Windows LAN diagnostics
'on':
  workflow_dispatch:
    inputs:
      revision:
        required: true
        type: string
        description: Product source revision
concurrency:
  group: windows-lan-diagnostics
  cancel-in-progress: true
env:
  GLOB2_DEV_MODE: isolated
jobs:
  windows:
    name: windows (mingw-w64)
    runs-on: windows-latest
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      id: msys2_setup_msys2_v2_1
      with:
        msystem: MINGW64
        update: true
        install: git make mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
          mingw-w64-x86_64-scons mingw-w64-x86_64-cmake mingw-w64-x86_64-freetype
          mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libogg mingw-w64-x86_64-speex
          mingw-w64-x86_64-zlib mingw-w64-x86_64-fribidi mingw-w64-x86_64-pcre mingw-w64-x86_64-openssl
          mingw-w64-x86_64-boost mingw-w64-x86_64-libepoxy mingw-w64-x86_64-libsystre
          mingw-w64-x86_64-nasm mingw-w64-x86_64-ccache
    - uses: actions/checkout@v4
      id: actions_checkout_v4_1
      with:
        ref: ${{ inputs.revision || github.sha }}
    - name: Align Git newline handling for Windows builds
      run: git config --local core.autocrlf true
    - name: Restore the compiler cache
      id: restore_the_compiler_cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-windows-
    - name: Reset the cache statistics
      id: cache_ready
      run: 'ccache -z

        echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

        '
    - name: Record Windows checkout before compilation
      run: "mkdir -p artifacts/windows-source\n{\n  command -v git\n  git --version\n\
        \  git config --show-origin --get-regexp '^core\\.(symlinks|filemode|autocrlf)$'\
        \ || true\n  git status --porcelain=v1 --untracked-files=all\n} > artifacts/windows-source/before-build.log\
        \ 2>&1\ncat artifacts/windows-source/before-build.log\n"
    - name: Retain Windows checkout diagnostics before compilation
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: windows-source-before-build
        path: artifacts/windows-source/before-build.log
    - uses: ./.github/actions/sdl3
      with:
        shell: msys2 {0}
        cc: gcc
        cxx: g++
    - name: Build glob2 and the regression harnesses
      id: build_glob2_and_the_regression_harnesses
      run: "python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work\
        \ build/sdl3-ci/sources --jobs 2\ncygpath -w \"$PWD/build/sdl3-ci/prefix/bin\"\
        \ >> \"$GITHUB_PATH\"\nexport PATH=\"$PWD/build/sdl3-ci/prefix/bin:$PATH\"\
        \nGLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1\
        \ server=0 build/mingw/client/release/src/glob2.exe \\\n  unit-tests \\\n\
        \  engine-tests \\\n  software-render-benchmark \\\n  map-report-test\n# MSYS2\
        \ starts each step with its own PATH; colocate the pinned\n# SDL DLLs so Windows\
        \ can load the client and every harness directly.\nfor directory in build/mingw/client/release/src\
        \ build/mingw/client/release/test; do\n  cp build/sdl3-ci/prefix/bin/*.dll\
        \ \"$directory/\"\ndone\n"
    - name: Test shutdown before worker exit
      run: 'mkdir -p artifacts/windows-lan

        python3 test/run_tests.py --binary engine --build-dir build/mingw/client/release
        --filter ''LanMatchHarness/LAN WSS drop*'' --artifacts artifacts/windows-lan/after
        --junit artifacts/windows-lan/after.xml > artifacts/windows-lan/after.log
        2>&1

        cat artifacts/windows-lan/after.log'
    - name: Retain old-order control failure
      if: always()
      run: 'mkdir -p artifacts/windows-lan

        set +e

        GLOB2_LAN_STOP_BEFORE_CLOSE=1 python3 test/run_tests.py --binary engine --build-dir
        build/mingw/client/release --filter ''LanMatchHarness/LAN WSS drop*'' --artifacts
        artifacts/windows-lan/before --junit artifacts/windows-lan/before.xml > artifacts/windows-lan/before.log
        2>&1

        cat artifacts/windows-lan/before.log

        python3 -c "import xml.etree.ElementTree as E; cs=list(E.parse(''artifacts/windows-lan/before.xml'').iter(''testcase''));
        assert len(cs)==1 and cs[0].find(''failure'') is not None"'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-lan-diagnostics
        path: artifacts/
        if-no-files-found: error
    timeout-minutes: 30
