name: Explicit designs and Portage resource epoch evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resource-epoch-macos:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GLOB2_DEV_MODE: isolated
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve evidence-only observer
        run: |
          cp .github/scripts/resource_epoch_observe.py "$RUNNER_TEMP/resource_epoch_observe.py"
          cp .github/scripts/resource_epoch_requests.json "$RUNNER_TEMP/resource_epoch_requests.json"
          cp .github/scripts/resource_epoch_dependencies.py "$RUNNER_TEMP/resource_epoch_dependencies.py"
      - uses: actions/checkout@v4
        with:
          ref: c3fc51e3cc090bdbf49376a6756270b9ff4e91f8
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7e54a3fc581d22d32e7b97a6aee76dbfeae58e9f
          path: artifacts/portage-old
          persist-credentials: false
      - name: Install shared development dependencies
        run: brew install cmake freetype libpng jpeg-turbo scons pkgconf opusfile opus libogg speex openssl@3 boost fribidi libepoxy
      - uses: ./.github/actions/sdl3
        with:
          cc: clang
          cxx: clang++
      - name: Record source and toolchain inputs
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          mkdir -p artifacts/portage-evidence
          git rev-parse HEAD > artifacts/portage-evidence/current-revision.txt
          git status --porcelain > artifacts/portage-evidence/current-status.txt
          git -C artifacts/portage-old rev-parse HEAD > artifacts/portage-evidence/historical-revision.txt
          git -C artifacts/portage-old status --porcelain > artifacts/portage-evidence/historical-status.txt
          g++ --version > artifacts/portage-evidence/build-compiler.txt
          clang++ --version > artifacts/portage-evidence/dependency-compiler.txt
          brew list --versions > artifacts/portage-evidence/brew-versions.txt
          brew --version > artifacts/portage-evidence/brew-version.txt
          brew info --json=v2 --installed > artifacts/portage-evidence/brew-installed.json
          sw_vers > artifacts/portage-evidence/os.txt
          uname -a >> artifacts/portage-evidence/os.txt
          xcrun --show-sdk-version > artifacts/portage-evidence/sdk.txt
          cp build/sdl3-ci/prefix/.ci-cache.json artifacts/portage-evidence/dependency-prefix.json
          cp "$RUNNER_TEMP/resource_epoch_observe.py" artifacts/portage-evidence/observer.py
          cp test/fixtures/map-generators/pre-resource-epoch-golden.txt artifacts/portage-evidence/historical-goldens.txt
          cp "$RUNNER_TEMP/resource_epoch_requests.json" artifacts/portage-evidence/requests.json
          cp "$RUNNER_TEMP/resource_epoch_dependencies.py" artifacts/portage-evidence/dependencies.py
          python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/portage-evidence/dependencies-initial.json --verify-seal
      - name: Build current study tool
        id: current_build
        run: |
          openssl="$(brew --prefix openssl@3)"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX="$PWD/build/sdl3-ci/prefix" GLOB2_RECORDING_PREFIX="$PWD/build/sdl3-ci/prefix/recording" \
            scons release=1 server=0 -j2 map-generator-study map-generator-golden-test \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > artifacts/portage-evidence/current-build.log 2>&1
      - name: Snapshot dependency changes made by the current build
        if: ${{ !cancelled() && steps.current_build.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/portage-evidence/dependencies-after-current-build.json --previous artifacts/portage-evidence/dependencies-initial.json
      - name: Build historical study tool using the same dependency prefix
        id: historical_build
        if: ${{ !cancelled() && steps.current_build.outcome == 'success' }}
        run: |
          openssl="$(brew --prefix openssl@3)"
          root="$PWD"
          export PATH="$root/build/sdl3-ci/prefix/bin:$PATH"
          cd artifacts/portage-old
          GLOB2_SDL3_PREFIX="$root/build/sdl3-ci/prefix" GLOB2_RECORDING_PREFIX="$root/build/sdl3-ci/prefix/recording" \
            scons release=1 server=0 -j2 map-generator-study \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > "$root/artifacts/portage-evidence/historical-build.log" 2>&1
      - name: Require the historical build to preserve the final shared dependencies
        id: shared_dependencies
        if: ${{ !cancelled() && steps.historical_build.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/portage-evidence/dependencies-before-observations.json --previous artifacts/portage-evidence/dependencies-after-current-build.json --require-match
      - name: Observe seven current diagnostic requests
        if: ${{ !cancelled() && steps.shared_dependencies.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 "$RUNNER_TEMP/resource_epoch_observe.py" \
            build/darwin/client/release/src/MapGeneratorStudy "$PWD" artifacts/portage-evidence/current \
            artifacts/portage-evidence/requests.json current macos-arm64 > artifacts/portage-evidence/current-collection.log 2>&1
      - name: Audit dependencies after current maps
        if: ${{ !cancelled() && steps.shared_dependencies.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/portage-evidence/dependencies-after-current-maps.json --previous artifacts/portage-evidence/dependencies-before-observations.json --require-match
      - name: Collect independently built current catalog
        if: ${{ !cancelled() && steps.shared_dependencies.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 test/collect_generator_evidence.py collect build/darwin/client/release/src/MapGeneratorGoldenTest artifacts/portage-evidence/generator-evidence --platform macos-arm64
      - name: Audit dependencies after current catalog
        if: ${{ !cancelled() && steps.shared_dependencies.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/portage-evidence/dependencies-after-current-catalog.json --previous artifacts/portage-evidence/dependencies-before-observations.json --require-match
      - name: Observe seven historical requests and require archived full fingerprints
        if: ${{ !cancelled() && steps.shared_dependencies.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 "$RUNNER_TEMP/resource_epoch_observe.py" \
            artifacts/portage-old/build/darwin/client/release/src/MapGeneratorStudy "$PWD/artifacts/portage-old" artifacts/portage-evidence/historical \
            artifacts/portage-evidence/requests.json historical macos-arm64 > artifacts/portage-evidence/historical-collection.log 2>&1
      - name: Audit inputs after observation
        if: always()
        run: |
          git status --porcelain > artifacts/portage-evidence/current-status-after.txt
          git -C artifacts/portage-old status --porcelain > artifacts/portage-evidence/historical-status-after.txt
          cmp artifacts/portage-evidence/current-status.txt artifacts/portage-evidence/current-status-after.txt
          cmp artifacts/portage-evidence/historical-status.txt artifacts/portage-evidence/historical-status-after.txt
      - name: Retain final dependency audit independently of source audit
        if: always()
        run: python3 "$RUNNER_TEMP/resource_epoch_dependencies.py" build/sdl3-ci/prefix artifacts/portage-evidence/dependencies-after-all-observations.json --previous artifacts/portage-evidence/dependencies-before-observations.json --require-match
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-epoch-macos-epoch-evidence
          path: artifacts/portage-evidence/
          if-no-files-found: error
          retention-days: 14
