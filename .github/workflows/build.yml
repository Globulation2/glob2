name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth \
            libcppunit-dev

      - uses: actions/checkout@v4

      - name: Validate translations
        run: |
          python3 data/check_translations.py --strict
          python3 test/test_translations.py
          python3 test/test_font_coverage.py
          python3 test/test_text_area_layout.py

      - name: Test compiler cache integration
        run: python3 test/test-ccache.py

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.runner }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: ccache -z

      - name: Build glob2
        run: scons CXX=${{ matrix.compiler }} -j$(nproc) release=1

      - name: Test torus geometry, picking and cloud coordinates
        run: |
          ${{ matrix.compiler }} -std=c++14 -O2 test/TorusGeometryTest.cpp -o /tmp/torus-geometry
          /tmp/torus-geometry
          ${{ matrix.compiler }} -std=c++14 -O2 test/TorusPickingTest.cpp -o /tmp/torus-picking
          /tmp/torus-picking
          ${{ matrix.compiler }} -std=c++14 -O2 test/CloudFieldTest.cpp src/SimplexNoise.cpp -o /tmp/cloud-field
          /tmp/cloud-field
          ${{ matrix.compiler }} -std=c++14 -O2 test/MapRenderGeometryTest.cpp -o /tmp/map-render-geometry
          /tmp/map-render-geometry

      - name: Exercise GPU and software game rendering
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 torus-render-test
          mkdir -p /tmp/glob2-render-profile
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a build/src/torus-render-test -g -F -m -s 1120x720
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            build/src/torus-render-test -G -F -m -s 1120x720

      - name: Build and run custom-game setup regressions
        run: |
          scons -j$(nproc) release=1 server=0 custom-setup-test
          timeout 180s ./build/src/CustomGameSetupHarness
          mkdir -p artifacts/custom-game-ci
          timeout 180s xvfb-run -a -s '-screen 0 1024x768x24' ./build/src/CustomGameSetupHarness artifacts/custom-game-ci > artifacts/custom-game-ci/ui.log 2>&1
          timeout 60s xvfb-run -a ./build/src/CustomGameSetupHarness preferences-write
          timeout 60s xvfb-run -a ./build/src/CustomGameSetupHarness preferences-read
          cat artifacts/custom-game-ci/ui.log
          ! grep -q 'no such key' artifacts/custom-game-ci/ui.log

      - name: Build and run the selection lifetime regression
        run: |
          scons -j$(nproc) release=1 server=0 selection-test
          ./build/src/GameGUISelectionHarness

      - name: Build and run the wrapped building footprint regression
        run: |
          scons -j$(nproc) release=1 server=0 building-footprint-test
          ./build/src/BuildingFootprintHarness
          ./build/src/BuildingFootprintHarness --load test/fixtures/wrapped-building/reproducer.game

      - name: Build and run the entering unit save regression
        run: |
          scons -j$(nproc) release=1 server=0 entering-unit-save-test
          ./build/src/EnteringUnitSaveHarness
          ./build/src/EnteringUnitSaveHarness --load test/fixtures/entering-explorer/reproducer.game

      - name: Test trapped colony elimination
        run: |
          scons -j$(nproc) release=1 server=0 trapped-unit-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/TrappedUnitLifecycleTest

      - name: Build and run the entering unit draw regression
        run: |
          scons -j$(nproc) release=1 server=0 entering-unit-draw-test
          timeout 300s xvfb-run -a -s '-screen 0 1024x768x24' ./build/src/EnteringUnitDrawHarness

      - name: Build and run the immobile unit gradient regression
        run: |
          scons -j$(nproc) release=1 server=0 immobile-unit-gradient-test
          ./build/src/ImmobileUnitGradientHarness

      - name: Build and run the building expulsion regression
        run: |
          scons -j$(nproc) release=1 server=0 building-expel-test
          timeout 300s ./build/src/BuildingExpelHarness

      - name: Build and run the hiring bucket regression
        run: |
          scons -j$(nproc) release=1 server=0 hiring-bucket-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/HiringBucketHarness .

      - name: Build and run the resource-fetch target regression
        run: |
          scons -j$(nproc) release=1 server=0 resource-fetch-target-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/ResourceFetchTargetHarness .

      - name: Build and run the round-trip hunger gate regression
        run: |
          scons -j$(nproc) release=1 server=0 round-trip-hunger-gate-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/RoundTripHungerGateHarness .

      - name: Test savegame loading and atomic autosaves
        run: |
          scons -j$(nproc) release=1 server=0 savegame-safety-test buffered-file-test
          python3 test/run-savegame-safety-tests.py build/src/SavegameSafetyHarness
          ./build/src/BufferedFileStreamHarness

      - name: Test team statistics save compatibility
        run: |
          scons -j$(nproc) release=1 server=0 team-stats-save-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/TeamStatsSaveHarness .
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version88.expected.txt build/src/TeamStatsSaveHarness . --legacy test/fixtures/team-stats/version88.game
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version84.expected.txt build/src/TeamStatsSaveHarness . --legacy games/gd-small-2ai.game

      - name: Build the YOG server
        run: scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=1 --build=build-server

      - name: Build and run the terrain resource regression
        run: |
          scons -j$(nproc) release=1 server=0 terrain-test
          ./build/src/TerrainResourcesHarness

      - name: Build and run the global gradient regression
        run: |
          scons -j$(nproc) release=1 server=0 global-gradient-test
          ./build/src/GlobalGradientHarness

      - name: Build and run the LAN session regression
        run: |
          scons -j$(nproc) release=1 server=0 lan-test
          python3 test/run_lan_session_test.py build/src/LANSessionHarness

      - name: Build and run the aspect-ratio regression
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          scons -j$(nproc) release=1 server=0 aspect-test
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/libgag/src/FullscreenAspectHarness gl
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/libgag/src/FullscreenAspectHarness software

      - name: Build and run the window resize regression
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          scons -j$(nproc) release=1 server=0 resize-test
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/libgag/src/WindowResizeHarness gl
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/libgag/src/WindowResizeHarness software

      - name: Check game rendering across repeated map copies
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          scons -j$(nproc) release=1 server=0 map-render-resize-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/MapRenderResizeHarness
          SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1920x1200x24' python3 test/run-savegame-safety-tests.py --check-preferences build/src/MapRenderResizeHarness --gl

      - name: Build and run the tests
        working-directory: test
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc)
          ./TestsRunner
          for harness in ./*Harness ./*Test; do
            echo "== $harness"
            "$harness"
          done

      - name: Test front-end colony isolation and menu navigation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          scons -j$(nproc) release=1 server=0 menu-colony-harness
          ./build/src/MenuColonyHarness check data/menu/colony.bin
          ./build/src/MenuColonyHarness navigation unused

      - name: Test game speed controls and playback
        run: |
          scons -j$(nproc) release=1 server=0 speed-tests
          xvfb-run -a python3 test/run-game-speed-tests.py

      - name: Build without OpenGL
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 opengl=0 --build=build-software
          python3 test/SoftwareStartupTest.py build-software/src/glob2
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 opengl=0 --build=build-software torus-render-test
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            build-software/src/torus-render-test -g -F -m -s 1120x720

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}

  windows:
    name: windows (mingw-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_net
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre

      - uses: actions/checkout@v4

      - name: Build glob2
        run: scons -j$(nproc) release=1 mingw=1

      - name: Test trapped colony elimination
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 trapped-unit-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/TrappedUnitLifecycleTest.exe

      - name: Test torus geometry, picking and cloud coordinates
        run: |
          g++ -std=c++14 -O2 test/TorusGeometryTest.cpp -o /tmp/torus-geometry
          /tmp/torus-geometry
          g++ -std=c++14 -O2 test/TorusPickingTest.cpp -o /tmp/torus-picking
          /tmp/torus-picking
          g++ -std=c++14 -O2 test/CloudFieldTest.cpp src/SimplexNoise.cpp -o /tmp/cloud-field
          /tmp/cloud-field
          g++ -std=c++14 -O2 test/MapRenderGeometryTest.cpp -o /tmp/map-render-geometry
          /tmp/map-render-geometry

      - name: Build and run the hiring bucket regression
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 hiring-bucket-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/HiringBucketHarness.exe .

      - name: Check game rendering across repeated map copies
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 map-render-resize-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/MapRenderResizeHarness.exe

      - name: Test savegame loading and atomic autosaves
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 savegame-safety-test
          python3 test/run-savegame-safety-tests.py build/src/SavegameSafetyHarness.exe

      - name: Test team statistics save compatibility
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 team-stats-save-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/src/TeamStatsSaveHarness.exe .
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version88.expected.txt build/src/TeamStatsSaveHarness.exe . --legacy test/fixtures/team-stats/version88.game
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version84.expected.txt build/src/TeamStatsSaveHarness.exe . --legacy games/gd-small-2ai.game

      - name: Build the YOG server
        run: scons -j$(nproc) release=1 mingw=1 server=1 --build=build-server
