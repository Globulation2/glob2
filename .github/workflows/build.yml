name: build

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      revision:
        description: Exact release candidate revision
        required: true
        type: string
  pull_request:
    # ready_for_review runs the checks a draft deferred (see ci_changed_paths.py).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      browser_only:
        description: Run only browser, transport and deployment checks
        required: false
        type: boolean
        default: false

# Superseded runs: see "CI run cancellation" in docs/development/reference.md.
# A newer revision of the same pull request (or non-default branch) cancels
# this run. Default-branch runs finish once started; the newest pending
# revision replaces older pending work, so not every master commit is verified.
concurrency:
  group: build-${{ inputs.revision != '' && format('release-{0}', github.run_id) || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

env:
  GLOB2_DEV_MODE: isolated

jobs:
  changes:
    name: Select relevant checks
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.select.outputs.native }}
      browser: ${{ steps.select.outputs.browser }}
      map_generators: ${{ steps.select.outputs.map_generators }}
      deployment: ${{ steps.select.outputs.deployment }}
      cross_platform: ${{ steps.select.outputs.cross_platform }}
      platform: ${{ steps.select.outputs.platform }}
      compatibility: ${{ steps.select.outputs.compatibility }}
      browsers_all: ${{ steps.select.outputs.browsers_all }}
      android: ${{ steps.select.outputs.android }}
      browser_matrix: ${{ steps.select.outputs.browser_matrix }}
      android_arches: ${{ steps.select.outputs.android_arches }}
      windows: ${{ steps.select.outputs.windows }}
      variants: ${{ steps.select.outputs.variants }}
      coverage: ${{ steps.select.outputs.coverage }}
      tsan: ${{ steps.select.outputs.tsan }}
      macos: ${{ steps.select.outputs.macos }}
      secondary_profile: ${{ steps.select.outputs.secondary_profile }}
      full_matrix: ${{ steps.select.outputs.full_matrix }}
      draft: ${{ steps.select.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Test shared build-system contracts once
        run: '"$(python3 tools/package_assets.py --encoder-python)" -m unittest discover -s tests/build_system -v'
      - name: Test CI runners and failure reporting
        run: |
          python3 test/ci_run_commands.py \
            --check 'native runner contracts' 'python3 -m unittest discover -s test -p test_run_tests.py -v' \
            --check 'failure aggregation contracts' 'python3 -m unittest discover -s test -p test_ci_failure_aggregation.py -v'
      - name: Verify pinned scripting vendors once
        run: python3 tools/javascript/verify-vendor.py
      - name: Select checks for changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BROWSER_ONLY: ${{ inputs.browser_only }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CI_CALLED_FULL: ${{ inputs.revision != '' }}
          CI_TIERED_COVERAGE_ENABLED: ${{ vars.CI_TIERED_COVERAGE_ENABLED }}
          CI_TIER_BASELINE_RUN_ID: ${{ vars.CI_TIER_BASELINE_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 .github/scripts/ci_changed_paths.py --base "$BASE_SHA"
          else
            python3 .github/scripts/ci_changed_paths.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-observation-selection
          path: artifacts/ci-selection.json

  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    uses: ./.github/workflows/mobile.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      architectures: ${{ needs.changes.outputs.android_arches }}

  macos:
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    uses: ./.github/workflows/ci-macos.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      coverage_profile: ${{ needs.changes.outputs.secondary_profile }}

  tsan:
    needs: changes
    if: ${{ needs.changes.outputs.tsan == 'true' }}
    uses: ./.github/workflows/thread-sanitizer.yml
    with:
      revision: ${{ inputs.revision || github.sha }}

  native-coverage:
    name: Native Clang coverage
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install matching compiler and coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 llvm-18 python3 scons pkg-config git cmake \
            libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libvorbis-dev libogg-dev libspeex-dev libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev libgl1-mesa-dev \
            libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth openbox x11-utils
      - uses: ./.github/actions/sdl3
        with:
          cc: clang-18
          cxx: clang++-18
      - name: Build pinned SDL3 dependencies
        run: python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
      - name: Verify coverage accounting
        run: python3 -m unittest discover -s test -p test_run_coverage.py -v
      - name: Run native coverage without the slow integration tier
        run: |
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix python3 test/run_coverage.py --quick --timeout 900 -j4 \
            --cc clang-18 --cxx clang++-18 \
            --llvm-profdata llvm-profdata-18 --llvm-cov llvm-cov-18
      - name: Retain coverage and failing test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-clang-coverage
          path: artifacts/native-coverage
          if-no-files-found: warn
          retention-days: 14

  linux-gcc11:
    name: Linux GCC 11 build and tests
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' && needs.changes.outputs.compatibility == 'true' }}
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      image: ubuntu:22.04
      runner: ubuntu-22.04
      compiler: g++-11
      c_compiler: gcc-11
      run_tests: true
      coverage_profile: ${{ needs.changes.outputs.secondary_profile }}
      map_generators: ${{ needs.changes.outputs.map_generators == 'true' }}
      runtime_packages: ${{ vars.CI_RUNTIME_PACKAGES_ENABLED == 'true' }}

  linux-gcc13-producer:
    name: Primary Linux programs
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      image: ubuntu:24.04
      runner: ubuntu-24.04
      compiler: g++-13
      c_compiler: gcc-13
      build_only: true
      web_native: ${{ needs.changes.outputs.browser == 'true' }}

  linux-gcc13:
    name: Linux GCC 13 build and tests
    needs: [changes, linux-gcc13-producer]
    if: ${{ needs.changes.outputs.native == 'true' }}
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      image: ubuntu:24.04
      runner: ubuntu-24.04
      compiler: g++-13
      c_compiler: gcc-13
      reuse_build: true
      run_tests: true
      map_generators: ${{ needs.changes.outputs.map_generators == 'true' }}
      runtime_packages: ${{ vars.CI_RUNTIME_PACKAGES_ENABLED == 'true' }}

  linux-build:
    needs: [changes, linux-gcc11, linux-gcc13]
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both GCC platforms
        env:
          COMPATIBILITY: ${{ needs.changes.outputs.compatibility }}
          GCC11: ${{ needs.linux-gcc11.result }}
          GCC13: ${{ needs.linux-gcc13.result }}
        run: |
          expected=skipped
          if [ "$COMPATIBILITY" = true ]; then expected=success; fi
          test "$GCC11" = "$expected" && test "$GCC13" = success

  linux-clang:
    name: Linux Clang compatibility
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' && needs.changes.outputs.variants == 'true' }}
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      image: ubuntu:24.04
      runner: ubuntu-24.04
      compiler: clang-18
      c_compiler: clang-18

  linux:
    name: linux (${{ matrix.image }})
    needs: [changes, linux-build, linux-clang]
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - name: Require every Linux build and test shard
        env:
          BUILD_RESULT: ${{ needs.linux-build.result }}
          COMPATIBILITY: ${{ needs.changes.outputs.variants }}
          CLANG_RESULT: ${{ needs.linux-clang.result }}
        run: |
          echo "Linux builds: $BUILD_RESULT; Clang: $CLANG_RESULT"
          expected=skipped
          if [ "$COMPATIBILITY" = true ]; then expected=success; fi
          test "$BUILD_RESULT" = success && test "$CLANG_RESULT" = "$expected"

  linux-variants:
    name: linux variants (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' && needs.changes.outputs.variants == 'true' }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 python3-venv scons pkg-config ccache \
            cmake libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth openbox x11-utils

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-variants-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-variants-${{ matrix.runner }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/sdl3
        with:
          cc: ${{ matrix.compiler == 'g++-11' && 'gcc-11' || 'gcc-13' }}
          cxx: ${{ matrix.compiler }}
      - name: Build the YOG server
        id: build_the_yog_server
        continue-on-error: true
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=1 --build=build-server

      - name: Build without OpenGL
        id: build_without_opengl
        continue-on-error: true
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 opengl=0 --build=build-software build-software/src/glob2 engine-tests
          python3 test/SoftwareStartupTest.py build-software/src/glob2
          python3 test/run_tests.py --binary engine --build-dir build-software --no-display --filter 'TorusRender/*software*' --junit artifacts/tests/software-junit.xml

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        id: report_the_cache_statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-variants-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  linux-map-generators-standalone:
    name: Golden-only build and checks (${{ matrix.runner }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.map_generators == 'true' && needs.changes.outputs.native != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            compiler: g++-11
            c_compiler: gcc-11
            image: ubuntu:22.04
          - runner: ubuntu-24.04
            compiler: g++-13
            c_compiler: gcc-13
            image: ubuntu:24.04
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}
      compiler: ${{ matrix.compiler }}
      c_compiler: ${{ matrix.c_compiler }}
      generator_only: true
      map_generators: true
      coverage_profile: ${{ matrix.runner == 'ubuntu-24.04' && 'full' || needs.changes.outputs.secondary_profile }}

  linux-map-generators:
    needs: [changes, linux-gcc11, linux-gcc13, linux-map-generators-standalone]
    if: ${{ !cancelled() && needs.changes.outputs.map_generators == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected generator checks
        env:
          NATIVE: ${{ needs.changes.outputs.native }}
          COMPATIBILITY: ${{ needs.changes.outputs.compatibility }}
          GCC11: ${{ needs.linux-gcc11.result }}
          GCC13: ${{ needs.linux-gcc13.result }}
          STANDALONE: ${{ needs.linux-map-generators-standalone.result }}
        run: |
          if [ "$NATIVE" = true ]; then
            expected=skipped
            if [ "$COMPATIBILITY" = true ]; then expected=success; fi
            test "$GCC11" = "$expected" && test "$GCC13" = success
          else
            test "$STANDALONE" = success
          fi

  windows:
    name: windows (mingw-w64)
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: windows-latest
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        id: msys2_setup_msys2_v2_1
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-ccache

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      # Checkout uses Git for Windows; MSYS Git otherwise defaults to different
      # newline handling and reports unchanged CRLF source files as modifications.
      - name: Align Git newline handling for Windows builds
        run: git config --local core.autocrlf true

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record Windows checkout before compilation
        run: |
          mkdir -p artifacts/windows-source
          {
            command -v git
            git --version
            git config --show-origin --get-regexp '^core\.(symlinks|filemode|autocrlf)$' || true
            git status --porcelain=v1 --untracked-files=all
          } > artifacts/windows-source/before-build.log 2>&1
          cat artifacts/windows-source/before-build.log

      - name: Retain Windows checkout diagnostics before compilation
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-source-before-build
          path: artifacts/windows-source/before-build.log

      - uses: ./.github/actions/sdl3
        with:
          shell: msys2 {0}
          cc: gcc
          cxx: g++
      - name: Build glob2 and the regression harnesses
        id: build_glob2_and_the_regression_harnesses
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          cygpath -w "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1 server=0 build/mingw/client/release/src/glob2.exe \
            unit-tests \
            engine-tests \
            software-render-benchmark \
            map-report-test
          # MSYS2 starts each step with its own PATH; colocate the pinned
          # SDL DLLs so Windows can load the client and every harness directly.
          for directory in build/mingw/client/release/src build/mingw/client/release/test; do
            cp build/sdl3-ci/prefix/bin/*.dll "$directory/"
          done

      - name: Exercise production CLI and retain continuation traces
        if: ${{ !cancelled() && steps.build_glob2_and_the_regression_harnesses.outcome == 'success' }}
        run: python3 test/test_cli_smoke.py --binary build/mingw/client/release/src/glob2.exe --artifacts artifacts/cli-smoke --junit artifacts/cli-smoke.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-windows
          path: |
            artifacts/cli-smoke/
            artifacts/cli-smoke.xml
          if-no-files-found: ignore

      - name: Record Windows checkout after compilation
        if: ${{ !cancelled() && steps.actions_checkout_v4_1.outcome == 'success' }}
        run: |
          mkdir -p artifacts/windows-source
          {
            command -v git
            git --version
            git config --show-origin --get-regexp '^core\.(symlinks|filemode|autocrlf)$' || true
            git status --porcelain=v1 --untracked-files=all
            git diff --summary
          } > artifacts/windows-source/after-build.log 2>&1
          cat artifacts/windows-source/after-build.log

      - name: Execute shared JavaScript corpus
        id: execute_shared_javascript_corpus
        run: python3 test/check_javascript_corpus.py --build-dir build/mingw/client/release --output artifacts/javascript-corpus

      - name: Verify frozen JavaScript simulation profile
        id: verify_frozen_javascript_simulation_profile
        run: python3 test/check_javascript.py build/mingw/client/release/src/glob2.exe --output artifacts/javascript-profile

      - name: Upload JavaScript simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-profile-mingw
          path: |
            artifacts/javascript-profile
            artifacts/javascript-corpus
            artifacts/windows-source

      - name: Run the unit tests
        id: run_the_unit_tests
        continue-on-error: true
        run: python3 test/run_tests.py --binary unit --build-dir build/mingw/client/release --junit artifacts/tests/unit-junit.xml
      - name: Run the engine tests
        id: run_the_engine_tests
        continue-on-error: true
        # The [map-generators] contract stays on Linux, as before this runner existed.
        run: python3 test/run_tests.py --binary engine --coverage-profile ${{ needs.changes.outputs.secondary_profile }} --write-inventory artifacts/tests/engine.inventory.json --build-dir build/mingw/client/release --exclude-tag map-generators --junit artifacts/tests/engine-junit.xml
      - name: Upload native test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-windows
          path: artifacts/tests/
          if-no-files-found: ignore

      - name: Test map JSON reports
        if: ${{ needs.changes.outputs.secondary_profile == 'full' }}
        id: test_map_json_reports
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map report' 'python3 test/test_map_report.py build/mingw/client/release/src/glob2.exe build/mingw/client/release/test/MapReportHarness.exe' \
            --check 'map telemetry' 'python3 test/test_map_telemetry.py'
      - name: Upload map JSON reports and command log
        id: upload_map_json_reports_and_command_log
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-report-windows
          path: artifacts/map-report/

      - name: Test headless map CLI
        if: ${{ needs.changes.outputs.secondary_profile == 'full' }}
        id: test_headless_map_cli
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map CLI' 'python3 test/test_map_cli.py build/mingw/client/release/src/glob2.exe' \
            --check 'map image conversion' 'python3 test/test_map_image.py build/mingw/client/release/src/glob2.exe'
      - name: Upload map CLI previews and command log
        id: upload_map_cli_previews_and_command_log
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-windows
          path: |
            artifacts/map-cli/
            artifacts/map-image/

      - name: Verify save continuation traces
        id: verify_save_continuation_traces
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'shared runtime save continuation' 'python3 test/check_shared_runtime_save_continuation.py build/mingw/client/release/src/glob2.exe' \
            --check 'Maxima save continuation fixture' 'python3 test/maxima/check_save_continuation_fixture.py build/mingw/client/release/src/glob2.exe'

      - name: Verify default gradient schedule against cross-platform checksums
        id: verify_default_gradient_schedule_against_cross_platform
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'default AI gradient schedule' 'python3 test/check_telemetry_simulation.py build/mingw/client/release/src/glob2.exe --output artifacts/released-compatibility/serial' \
            --check 'parallel AI gradient schedule' 'python3 test/check_telemetry_simulation.py build/mingw/client/release/src/glob2.exe --parallel-ai --output artifacts/released-compatibility/parallel'

      - name: Upload released compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: released-compatibility-windows
          path: artifacts/released-compatibility/

      - name: Report the cache statistics
        id: report_the_cache_statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      - name: Retain browser/native simulation trace
        id: retain_browser_native_simulation_trace
        continue-on-error: true
        run: python3 test/run-browser-determinism.py build/mingw/client/release/src/glob2.exe artifacts/browser-determinism/native
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: browser-determinism-windows
          path: artifacts/browser-determinism/native/

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      # Master pushes and authenticated manual runs may retain successful builds.
      # Ordinary PRs only restore caches; later test failures do not discard objects.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && steps.build_glob2_and_the_regression_harnesses.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && steps.build_glob2_and_the_regression_harnesses.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  windows-server:
    name: windows server (mingw-w64)
    needs: changes
    if: ${{ needs.changes.outputs.variants == 'true' }}
    runs-on: windows-latest
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        id: msys2_setup_msys2_v2_1
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-ccache

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      # Checkout uses Git for Windows; MSYS Git otherwise defaults to different
      # newline handling and reports unchanged CRLF source files as modifications.
      - name: Align Git newline handling for Windows builds
        run: git config --local core.autocrlf true

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-winserver-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-winserver-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      # The server shares no objects with the client, so it builds on its own
      # runner instead of after the client's compile and tests.
      - uses: ./.github/actions/sdl3
        with:
          shell: msys2 {0}
          cc: gcc
          cxx: g++
      - name: Build the YOG server
        id: build_the_yog_server
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          cygpath -w "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1 server=1 --build=build-server

      - name: Report the cache statistics
        id: report_the_cache_statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      # Master pushes and authenticated manual runs may retain successful builds.
      # Ordinary PRs only restore caches; later test failures do not discard objects.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && steps.build_the_yog_server.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && steps.build_the_yog_server.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-winserver-${{ github.run_id }}-${{ github.run_attempt }}

  # The browser checks run as parallel jobs. The WebAssembly client and the
  # native programs the browser tests drive are built once each, side by side,
  # and handed to the test jobs as artifacts; the test suites then run on
  # separate runners, with the Chromium suite split into shards by spec file.

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  web-build:
    name: browser build (WebAssembly)
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: /tmp/glob2-wasm-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
        id: actions_checkout_v4_1
      - name: Install build dependencies
        id: install_build_dependencies
        run: |
          # The hosted image adds an unpinned Chrome repository that no job here uses.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv scons ccache g++-13 cmake libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libvorbis-dev libogg-dev libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Install pinned Emscripten
        id: install_pinned_emscripten
        run: python3 browser/setup.py
      - name: Restore WebAssembly compiler cache
        id: restore_webassembly_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-
      - name: Restore WebAssembly object tree
        id: restore_webassembly_object_tree
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/emscripten/client/release/.sconsign.dblite
            build/emscripten/client/release/identity.json
            build/emscripten/client/release/include/glob2/BuildConfig.h
            build/emscripten/client/release/obj
            build/emscripten/client/release/threaded/obj
            build/emscripten/client/release/threaded/include
            build/emscripten/client/release/threaded/identity.json
          key: wasm-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wasm-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-
      - name: Restore pinned WebAssembly dependencies
        id: wasm_dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            build/emscripten/client/release/sdl3/prefix
            build/emscripten/client/release/threaded/sdl3/prefix
          key: wasm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json', 'scons/web_build.py', 'scons/sdl3_dependencies.py', 'scons/sdl3-*.json', 'scons/vcpkg-ports/sdl3/*.patch') }}
      - name: Verify restored WebAssembly dependency prefixes
        env:
          DEPENDENCY_KEY: ${{ hashFiles('browser/toolchain.json', 'scons/web_build.py', 'scons/sdl3_dependencies.py', 'scons/sdl3-*.json', 'scons/vcpkg-ports/sdl3/*.patch') }}
        run: |
          for prefix in build/emscripten/client/release/sdl3/prefix build/emscripten/client/release/threaded/sdl3/prefix; do
            python3 .github/scripts/ci_dependency_cache.py verify --prefix "$prefix" --key "$DEPENDENCY_KEY"
          done
      - name: Build WebAssembly client
        id: build_web
        env:
          # Emscripten wraps its underlying clang, not the Python compiler driver.
          EM_COMPILER_WRAPPER: ccache
        run: |
          ccache -z
          echo "WASM_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
          # This source embeds __DATE__ and __TIME__. Refresh it after restoring
          # objects so the binary still reports the current compilation time.
          rm -f build/emscripten/client/release/obj/src/GlobalContainerArgs.cpp.o build/emscripten/client/release/threaded/obj/src/GlobalContainerArgs.cpp.o
          scons target=web release=1 web-tests build/emscripten/client/release/index.html -j$(nproc)
          ccache -s -v
      - name: Seal built WebAssembly dependency prefixes
        env:
          DEPENDENCY_KEY: ${{ hashFiles('browser/toolchain.json', 'scons/web_build.py', 'scons/sdl3_dependencies.py', 'scons/sdl3-*.json', 'scons/vcpkg-ports/sdl3/*.patch') }}
        run: |
          for prefix in build/emscripten/client/release/sdl3/prefix build/emscripten/client/release/threaded/sdl3/prefix; do
            python3 .github/scripts/ci_dependency_cache.py seal --prefix "$prefix" --key "$DEPENDENCY_KEY"
          done
      - name: Save pinned WebAssembly dependencies
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.wasm_dependencies.outputs.cache-hit != 'true' }}
        with:
          path: |
            build/emscripten/client/release/sdl3/prefix
            build/emscripten/client/release/threaded/sdl3/prefix
          key: wasm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json', 'scons/web_build.py', 'scons/sdl3_dependencies.py', 'scons/sdl3-*.json', 'scons/vcpkg-ports/sdl3/*.patch') }}
      - name: Save WebAssembly object tree
        id: save_webassembly_object_tree
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/emscripten/client/release/.sconsign.dblite
            build/emscripten/client/release/identity.json
            build/emscripten/client/release/include/glob2/BuildConfig.h
            build/emscripten/client/release/obj
            build/emscripten/client/release/threaded/obj
            build/emscripten/client/release/threaded/include
            build/emscripten/client/release/threaded/identity.json
          key: wasm-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prune WebAssembly compiler cache
        id: prune_webassembly_compiler_cache
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: ccache --evict-older-than "$(( $(date +%s) - WASM_CACHE_START + 60 ))s"
      - name: Save WebAssembly compiler cache
        id: save_webassembly_compiler_cache
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Serve the game and scripting harness; retain compiler identity for the
      # scripting evidence collected by the browser test jobs.
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: web-client
          retention-days: 3
          if-no-files-found: error
          path: |
            build/emscripten/client/release/identity.json
            build/emscripten/client/release/index.html
            build/emscripten/client/release/loader.js
            build/emscripten/client/release/threaded/identity.json
            build/emscripten/client/release/threaded/index.js
            build/emscripten/client/release/threaded/index.wasm
            build/emscripten/client/release/threaded/index.data
            build/emscripten/client/release/index.js
            build/emscripten/client/release/index.wasm
            build/emscripten/client/release/index.data
            build/emscripten/client/release/script-tests.js
            build/emscripten/client/release/script-tests.wasm
            build/emscripten/client/release/script-tests.data
            build/emscripten/client/release/threaded/script-tests.js
            build/emscripten/client/release/threaded/script-tests.wasm
      - uses: actions/upload-artifact@v4
        id: upload_artifact_2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        with:
          name: glob2-web-development
          retention-days: 7
          path: |
            build/emscripten/client/release/index.html
            build/emscripten/client/release/loader.js
            build/emscripten/client/release/threaded/index.js
            build/emscripten/client/release/threaded/index.wasm
            build/emscripten/client/release/threaded/index.data
            build/emscripten/client/release/index.js
            build/emscripten/client/release/index.wasm
            build/emscripten/client/release/index.data

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  web-native:
    name: browser native WSS server, router and transport
    needs: [changes, linux-gcc13-producer]
    if: ${{ !cancelled() && needs.changes.outputs.browser == 'true' && (needs.changes.outputs.native != 'true' || needs.linux-gcc13-producer.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
        id: actions_checkout_v4_1
      - uses: actions/download-artifact@v4
        if: ${{ needs.changes.outputs.native == 'true' }}
        with:
          name: linux-test-programs-ubuntu-24.04
          path: artifacts/ci-native
      - name: Reuse exact primary client and transport programs
        if: ${{ needs.changes.outputs.native == 'true' }}
        run: |
          tar -xzf artifacts/ci-native/linux-test-programs.tar.gz
          python3 .github/scripts/ci_build_provenance.py verify --compiler g++-13
      - name: Install native build dependencies
        id: install_native_build_dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv scons ccache g++-13 cmake libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libvorbis-dev libogg-dev libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      # Reuse the native client objects already populated by the main Linux job.
      # This job only reads that cache; transport-specific misses stay local.
      - name: Restore native compiler cache
        id: restore_native_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-ubuntu-24.04-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-ubuntu-24.04-
      - name: Identify native compiler
        id: native_compiler
        run: |
          digest=$(sha256sum "$(command -v g++-13)" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore native object tree
        id: restore_native_object_tree
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux/**/.sconsign.dblite
            build/linux/**/identity.json
            build/linux/**/configure
            build/linux/**/include/glob2/BuildConfig.h
            build/linux/**/*.o
            build/linux/**/*.a
          key: native-objects-v2-ubuntu-24.04-${{ steps.native_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-objects-v2-ubuntu-24.04-${{ steps.native_compiler.outputs.digest }}-
      - name: Reset native compiler cache statistics
        id: reset_native_compiler_cache_statistics
        run: |
          ccache -z
          # Keep the build banner current even when every other object is reused.
          find build/linux -name GlobalContainerArgs.o -delete 2>/dev/null || true
      - uses: ./.github/actions/sdl3
        with:
          cc: gcc-13
          cxx: g++-13
      - name: Build headless server
        id: build_headless_server
        continue-on-error: true
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons role=server release=1 -j$(nproc)
      - name: Build headless router
        id: build_headless_router
        continue-on-error: true
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons CXX=g++-13 role=router release=1 -j$(nproc)
      - name: Build transport integration fixture
        id: build_transport_integration_fixture
        continue-on-error: true
        run: |
          if [ '${{ needs.changes.outputs.native }}' = true ]; then
            test -x build/linux/client/release/src/net-connection-test
            test -x build/linux/client/release/src/native-multiplayer-peer
            test -x build/linux/client/release/src/lan-discovery-test
            exit 0
          fi
          # The browser's editor tests read the native generator catalog, then
          # navigate the visible picker with real keyboard/pointer events.
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons CXX=g++-13 release=1 transport-test build/linux/client/release/src/glob2 -j$(nproc)
      - name: Test network transport
        id: test_network_transport
        continue-on-error: true
        if: steps.build_transport_integration_fixture.outcome == 'success'
        run: |
          python3 test/ci_run_commands.py \
            --check 'network transport' 'python3 test/run-network-transport-tests.py' \
            --check 'LAN discovery' 'build/linux/client/release/src/lan-discovery-test' \
            --check 'transport unit tests' 'python3 -m unittest discover -s tests/transport -v' \
            --check 'compiler cache statistics' 'ccache -s -v'
      - name: Package the programs the browser tests drive
        id: package_the_programs_the_browser_tests_drive
        if: steps.build_headless_server.outcome == 'success' && steps.build_transport_integration_fixture.outcome == 'success'
        run: |
          mkdir -p artifacts/ci-native
          python3 .github/scripts/linux_runtime_packages.py build/linux --output artifacts/ci-native/runtime-packages.txt
          tar -czf artifacts/ci-native/web-native.tar.gz \
            build/linux/client/release/src/glob2 \
            build/linux/client/release/src/net-connection-test \
            build/linux/client/release/src/native-multiplayer-peer \
            build/linux/server/release/src/glob2-server \
            build/sdl3-ci/prefix/lib
      - name: Save native object tree
        id: save_native_object_tree
        if: ${{ !cancelled() && steps.package_the_programs_the_browser_tests_drive.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux/**/.sconsign.dblite
            build/linux/**/identity.json
            build/linux/**/configure
            build/linux/**/include/glob2/BuildConfig.h
            build/linux/**/*.o
            build/linux/**/*.a
          key: native-objects-v2-ubuntu-24.04-${{ steps.native_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: web-native
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/ci-native/web-native.tar.gz
            artifacts/ci-native/runtime-packages.txt

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  web-deploy:
    name: browser self-hosting deployment
    needs: [changes, web-build]
    if: ${{ needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
        id: actions_checkout_v4_1
      - uses: actions/download-artifact@v4
        id: download_web_client
        with:
          name: web-client
          path: build/emscripten/client/release
      - name: Test self-hosting with real TLS and persistent volumes
        id: test_self_hosting_with_real_tls_and_persistent_volumes
        continue-on-error: true
        run: |
          python3 browser/package-static.py
          python3 browser/package-static.py --verify build/browser-static
          docker compose -f deploy/compose.yaml build lobby web
          python3 -m unittest discover -s tests/deployment -v

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  web-test:
    name: browser tests (${{ matrix.name }})
    needs: [changes, web-build, web-native]
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Leave runner capacity for Linux test shards once the browser build
      # finishes; all browser cases still run before the required check passes.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    env:
      GLOB2_TEST_RENDERER: ${{ matrix.renderer || 'software' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
        id: actions_checkout_v4_1
      - uses: actions/download-artifact@v4
        id: actions_download_artifact_v4_1
        with:
          name: web-client
          path: build/emscripten/client/release
      - uses: actions/download-artifact@v4
        id: actions_download_artifact_v4_2
        with:
          name: web-native
          path: artifacts/ci-native
      - name: Unpack the native programs
        id: unpack_the_native_programs
        run: tar -xzf artifacts/ci-native/web-native.tar.gz
      - name: Install executable runtime libraries
        run: |
          sudo apt-get update -qq
          xargs sudo apt-get install -y --no-install-recommends < artifacts/ci-native/runtime-packages.txt
          sudo apt-get install -y --no-install-recommends python3 libgl1 libglu1-mesa libepoxy0 libgl1-mesa-dri xvfb xauth openbox x11-utils
          python3 .github/scripts/linux_runtime_packages.py build/linux/client/release --verify
      - uses: actions/setup-node@v4
        id: actions_setup_node_v4_1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Restore Playwright browser installations
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browsers }}-${{ hashFiles('browser/package-lock.json') }}
      - name: Install browser test dependencies
        id: install_browser_test_dependencies
        working-directory: browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Save Playwright browser installations
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (matrix.name == 'chromium 1/5' || matrix.name == 'firefox' || matrix.name == 'webkit') }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browsers }}-${{ hashFiles('browser/package-lock.json') }}
      # Firefox needs an X display and an audio service. A null sink is silent.
      - name: Start a silent audio service
        id: start_a_silent_audio_service
        if: contains(matrix.browsers, 'firefox')
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load='module-null-sink sink_name=glob2_ci'
      - name: Run ${{ matrix.name }}
        id: run_matrix_name
        continue-on-error: true
        working-directory: browser
        run: ${{ matrix.command }}
      # Baseline replay and per-browser scripting results share this artifact
      # family; the comparison job selects each corpus explicitly.
      - uses: actions/upload-artifact@v4
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: browser-determinism-wasm-${{ strategy.job-index }}
          path: artifacts/browser-determinism/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        id: upload_artifact_2
        continue-on-error: true
        if: steps.run_matrix_name.outcome == 'failure'
        with:
          name: browser-failure-traces-${{ strategy.job-index }}
          retention-days: 7
          path: |
            build/browser-test-results
            build/browser-test-report

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  browser-determinism:
    name: browser/native simulation equivalence
    env:
      COMPATIBILITY: ${{ needs.changes.outputs.compatibility }}
    needs: [changes, linux, windows, web-test, macos]
    if: ${{ !cancelled() && needs.changes.outputs.cross_platform == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
        id: actions_checkout_v4_1
      - uses: actions/download-artifact@v4
        id: actions_download_artifact_v4_1
        with:
          pattern: browser-determinism-*
          path: artifacts/ci-traces
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts/cli-platforms
      - name: Compare complete native CLI continuation checksums
        run: |
          python3 test/check_cli_evidence.py artifacts/cli-platforms --require-platform linux --require-platform windows

      - uses: actions/download-artifact@v4
        with:
          pattern: javascript-profile-*
          path: artifacts/ci-scripting
      - name: Compare selected native and browser evidence
        run: |
          python3 .github/scripts/ci_compare_evidence.py             --traces artifacts/ci-traces --scripting artifacts/ci-scripting             --compatibility '${{ needs.changes.outputs.compatibility }}'             --variants '${{ needs.changes.outputs.variants }}'             --macos '${{ needs.changes.outputs.macos }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-cross-platform-comparisons
          path: artifacts/javascript-ci/
          if-no-files-found: ignore

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  # The TypeScript platform (platform/): lint, type checks, the web build, and
  # unit and integration tests against a real Postgres.
  platform:
    name: platform (TypeScript)
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: glob2
          POSTGRES_PASSWORD: glob2
          POSTGRES_DB: glob2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U glob2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://glob2:glob2@localhost:5432/postgres
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        id: actions_setup_node_v4_1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install platform dependencies
        id: install_platform_dependencies
        run: npm ci
      - name: Lint and check formatting
        id: lint_and_check_formatting
        run: npm run lint
      - name: Type check
        id: type_check
        run: npm run typecheck
      - name: Build the web app
        id: build_the_web_app
        run: npm run build -w @glob2/web
      - name: Run tests
        id: run_tests
        run: npm test
      - name: Apply migrations with the CLI
        id: apply_migrations_with_the_cli
        env:
          DATABASE_URL: postgres://glob2:glob2@localhost:5432/glob2
        run: |
          npm run migrate -- latest
          npm run migrate -- status

  ci-result:
    name: Relevant checks passed
    needs: [changes, android, macos, tsan, native-coverage, linux, linux-variants, linux-map-generators, windows, windows-server, web-build, web-native, web-deploy, web-test, browser-determinism, platform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify all selected jobs completed successfully
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ['NEEDS_JSON'])
          assert needs['changes']['result'] == 'success', 'Change detection failed'
          selected = needs['changes']['outputs']
          expected = {
              'android': selected['android'] == 'true',
              'macos': selected['macos'] == 'true',
              'tsan': selected['tsan'] == 'true',
              'native-coverage': selected['coverage'] == 'true',
              'linux': selected['native'] == 'true',
              'linux-variants': selected['native'] == 'true' and selected['variants'] == 'true',
              'linux-map-generators': selected['map_generators'] == 'true',
              'windows': selected['windows'] == 'true',
              'windows-server': selected['variants'] == 'true',
              'web-build': selected['browser'] == 'true',
              'web-native': selected['browser'] == 'true',
              'web-deploy': selected['deployment'] == 'true',
              'web-test': selected['browser'] == 'true',
              'browser-determinism': selected['cross_platform'] == 'true',
              'platform': selected['platform'] == 'true',
          }
          for job, should_run in expected.items():
              required = 'success' if should_run else 'skipped'
              actual = needs[job]['result']
              print(f'{job}: {actual} (expected {required})')
              assert actual == required, f'{job}: {actual}, expected {required}'
          PY
