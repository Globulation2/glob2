name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_only:
        description: Run only browser, transport, gateway, and deployment checks
        required: false
        type: boolean
        default: false

# A new push to a pull request supersedes its running checks. Master runs are
# never cancelled: each one saves the compiler caches the next PRs restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux (${{ matrix.image }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.browser_only }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth \
            libcppunit-dev

      - uses: actions/checkout@v4

      - name: Validate translations
        run: |
          python3 data/check_translations.py --strict
          python3 test/test_translations.py
          python3 test/test_font_coverage.py
          python3 test/test_text_area_layout.py

      - name: Test compiler cache integration
        run: python3 test/test-ccache.py

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-${{ matrix.runner }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build glob2 and the regression harnesses
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 build/linux/client/release/src/glob2 \
            map-report-test \
            orchard-conversion-test \
            maxima-food-ledger-test \
            tournament-compatibility-test \
            torus-render-test \
            map-preview-test \
            custom-setup-test \
            map-generator-defaults-test \
            map-generator-golden-test \
            point-bar-render-test \
            selection-test \
            building-footprint-test \
            entering-unit-save-test \
            clearing-gradient-test \
            trapped-unit-test \
            failing-unit-markers-test \
            entering-unit-draw-test \
            immobile-unit-gradient-test \
            building-expel-test \
            building-gradient-invalidation-test \
            hiring-bucket-test \
            level-gate-test \
            resource-fetch-target-test \
            round-trip-hunger-gate-test \
            inn-swap-test \
            savegame-safety-test \
            maxima-continuation-test \
            maxima-relocation-test \
            buffered-file-test \
            team-stats-save-test \
            unit-continuation-test \
            performance-telemetry-test \
            terrain-test \
            global-gradient-test \
            path-gradient-test \
            nicowar-farming-test \
            lan-test \
            aspect-test \
            resize-test \
            text-raster-test \
            map-render-resize-test \
            menu-colony-harness \
            speed-tests \
            settings-tests \
            screen-test \
            session-test \
            portable-renderer-test \
            mobile-input-test \
            gameplay-touch-test \
            responsive-menu-test \
            mobile-presentation-test \
            mobile-documents-test \
            mobile-certificate-test \
            mobile-temporary-files-test

      - name: Test Maxima food ledger
        run: build/linux/client/release/src/MaximaFoodLedgerStandaloneTest

      - name: Test map JSON reports
        run: |
          python3 test/test_map_report.py build/linux/client/release/src/glob2 build/linux/client/release/src/MapReportHarness
          python3 test/test_map_telemetry.py
      - name: Upload map JSON reports and command log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-report-${{ matrix.runner }}
          path: artifacts/map-report/

      - name: Test headless map CLI with the shared preview renderer
        run: |
          python3 test/test_map_cli.py build/linux/client/release/src/glob2 --generation-only
          python3 test/test_map_cli.py build/linux/client/release/src/glob2
      - name: Upload map CLI previews and command log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-${{ matrix.runner }}
          path: artifacts/map-cli/

      - name: Test tournament protocol, AI configuration and main CLI
        run: |
          python3 test/test_tournaments.py
          python3 test/test_tournament_pipeline.py
          python3 test/test_distributed_map_telemetry.py
          python3 test/test_distributed_game_telemetry.py
          python3 test/test_map_fairness_tournament.py
          python3 test/test_map_generation_study.py
          python3 test/test_fairness_model.py
          ./build/linux/client/release/src/TournamentCompatibilityTest
          python3 test/tournament_cli_integration.py --binary build/linux/client/release/src/glob2 --output artifacts/tournament-cli

      - name: Retain tournament CLI compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-cli-${{ matrix.runner }}
          path: artifacts/tournament-cli/
          if-no-files-found: ignore

      - name: Test torus geometry, picking and cloud coordinates
        run: |
          ${{ matrix.compiler }} -std=c++14 -O2 test/TorusGeometryTest.cpp -o /tmp/torus-geometry
          /tmp/torus-geometry
          ${{ matrix.compiler }} -std=c++14 -O2 test/TorusPickingTest.cpp -o /tmp/torus-picking
          /tmp/torus-picking
          ${{ matrix.compiler }} -std=c++14 -O2 test/CloudFieldTest.cpp src/SimplexNoise.cpp -o /tmp/cloud-field
          /tmp/cloud-field
          ${{ matrix.compiler }} -std=c++14 -O2 test/MapRenderGeometryTest.cpp -o /tmp/map-render-geometry
          /tmp/map-render-geometry

      - name: Exercise GPU and software game rendering
        run: |
          mkdir -p /tmp/glob2-render-profile
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a build/linux/client/release/src/torus-render-test -g -F -m -s 1120x720
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            GLOB2_UI_SCALE=3 xvfb-run -a -s '-screen 0 1920x1440x24' \
            build/linux/client/release/src/torus-render-test -g -F -m -s 1920x1440
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            build/linux/client/release/src/torus-render-test -G -F -m -s 1120x720

      - name: Build the YOG server
        run: scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=1 --build=build-server

      - name: Build and run pre-game map preview regressions
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/MapPreviewHarness
          mkdir -p artifacts/map-preview
          timeout 180s xvfb-run -a ./build/linux/client/release/src/MapPreviewHarness glob2-map-preview-tests --visual artifacts/map-preview

      - name: Retain pre-game map preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-preview-${{ matrix.runner }}-${{ matrix.compiler }}
          path: artifacts/map-preview/
          if-no-files-found: ignore

      - name: Test Orchard Commons generation and fruit conversion
        run: |
          timeout 120s ./build/linux/client/release/src/OrchardCommonsConversionTest glob2-orchard-ci "$PWD" "$PWD/artifacts/orchard-conversion"

      - name: Retain Orchard Commons conversion fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-conversion-${{ matrix.runner }}
          path: artifacts/orchard-conversion/
          if-no-files-found: ignore

      - name: Build and run custom-game setup regressions
        run: |
          # The growing generator catalog exercises hundreds of complete worlds.
          timeout 300s ./build/linux/client/release/src/MapGeneratorDefaultsTest glob2-map-defaults-ci
          timeout 180s ./build/linux/client/release/src/CustomGameSetupHarness
          mkdir -p artifacts/custom-game-ci
          timeout 180s xvfb-run -a -s '-screen 0 1024x768x24' ./build/linux/client/release/src/CustomGameSetupHarness artifacts/custom-game-ci 2>&1 | grep -v '^Map generation\|^Landscape preview\|^Settings::load' | tee artifacts/custom-game-ci/ui.log
          timeout 60s xvfb-run -a ./build/linux/client/release/src/CustomGameSetupHarness preferences-write
          timeout 60s xvfb-run -a ./build/linux/client/release/src/CustomGameSetupHarness preferences-read
          cat artifacts/custom-game-ci/ui.log
          ! grep -q 'no such key' artifacts/custom-game-ci/ui.log

      - name: Test status-bar bounds in GPU and software rendering
        run: |
          SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ./build/linux/client/release/src/point-bar-render-test gl
          SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            ./build/linux/client/release/src/point-bar-render-test software
      - name: Test nonblocking screen execution
        run: |
          ./build/linux/client/release/libgag/src/ScreenExecutionHarness

      - name: Test portable rendering and mobile input
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          ./build/linux/client/release/libgag/src/MobileInputHarness
          ./build/linux/client/release/libgag/src/MobileDocumentsHarness
          python3 test/run-mobile-certificate-tests.py build/linux/client/release/src/MobileCertificateHarness
          python3 test/run-mobile-temporary-tests.py build/linux/client/release/src/MobileTemporaryFilesHarness
          xvfb-run -a ./build/linux/client/release/libgag/src/PortableRendererHarness

      - name: Test incremental engine sessions
        run: |
          python3 test/run-engine-session-test.py

      - name: Build and run the selection lifetime regression
        run: |
          ./build/linux/client/release/src/GameGUISelectionHarness

      - name: Build and run the wrapped building footprint regression
        run: |
          ./build/linux/client/release/src/BuildingFootprintHarness
          ./build/linux/client/release/src/BuildingFootprintHarness --load test/fixtures/wrapped-building/reproducer.game

      - name: Build and run the entering unit save regression
        run: |
          ./build/linux/client/release/src/EnteringUnitSaveHarness
          ./build/linux/client/release/src/EnteringUnitSaveHarness --load test/fixtures/entering-explorer/reproducer.game

      - name: Test Cortex placement equivalence
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 cortex-geometry-test
          ./build/linux/client/release/src/CortexGeometryHarness

      - name: Test Maxima relocation handovers and recovery
        run: |
          GLOB2_USER_DIR="$(mktemp -d)" ./build/linux/client/release/src/MaximaRelocationIntegrationTest

      - name: Test Maxima strategy and implementation
        run: |
          GLOB2_USER_DIR="$(mktemp -d)" python3 test/maxima/run_maxima_implementation_regressions.py --build-dir build/linux/client/release --reuse-built-objects

      - name: Test clearing flag resource bounds
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/ClearingFlagGradientTest

      - name: Test trapped colony elimination
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/TrappedUnitLifecycleTest

      - name: Build and run the failing-unit markers regression
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1024x768x24' ./build/linux/client/release/src/FailingUnitMarkersHarness
      - name: Upload the failing-unit markers scene
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failing-unit-markers-${{ matrix.runner }}
          path: .cache/failing-unit-markers/
          if-no-files-found: ignore
      - name: Build and run the entering unit draw regression
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1024x768x24' ./build/linux/client/release/src/EnteringUnitDrawHarness

      - name: Build and run the immobile unit gradient regression
        run: |
          ./build/linux/client/release/src/ImmobileUnitGradientHarness

      - name: Build and run the building expulsion regression
        run: |
          timeout 300s ./build/linux/client/release/src/BuildingExpelHarness

      - name: Build and run the building gradient invalidation regression
        run: |
          ./build/linux/client/release/src/BuildingGradientInvalidationHarness

      - name: Build and run the hiring bucket regression
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/HiringBucketHarness .

      - name: Build and run the hiring level-gate regression
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/LevelGateHarness .
      - name: Build and run the resource-fetch target regression
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/ResourceFetchTargetHarness .

      - name: Build and run the round-trip hunger gate regression
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/RoundTripHungerGateHarness .

      - name: Build and run the inn swap regression
        run: |
          timeout 120s ./build/linux/client/release/src/InnSwapHarness

      - name: Test savegame loading and atomic autosaves
        run: |
          python3 test/run-savegame-safety-tests.py build/linux/client/release/src/SavegameSafetyHarness
          build/linux/client/release/src/MaximaContinuationTest
          ./build/linux/client/release/src/BufferedFileStreamHarness

      - name: Test team statistics save compatibility
        run: |
          build/linux/client/release/libgag/src/PerformanceTelemetryHarness
          ./build/linux/client/release/src/UnitContinuationHarness
          python3 test/maxima/check_save_continuation_fixture.py build/linux/client/release/src/glob2
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/TeamStatsSaveHarness .
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version88.expected.txt build/linux/client/release/src/TeamStatsSaveHarness . --legacy test/fixtures/team-stats/version88.game
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version84.expected.txt build/linux/client/release/src/TeamStatsSaveHarness . --legacy games/gd-small-2ai.game

      - name: Verify gameplay telemetry leaves simulation checksums unchanged
        run: python3 test/check_telemetry_simulation.py build/linux/client/release/src/glob2

      - name: Build and run the terrain resource regression
        run: |
          ./build/linux/client/release/src/TerrainResourcesHarness

      - name: Test Nicowar farming wood clearance
        run: |
          python3 test/run-savegame-safety-tests.py build/linux/client/release/src/NicowarFarmingHarness .

      - name: Verify weighted path gradients against the independent oracle
        run: ./build/linux/client/release/src/PathGradientHarness

      - name: Build and run the global gradient regression
        run: |
          ./build/linux/client/release/src/GlobalGradientHarness

      - name: Build and run the LAN session regression
        run: |
          python3 test/run_lan_session_test.py build/linux/client/release/src/LANSessionHarness

      - name: Build and run the aspect-ratio regression
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/FullscreenAspectHarness gl
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/FullscreenAspectHarness software

      - name: Check phone layouts and gameplay touch input
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_AUDIODRIVER: dummy
        run: |
          build/linux/client/release/libgag/src/MobileInputHarness
          timeout 60s xvfb-run -a build/linux/client/release/libgag/src/PortableRendererHarness
          for harness in gameplay-touch-test responsive-menu-test mobile-presentation-test; do
            mkdir -p "artifacts/mobile-ui/$harness"
            GLOB2_USER_DATA_DIR="$PWD/artifacts/mobile-ui/$harness" timeout 120s xvfb-run -a -s '-screen 0 1600x1400x24' "build/linux/client/release/src/$harness"
          done

      - name: Upload phone UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-verification
          path: artifacts/mobile-ui/

      - name: Check native settings persistence and retry
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s '-screen 0 1600x1400x24' python3 test/run-settings-tests.py

      - name: Build and run the window resize regression
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/WindowResizeHarness gl
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/WindowResizeHarness software

      - name: Build and run the scaled text regression
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p artifacts/text-raster
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/TextRasterHarness artifacts/text-raster

      - name: Check game rendering across repeated map copies
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/MapRenderResizeHarness
          SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1920x1200x24' python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/MapRenderResizeHarness --gl

      - name: Test front-end colony isolation and menu navigation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/linux/client/release/src/MenuColonyHarness check data/menu/colony.bin
          ./build/linux/client/release/src/MenuColonyHarness navigation unused

      - name: Test game speed controls and playback
        run: |
          GLOB2_BUILD_DIR=build/linux/client/release xvfb-run -a python3 test/run-game-speed-tests.py

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      - name: Retain browser/native simulation trace
        run: python3 test/run-browser-determinism.py build/linux/client/release/src/glob2 artifacts/browser-determinism/native
      - uses: actions/upload-artifact@v4
        with:
          name: browser-determinism-${{ matrix.runner }}
          path: artifacts/browser-determinism/native/

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}

  linux-variants:
    name: linux variants (${{ matrix.image }})
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth \
            libcppunit-dev

      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-variants-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-variants-${{ matrix.runner }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and run the tests
        working-directory: test
        run: |
          # The standalone suite owns its generated configuration.
          scons CXX=${{ matrix.compiler }} -j$(nproc)
          ./TestsRunner
          for harness in ./*Harness ./*Test; do
            echo "== $harness"
            "$harness"
          done

      - name: Build the YOG server
        run: scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=1 --build=build-server

      - name: Build without OpenGL
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 opengl=0 wss=0 --build=build-software build-software/src/glob2 torus-render-test
          python3 test/SoftwareStartupTest.py build-software/src/glob2
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            build-software/src/torus-render-test -g -F -m -s 1120x720

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-variants-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}

  linux-map-generators:
    name: linux map generators (${{ matrix.image }})
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth \
            libcppunit-dev

      - uses: actions/checkout@v4

      # Reads the main job's cache and never saves: it compiles a subset of the
      # same objects with the same flags.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-${{ matrix.runner }}-

      - name: Build the map generator golden test
        run: scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 map-generator-golden-test

      - name: Check golden maps and sweep colony counts
        run: |
          # Golden maps: rows exist per platform and this platform must have them. The check and
          # the sweep's shards share nothing, so they run side by side with separate
          # profiles; logs are replayed in order. A failing check then prints the rows this
          # platform produces, so a new platform's rows can be committed from the log.
          golden() { log=$1; shift; timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest "$@" > "$log" 2>&1; }
          golden /tmp/golden-rows.log glob2-golden-rows --require-rows & rows=$!
          sweeps=()
          for shard in 0 1 2 3; do
            golden /tmp/golden-sweep-$shard.log glob2-golden-sweep-$shard --sweep $shard/4 & sweeps+=($!)
          done
          status=0
          if ! wait $rows; then
            status=1
            golden /tmp/golden-print.log glob2-golden-print --print || true
            cat /tmp/golden-print.log
          fi
          cat /tmp/golden-rows.log
          for i in 0 1 2 3; do wait ${sweeps[$i]} || status=1; cat /tmp/golden-sweep-$i.log; done
          [ $status = 0 ]

      - name: Check generator telemetry equivalence and cost
        run: timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest glob2-telemetry-ci --telemetry

  windows:
    name: windows (mingw-w64)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.browser_only }}
    runs-on: windows-latest
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_net
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-ccache

      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build glob2 and the regression harnesses
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 build/mingw/client/release/src/glob2.exe \
            map-report-test \
            orchard-conversion-test \
            tournament-compatibility-test \
            clearing-gradient-test \
            path-gradient-test \
            point-bar-render-test \
            trapped-unit-test \
            hiring-bucket-test \
            map-render-resize-test \
            map-preview-test \
            savegame-safety-test \
            maxima-continuation-test \
            team-stats-save-test \
            unit-continuation-test \
            performance-telemetry-test

      - name: Test Orchard Commons generation and fruit conversion
        run: ./build/mingw/client/release/src/OrchardCommonsConversionTest.exe glob2-orchard-ci "$PWD" "$PWD/artifacts/orchard-conversion"

      - name: Retain Orchard Commons conversion fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-conversion-windows
          path: artifacts/orchard-conversion/
          if-no-files-found: ignore

      - name: Test map JSON reports
        run: |
          python3 test/test_map_report.py build/mingw/client/release/src/glob2.exe build/mingw/client/release/src/MapReportHarness.exe
          python3 test/test_map_telemetry.py
      - name: Upload map JSON reports and command log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-report-windows
          path: artifacts/map-report/

      - name: Test headless map CLI
        run: python3 test/test_map_cli.py build/mingw/client/release/src/glob2.exe
      - name: Upload map CLI previews and command log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-windows
          path: artifacts/map-cli/

      - name: Verify weighted path gradients against the independent oracle
        run: ./build/mingw/client/release/src/PathGradientHarness.exe

      - name: Test clearing flag resource bounds
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/ClearingFlagGradientTest.exe
      - name: Test status-bar bounds in software rendering
        run: |
          SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            ./build/mingw/client/release/src/point-bar-render-test.exe software

      - name: Test trapped colony elimination
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/TrappedUnitLifecycleTest.exe

      - name: Test torus geometry, picking and cloud coordinates
        run: |
          g++ -std=c++14 -O2 test/TorusGeometryTest.cpp -o /tmp/torus-geometry
          /tmp/torus-geometry
          g++ -std=c++14 -O2 test/TorusPickingTest.cpp -o /tmp/torus-picking
          /tmp/torus-picking
          g++ -std=c++14 -O2 test/CloudFieldTest.cpp src/SimplexNoise.cpp -o /tmp/cloud-field
          /tmp/cloud-field
          g++ -std=c++14 -O2 test/MapRenderGeometryTest.cpp -o /tmp/map-render-geometry
          /tmp/map-render-geometry

      - name: Build and run the hiring bucket regression
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/HiringBucketHarness.exe .

      - name: Check game rendering across repeated map copies
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/MapRenderResizeHarness.exe

      - name: Build and run pre-game map preview regressions
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/MapPreviewHarness.exe

      - name: Test savegame loading and atomic autosaves
        run: |
          python3 test/run-savegame-safety-tests.py build/mingw/client/release/src/SavegameSafetyHarness.exe
          build/mingw/client/release/src/MaximaContinuationTest.exe

      - name: Test team statistics save compatibility
        run: |
          build/mingw/client/release/libgag/src/PerformanceTelemetryHarness.exe
          ./build/mingw/client/release/src/UnitContinuationHarness.exe
          python3 test/maxima/check_save_continuation_fixture.py build/mingw/client/release/src/glob2.exe
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/TeamStatsSaveHarness.exe .
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version88.expected.txt build/mingw/client/release/src/TeamStatsSaveHarness.exe . --legacy test/fixtures/team-stats/version88.game
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version84.expected.txt build/mingw/client/release/src/TeamStatsSaveHarness.exe . --legacy games/gd-small-2ai.game

      - name: Verify gameplay telemetry leaves simulation checksums unchanged
        run: python3 test/check_telemetry_simulation.py build/mingw/client/release/src/glob2.exe

      - name: Build the YOG server
        run: scons -j$(nproc) release=1 mingw=1 server=1 --build=build-server

      - name: Report the cache statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      - name: Retain browser/native simulation trace
        run: python3 test/run-browser-determinism.py build/mingw/client/release/src/glob2.exe artifacts/browser-determinism/native
      - uses: actions/upload-artifact@v4
        with:
          name: browser-determinism-windows
          path: artifacts/browser-determinism/native/

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}

  web:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native and build dependencies
        run: |
          # The hosted image adds an unpinned Chrome repository, while this job
          # installs its pinned browsers through Playwright below.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y scons libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev libvorbis-dev libogg-dev libspeex-dev libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Install pinned Emscripten
        run: python3 browser/setup.py
      - name: Test build identities
        run: python3 -m unittest discover -s tests/build_system -v
      - name: Build WebAssembly client
        run: scons target=web release=1 -j$(nproc)
      - name: Build and test gateway
        run: |
          scons role=gateway release=1 -j$(nproc)
          python3 -m unittest discover -s tests/gateway -v
      - name: Build headless router
        run: scons role=router release=1 -j$(nproc)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Build transport integration fixture
        run: |
          scons release=1 transport-test -j$(nproc)
          python3 test/run-network-transport-tests.py
          python3 -m unittest discover -s tests/transport -v
      - name: Test browser lifecycle, renderers and multiplayer
        working-directory: browser
        env:
          GLOB2_FIREFOX_HEADED: '1'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
          # Firefox needs an X display for WebGL2 and a real audio service to
          # complete AudioContext.resume(). A null sink keeps CI silent.
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load='module-null-sink sink_name=glob2_ci'
          node --test unit/*.test.js
          # Chromium carries the complete behavior suite. The other engines
          # exercise startup, gameplay, viewport and native text editing without
          # repeating every persistence and multiplayer scenario.
          GLOB2_TEST_RENDERER=software xvfb-run -a npx playwright test --project=chromium
          GLOB2_TEST_RENDERER=software xvfb-run -a npx playwright test runtime-build.spec.js viewport.spec.js responsive-presentation.spec.js campaign-editor-storage.spec.js --project=firefox --project=webkit
          # WebGL2 shares the game behavior above; keep focused adapter,
          # lifecycle, persistence and rendering coverage in Chromium.
          GLOB2_TEST_RENDERER=webgl2 xvfb-run -a npx playwright test runtime-build.spec.js session-reload.spec.js viewport.spec.js rendering.spec.js input.spec.js responsive-presentation.spec.js --project=chromium
          xvfb-run -a npx playwright test --config visibility.config.js
          GLOB2_TEST_RENDERER=webgl2 xvfb-run -a npx playwright test --config visibility.config.js
      - uses: actions/upload-artifact@v4
        with:
          name: browser-determinism-wasm
          path: artifacts/browser-determinism/wasm/
          if-no-files-found: error
      - name: Test self-hosting with real TLS and persistent volumes
        run: |
          docker compose -f deploy/compose.yaml build lobby
          python3 -m unittest discover -s tests/deployment -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          retention-days: 7
          path: |
            build/browser-test-results
            build/browser-test-report
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: glob2-web-development
          retention-days: 7
          path: |
            build/emscripten/client/release/index.html
            build/emscripten/client/release/index.js
            build/emscripten/client/release/index.wasm
            build/emscripten/client/release/index.data

  browser-determinism:
    name: browser/native simulation equivalence
    needs: [linux, windows, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-determinism-*
          path: traces
      - name: Compare every per-tick trace across Linux, Windows and WebAssembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          traces = sorted(Path('traces').rglob('*.checksums'))
          assert len(traces) == 4, f'Expected four platform traces, got {traces}'
          reference = traces[0].read_bytes()
          assert len(reference) > 1000
          for trace in traces[1:]:
              assert trace.read_bytes() == reference, f'Simulation differs: {trace}'
          print('All four per-tick simulation traces match')
          PY
