name: Portage resource epoch evidence (no expected output updates)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portage-macos:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GLOB2_DEV_MODE: isolated
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve evidence-only observer
        run: cp .github/scripts/portage_epoch_observe.py "$RUNNER_TEMP/portage_epoch_observe.py"
      - uses: actions/checkout@v4
        with:
          ref: a82845c38d5569fe1167d14a3590e1ae8c8a47c5
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7e54a3fc581d22d32e7b97a6aee76dbfeae58e9f
          path: artifacts/portage-old
          persist-credentials: false
      - name: Install shared development dependencies
        run: brew install cmake freetype libpng jpeg-turbo scons pkgconf opusfile opus libogg speex openssl@3 boost fribidi libepoxy
      - uses: ./.github/actions/sdl3
        with:
          cc: clang
          cxx: clang++
      - name: Record source and toolchain inputs
        run: |
          mkdir -p artifacts/portage-evidence
          git rev-parse HEAD > artifacts/portage-evidence/current-revision.txt
          git status --porcelain > artifacts/portage-evidence/current-status.txt
          git -C artifacts/portage-old rev-parse HEAD > artifacts/portage-evidence/historical-revision.txt
          git -C artifacts/portage-old status --porcelain > artifacts/portage-evidence/historical-status.txt
          g++ --version > artifacts/portage-evidence/build-compiler.txt
          clang++ --version > artifacts/portage-evidence/dependency-compiler.txt
          brew list --versions > artifacts/portage-evidence/brew-versions.txt
          sw_vers > artifacts/portage-evidence/os.txt
          uname -a >> artifacts/portage-evidence/os.txt
          xcrun --show-sdk-version > artifacts/portage-evidence/sdk.txt
          cp build/sdl3-ci/prefix/.ci-cache.json artifacts/portage-evidence/dependency-prefix.json
          cp "$RUNNER_TEMP/portage_epoch_observe.py" artifacts/portage-evidence/observer.py
          cp test/fixtures/map-generators/pre-resource-epoch-golden.txt artifacts/portage-evidence/historical-goldens.txt
          # These two unapproved values are diagnostic anchors from the first7baf mac print,
          # not accepted expected output. Historical values are checked independently.
          printf '%s\n' 'macos-arm64 65 4 9 8 4 1 ok 15517041212468541340' 'macos-arm64 65 4 8 8 4 2 ok 16118877485436928657' > artifacts/portage-evidence/current-observed.txt
      - name: Build current study tool
        id: current_build
        run: |
          openssl="$(brew --prefix openssl@3)"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX="$PWD/build/sdl3-ci/prefix" GLOB2_RECORDING_PREFIX="$PWD/build/sdl3-ci/prefix/recording" \
            scons release=1 server=0 -j2 map-generator-study \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > artifacts/portage-evidence/current-build.log 2>&1
      - name: Observe current Portage requests
        if: ${{ !cancelled() && steps.current_build.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 "$RUNNER_TEMP/portage_epoch_observe.py" \
            build/darwin/client/release/src/MapGeneratorStudy "$PWD" artifacts/portage-evidence/current \
            artifacts/portage-evidence/current-observed.txt macos-arm64 > artifacts/portage-evidence/current-collection.log 2>&1
      - name: Build historical study tool using the same dependency prefix
        id: historical_build
        if: ${{ !cancelled() && steps.current_build.outcome == 'success' }}
        run: |
          openssl="$(brew --prefix openssl@3)"
          root="$PWD"
          export PATH="$root/build/sdl3-ci/prefix/bin:$PATH"
          cd artifacts/portage-old
          GLOB2_SDL3_PREFIX="$root/build/sdl3-ci/prefix" GLOB2_RECORDING_PREFIX="$root/build/sdl3-ci/prefix/recording" \
            scons release=1 server=0 -j2 map-generator-study \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > "$root/artifacts/portage-evidence/historical-build.log" 2>&1
      - name: Observe historical requests and require archived full fingerprints
        if: ${{ !cancelled() && steps.historical_build.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 "$RUNNER_TEMP/portage_epoch_observe.py" \
            artifacts/portage-old/build/darwin/client/release/src/MapGeneratorStudy "$PWD/artifacts/portage-old" artifacts/portage-evidence/historical \
            artifacts/portage-evidence/historical-goldens.txt macos-arm64 > artifacts/portage-evidence/historical-collection.log 2>&1
      - name: Audit inputs after observation
        if: always()
        run: |
          git status --porcelain > artifacts/portage-evidence/current-status-after.txt
          git -C artifacts/portage-old status --porcelain > artifacts/portage-evidence/historical-status-after.txt
          cmp artifacts/portage-evidence/current-status.txt artifacts/portage-evidence/current-status-after.txt
          cmp artifacts/portage-evidence/historical-status.txt artifacts/portage-evidence/historical-status-after.txt
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          prefix=Path('build/sdl3-ci/prefix')
          before=json.loads(Path('artifacts/portage-evidence/dependency-prefix.json').read_text())['files']
          after={str(p.relative_to(prefix)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(prefix.rglob('*')) if p.is_file() and p.name!='.ci-cache.json'}
          if before!=after: raise SystemExit('Shared dependency prefix changed during the observations')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portage-macos-epoch-evidence
          path: artifacts/portage-evidence/
          if-no-files-found: error
          retention-days: 14
