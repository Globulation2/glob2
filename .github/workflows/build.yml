name: Exact-artifact Chromium editor crash investigation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GLOB2_DEV_MODE: isolated
  GLOB2_TEST_RENDERER: software
jobs:
  chromium-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c8297c5c17974bbcc9f1fedbfbb43064095e04c
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11461717078'
          run-id: 37570683268
          github-token: ${{ github.token }}
          path: build/emscripten/client/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11460922193'
          run-id: 37570683268
          github-token: ${{ github.token }}
          path: artifacts/ci-native
          merge-multiple: true
      - name: Unpack original native programs and install runtime inputs
        run: |
          tar -xzf artifacts/ci-native/web-native.tar.gz
          sudo apt-get update -qq
          xargs sudo apt-get install -y --no-install-recommends < artifacts/ci-native/runtime-packages.txt
          sudo apt-get install -y --no-install-recommends python3 libgl1 libglu1-mesa libepoxy0 libgl1-mesa-dri xvfb xauth openbox x11-utils gdb
          python3 .github/scripts/linux_runtime_packages.py build/linux/client/release --verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('browser/package-lock.json') }}
      - name: Install locked browser test inputs
        working-directory: browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Record source and host before execution
        run: |
          mkdir -p artifacts/editor-crash-investigation
          git rev-parse HEAD > artifacts/editor-crash-investigation/revision.txt
          python3 test/build_provenance.py > artifacts/editor-crash-investigation/source-before.json
          uname -a > artifacts/editor-crash-investigation/host.txt
          cat /proc/meminfo > artifacts/editor-crash-investigation/meminfo-before.txt
          df -h > artifacts/editor-crash-investigation/disk-before.txt
          node --version > artifacts/editor-crash-investigation/node-version.txt
          npm --prefix browser ls @playwright/test > artifacts/editor-crash-investigation/playwright-version.txt
          sha256sum browser/package-lock.json > artifacts/editor-crash-investigation/lock-sha256.txt
          python3 - <<'PYCODE'
          import json,pathlib,hashlib
          files={}
          for root in (pathlib.Path("build/emscripten/client/release"),pathlib.Path("build/linux/client/release")):
              for f in sorted(root.rglob("*")):
                  if f.is_file():files[str(f)]=hashlib.sha256(f.read_bytes()).hexdigest()
          pathlib.Path("artifacts/editor-crash-investigation/payload-before.json").write_text(json.dumps(files,indent=2)+"\n")
          d={'source':'4c8297c5c17974bbcc9f1fedbfbb43064095e04c','original_run':37570683268,'original_job':112635275024,'original_artifacts':{'web-client':{'id':11461717078,'expected_archive_sha256':'edd9c7b4bab46b872c5b09cd6ebfe06169b5af95a002268487be3ba7478b81a3'},'web-native':{'id':11460922193,'expected_archive_sha256':'028c98e062b3f1cc9ea731b4bc9de8b65ac84c831659718f4c57b1510b457826'}},'scope':'Exact original build artifacts and locked test source; fresh hosted browser execution, not a new engine build or fully identical runner image.'}
          pathlib.Path('artifacts/editor-crash-investigation/inputs.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
      - name: Repeat original shard with browser process diagnostics
        id: shard
        continue-on-error: true
        working-directory: browser
        env:
          DEBUG: pw:browser
        run: |
          xvfb-run -a npx playwright test --project=chromium --shard=2/5 --grep-invert='torus\.spec\.js|rendering\.spec\.js|settings-storage\.spec\.js' > ../artifacts/editor-crash-investigation/original-shard.log 2>&1
      - name: Preserve original-shard artifacts before focused run
        if: always()
        run: |
          if test -d build/browser-test-results; then mv build/browser-test-results artifacts/editor-crash-investigation/original-shard-results; fi
          if test -d build/browser-test-report; then mv build/browser-test-report artifacts/editor-crash-investigation/original-shard-report; fi
      - name: Repeat both editor durability faults three times
        id: focused
        continue-on-error: true
        working-directory: browser
        env:
          DEBUG: pw:browser
        run: |
          xvfb-run -a npx playwright test tests/editor-storage.spec.js --project=chromium --repeat-each=3 > ../artifacts/editor-crash-investigation/focused-editor.log 2>&1
      - name: Record final host and source state
        if: always()
        run: |
          cat /proc/meminfo > artifacts/editor-crash-investigation/meminfo-after.txt
          df -h > artifacts/editor-crash-investigation/disk-after.txt
          sudo dmesg > artifacts/editor-crash-investigation/kernel.log 2>&1 || true
          python3 - <<'PYCODE'
          import json,pathlib,hashlib
          root=pathlib.Path('artifacts/editor-crash-investigation')
          before=json.loads((root/'payload-before.json').read_text())
          after={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() if pathlib.Path(name).is_file() else None for name in before}
          (root/'payload-after.json').write_text(json.dumps(after,indent=2)+'\n')
          if before!=after:raise SystemExit('Original extracted build payload changed')
          PYCODE
      - name: Audit source stability independently
        if: always()
        run: |
          python3 test/build_provenance.py > artifacts/editor-crash-investigation/source-after.json
          cmp artifacts/editor-crash-investigation/source-before.json artifacts/editor-crash-investigation/source-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-artifact-editor-crash-investigation
          path: |
            artifacts/editor-crash-investigation/
            build/browser-test-results/
            build/browser-test-report/
          if-no-files-found: error
          retention-days: 14
      - name: Require both repetitions to pass
        if: always()
        run: test '${{ steps.shard.outcome }}' = success && test '${{ steps.focused.outcome }}' = success
