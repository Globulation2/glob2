name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_only:
        description: Run only browser, transport, gateway, and deployment checks
        required: false
        type: boolean
        default: false

# A new push to a pull request supersedes its running checks. Master runs are
# never cancelled: relevant builds save the compiler caches the next PRs restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.select.outputs.native }}
      browser: ${{ steps.select.outputs.browser }}
      map_generators: ${{ steps.select.outputs.map_generators }}
      deployment: ${{ steps.select.outputs.deployment }}
      cross_platform: ${{ steps.select.outputs.cross_platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Test changed-path selection
        run: python3 -m unittest discover -s tests/build_system -p test_ci_changed_paths.py -v
      - name: Select checks for changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BROWSER_ONLY: ${{ inputs.browser_only }}
        run: python3 .github/scripts/ci_changed_paths.py --base "$BASE_SHA"

  linux-build:
    name: linux build (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}

    runs-on: ${{ matrix.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth \
            libcppunit-dev

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      - name: Validate translations
        id: validate_translations
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'translation catalog' 'python3 data/check_translations.py --strict' \
            --check 'translation tests' 'python3 test/test_translations.py' \
            --check 'font coverage' 'python3 test/test_font_coverage.py' \
            --check 'text area layout' 'python3 test/test_text_area_layout.py'
      - name: Test compiler cache integration
        id: test_compiler_cache_integration
        continue-on-error: true
        run: python3 test/test-ccache.py

      - name: Test CI failure aggregation
        id: test_ci_failure_aggregation
        continue-on-error: true
        run: python3 test/test_ci_failure_aggregation.py

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-${{ matrix.runner }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build glob2 and the regression harnesses
        id: build_glob2_and_the_regression_harnesses
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 build/linux/client/release/src/glob2 \
            map-report-test \
            orchard-conversion-test \
            maxima-food-ledger-test \
            tournament-compatibility-test \
            torus-render-test \
            map-preview-test \
            custom-setup-test \
            map-generator-defaults-test \
            map-generator-golden-test \
            point-bar-render-test \
            selection-test \
            building-footprint-test \
            entering-unit-save-test \
            clearing-gradient-test \
            trapped-unit-test \
            hungry-defeat-test \
            failing-unit-markers-test \
            entering-unit-draw-test \
            immobile-unit-gradient-test \
            building-expel-test \
            building-gradient-invalidation-test \
            hiring-bucket-test \
            level-gate-test \
            resource-fetch-target-test \
            round-trip-hunger-gate-test \
            inn-swap-test \
            savegame-safety-test \
            maxima-continuation-test \
            maxima-relocation-test \
            buffered-file-test \
            team-stats-save-test \
            unit-continuation-test \
            runtime-continuation-test \
            gradient-invalidation-test \
            performance-telemetry-test \
            terrain-test \
            global-gradient-test \
            path-gradient-test \
            compute-executor-test \
            gradient-pipeline-test \
            nicowar-farming-test \
            ai-save-portability-test \
            lan-test \
            aspect-test \
            resize-test \
            text-raster-test \
            map-render-resize-test \
            menu-colony-harness \
            speed-tests \
            unit-render-tests \
            unit-hd-cache-test \
            runtime-pack-check \
            settings-tests \
            screen-test \
            session-test \
            portable-renderer-test \
            mobile-input-test \
            gameplay-touch-test \
            responsive-menu-test \
            mobile-presentation-test \
            mobile-documents-test \
            mobile-certificate-test \
            mobile-temporary-files-test

      - name: Test Cortex placement equivalence
        id: test_cortex_placement_equivalence
        continue-on-error: true
        run: |
          scons CXX=${{ matrix.compiler }} -j$(nproc) release=1 server=0 cortex-geometry-test
          ./build/linux/client/release/src/CortexGeometryHarness

      - name: Test Maxima strategy and implementation
        id: test_maxima_strategy_and_implementation
        continue-on-error: true
        run: |
          GLOB2_USER_DIR="$(mktemp -d)" python3 test/maxima/run_maxima_implementation_regressions.py --build-dir build/linux/client/release --reuse-built-objects

      - name: Package built Linux test programs
        id: package_linux_test_programs
        if: steps.build_glob2_and_the_regression_harnesses.outcome == 'success'
        run: |
          test -x build/linux/client/release/src/glob2
          find build/linux/client/release -type f \( -perm /111 -o -name '*.so*' \) -print0 |
            tar --null -czf linux-test-programs.tar.gz -T -
      - uses: actions/upload-artifact@v4
        id: upload_linux_test_programs
        if: steps.package_linux_test_programs.outcome == 'success'

        with:
          name: linux-test-programs-${{ matrix.runner }}
          path: linux-test-programs.tar.gz
          retention-days: 2
          if-no-files-found: error


      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        id: report_the_cache_statistics
        continue-on-error: true
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py

  linux-tests:
    name: linux tests (${{ matrix.platform }}, shard ${{ matrix.shard }}/4)
    needs: [changes, linux-build]
    if: ${{ needs.changes.outputs.native == 'true' && needs.linux-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 1
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 2
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 3
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            compiler: g++-11
            shard: 4
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 1
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 2
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 3
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
            compiler: g++-13
            shard: 4
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ matrix.compiler }} python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth \
            libcppunit-dev

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1

      - uses: actions/download-artifact@v4
        id: download_linux_test_programs
        with:
          name: linux-test-programs-${{ matrix.runner }}
      - name: Unpack built Linux test programs
        id: unpack_linux_test_programs
        run: tar -xzf linux-test-programs.tar.gz

      - name: Test Maxima food ledger
        if: ${{ matrix.shard == 1 }}
        id: test_maxima_food_ledger
        continue-on-error: true
        run: build/linux/client/release/src/MaximaFoodLedgerStandaloneTest

      - name: Test map JSON reports
        if: ${{ matrix.shard == 2 }}
        id: test_map_json_reports
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map report' 'python3 test/test_map_report.py build/linux/client/release/src/glob2 build/linux/client/release/src/MapReportHarness' \
            --check 'map telemetry' 'python3 test/test_map_telemetry.py'
      - name: Upload map JSON reports and command log
        id: upload_map_json_reports_and_command_log
        continue-on-error: true
        if: ${{ always() && matrix.shard == 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: map-report-${{ matrix.runner }}
          path: artifacts/map-report/

      - name: Test headless map CLI with the shared preview renderer
        if: ${{ matrix.shard == 3 }}
        id: test_headless_map_cli_with_the_shared_preview_renderer
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'generation only' 'python3 test/test_map_cli.py build/linux/client/release/src/glob2 --generation-only' \
            --check 'map CLI' 'python3 test/test_map_cli.py build/linux/client/release/src/glob2'
      - name: Upload map CLI previews and command log
        id: upload_map_cli_previews_and_command_log
        continue-on-error: true
        if: ${{ always() && matrix.shard == 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-${{ matrix.runner }}
          path: artifacts/map-cli/

      - name: Test tournament protocol, AI configuration and main CLI
        if: ${{ matrix.shard == 1 }}
        id: test_tournament_protocol_ai_configuration_and_main_cli
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check tournaments 'python3 test/test_tournaments.py' \
            --check 'tournament pipeline' 'python3 test/test_tournament_pipeline.py' \
            --check 'distributed map telemetry' 'python3 test/test_distributed_map_telemetry.py' \
            --check 'distributed game telemetry' 'python3 test/test_distributed_game_telemetry.py' \
            --check 'map fairness' 'python3 test/test_map_fairness_tournament.py' \
            --check 'map generation study' 'python3 test/test_map_generation_study.py' \
            --check 'fairness model' 'python3 test/test_fairness_model.py' \
            --check 'tournament compatibility' ./build/linux/client/release/src/TournamentCompatibilityTest \
            --check 'tournament CLI' 'python3 test/tournament_cli_integration.py --binary build/linux/client/release/src/glob2 --output artifacts/tournament-cli'
      - name: Retain tournament CLI compatibility evidence
        id: retain_tournament_cli_compatibility_evidence
        continue-on-error: true
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: tournament-cli-${{ matrix.runner }}
          path: artifacts/tournament-cli/
          if-no-files-found: ignore

      - name: Test torus geometry, picking and cloud coordinates
        if: ${{ matrix.shard == 4 }}
        id: test_torus_geometry_picking_and_cloud_coordinates
        continue-on-error: true
        run: |
          ${{ matrix.compiler }} -std=c++14 -O2 test/TorusGeometryTest.cpp -o /tmp/torus-geometry
          /tmp/torus-geometry
          ${{ matrix.compiler }} -std=c++14 -O2 test/TorusPickingTest.cpp -o /tmp/torus-picking
          /tmp/torus-picking
          ${{ matrix.compiler }} -std=c++14 -O2 test/CloudFieldTest.cpp src/SimplexNoise.cpp -o /tmp/cloud-field
          /tmp/cloud-field
          ${{ matrix.compiler }} -std=c++14 -O2 test/MapRenderGeometryTest.cpp -o /tmp/map-render-geometry
          /tmp/map-render-geometry

      - name: Test the RNG, tribool and local time that replaced Boost
        run: |
          ${{ matrix.compiler }} -std=c++20 -O2 test/MersenneTwisterTest.cpp -o /tmp/mersenne-twister
          /tmp/mersenne-twister
          ${{ matrix.compiler }} -std=c++20 -O2 test/TriboolTest.cpp -o /tmp/tribool
          /tmp/tribool
          ${{ matrix.compiler }} -std=c++20 -O2 test/LocalTimeTest.cpp -o /tmp/local-time
          /tmp/local-time

      - name: Exercise GPU and software game rendering
        if: ${{ matrix.shard == 4 }}
        id: exercise_gpu_and_software_game_rendering
        continue-on-error: true
        run: |
          mkdir -p /tmp/glob2-render-profile
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a build/linux/client/release/src/torus-render-test -g -F -m -s 1120x720
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            GLOB2_UI_SCALE=3 xvfb-run -a -s '-screen 0 1920x1440x24' \
            build/linux/client/release/src/torus-render-test -g -F -m -s 1920x1440
          GLOB2_USER_DIR=/tmp/glob2-render-profile SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            build/linux/client/release/src/torus-render-test -G -F -m -s 1120x720

      - name: Build and run pre-game map preview regressions
        if: ${{ matrix.shard == 2 }}
        id: build_and_run_pre_game_map_preview_regressions
        continue-on-error: true
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/MapPreviewHarness
          mkdir -p artifacts/map-preview
          timeout 180s xvfb-run -a ./build/linux/client/release/src/MapPreviewHarness glob2-map-preview-tests --visual artifacts/map-preview

      - name: Retain pre-game map preview evidence
        id: retain_pre_game_map_preview_evidence
        continue-on-error: true
        if: ${{ always() && matrix.shard == 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: map-preview-${{ matrix.runner }}-${{ matrix.compiler }}
          path: artifacts/map-preview/
          if-no-files-found: ignore

      - name: Test Orchard Commons generation and fruit conversion
        if: ${{ matrix.shard == 3 }}
        id: test_orchard_commons_generation_and_fruit_conversion
        continue-on-error: true
        run: |
          timeout 120s ./build/linux/client/release/src/OrchardCommonsConversionTest glob2-orchard-ci "$PWD" "$PWD/artifacts/orchard-conversion"

      - name: Retain Orchard Commons conversion fixtures
        id: retain_orchard_commons_conversion_fixtures
        continue-on-error: true
        if: ${{ always() && matrix.shard == 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: orchard-conversion-${{ matrix.runner }}
          path: artifacts/orchard-conversion/
          if-no-files-found: ignore

      - name: Build and run custom-game setup regressions
        if: ${{ matrix.shard == 2 }}
        id: build_and_run_custom_game_setup_regressions
        continue-on-error: true
        run: |
          # The growing generator catalog exercises hundreds of complete worlds.
          timeout 300s ./build/linux/client/release/src/MapGeneratorDefaultsTest glob2-map-defaults-ci
          timeout 180s ./build/linux/client/release/src/CustomGameSetupHarness
          mkdir -p artifacts/custom-game-ci
          timeout 60s xvfb-run -a ./build/linux/client/release/src/CustomGameSetupHarness artifacts/custom-game-ci/landscape-performance landscape-responsive
          timeout 180s xvfb-run -a -s '-screen 0 1024x768x24' ./build/linux/client/release/src/CustomGameSetupHarness artifacts/custom-game-ci 2>&1 | grep -v '^Map generation\|^Landscape preview\|^Settings::load' | tee artifacts/custom-game-ci/ui.log
          timeout 60s xvfb-run -a ./build/linux/client/release/src/CustomGameSetupHarness preferences-write
          timeout 60s xvfb-run -a ./build/linux/client/release/src/CustomGameSetupHarness preferences-read
          cat artifacts/custom-game-ci/ui.log
          ! grep -q 'no such key' artifacts/custom-game-ci/ui.log

      - name: Test status-bar bounds in GPU and software rendering
        if: ${{ matrix.shard == 1 }}
        id: test_status_bar_bounds_in_gpu_and_software_rendering
        continue-on-error: true
        run: |
          SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ./build/linux/client/release/src/point-bar-render-test gl
          SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy \
            ./build/linux/client/release/src/point-bar-render-test software
      - name: Test nonblocking screen execution
        if: ${{ matrix.shard == 3 }}
        id: test_nonblocking_screen_execution
        continue-on-error: true
        run: |
          ./build/linux/client/release/libgag/src/ScreenExecutionHarness

      - name: Test portable rendering and mobile input
        if: ${{ matrix.shard == 4 }}
        id: test_portable_rendering_and_mobile_input
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          python3 test/ci_run_commands.py \
            --check 'mobile input' ./build/linux/client/release/libgag/src/MobileInputHarness \
            --check 'mobile documents' ./build/linux/client/release/libgag/src/MobileDocumentsHarness \
            --check 'mobile certificate' 'python3 test/run-mobile-certificate-tests.py build/linux/client/release/src/MobileCertificateHarness' \
            --check 'mobile temporary files' 'python3 test/run-mobile-temporary-tests.py build/linux/client/release/src/MobileTemporaryFilesHarness' \
            --check 'portable renderer' 'xvfb-run -a ./build/linux/client/release/libgag/src/PortableRendererHarness'
      - name: Test incremental engine sessions
        if: ${{ matrix.shard == 1 }}
        id: test_incremental_engine_sessions
        continue-on-error: true
        run: |
          python3 test/run-engine-session-test.py

      - name: Build and run the selection lifetime regression
        if: ${{ matrix.shard == 2 }}
        id: build_and_run_the_selection_lifetime_regression
        continue-on-error: true
        run: |
          ./build/linux/client/release/src/GameGUISelectionHarness

      - name: Build and run the wrapped building footprint regression
        if: ${{ matrix.shard == 3 }}
        id: build_and_run_the_wrapped_building_footprint_regression
        continue-on-error: true
        run: |
          ./build/linux/client/release/src/BuildingFootprintHarness
          python3 test/inflate_gzip_fixture.py test/fixtures/wrapped-building/reproducer.game.gz /tmp/wrapped-building-reproducer.game
          ./build/linux/client/release/src/BuildingFootprintHarness --load /tmp/wrapped-building-reproducer.game

      - name: Build and run the entering unit save regression
        if: ${{ matrix.shard == 4 }}
        id: build_and_run_the_entering_unit_save_regression
        continue-on-error: true
        run: |
          ./build/linux/client/release/src/EnteringUnitSaveHarness
          python3 test/inflate_gzip_fixture.py test/fixtures/entering-explorer/reproducer.game.gz /tmp/entering-explorer-reproducer.game
          ./build/linux/client/release/src/EnteringUnitSaveHarness --load /tmp/entering-explorer-reproducer.game

      - name: Test Maxima relocation handovers and recovery
        if: ${{ matrix.shard == 1 }}
        id: test_maxima_relocation_handovers_and_recovery
        continue-on-error: true
        run: |
          GLOB2_USER_DIR="$(mktemp -d)" ./build/linux/client/release/src/MaximaRelocationIntegrationTest

      - name: Test clearing flag resource bounds
        if: ${{ matrix.shard == 2 }}
        id: test_clearing_flag_resource_bounds
        continue-on-error: true
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/ClearingFlagGradientTest

      - name: Test trapped colony elimination
        if: ${{ matrix.shard == 3 }}
        id: test_trapped_colony_elimination
        continue-on-error: true
        run: |
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/TrappedUnitLifecycleTest

      - name: Test hunger and defeat detection
