name: Independent macOS generator observations
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GLOB2_DEV_MODE: isolated
jobs:
  observe:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3fc51e3cc090bdbf49376a6756270b9ff4e91f8
          persist-credentials: false
      - name: Install development dependencies
        run: brew install cmake freetype libpng jpeg-turbo scons pkgconf opusfile opus libogg speex openssl@3 boost fribidi libepoxy
      - uses: ./.github/actions/sdl3
        with:
          cc: clang
          cxx: clang++
      - name: Record source, compiler and dependency identities
        run: |
          mkdir -p artifacts/independent-generator-inputs
          git rev-parse HEAD > artifacts/independent-generator-inputs/revision.txt
          python3 test/build_provenance.py > artifacts/independent-generator-inputs/source-before.json
          g++ --version > artifacts/independent-generator-inputs/compiler.txt
          clang++ --version > artifacts/independent-generator-inputs/dependency-compiler.txt
          brew --version > artifacts/independent-generator-inputs/brew-version.txt
          brew list --versions > artifacts/independent-generator-inputs/brew-packages.txt
          brew info --json=v2 --installed > artifacts/independent-generator-inputs/brew-installed.json
          sw_vers > artifacts/independent-generator-inputs/os.txt
          uname -a >> artifacts/independent-generator-inputs/os.txt
          xcrun --show-sdk-version > artifacts/independent-generator-inputs/sdk.txt
          cp build/sdl3-ci/prefix/.ci-cache.json artifacts/independent-generator-inputs/sdl-dependency-prefix.json
          python3 - <<'PYCODE'
          import hashlib,json,subprocess
          from pathlib import Path
          rows={}
          for name in 'freetype libpng jpeg-turbo opusfile opus libogg speex openssl@3 boost fribidi libepoxy'.split():
              prefix=Path(subprocess.check_output(['brew','--prefix',name],text=True).strip())
              for path in sorted((prefix/'lib').rglob('*')):
                  if path.is_file() and '.dylib' in path.name:
                      rows[name+'/'+str(path.relative_to(prefix))]=hashlib.sha256(path.read_bytes()).hexdigest()
          Path('artifacts/independent-generator-inputs/brew-runtime-libraries.json').write_text(json.dumps(rows,indent=2)+'\n')
          PYCODE
      - name: Build exact-source generator and design harness
        id: build
        run: |
          openssl="$(brew --prefix openssl@3)"
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons release=1 server=0 -j2 \
            engine-tests map-generator-golden-test \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > artifacts/independent-generator-inputs/build.log 2>&1
      - name: Collect unapproved observations with strict complete inventory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 test/ci_run_commands.py \
            --check 'generator fingerprints' 'python3 test/collect_generator_evidence.py collect build/darwin/client/release/src/MapGeneratorGoldenTest artifacts/generator-evidence --platform macos-arm64' \
            --check 'resource design fingerprints' "python3 test/run_tests.py --binary engine --build-dir build/darwin/client/release --in-process --no-display --filter 'MapGeneratorDefaults/Explicit designs preserve topology*' --artifacts artifacts/generator-evidence/designs --junit artifacts/generator-evidence/designs-junit.xml"
      - name: Audit observation inputs
        if: always()
        run: |
          python3 test/build_provenance.py > artifacts/independent-generator-inputs/source-after.json
          cmp artifacts/independent-generator-inputs/source-before.json artifacts/independent-generator-inputs/source-after.json
          python3 - <<'PYCODE'
          import hashlib,json,subprocess
          from pathlib import Path
          saved=Path('artifacts/independent-generator-inputs')
          prefix=Path('build/sdl3-ci/prefix')
          before=json.loads((saved/'sdl-dependency-prefix.json').read_text())['files']
          after={str(p.relative_to(prefix)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(prefix.rglob('*')) if p.is_file() and p.name!='.ci-cache.json'}
          if before!=after:raise SystemExit('SDL dependency prefix changed')
          before=json.loads((saved/'brew-runtime-libraries.json').read_text());after={}
          for name in 'freetype libpng jpeg-turbo opusfile opus libogg speex openssl@3 boost fribidi libepoxy'.split():
              prefix=Path(subprocess.check_output(['brew','--prefix',name],text=True).strip())
              for path in sorted((prefix/'lib').rglob('*')):
                  if path.is_file() and '.dylib' in path.name:
                      after[name+'/'+str(path.relative_to(prefix))]=hashlib.sha256(path.read_bytes()).hexdigest()
          if before!=after:raise SystemExit('Homebrew runtime libraries changed')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independently-built-macos-generator-observations
          path: |
            artifacts/generator-evidence/
            artifacts/independent-generator-inputs/
          if-no-files-found: error
          retention-days: 14
