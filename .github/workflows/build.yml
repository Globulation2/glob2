name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * *'

jobs:
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      CCACHE: 1
      CCACHE_DIR: /ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported toolchain range: 22.04 is g++ 11 / Boost
        # 1.74 (catches C++20 features the oldest supported compiler lacks),
        # 24.04 is g++ 13 / Boost 1.83 (catches new diagnostics and headers
        # that no longer come in transitively).
        image: [ubuntu:22.04, ubuntu:24.04]
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ python3 scons pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev \
            libcppunit-dev xvfb xauth libgl1-mesa-dri

      - uses: actions/checkout@v4

      - name: Test compiler cache integration
        run: python3 test/test-ccache.py

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /ccache
          key: ccache-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.image }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: ccache -z

      - name: Test build identities
        run: python3 -m unittest discover -s tests/build_system -v

      - name: Build glob2
        run: scons -j$(nproc) release=1

      - name: Test nonblocking screen execution
        run: |
          scons release=1 -j$(nproc) screen-test
          ./build/linux/client/release/libgag/src/ScreenExecutionHarness

      - name: Test incremental engine sessions
        run: |
          scons release=1 -j$(nproc) session-test
          python3 test/run-engine-session-test.py

      - name: Build and run the selection lifetime regression
        run: |
          scons -j$(nproc) release=1 server=0 selection-test
          ./build/linux/client/release/src/GameGUISelectionHarness

      - name: Build and run the wrapped building footprint regression
        run: |
          scons -j$(nproc) release=1 server=0 building-footprint-test
          ./build/linux/client/release/src/BuildingFootprintHarness
          ./build/linux/client/release/src/BuildingFootprintHarness --load test/fixtures/wrapped-building/reproducer.game

      - name: Build and run the entering unit save regression
        run: |
          scons -j$(nproc) release=1 server=0 entering-unit-save-test
          ./build/linux/client/release/src/EnteringUnitSaveHarness
          ./build/linux/client/release/src/EnteringUnitSaveHarness --load test/fixtures/entering-explorer/reproducer.game

      - name: Build and run the immobile unit gradient regression
        run: |
          scons -j$(nproc) release=1 server=0 immobile-unit-gradient-test
          ./build/linux/client/release/src/ImmobileUnitGradientHarness

      - name: Test savegame loading and atomic autosaves
        run: |
          scons -j$(nproc) release=1 server=0 savegame-safety-test
          python3 test/run-savegame-safety-tests.py build/linux/client/release/src/SavegameSafetyHarness

      - name: Test team statistics save compatibility
        run: |
          scons -j$(nproc) release=1 server=0 team-stats-save-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/linux/client/release/src/TeamStatsSaveHarness .
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version88.expected.txt build/linux/client/release/src/TeamStatsSaveHarness . --legacy test/fixtures/team-stats/version88.game
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version84.expected.txt build/linux/client/release/src/TeamStatsSaveHarness . --legacy games/gd-small-2ai.game

      - name: Build the YOG server
        run: scons -j$(nproc) release=1 server=1 --build=build-server

      - name: Build and run the terrain resource regression
        run: |
          scons -j$(nproc) release=1 server=0 terrain-test
          ./build/linux/client/release/src/TerrainResourcesHarness

      - name: Build and run the global gradient regression
        run: |
          scons -j$(nproc) release=1 server=0 global-gradient-test
          ./build/linux/client/release/src/GlobalGradientHarness

      - name: Build and run the LAN session regression
        run: |
          scons -j$(nproc) release=1 server=0 lan-test
          python3 test/run_lan_session_test.py build/linux/client/release/src/LANSessionHarness

      - name: Build and run the aspect-ratio regression
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          scons -j$(nproc) release=1 server=0 aspect-test
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/FullscreenAspectHarness gl
          timeout 60s xvfb-run -a -s '-screen 0 1600x1400x24' ./build/linux/client/release/libgag/src/FullscreenAspectHarness software

      - name: Build and run the tests
        working-directory: test
        run: |
          scons -j$(nproc)
          ./TestsRunner
          for harness in ./*Harness ./*Test; do
            echo "== $harness"
            "$harness"
          done

      - name: Test game speed controls and playback
        run: |
          scons -j$(nproc) release=1 server=0 speed-tests
          GLOB2_BUILD_DIR=build/linux/client/release xvfb-run -a python3 test/run-game-speed-tests.py

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: /ccache
          key: ccache-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}

  windows:
    name: windows (mingw-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_net
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre

      - uses: actions/checkout@v4

      - name: Test build identities
        run: python3 -m unittest discover -s tests/build_system -v

      - name: Build glob2
        run: scons -j$(nproc) release=1 mingw=1

      - name: Test savegame loading and atomic autosaves
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 savegame-safety-test
          python3 test/run-savegame-safety-tests.py build/mingw/client/release/src/SavegameSafetyHarness.exe

      - name: Test team statistics save compatibility
        run: |
          scons -j$(nproc) release=1 mingw=1 server=0 team-stats-save-test
          python3 test/run-savegame-safety-tests.py --check-preferences build/mingw/client/release/src/TeamStatsSaveHarness.exe .
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version88.expected.txt build/mingw/client/release/src/TeamStatsSaveHarness.exe . --legacy test/fixtures/team-stats/version88.game
          python3 test/run-savegame-safety-tests.py --check-preferences --expect-stdout test/fixtures/team-stats/version84.expected.txt build/mingw/client/release/src/TeamStatsSaveHarness.exe . --legacy games/gd-small-2ai.game

      - name: Build the YOG server
        run: scons -j$(nproc) release=1 mingw=1 server=1 --build=build-server

  web-coexistence:
    name: browser and native (${{ matrix.order }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        order: [native-first, web-first, concurrent]
    steps:
      - uses: actions/checkout@v4
      - name: Install native and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y scons libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev libvorbis-dev libogg-dev libspeex-dev libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Install pinned Emscripten
        run: python3 browser/setup.py
      - name: Test build identities
        run: python3 -m unittest discover -s tests/build_system -v
      - name: Verify clean builds and incremental isolation
        run: python3 tests/build_system/coexistence.py --order ${{ matrix.order }}
      - name: Build and test gateway
        run: |
          scons role=gateway release=1 -j2
          python3 -m unittest discover -s tests/gateway -v
      - name: Build headless router
        run: scons role=router release=1 -j2
      - uses: actions/setup-node@v4
        if: matrix.order == 'concurrent'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Build transport integration fixture
        if: matrix.order == 'concurrent'
        run: |
          scons release=1 transport-test -j2
          python3 test/run-network-transport-tests.py
          python3 -m unittest discover -s tests/transport -v
      - name: Test browser lifecycle, renderers and multiplayer
        if: matrix.order == 'concurrent'
        working-directory: browser
        env:
          GLOB2_ALL_AIS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
          npm test
          GLOB2_TEST_RENDERER=webgl2 npx playwright test single-player.spec.js viewport.spec.js rendering.spec.js input.spec.js settings-storage.spec.js shutdown-storage.spec.js campaign-editor-storage.spec.js
          xvfb-run -a npx playwright test --config visibility.config.js
          GLOB2_TEST_RENDERER=webgl2 xvfb-run -a npx playwright test --config visibility.config.js
      - name: Test self-hosting with real TLS and persistent volumes
        if: matrix.order == 'concurrent'
        run: |
          docker compose -f deploy/compose.yaml build lobby
          python3 -m unittest discover -s tests/deployment -v
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.order == 'concurrent'
        with:
          name: browser-failure-traces
          path: |
            build/browser-test-results
            build/browser-test-report
      - uses: actions/upload-artifact@v4
        with:
          name: glob2-web-development-${{ matrix.order }}
          path: |
            build/emscripten/client/release/index.html
            build/emscripten/client/release/index.js
            build/emscripten/client/release/index.wasm
            build/emscripten/client/release/index.data
