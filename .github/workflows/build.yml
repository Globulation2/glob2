name: Candidate exact-run native and browser parity aggregation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve evidence-only comparison helpers
        run: |
          cp .github/scripts/candidate_parity_aggregate.py "$RUNNER_TEMP/candidate_parity_aggregate.py"
          cp .github/scripts/candidate_parity_artifacts.json "$RUNNER_TEMP/candidate_parity_artifacts.json"
          cp .github/scripts/ci_compare_evidence.py "$RUNNER_TEMP/ci_compare_evidence.py"
      - uses: actions/checkout@v4
        with:
          ref: 4c8297c5c17974bbcc9f1fedbfbb43064095e04c
          persist-credentials: false
      - name: Download exact-run producers and compare complete traces
        run: python3 "$RUNNER_TEMP/candidate_parity_aggregate.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-exact-run-native-browser-parity
          path: artifacts/candidate-parity-aggregation/
          if-no-files-found: error
          retention-days: 14
