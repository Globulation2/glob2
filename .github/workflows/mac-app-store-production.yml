name: Prepare, submit or publish tagged Mac App Store version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public game version tag
        required: true
        type: string
      upload_run_id:
        description: Successful owner mirror Mac App Store run that uploaded the build and recorded provenance
        required: true
        type: string
      stage:
        description: Deliberate production action; prepare never submits and submit never publishes
        required: true
        type: choice
        options: [inspect, supersede, prepare, submit, publish]
        default: prepare
      draft_version_id:
        description: Optional editable Apple draft ID to reuse during prepare or supersede
        required: false
        type: string
        default: ''
      replace_draft_build_id:
        description: Expected current build ID in that draft; leave blank to refuse replacement
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: mac-app-store-production
  cancel-in-progress: false

jobs:
  context:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Older tags' store helpers know only iOS; provenance is checked with the
      # reviewed mirror driver while the version encoding comes from the tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-driver
          sparse-checkout: |
            platforms/mobile/ios_store_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify upload run trust and exact source before obtaining store credentials
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          STAGE: ${{ inputs.stage }}
          DRAFT_VERSION_ID: ${{ inputs.draft_version_id }}
          REPLACE_DRAFT_BUILD_ID: ${{ inputs.replace_draft_build_id }}
        run: |
          set -euo pipefail
          [[ "$UPLOAD_RUN_ID" =~ ^[0-9]+$ ]]
          python3 tools/release/release.py check --tag "$TAG"
          mkdir -p artifacts/mac-app-store-production
          gh api "repos/genixpro/glob2-release/actions/runs/$UPLOAD_RUN_ID" > artifacts/mac-app-store-production/run.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          expected=os.environ['REPLACE_DRAFT_BUILD_ID']
          if expected and (os.environ['STAGE'] not in ('prepare','supersede')
                  or not re.fullmatch('[A-Za-z0-9-]{1,128}',os.environ['DRAFT_VERSION_ID'])
                  or not re.fullmatch('[A-Za-z0-9-]{1,128}',expected)):
              raise SystemExit('Replacement requires prepare or supersede and explicit draft/current build IDs')
          run=json.loads(Path('artifacts/mac-app-store-production/run.json').read_text())
          if (run['repository']['id']!=1397722696 or run['actor']['id']!=6193625 or run['triggering_actor']['id']!=6193625
              or run['event']!='workflow_dispatch' or run['head_branch']!='master' or run['conclusion']!='success'
              or run['path'].split('@')[0]!='.github/workflows/mac-app-store.yml'):
              raise SystemExit('Uploaded build did not come from a successful trusted Mac App Store mirror run')
          PY
          gh run download "$UPLOAD_RUN_ID" --repo genixpro/glob2-release --name mac-upload-provenance --dir artifacts/mac-app-store-production
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path[:0]=['release-driver/platforms/mobile','platforms/mobile' if Path('platforms/mobile').is_dir() else 'mobile']
          from ios_store_release import validate_provenance
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          validate_provenance(json.loads(Path('artifacts/mac-app-store-production/mac-upload-provenance.json').read_text()),
                              os.environ['TAG'],commit,os.environ['UPLOAD_RUN_ID'],'MAC_OS')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('commit='+commit,file=output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-mac-app-store-provenance
          path: artifacts/mac-app-store-production/mac-upload-provenance.json
          if-no-files-found: error
          retention-days: 1

  production:
    needs: context
    environment: mac-app-store
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.context.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-driver
          sparse-checkout: |
            platforms/mobile/ios_store_inspect.py
            platforms/mobile/ios_store_supersede.py
            platforms/mobile/ios_store_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-mac-app-store-provenance
          path: artifacts/mac-app-store-production
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare existing pinned API authentication tools
        run: |
          # Tags before the repository reorganisation keep the mobile helpers in mobile/.
          mobile=platforms/mobile; [ -d "$mobile" ] || mobile=mobile
          echo "TAGGED_MOBILE_DIR=$PWD/$mobile" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/mac-app-store-production-tools"
          "$RUNNER_TEMP/mac-app-store-production-tools/bin/pip" install --require-hashes --only-binary=:all: -r "$mobile/play-api-requirements.txt"
      - name: Perform only the explicitly selected owner production action
        env:
          # The driver reads the App Store Connect key under its iOS names; this
          # environment's key belongs to the same app record.
          IOS_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_ASC_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.context.outputs.commit }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          STAGE: ${{ inputs.stage }}
          DRAFT_VERSION_ID: ${{ inputs.draft_version_id }}
          REPLACE_DRAFT_BUILD_ID: ${{ inputs.replace_draft_build_id }}
        run: |
          set -euo pipefail
          test -n "$IOS_ASC_KEY_ID" && test -n "$IOS_ASC_ISSUER_ID" && test -n "$IOS_ASC_KEY_P8_BASE64"
          python="$RUNNER_TEMP/mac-app-store-production-tools/bin/python"
          driver=release-driver/platforms/mobile
          common=(--provenance artifacts/mac-app-store-production/mac-upload-provenance.json
            --tag "$TAG" --source-commit "$SOURCE_COMMIT" --run-id "$UPLOAD_RUN_ID" --platform MAC_OS)
          if [ "$STAGE" = inspect ]; then
            PYTHONPATH="$TAGGED_MOBILE_DIR" "$python" "$driver/ios_store_inspect.py" "${common[@]}"
            exit 0
          fi
          if [ "$STAGE" = supersede ]; then
            PYTHONPATH="$TAGGED_MOBILE_DIR" "$python" "$driver/ios_store_supersede.py" "${common[@]}" \
              --draft-version-id "$DRAFT_VERSION_ID" --replace-draft-build-id "$REPLACE_DRAFT_BUILD_ID"
            exit 0
          fi
          replacement_args=()
          if [ -n "$REPLACE_DRAFT_BUILD_ID" ]; then replacement_args=(--replace-draft-build-id "$REPLACE_DRAFT_BUILD_ID"); fi
          PYTHONPATH="$TAGGED_MOBILE_DIR" "$python" "$driver/ios_store_release.py" "$STAGE" "${common[@]}" \
            --draft-version-id "$DRAFT_VERSION_ID" ${replacement_args[@]+"${replacement_args[@]}"}
