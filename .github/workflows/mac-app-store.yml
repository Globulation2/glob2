name: Mac App Store release

on:
  pull_request:
    paths:
      - '.github/workflows/mac-app-store.yml'
      - 'SConstruct'
      - 'scons/bundle.py'
      - 'scons/addDependentLibsToBundle.py'
      - 'darwin/**'
  workflow_dispatch:
    inputs:
      build_number:
        description: Increasing App Store build number (CFBundleVersion)
        required: true
        type: string
      upload:
        description: Sign and upload from genixpro/glob2-release master only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Manual releases serialize; superseded public PR build checks can be cancelled.
concurrency:
  group: mac-app-store-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build game and test candidate
    if: ${{ (github.repository == 'Globulation2/glob2' && github.event_name == 'pull_request') || (github.repository == 'genixpro/glob2-release' && github.actor == 'genixpro' && github.triggering_actor == 'genixpro' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Confirm owner-controlled mirror release context
        if: ${{ github.repository == 'genixpro/glob2-release' }}
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$RELEASE_REPOSITORY" = genixpro/glob2-release
          test "$RELEASE_REF" = refs/heads/master
          test "$RELEASE_EVENT" = workflow_dispatch
          test "$RELEASE_ACTOR" = genixpro
          test "$RELEASE_TRIGGERING_ACTOR" = genixpro

      - name: Install macOS build dependencies
        run: |
          brew install scons pkgconf sdl2-compat sdl2_image sdl2_net sdl2_ttf \
            libvorbis libogg speex openssl@3 boost fribidi libepoxy
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
          test "$(uname -m)" = arm64

      - name: Compile game; bundle only in release mirror
        run: |
          openssl="$(brew --prefix openssl@3)"
          if [[ "$GITHUB_REPOSITORY" == genixpro/glob2-release ]]; then
            scons release=1 bundle -j2 \
              CXXFLAGS="-I$openssl/include" \
              LINKFLAGS="-L$openssl/lib"
          else
            scons release=1 -j2 \
              CXXFLAGS="-I$openssl/include" \
              LINKFLAGS="-L$openssl/lib"
          fi

      - name: Smoke test public compiled game
        if: ${{ github.repository == 'Globulation2/glob2' }}
        run: |
          game=build/darwin/client/release/src/glob2
          test -x "$game"
          "$game" --list-map-generators > "$RUNNER_TEMP/glob2-generators.txt"
          test -s "$RUNNER_TEMP/glob2-generators.txt"

      - name: Stage sandbox candidate
        if: ${{ github.repository == 'genixpro/glob2-release' }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
        run: |
          python3 darwin/package_app_store.py --build "$BUILD_NUMBER" \
            --bundle-id "${BUNDLE_ID:-org.globulation2.glob2}"

      - name: Smoke test sandboxed candidate
        if: ${{ github.repository == 'genixpro/glob2-release' }}
        env:
          BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
        run: |
          app="$PWD/artifacts/mac-app-store/Glob2.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/glob2" --list-map-generators > artifacts/mac-app-store/generators.txt
          test -s artifacts/mac-app-store/generators.txt
          map="$HOME/Library/Containers/${BUNDLE_ID:-org.globulation2.glob2}/Data/release-smoke.map.gz"
          "$app/Contents/MacOS/glob2" --generate-map maze --seed 7 \
            --width 64 --height 64 --teams 2 --output "$map"
          test -s "$map"

      - name: Archive app for signing job
        if: ${{ github.repository == 'genixpro/glob2-release' }}
        run: ditto -c -k --keepParent artifacts/mac-app-store/Glob2.app artifacts/mac-app-store/source-app.zip

      - uses: actions/upload-artifact@v4
        if: ${{ github.repository == 'genixpro/glob2-release' }}
        with:
          name: mac-app-store-source-app
          path: artifacts/mac-app-store/source-app.zip
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Sign and upload to App Store Connect
    if: ${{ github.repository == 'genixpro/glob2-release' && github.actor == 'genixpro' && github.triggering_actor == 'genixpro' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.upload }}
    needs: build
    runs-on: macos-26
    environment: mac-app-store
    timeout-minutes: 60
    steps:
      - name: Confirm owner-controlled mirror release context
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_UPLOAD: ${{ inputs.upload }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$RELEASE_REPOSITORY" = genixpro/glob2-release
          test "$RELEASE_REF" = refs/heads/master
          test "$RELEASE_EVENT" = workflow_dispatch
          test "$RELEASE_UPLOAD" = true
          test "$RELEASE_ACTOR" = genixpro
          test "$RELEASE_TRIGGERING_ACTOR" = genixpro
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-app-store-source-app
          path: artifacts/mac-app-store

      - name: Restore built app
        run: |
          mkdir -p artifacts/mac-app-store/source
          ditto -x -k artifacts/mac-app-store/source-app.zip artifacts/mac-app-store/source
          test -x artifacts/mac-app-store/source/Glob2.app/Contents/MacOS/glob2

      - name: Import App Store signing material
        env:
          APP_P12_BASE64: ${{ secrets.APPLE_APP_P12_BASE64 }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_APP_P12_PASSWORD }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP'])
          for secret, name in (
              ('APP_P12_BASE64', 'glob2-app.p12'),
              ('INSTALLER_P12_BASE64', 'glob2-installer.p12'),
              ('PROFILE_BASE64', 'glob2.provisionprofile'),
          ):
              value = os.environ.get(secret)
              if not value:
                  raise SystemExit(f'Missing {secret} environment secret')
              (root / name).write_bytes(base64.b64decode(value, validate=True))
          PY
          test -n "$APP_P12_PASSWORD"
          test -n "$INSTALLER_P12_PASSWORD"
          keychain="$RUNNER_TEMP/glob2-app-store.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/glob2-app.p12" -k "$keychain" \
            -P "$APP_P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/glob2-installer.p12" -k "$keychain" \
            -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"
          rm -f "$RUNNER_TEMP/glob2-app.p12" "$RUNNER_TEMP/glob2-installer.p12"

      - name: Sign app and installer package
        id: sign
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          APP_IDENTITY: ${{ vars.APPLE_APP_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGN_IDENTITY }}
        run: |
          test -n "$APP_IDENTITY"
          test -n "$INSTALLER_IDENTITY"
          python3 darwin/package_app_store.py \
            --source artifacts/mac-app-store/source/Glob2.app \
            --output artifacts/mac-app-store/signed/Glob2.app \
            --bundle-id "${BUNDLE_ID:-org.globulation2.glob2}" \
            --build "$BUILD_NUMBER" \
            --identity "$APP_IDENTITY" \
            --installer-identity "$INSTALLER_IDENTITY" \
            --profile "$RUNNER_TEMP/glob2.provisionprofile"

      - name: Prepare App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          value = os.environ.get('API_KEY_BASE64')
          if not value:
              raise SystemExit('Missing APPLE_API_KEY_P8_BASE64 environment secret')
          (Path(os.environ['RUNNER_TEMP']) / 'glob2-auth.p8').write_bytes(
              base64.b64decode(value, validate=True))
          PY

      - name: Validate and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PROVIDER_ID: ${{ vars.APPLE_PROVIDER_PUBLIC_ID }}
        run: |
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          package="$PWD/artifacts/mac-app-store/signed/Glob2.pkg"
          auth=(--api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID"
            --p8-file-path "$RUNNER_TEMP/glob2-auth.p8")
          if [[ -n "$PROVIDER_ID" ]]; then
            auth+=(--provider-public-id "$PROVIDER_ID")
          fi
          xcrun altool --validate-app "$package" "${auth[@]}"
          xcrun altool --upload-package "$package" "${auth[@]}"

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/glob2-app-store.keychain-db" || true
          rm -f "$RUNNER_TEMP/glob2-app.p12" "$RUNNER_TEMP/glob2-installer.p12" \
            "$RUNNER_TEMP/glob2.provisionprofile" "$RUNNER_TEMP/glob2-auth.p8"
