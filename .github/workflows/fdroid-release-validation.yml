name: F-Droid release validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact public Globulation 2 candidate commit SHA
        required: true
        type: string
      tag:
        description: Public vVERSION tag after release approval; leave blank for a candidate build
        required: false
        type: string
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fdroid-release-validation
  cancel-in-progress: false

env:
  GLOB2_DEV_MODE: isolated

jobs:
  preflight:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public candidate and release identity
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          # Release preflight must see tags created by other store pipelines.
          git fetch --tags https://github.com/Globulation2/glob2.git
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git fetch --no-tags https://github.com/Globulation2/glob2.git \
              "refs/tags/$RELEASE_TAG:refs/tags/fdroid-reviewed-public"
            test "$(git rev-parse 'refs/tags/fdroid-reviewed-public^{commit}')" = "$SOURCE_COMMIT"
            git fetch --no-tags https://github.com/Globulation2/glob2.git \
              'refs/heads/master:refs/remotes/public/master'
            git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/public/master
          fi
          git checkout --detach "$SOURCE_COMMIT"
          python3 mobile/android_release.py ${{ inputs.tag && 'check' || 'check-candidate' }}
          python3 mobile/android_release.py check-listing
          version="$(python3 -c 'import sys; sys.path.insert(0,"mobile"); from android_release import release_identity; print(release_identity()["versionName"])')"
          if [[ -n "$RELEASE_TAG" ]]; then test "$RELEASE_TAG" = "v$version"; fi
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test Android release guards
        run: python3 -m unittest discover -s test/build_system -p test_android_release.py -v

  apk:
    needs: preflight
    name: F-Droid candidate APK (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the exact public candidate
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/Globulation2/glob2.git "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
      - name: Install source build utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            scons pkg-config unzip zip autoconf automake libtool ccache \
            python3-venv g++ make cmake ninja-build curl perl nasm
      - name: Install pinned Android tools
        run: |
          python3 mobile/setup_ndk.py
          python3 mobile/setup_tools.py
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          import sys; sys.path.insert(0, str(root/'scons'))
          from dev_store import paths
          dev=paths(root)
          sdk=pathlib.Path(dev['android_sdk'])
          lock = json.loads((root / 'mobile/toolchain.json').read_text())['android']
          tools = json.loads((root / 'mobile/android-tools.json').read_text())
          jdk = tools['jdk-Linux-x86_64']
          java=pathlib.Path(dev['java_home'])
          env = dict(os.environ, JAVA_HOME=str(java), ANDROID_HOME=str(sdk), ANDROID_SDK_ROOT=str(sdk))
          manager = sdk / 'cmdline-tools/19.0/bin/sdkmanager'
          subprocess.run([str(manager), f'--sdk_root={sdk}', '--licenses'],
                         input='y\n' * 100, text=True, env=env, check=True)
          subprocess.run([str(manager), f'--sdk_root={sdk}',
                          f"platforms;android-{lock['compile_api']}",
                          f"build-tools;{lock['build_tools']}", 'platform-tools'],
                         env=env, check=True)
          PY
      - name: Build F-Droid recipe command and verify unsigned APK
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          code="$(python3 mobile/android_release.py code --arch "$ARCH")"
          sdk="$(python3 tools/dev_environment.py paths --field android_sdk)"
          ndk="$(python3 -c 'import json; print(json.load(open("mobile/toolchain.json"))["android"]["ndk"])')"
          mkdir -p artifacts/fdroid
          python3 mobile/fdroid_build.py --version-code "$code" \
            --android-sdk "$sdk" --android-ndk "$sdk/ndk/$ndk" \
            2>&1 | tee "artifacts/fdroid/$ARCH-build.log"
          python3 mobile/android_release.py verify-apk --arch "$ARCH" \
            --apk build/fdroid-output.apk
          cp build/fdroid-output.apk "artifacts/fdroid/glob2-$ARCH-unsigned.apk"
          sha256sum "artifacts/fdroid/glob2-$ARCH-unsigned.apk" \
            > "artifacts/fdroid/glob2-$ARCH-unsigned.sha256"
      - name: Launch x86_64 candidate in an emulator
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          python3 mobile/setup_tools.py --emulator
          python3 mobile/emulator.py configure --arch x86_64
          nohup python3 mobile/emulator.py adb-server > artifacts/fdroid/adb-server.log 2>&1 &
          nohup python3 mobile/emulator.py run --arch x86_64 > artifacts/fdroid/emulator.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if python3 mobile/emulator.py status --arch x86_64 >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          python3 mobile/android.py sign --arch x86_64 --release --fdroid
          python3 mobile/android.py install --arch x86_64 --release --fdroid \
            --serial emulator-5580 --adb-port 15037
          python3 mobile/smoke.py --serial emulator-5580 --avd glob2-api35-x64 \
            --package org.globulation2.glob2
          python3 mobile/emulator.py stop --arch x86_64
      - name: Retain APK, checksums, logs, and symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdroid-${{ matrix.arch }}-${{ needs.preflight.outputs.version }}
          path: |
            artifacts/fdroid/
            build/android/**/app-release-unsigned.symbols.json
            build/mobile-smoke/
          if-no-files-found: ignore
          retention-days: 14
