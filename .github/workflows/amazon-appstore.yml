name: Amazon Appstore Fire tablets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag mirrored into this repository
        required: true
        type: string
      mode:
        description: Build, sign first-submission candidate, or submit an update
        required: true
        default: build
        type: choice
        options: [build, candidate, publish]
      release_notes:
        description: English release notes required for publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: amazon-appstore
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'genixpro/glob2-release' && github.repository_id == 1397722696 && github.actor_id == 6193625 && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed public release tag
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(python3 -c 'import sys; sys.path.insert(0,"scons"); from build_layout import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          test "$TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags https://github.com/Globulation2/glob2.git "refs/tags/$TAG:refs/tags/public-amazon-release"
          test "$(git rev-parse HEAD)" = "$(git rev-parse 'refs/tags/public-amazon-release^{commit}')"
          git fetch --no-tags https://github.com/Globulation2/glob2.git 'refs/heads/master:refs/remotes/public/master'
          git merge-base --is-ancestor HEAD refs/remotes/public/master
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Android build utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            scons pkg-config unzip zip autoconf automake libtool ccache
      - name: Check Android release tooling
        run: python3 -m unittest discover -s tests/build_system -p 'test_amazon_release.py' -v
      - name: Install pinned Android tools
        run: |
          python3 mobile/setup_ndk.py
          python3 mobile/setup_tools.py
      - name: Install pinned Android SDK packages
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          sdk=root/'build/mobile-tools/android-sdk'
          lock=json.loads((root/'mobile/toolchain.json').read_text())['android']
          tools=json.loads((root/'mobile/android-tools.json').read_text())
          jdk=tools['jdk-Linux-x86_64']
          java=root/'build/mobile-tools'/jdk['directory']/jdk['java_home']
          env=dict(os.environ, JAVA_HOME=str(java), ANDROID_HOME=str(sdk), ANDROID_SDK_ROOT=str(sdk))
          manager=sdk/'cmdline-tools/19.0/bin/sdkmanager'
          subprocess.run([str(manager),f'--sdk_root={sdk}','--licenses'],input='y\n'*100,text=True,env=env,check=True)
          subprocess.run([str(manager),f'--sdk_root={sdk}',f"platforms;android-{lock['compile_api']}",
              f"build-tools;{lock['build_tools']}",'platform-tools'],env=env,check=True)
          PY
      - name: Build both ARM dependency sets
        run: |
          python3 mobile/dependencies.py --arch arm64-v8a --release
          python3 mobile/dependencies.py --arch armeabi-v7a --release
      - name: Build and verify unsigned Fire tablet APK
        id: package
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          code="$(python3 mobile/amazon_release.py version-code)"
          python3 mobile/android.py build --arch arm64-v8a --release --amazon-apk --version-code "$code"
          apk=build/android/device/arm64-v8a/26/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p artifacts/amazon-appstore
          cp "$apk" artifacts/amazon-appstore/glob2-fire-unsigned.apk
          cp "${apk%.apk}.json" artifacts/amazon-appstore/glob2-fire-unsigned.json
          python3 mobile/amazon_release.py prepare --apk artifacts/amazon-appstore/glob2-fire-unsigned.apk \
            --tag "$TAG" --source-commit "$COMMIT" --output artifacts/amazon-appstore/provenance.json
          echo "digest=$(sha256sum artifacts/amazon-appstore/glob2-fire-unsigned.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amazon-fire-${{ steps.source.outputs.commit }}
          path: artifacts/amazon-appstore/
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    if: inputs.mode != 'build'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: amazon-appstore
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: amazon-fire-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/amazon-appstore
      - name: Install pinned verification tools
        run: |
          python3 mobile/setup_tools.py
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          sdk=root/'build/mobile-tools/android-sdk'
          lock=json.loads((root/'mobile/toolchain.json').read_text())['android']
          tools=json.loads((root/'mobile/android-tools.json').read_text())
          jdk=tools['jdk-Linux-x86_64']
          java=root/'build/mobile-tools'/jdk['directory']/jdk['java_home']
          env=dict(os.environ,JAVA_HOME=str(java),ANDROID_HOME=str(sdk),ANDROID_SDK_ROOT=str(sdk))
          manager=sdk/'cmdline-tools/19.0/bin/sdkmanager'
          subprocess.run([str(manager),f'--sdk_root={sdk}','--licenses'],input='y\n'*100,text=True,env=env,check=True)
          subprocess.run([str(manager),f'--sdk_root={sdk}',f"platforms;android-{lock['compile_api']}",
              f"build-tools;{lock['build_tools']}"],env=env,check=True)
          PY
      - name: Verify handoff without credentials
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/amazon-appstore"
          python3 mobile/amazon_release.py verify --apk "$dir/glob2-fire-unsigned.apk" --manifest "$dir/provenance.json"
          python3 - <<'PY'
          import json,os,pathlib
          value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'amazon-appstore/provenance.json').read_text())
          assert value['source_commit']==os.environ['EXPECTED_COMMIT']
          assert value['version_name']==os.environ['EXPECTED_VERSION']
          assert value['sha256']==os.environ['EXPECTED_DIGEST']
          PY
      - name: Sign verified Fire tablet APK
        env:
          GLOB2_AMAZON_KEYSTORE_BASE64: ${{ secrets.GLOB2_AMAZON_KEYSTORE_BASE64 }}
          GLOB2_AMAZON_STORE_PASSWORD: ${{ secrets.GLOB2_AMAZON_STORE_PASSWORD }}
          GLOB2_AMAZON_KEY_PASSWORD: ${{ secrets.GLOB2_AMAZON_KEY_PASSWORD }}
          GLOB2_AMAZON_CERT_SHA256: ${{ vars.GLOB2_AMAZON_CERT_SHA256 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/amazon-appstore"
          key="$RUNNER_TEMP/glob2-amazon-upload.p12"
          trap 'rm -f "$key"' EXIT
          python3 - <<'PY'
          import base64,os,pathlib
          encoded=''.join(os.environ['GLOB2_AMAZON_KEYSTORE_BASE64'].split())
          if not encoded: raise ValueError('Amazon upload keystore secret is missing')
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'glob2-amazon-upload.p12'
          key.write_bytes(base64.b64decode(encoded,validate=True))
          key.chmod(0o600)
          PY
          python3 mobile/amazon_release.py sign --apk "$dir/glob2-fire-unsigned.apk" \
            --manifest "$dir/provenance.json" --keystore "$key" --key-alias glob2-amazon \
            --expected-cert-sha256 "$GLOB2_AMAZON_CERT_SHA256" --output "$dir/glob2-fire-amazon.apk"
      - name: Retain signed candidate for first console submission
        if: inputs.mode == 'candidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amazon-fire-signed-${{ needs.build.outputs.commit }}
          path: |
            ${{ runner.temp }}/amazon-appstore/glob2-fire-amazon.apk
            ${{ runner.temp }}/amazon-appstore/glob2-fire-amazon.json
          if-no-files-found: error
          retention-days: 7
      - name: Submit update through Amazon App Submission API
        if: inputs.mode == 'publish'
        env:
          GLOB2_AMAZON_CLIENT_ID: ${{ secrets.GLOB2_AMAZON_CLIENT_ID }}
          GLOB2_AMAZON_CLIENT_SECRET: ${{ secrets.GLOB2_AMAZON_CLIENT_SECRET }}
          GLOB2_AMAZON_APP_ID: ${{ vars.GLOB2_AMAZON_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_NOTES"
          dir="$RUNNER_TEMP/amazon-appstore"
          python3 mobile/amazon_release.py publish --apk "$dir/glob2-fire-amazon.apk" \
            --manifest "$dir/glob2-fire-amazon.json" --release-notes "$RELEASE_NOTES"
