name: Validate clean Linux runtime images
on:
  workflow_dispatch:
permissions:
  contents: read
# Manual dispatches on one ref queue behind each other; a newer pending
# dispatch replaces an older pending one (no in-progress cancellation).
concurrency:
  group: ci-linux-runtime-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}
jobs:
  clean-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            runner: ubuntu-22.04
            compiler: g++-11
            c_compiler: gcc-11
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            compiler: g++-13
            c_compiler: gcc-13
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      image: ${{ matrix.image }}
      runner: ${{ matrix.runner }}
      compiler: ${{ matrix.compiler }}
      c_compiler: ${{ matrix.c_compiler }}
      run_tests: true
      runtime_packages: true
      validate_runtime: true
