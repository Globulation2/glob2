name: Publish deployment images
# Platform stack (deploy/compose.yaml): platform, engine-agent, relay, caddy.
# Legacy YOG stack (deploy/compose.legacy.yaml, until M9): server, proxy.
#
# Nothing gets a usable tag unless the whole set is good:
#   1. verify  builds the platform stack from this commit and smoke-tests it
#              (tests/deployment/platform_stack_smoke.py); nothing is pushed if it fails.
#   2. image   builds every target for amd64 and arm64 and pushes it only as
#              candidate-<commit>, a tag that deployments never reference.
#   3. publish runs only when every candidate exists, and only then adds the
#              release tag, sha-<commit> and (engine-agent) simver-<key>.
# So a failed smoke test or a failed build leaves no release tag at all.
on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test the platform stack built from this commit
        run: python3 tests/deployment/platform_stack_smoke.py --jobs 4 --log-dir artifacts/platform-stack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-stack-smoke
          path: artifacts/platform-stack
          if-no-files-found: ignore

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        target: [server, proxy, platform, engine-agent, relay, caddy]
    steps:
      - uses: actions/checkout@v4
      - name: Read the sim version
        id: sim
        run: echo "key=$(python3 deploy/sim_version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: type=raw,value=candidate-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GLOB2_SIM_VERSION=${{ steps.sim.outputs.key }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        target: [server, proxy, platform, engine-agent, relay, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the verified candidate
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${TARGET}"
          tags=(-t "${image}:sha-${GITHUB_SHA}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(-t "${image}:${GITHUB_REF_NAME}")
          fi
          # Engine-agent images are also tagged with the sim version they serve,
          # so operators can run one agent service per version.
          if [ "$TARGET" = engine-agent ]; then
            tags+=(-t "${image}:simver-$(python3 deploy/sim_version.py)")
          fi
          docker buildx imagetools create "${tags[@]}" "${image}:candidate-${GITHUB_SHA}"
