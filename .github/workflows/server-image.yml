name: Publish deployment images
# Platform stack (deploy/compose.yaml): platform, engine-agent, relay, caddy.
# Legacy YOG stack (deploy/compose.legacy.yaml, until M9): server, proxy.
on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [server, proxy, platform, engine-agent, relay, caddy]
    steps:
      - uses: actions/checkout@v4
      - name: Read the sim version
        id: sim
        run: echo "key=$(python3 deploy/sim_version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          # Engine-agent images are also tagged with the sim version they serve,
          # so operators can run one agent service per version.
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=simver-${{ steps.sim.outputs.key }},enable=${{ matrix.target == 'engine-agent' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GLOB2_SIM_VERSION=${{ steps.sim.outputs.key }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
