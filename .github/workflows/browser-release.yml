name: Publish browser to Google Cloud Storage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-storage-release
  cancel-in-progress: false

env:
  GLOB2_DEV_MODE: isolated

jobs:
  context:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$TRIGGERING_ACTOR" != genixpro || "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/master ]]; then
            echo '::error::Browser publication requires a manual dispatch from the release repository master by its owner.'
            exit 1
          fi

  build:
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public tag checkout
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          match = re.search(r'^PACKAGE_VERSION = "([0-9]+(?:\.[0-9]+)+)"$',
                            Path('scons/build_layout.py').read_text(), re.MULTILINE)
          if match is None or os.environ['TAG'] != 'v' + match.group(1):
              raise SystemExit('Public tag must match the browser package version')
          PYTHON
      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv scons g++-13 cmake libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libvorbis-dev libogg-dev libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Build and package browser client
        run: |
          set -euo pipefail
          python3 browser/setup.py
          scons target=web release=1 -j$(nproc)
          python3 browser/package-static.py
          python3 browser/package-static.py --verify build/browser-static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-release
          path: build/browser-static/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: browser-release
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: gs://glob2-browser-pharaoh-418820-20260909
      PUBLIC_URL: ${{ vars.GLOB2_BROWSER_PUBLIC_URL }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-release
          path: candidate
      - name: Verify candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          python3 - <<'PYTHON'
          import gzip
          from pathlib import Path
          for original in [Path("index.html"), *Path(".").rglob("index-*.*"), *Path(".").glob("loader-*.js")]:
              if original.suffix == ".gz": continue
              assert gzip.decompress(Path(str(original)+".gz").read_bytes()) == original.read_bytes()
          PYTHON
          test -s index.html
          for ext in js wasm; do
            mapfile -t files < <(find . -maxdepth 1 -type f -name "index-*.$ext")
            test "${#files[@]}" -eq 1
            test -s "${files[0]}"
          done
          mapfile -t packages < <(find assets -maxdepth 1 -type f -name '*.data')
          test "${#packages[@]}" -ge 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOB2_BROWSER_WIF_PROVIDER }}
          service_account: ${{ vars.GLOB2_BROWSER_SERVICE_ACCOUNT }}
          project_id: pharaoh-418820
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Upload assets then publish entry point
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            gcloud storage cp "$asset.gz" "$BUCKET/${asset#candidate/}" --content-type=text/javascript --content-encoding=gzip --cache-control='public,max-age=31536000,immutable'
          done < <(find candidate -type f -name '*.js' -print0)
          while IFS= read -r -d '' asset; do
            gcloud storage cp "$asset.gz" "$BUCKET/${asset#candidate/}" --content-type=application/wasm --content-encoding=gzip --cache-control='public,max-age=31536000,immutable'
          done < <(find candidate -type f -name '*.wasm' -print0)
          while IFS= read -r -d '' asset; do
            gcloud storage cp "$asset.gz" "$BUCKET/${asset#candidate/}" --content-type=application/octet-stream --content-encoding=gzip --cache-control='public,max-age=31536000,immutable'
          done < <(find candidate -type f -name '*.data' -print0)
          gcloud storage cp candidate/index.html.gz "$BUCKET/index.html" --content-encoding=gzip --content-type=text/html --cache-control='no-cache,max-age=0,must-revalidate'
      - name: Verify threaded public frontend
        if: env.PUBLIC_URL != ''
        run: |
          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          url = os.environ['PUBLIC_URL']
          if urlsplit(url).scheme != 'https':
              raise RuntimeError('GLOB2_BROWSER_PUBLIC_URL must use HTTPS')
          with urlopen(Request(url, method='HEAD'), timeout=30) as response:
              if urlsplit(response.url).scheme != 'https':
                  raise RuntimeError('Public frontend redirected away from HTTPS')
              for name, value in [('Cross-Origin-Opener-Policy', 'same-origin'),
                                  ('Cross-Origin-Embedder-Policy', 'require-corp')]:
                  if response.headers.get(name) != value:
                      raise RuntimeError('Public frontend requires ' + name + ': ' + value)
          PYTHON
      - name: Summarize publication
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Published browser release $TAG to $BUCKET" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUBLIC_URL" ]; then
            echo "Threaded public frontend: $PUBLIC_URL (HTTPS and isolation headers verified)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Serial fallback: https://storage.googleapis.com/glob2-browser-pharaoh-418820-20260909/index.html' >> "$GITHUB_STEP_SUMMARY"
            echo 'Set GLOB2_BROWSER_PUBLIC_URL to a Caddy or equivalent HTTPS frontend with COOP/COEP headers to publish a threaded public URL.' >> "$GITHUB_STEP_SUMMARY"
          fi
