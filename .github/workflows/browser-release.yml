name: Publish browser to Google Cloud Storage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag
        required: true
        type: string
      publish:
        description: Publish to Google Cloud Storage (off builds the portal uploads only)
        type: boolean
        default: true
      gamejolt:
        description: Push the Game Jolt upload with gjpush (gamejolt-release approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-storage-release
  cancel-in-progress: false

env:
  GLOB2_DEV_MODE: isolated

jobs:
  context:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$TRIGGERING_ACTOR" != genixpro || "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/master ]]; then
            echo '::error::Browser publication requires a manual dispatch from the release repository master by its owner.'
            exit 1
          fi

  # Each browser edition (buildsys/edition.py) is built, packaged and published
  # alike: the standard client at the bucket root, the download-size lite edition
  # under lite/ (docs/browser/editions.md).
  build:
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: standard
            arguments: ''
            source: build/emscripten/client/release
            output: build/browser-static
            artifact: ''
          - edition: lite
            arguments: edition=lite
            source: build/emscripten/client/release/lite
            output: build/browser-static-lite
            artifact: -lite
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public tag checkout
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          match = re.search(r'^PACKAGE_VERSION = "([0-9]+(?:\.[0-9]+)+)"$',
                            Path('buildsys/build_layout.py').read_text(), re.MULTILINE)
          if match is None or os.environ['TAG'] != 'v' + match.group(1):
              raise SystemExit('Public tag must match the browser package version')
          PYTHON
      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv ninja-build nasm libva-dev g++-13 cmake libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libopusfile-dev libopus-dev libogg-dev libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Build and package browser client (${{ matrix.edition }})
        env:
          EDITION_ARGUMENTS: ${{ matrix.arguments }}
          SOURCE: ${{ matrix.source }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          python3 platforms/web/setup.py
          python3 tools/dev_build.py target=web release=1 client_profile=free $EDITION_ARGUMENTS -j$(nproc) web-package
          python3 platforms/web/package-static.py --source "$SOURCE" --output "$OUTPUT"
          python3 platforms/web/package-static.py --verify "$OUTPUT"
      - name: Hand over crash symbols
        if: ${{ (inputs.publish || inputs.gamejolt) && hashFiles('tools/symbols/dump_syms.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-symbols-browser${{ matrix.artifact }}
          path: |
            ${{ matrix.source }}/index.wasm
            ${{ matrix.source }}/index.js.symbols
            ${{ matrix.source }}/threaded/index.wasm
            ${{ matrix.source }}/threaded/index.js.symbols
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-build-browser${{ matrix.artifact }}
          path: ${{ matrix.source }}/identity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-release${{ matrix.artifact }}
          path: ${{ matrix.output }}/
          if-no-files-found: error

  publish:
    needs: [build, crash-symbols]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: browser-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - edition: standard
            artifact: ''
            prefix: ''
          - edition: lite
            artifact: -lite
            prefix: /lite
    env:
      BUCKET: gs://glob2-browser${{ matrix.prefix }}
      PUBLIC_URL: ${{ vars.GLOB2_BROWSER_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-release${{ matrix.artifact }}
          path: candidate
      - name: Verify candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          python3 - <<'PYTHON'
          import gzip
          from pathlib import Path
          for original in [Path("index.html"), *Path(".").rglob("index-*.*"), *Path(".").glob("loader-*.js")]:
              if original.suffix == ".gz": continue
              assert gzip.decompress(Path(str(original)+".gz").read_bytes()) == original.read_bytes()
          PYTHON
          test -s index.html
          for ext in js wasm; do
            mapfile -t files < <(find . -maxdepth 1 -type f -name "index-*.$ext")
            test "${#files[@]}" -eq 1
            test -s "${files[0]}"
          done
          mapfile -t packages < <(find assets -maxdepth 1 -type f -name '*.data')
          test "${#packages[@]}" -ge 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOB2_BROWSER_WIF_PROVIDER }}
          service_account: ${{ vars.GLOB2_BROWSER_SERVICE_ACCOUNT }}
          project_id: bradley-personal-20261027
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Upload assets then publish entry point
        run: python3 platforms/web/publish-static.py candidate "$BUCKET"
      - name: Verify threaded public frontend
        if: env.PUBLIC_URL != '' && matrix.edition == 'standard'
        run: |
          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          url = os.environ['PUBLIC_URL']
          if urlsplit(url).scheme != 'https':
              raise RuntimeError('GLOB2_BROWSER_PUBLIC_URL must use HTTPS')
          with urlopen(Request(url, method='HEAD'), timeout=30) as response:
              if urlsplit(response.url).scheme != 'https':
                  raise RuntimeError('Public frontend redirected away from HTTPS')
              for name, value in [('Cross-Origin-Opener-Policy', 'same-origin'),
                                  ('Cross-Origin-Embedder-Policy', 'require-corp')]:
                  if response.headers.get(name) != value:
                      raise RuntimeError('Public frontend requires ' + name + ': ' + value)
          PYTHON
      - name: Summarize publication
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Published browser release $TAG (${{ matrix.edition }} edition) to $BUCKET" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUBLIC_URL" ]; then
            echo "Threaded public frontend: $PUBLIC_URL (HTTPS and isolation headers verified)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Serial fallback: https://storage.googleapis.com/glob2-browser${{ matrix.prefix }}/index.html" >> "$GITHUB_STEP_SUMMARY"
            echo 'Set GLOB2_BROWSER_PUBLIC_URL to a Caddy or equivalent HTTPS frontend with COOP/COEP headers to publish a threaded public URL.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # Web portals host their own copy of the browser game, so every browser release
  # also produces each portal's upload from the same verified package (no rebuild).
  # Each leg packages one edition: the standard browser-release artifact, or the
  # download-size lite edition (browser-release-lite) for the portals that need a
  # small download (CrazyGames, Poki) or limit the unpacked size (Yandex Games:
  # 100 MB, which only lite meets). Game Jolt uploads with gjpush (the gamejolt
  # job); for the others, download the <portal>-upload or <portal>-lite-upload
  # artifact and submit it on the portal's dashboard (docs/releases/<portal>.md).
  portals:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {portal: gamepix, edition: ''}
          - {portal: newgrounds, edition: ''}
          - {portal: gamejolt, edition: ''}
          - {portal: gamedistribution, edition: ''}
          - {portal: crazygames, edition: -lite}
          - {portal: poki, edition: -lite}
          - {portal: yandex, edition: -lite}
    steps:
      # The packager comes from this workflow's revision: release tags can predate it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve the design system revision the online app pins
        id: design
        run: |
          set -euo pipefail
          sha=$(jq -er '.dependencies["@glob2/design-system"] | capture("#(?<sha>[0-9a-f]{40})$").sha' services/online/package.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: design-system
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-release${{ matrix.edition }}
          path: candidate
      - name: Package and verify the portal upload
        env:
          TAG: ${{ inputs.tag }}
          PORTAL: ${{ matrix.portal }}
          EDITION: ${{ matrix.edition }}
          # Empty until the game is registered; the packager then uses a placeholder ID.
          GLOB2_GAMEDISTRIBUTION_GAME_ID: ${{ vars.GLOB2_GAMEDISTRIBUTION_GAME_ID }}
        run: |
          set -euo pipefail
          zip="upload/glob2-${TAG#v}-$PORTAL$EDITION.zip"
          python3 platforms/web/package-portal.py candidate --portal "$PORTAL" \
            --design-system design-system --output "$zip"
          {
            python3 platforms/web/package-portal.py --portal "$PORTAL" --verify "$zip" --summary | tail -n 1
            echo "Submit it on the portal's dashboard; see docs/releases/$PORTAL.md."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.portal }}${{ matrix.edition }}-upload
          path: upload/
          if-no-files-found: error
          compression-level: 0

  # Game Jolt is the one portal with an upload tool: gjpush pushes the verified
  # gamejolt-upload artifact as a browser build. The gamejolt-release environment
  # holds GJPUSH_TOKEN and needs the owner's approval (docs/releases/gamejolt.md).
  gamejolt:
    needs: [portals, crash-symbols]
    if: inputs.gamejolt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gamejolt-release
    permissions:
      contents: read
    env:
      GAMEJOLT_GAME_ID: '1122762'
      GAMEJOLT_PACKAGE_ID: '1154961'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gamejolt-upload
          path: upload
      - name: Verify the Game Jolt upload
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 platforms/web/package-portal.py --portal gamejolt --verify "upload/glob2-${TAG#v}-gamejolt.zip"
      - name: Install pinned gjpush
        env:
          GJPUSH_DIR: ${{ runner.temp }}/gjpush
        run: |
          set -euo pipefail
          mkdir -p "$GJPUSH_DIR"
          cd "$GJPUSH_DIR"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gamejolt/cli/releases/download/v0.5.0/linux.zip --output gjpush.zip
          echo '5e685aa7747ceffccdcba0d45401d155b04e452835ede228c7be6561aa0b9883  gjpush.zip' | sha256sum -c
          unzip -q gjpush.zip
          chmod +x gjpush
          echo "$GJPUSH_DIR" >> "$GITHUB_PATH"
      - name: Push the browser build to Game Jolt
        env:
          GJPUSH_TOKEN: ${{ secrets.GJPUSH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$GJPUSH_TOKEN" ]]; then
            echo '::error::Set GJPUSH_TOKEN in the gamejolt-release environment.'
            exit 1
          fi
          # Game Jolt releases are semver; fold the fourth part of MAJOR.MINOR.PATCH.BUILD
          # into the patch (0.11.8.1 -> 0.11.801) so releases still sort in tag order.
          IFS=. read -r major minor patch build <<< "${TAG#v}"
          version="$major.$minor.$((patch * 100 + ${build:-0}))"
          gjpush --game "$GAMEJOLT_GAME_ID" --package "$GAMEJOLT_PACKAGE_ID" \
            --release "$version" --browser "upload/glob2-${TAG#v}-gamejolt.zip"
          echo "Pushed \`glob2-${TAG#v}-gamejolt.zip\` to Game Jolt as release $version." >> "$GITHUB_STEP_SUMMARY"

  # Uploads this release's crash symbols before anything is published
  # (docs/multiplayer/crash-reports.md#symbols).
  crash-symbols:
    needs: build
    if: ${{ inputs.publish || inputs.gamejolt }}
    uses: ./.github/workflows/crash-symbols.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag }}
      artifacts: crash-symbols-browser*
