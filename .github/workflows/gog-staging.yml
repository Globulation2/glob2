name: GOG release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved public vVERSION tag mirrored into this repository
        required: true
        type: string
      mode:
        description: Build depots only, or upload the validated depots to GOG Staging
        required: true
        default: build
        type: choice
        options: [build, stage]

      platforms:
        description: Build-only platform selection; staging requires all
        required: true
        default: all
        type: choice
        options: [all, windows, linux, macos, windows-linux]

permissions:
  contents: read

concurrency:
  group: gog-release
  cancel-in-progress: false

env:
  GLOB2_DEV_MODE: isolated
  GLOB2_SDL3_PREFIX: build/sdl3-ci/prefix

jobs:
  preflight:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      source_commit: ${{ steps.check.outputs.source_commit }}
      workflow_commit: ${{ steps.check.outputs.workflow_commit }}
      cli_version: ${{ steps.check.outputs.cli_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check GOG depot and upload guards
        run: python3 -m unittest discover -s test -p test_gog_release.py -v
      - name: Verify the public tag and mirrored game source
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          BUILD_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "$BUILD_PLATFORMS" in all|windows|linux|macos|windows-linux) ;; *) exit 1 ;; esac
          if [[ "$RELEASE_MODE" == stage && "$BUILD_PLATFORMS" != all ]]; then
            echo "GOG staging requires all platform depots" >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git \
            "refs/tags/$RELEASE_TAG:refs/gog-upstream/$RELEASE_TAG"
          source="$RUNNER_TEMP/gog-source"
          git worktree add --detach "$source" "refs/gog-upstream/$RELEASE_TAG^{commit}"
          if test -f "$source/src/app/cli/CommandLine.h"; then
            grep -Eq 'Version = 2;' "$source/src/app/cli/CommandLine.h"
            echo 'cli_version=2' >> "$GITHUB_OUTPUT"
          else
            echo 'cli_version=1' >> "$GITHUB_OUTPUT"
          fi
          python3 tools/gog_release.py preflight --source-root "$source" --tag "$RELEASE_TAG" \
            --upstream-ref "refs/gog-upstream/$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"

  windows:
    if: inputs.platforms == 'all' || inputs.platforms == 'windows' || inputs.platforms == 'windows-linux'
    needs: preflight
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned asset encoder
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: Pillow==12.2.0
          $encoder = (Get-Command python).Source
          "GLOB2_ASSET_ENCODER_PYTHON=$encoder" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-nasm mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-opusfile mingw-w64-x86_64-opus mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy mingw-w64-x86_64-libsystre
      - name: Use unchanged line endings for source checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Verify build source identity
        shell: bash
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build and stage Windows depot
        working-directory: source
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.preflight.outputs.workflow_commit }}
          CLI_VERSION: ${{ needs.preflight.outputs.cli_version }}
        run: |
          set -euo pipefail
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          scons -j2 release=1 mingw=1 server=0 lean_images=1 build/mingw/client/release/lean-images/src/glob2.exe
          python ../driver/tools/gog_release.py stage-windows --source-root "$PWD" \
            --exe build/mingw/client/release/lean-images/src/glob2.exe \
            --runtime /mingw64/bin --sdl-runtime build/sdl3-ci/prefix/bin --output artifacts/gog/windows \
            --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --workflow-commit "$WORKFLOW_COMMIT"
          tar -C artifacts/gog/windows -czf artifacts/gog/windows.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gog-windows
          path: source/artifacts/gog/windows.tar.gz
          if-no-files-found: error

  windows-smoke:
    needs: [preflight, windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false
          path: fixture
          sparse-checkout: games/cross-replay.game.gz
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gog-windows
          path: ${{ runner.temp }}/gog
      - name: Launch packaged game without build tools
        env:
          CLI_VERSION: ${{ needs.preflight.outputs.cli_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depot = Join-Path $env:RUNNER_TEMP 'gog\windows'
          New-Item -ItemType Directory -Force $depot | Out-Null
          tar -xzf (Join-Path $env:RUNNER_TEMP 'gog\windows.tar.gz') -C $depot
          $env:GLOB2_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'gog-profile'
          $env:GLOB2_ASSET_DIR = $depot
          Set-Location $depot
          $save = "$env:GITHUB_WORKSPACE\fixture\games\cross-replay.game.gz"
          switch ($env:CLI_VERSION) {
            '1' { $repeatArgs = @('--nox', $save, '10', '1') }
            '2' { $repeatArgs = @('game', 'repeat', $save, '--ticks', '10', '--runs', '1') }
            default { throw 'Unsupported source CLI version' }
          }
          & .\glob2.exe @repeatArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    if: inputs.platforms == 'all' || inputs.platforms == 'linux' || inputs.platforms == 'windows-linux'
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Verify build source identity
        shell: bash
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ python3 python3-venv scons pkg-config nasm libva-dev cmake ninja-build \
            libpng-dev libjpeg-dev libwebp-dev libfreetype-dev libx11-dev libxext-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev \
            libpulse-dev libwayland-dev libxkbcommon-dev libopusfile-dev libopus-dev libogg-dev \
            libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev \
            libpcre3-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Build and stage Linux depot
        working-directory: source
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.preflight.outputs.workflow_commit }}
          CLI_VERSION: ${{ needs.preflight.outputs.cli_version }}
        run: |
          set -euo pipefail
          case "$CLI_VERSION" in
            1) repeat_args=(--nox "$PWD/games/cross-replay.game.gz" 10 1) ;;
            2) repeat_args=(game repeat "$PWD/games/cross-replay.game.gz" --ticks 10 --runs 1) ;;
            *) exit 1 ;;
          esac
          stage="$PWD/artifacts/gog/install"
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          scons -j2 release=1 server=0 lean_images=1 BINDIR="$stage/usr/bin" \
            INSTALLDIR="$stage/usr/share" DATADIR=/usr/share install
          python3 ../driver/tools/gog_release.py stage-linux --source-root "$PWD" --stage "$stage" \
            --output artifacts/gog/linux --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --workflow-commit "$WORKFLOW_COMMIT"
          GLOB2_USER_DATA_DIR="$PWD/artifacts/gog-profile" \
            artifacts/gog/linux/start.sh "${repeat_args[@]}"
          tar -C artifacts/gog/linux -czf artifacts/gog/linux.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gog-linux
          path: source/artifacts/gog/linux.tar.gz
          if-no-files-found: error

  macos:
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Verify build source identity
        shell: bash
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install build tools
        run: |
          brew install nasm cmake freetype libpng jpeg-turbo scons \
            opusfile opus libogg speex boost openssl@3 fribidi pcre libepoxy
      - name: Build and stage macOS depot
        working-directory: source
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.preflight.outputs.workflow_commit }}
          CLI_VERSION: ${{ needs.preflight.outputs.cli_version }}
        run: |
          set -euo pipefail
          case "$CLI_VERSION" in
            1) repeat_args=(--nox "$PWD/games/cross-replay.game.gz" 10 1) ;;
            2) repeat_args=(game repeat "$PWD/games/cross-replay.game.gz" --ticks 10 --runs 1) ;;
            *) exit 1 ;;
          esac
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          scons -j2 release=1 server=0 package
          python3 ../driver/tools/gog_release.py stage-macos --source-root "$PWD" \
            --app build/darwin/client/release/Glob2.app \
            --output artifacts/gog/macos --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --workflow-commit "$WORKFLOW_COMMIT"
          codesign --verify --deep --strict artifacts/gog/macos/Glob2.app
          (
            cd artifacts/gog/macos/Glob2.app
            GLOB2_USER_DATA_DIR="$RUNNER_TEMP/gog-profile" \
              ./Contents/MacOS/glob2 "${repeat_args[@]}"
          )
          tar -C artifacts/gog/macos -czf artifacts/gog/macos.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gog-macos
          path: source/artifacts/gog/macos.tar.gz
          if-no-files-found: error

  upload-staging:
    if: >-
      inputs.mode == 'stage' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    needs: [preflight, windows-smoke, linux, macos]
    runs-on: ubuntu-24.04
    environment: gog-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gog-*
          path: artifacts/gog/archives
          merge-multiple: true
      - name: Extract and verify exact build outputs
        run: |
          set -euo pipefail
          for platform in windows linux macos; do
            python3 tools/gog_release.py extract \
              --archive "artifacts/gog/archives/$platform.tar.gz" \
              --platform "$platform" --depot "artifacts/gog/$platform"
          done
      - name: Obtain verified GOG Pipeline Builder
        env:
          BUILDER_URL: ${{ secrets.GOG_BUILDER_URL }}
        run: |
          set -euo pipefail
          BUILDER_SHA256="$(jq -r '.builderSha256' gog/release-config.json)"
          test -n "$BUILDER_URL"
          [[ "$BUILDER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --silent --show-error --proto '=https' \
            "$BUILDER_URL" --output "$RUNNER_TEMP/GOGGalaxyPipelineBuilder"
          echo "$BUILDER_SHA256  $RUNNER_TEMP/GOGGalaxyPipelineBuilder" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/GOGGalaxyPipelineBuilder"
      - name: Validate and upload all three Staging builds
        env:
          GOG_USERNAME: ${{ secrets.GOG_USERNAME }}
          GOG_PASSWORD: ${{ secrets.GOG_PASSWORD }}
          GOG_STAGING_PASSWORD: ${{ secrets.GOG_STAGING_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          PRODUCT_ID="$(jq -r '.productId' gog/release-config.json)"
          BASE_PRODUCT_ID="$(jq -r '.baseProductId' gog/release-config.json)"
          build_version="${VERSION}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          for platform in windows linux macos; do
            python3 tools/gog_pipeline.py --platform "$platform" \
              --depot "artifacts/gog/$platform" \
              --project "$RUNNER_TEMP/gog-projects/$platform.json" \
              --build-version "$build_version" --product-id "$PRODUCT_ID" \
              --base-product-id "$BASE_PRODUCT_ID" \
              --builder "$RUNNER_TEMP/GOGGalaxyPipelineBuilder" --offline
          done
          for platform in windows linux macos; do
            python3 tools/gog_pipeline.py --platform "$platform" \
              --depot "artifacts/gog/$platform" \
              --project "$RUNNER_TEMP/gog-projects/$platform.json" \
              --build-version "$build_version" --product-id "$PRODUCT_ID" \
              --base-product-id "$BASE_PRODUCT_ID" \
              --builder "$RUNNER_TEMP/GOGGalaxyPipelineBuilder" --upload-staging
          done
          echo "Uploaded $build_version to GOG Staging. Install and test each platform, then promote the exact build IDs in the Developer Portal." >> "$GITHUB_STEP_SUMMARY"
