name: Temporary Bengali iOS Simulator validation
'on':
  push:
    branches:
    - codex/bengali-ios-validation-31efbe8
permissions:
  contents: read
concurrency:
  group: bengali-ios-validation-31efbe8
  cancel-in-progress: false
env:
  GLOB2_DEV_MODE: isolated
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 31efbe8cd73319cfe2ad4e61acc439b944b55261
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.14.8
    - name: Install pinned build drivers
      run: |
        python3 -m venv "$RUNNER_TEMP/ios-build-tools"
        "$RUNNER_TEMP/ios-build-tools/bin/pip" install scons==4.11.1 cmake==4.4.3
        echo "$RUNNER_TEMP/ios-build-tools/bin" >> "$GITHUB_PATH"
    - name: Build and exercise Bengali iOS Simulator app
      run: |
        python3 - <<'IOSVALIDATION'
        import subprocess, os, json, hashlib, gzip, time, threading
        from pathlib import Path
        root=Path.cwd(); proof=root/'build/ios-bengali-proof'; proof.mkdir(parents=True,exist_ok=True)
        records=[]; selected=None; device_set=root/'build/mobile-tools/ios-simulators'
        def run(label,args,timeout=300):
            print('RUN',label,repr(args),flush=True)
            started=time.monotonic(); log=proof/(label+'.log.gz'); count=0; lines=[]; overflow=False
            proc=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            timer=threading.Timer(timeout,proc.kill); timer.start()
            try:
                with gzip.open(log,'wb') as dest:
                    for block in iter(lambda:proc.stdout.read(65536),b''):
                        count+=len(block)
                        if count>32*1024*1024:
                            overflow=True; proc.kill(); break
                        dest.write(block)
                        if count<4*1024*1024: lines.append(block)
                code=proc.wait()
            finally: timer.cancel()
            record={'label':label,'argv':args,'exit':code,'seconds':round(time.monotonic()-started,3),'uncompressed_log_bytes':count,'log_limit_exceeded':overflow}
            records.append(record); (proof/'commands.json').write_text(json.dumps(records,indent=2))
            if code or overflow:
                print(gzip.open(log,'rt',errors='replace').read()[-16000:],flush=True)
                raise RuntimeError(str(record))
            return b''.join(lines).decode(errors='replace')
        def sim(label,*args,timeout=300):return run(label,['xcrun','simctl','--set',str(device_set),*args],timeout)
        summary={'passed':False,'source':'31efbe8cd73319cfe2ad4e61acc439b944b55261','workflow_commit':os.environ['GITHUB_SHA'],'scope':'actual iOS arm64 Simulator release build; seeded Bengali profile; startup/background/resume/relaunch; no physical-device, first-visit-onboarding, keyboard, comprehensive gameplay or determinism claim'}
        try:
            actual=run('source',['git','rev-parse','HEAD']).strip(); assert actual==summary['source']
            assert run('architecture',['uname','-m']).strip()=='arm64'
            candidates=[]
            for candidate in sorted(Path('/Applications').glob('Xcode*.app/Contents/Developer')):
                version=subprocess.run(['/usr/bin/env','DEVELOPER_DIR='+str(candidate),'xcodebuild','-version'],capture_output=True,text=True,timeout=60)
                candidates.append({'path':str(candidate),'exit':version.returncode,'version':version.stdout,'stderr':version.stderr})
            (proof/'xcode-candidates.json').write_text(json.dumps(candidates,indent=2))
            exact=[c for c in candidates if c['exit']==0 and c['version'].splitlines()[0]=='Xcode 27.0']
            assert exact,'Pinned Xcode27.0 unavailable; installed candidates retained'
            os.environ['DEVELOPER_DIR']=exact[0]['path'];summary['developer_dir']=exact[0]['path']
            run('xcode',['xcodebuild','-version']);run('sdks',['xcodebuild','-showsdks'])
            doctor=run('doctor',['python3','mobile/doctor.py','ios','environment=simulator','release=1']);(proof/'toolchain.json').write_text(doctor)
            run('dependencies',['python3','mobile/dependencies.py','--target','ios','--environment','simulator','--release','--jobs','2'],3600)
            run('build',['python3','mobile/ios.py','build','--environment','simulator','--release','--jobs','2'],7200)
            app=root/'build/ios/simulator/arm64/15.0/client/release/xcode-project/build/Release-iphonesimulator/Glob2.app'
            assert app.is_dir()
            run('codesign',['codesign','--verify','--deep','--strict',str(app)])
            run('codesign-detail',['codesign','-dvv',str(app)])
            run('executable-identity',['file',str(app/'Glob2')])
            inventory=[]
            for path in sorted(app.rglob('*')):
                if path.is_file():inventory.append({'path':str(path.relative_to(app)),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
            (proof/'app-inventory.json').write_text(json.dumps(inventory,indent=2))
            important=['data/texts.bn.txt','data/texts.list.txt','data/fonts/sans.ttf','data/fonts/scripts/NotoSansBengali-Regular.ttf','data/fonts/scripts/manifest.json','data/fonts/LICENSE-Noto.txt']
            identities=[]
            for name in important:
                source=root/name; bundled=app/name
                assert source.is_file() and bundled.is_file(),name
                a=hashlib.sha256(source.read_bytes()).hexdigest();b=hashlib.sha256(bundled.read_bytes()).hexdigest();assert a==b,name
                identities.append({'path':name,'source_sha256':a,'app_sha256':b})
            assert next(x['app_sha256'] for x in identities if x['path']=='data/texts.bn.txt')=='142a264452a5e33f05ac58b921b232704f82d3d5473ea467053c15a4a4d06604'
            (proof/'critical-bundle-identities.json').write_text(json.dumps(identities,indent=2))
            manifests=[]
            for path in (root/'build').rglob('manifest.json'):
                if path.stat().st_size<4*1024*1024:
                    try:
                        content=json.loads(path.read_text())
                        if isinstance(content,dict) and 'toolchain' in content and 'archives' in content:manifests.append({'path':str(path.relative_to(root)),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'manifest':content})
                    except (ValueError,OSError): pass
            assert manifests,'No dependency manifest retained'
            (proof/'dependency-manifests.json').write_text(json.dumps(manifests,indent=2))
            runtimes=json.loads(sim('runtimes','list','runtimes','--json'))['runtimes']
            types=json.loads(sim('device-types','list','devicetypes','--json'))['devicetypes']
            available=[x for x in runtimes if x.get('isAvailable') and '.iOS-' in x['identifier']]
            assert available,'No installed available iOS Simulator runtime'
            runtime=sorted(available,key=lambda x:tuple(int(t) for t in x['version'].split('.')))[-1]
            phones=[x for x in types if x['name'].startswith('iPhone')]
            assert phones
            device_type=phones[-1]
            device_set.mkdir(parents=True,exist_ok=True)
            selected=sim('create','create','Glob2-Mobile',device_type['identifier'],runtime['identifier']).strip()
            summary['simulator']={'uuid':selected,'runtime':runtime,'device_type':device_type}
            sim('boot','boot',selected);sim('boot-wait','bootstatus',selected,'-b',timeout=600)
            run('install',['python3','mobile/ios.py','install','--environment','simulator','--release','--device',selected],300)
            container=Path(sim('app-data','get_app_container',selected,'org.globulation2.glob2','data').strip())
            profile=container/'.glob2';profile.mkdir(parents=True,exist_ok=True)
            prefs='version=2\nlanguage=bn\naudioPreferenceChosen=1\nthumbSideChosen=1\nintroductionOffered=1\nmute=1\n'
            (profile/'preferences.txt').write_text(prefs);(proof/'seeded-preferences.txt').write_text(prefs)
            run('lifecycle',['python3','mobile/ios_smoke.py','--device',selected,'--output','build/ios-bengali-proof/lifecycle'],900)
            saved=profile/'preferences.txt'
            if saved.exists(): (proof/'persisted-preferences.txt').write_bytes(saved.read_bytes())
            lifecycle=json.loads((proof/'lifecycle/result.json').read_text());assert lifecycle['passed']
            summary['passed']=True
        except Exception as error:
            summary['error']=str(error);raise
        finally:
            if selected:
                try: sim('shutdown','shutdown',selected,timeout=120)
                except Exception as error:summary['cleanup_error']=str(error)
            (proof/'result.json').write_text(json.dumps(summary,indent=2))

        IOSVALIDATION
    - name: Retain bounded proof and actual screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bengali-ios-simulator-31efbe8
        path: build/ios-bengali-proof/
        if-no-files-found: error
        retention-days: 14
