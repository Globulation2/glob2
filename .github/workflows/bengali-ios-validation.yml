name: Temporary Bengali iOS runtime recovery
'on':
  push:
    branches:
    - codex/bengali-ios-validation-31efbe8
permissions:
  contents: read
  actions: read
concurrency:
  group: bengali-ios-validation-31efbe8
  cancel-in-progress: false
env:
  GLOB2_DEV_MODE: isolated
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 942d138b609ad8e0c425d974042b6e3983a717a4
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.14.8
    - name: Download immutable release app checkpoint
      uses: actions/download-artifact@v4
      with:
        name: bengali-ios-simulator-final-v3-942d138
        path: build/ios-recovery-input
        github-token: ${{ github.token }}
        repository: Globulation2/glob2
        run-id: 41266250711
    - name: Verify and run retained Bengali iOS app without rebuilding
      run: |
        python3 - <<'IOSRECOVERY'
        import subprocess, os, json, hashlib, gzip, time, threading, tarfile, sys
        from pathlib import Path
        root=Path.cwd(); proof=root/'build/ios-bengali-recovery'; proof.mkdir(parents=True,exist_ok=True)
        records=[]; selected=None; device_set=root/'build/mobile-tools/ios-simulators'
        def run(label,args,timeout=300):
            print('RUN',label,repr(args),flush=True)
            started=time.monotonic(); log=proof/(label+'.log.gz'); count=0; lines=[]; overflow=False
            proc=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            timer=threading.Timer(timeout,proc.kill); timer.start()
            try:
                with gzip.open(log,'wb') as dest:
                    for block in iter(lambda:proc.stdout.read(65536),b''):
                        count+=len(block)
                        if count>32*1024*1024:
                            overflow=True; proc.kill(); break
                        dest.write(block)
                        if count<4*1024*1024: lines.append(block)
                code=proc.wait()
            finally: timer.cancel()
            record={'label':label,'argv':args,'exit':code,'seconds':round(time.monotonic()-started,3),'uncompressed_log_bytes':count,'log_limit_exceeded':overflow}
            records.append(record); (proof/'commands.json').write_text(json.dumps(records,indent=2))
            if code or overflow:
                print(gzip.open(log,'rt',errors='replace').read()[-16000:],flush=True)
                raise RuntimeError(str(record))
            return b''.join(lines).decode(errors='replace')
        def sim(label,*args,timeout=300):return run(label,['xcrun','simctl','--set',str(device_set),*args],timeout)
        summary={'passed':False,'source':'942d138b609ad8e0c425d974042b6e3983a717a4','workflow_commit':os.environ['GITHUB_SHA'],'scope':'Runtime-only recovery of retained exact942 release app; no app/dependency rebuild; seeded Bengali SDL preference profile; startup/background/resume/relaunch; no physical-device, first-visit-onboarding, keyboard, comprehensive gameplay or determinism claim'}
        try:
            actual=run('source',['git','rev-parse','HEAD']).strip(); assert actual==summary['source']
            source_catalogs={}
            for name,expected in [('data/texts.bn.txt','3b9a6d23a436c12c0d95ee64d3bf74536187c46f7d110268e58325e85e618054'),('platform/packages/i18n/locales/bn.json','5776ba1f7d336c335c408096eb680ab9e551677a100b2f38a991c3ccb7ef1f29')]:
                content=(root/name).read_bytes(); digest=hashlib.sha256(content).hexdigest();assert digest==expected,name
                source_catalogs[name]={'sha256':digest,'keys':len(content.decode().splitlines())//2 if name.endswith('.txt') else len(json.loads(content))}
            assert [v['keys'] for v in source_catalogs.values()]==[3395,2842]
            (proof/'source-catalogs.json').write_text(json.dumps(source_catalogs,indent=2))
            assert run('architecture',['uname','-m']).strip()=='arm64'
            candidates=[]
            for candidate in sorted(Path('/Applications').glob('Xcode*.app/Contents/Developer')):
                version=subprocess.run(['/usr/bin/env','DEVELOPER_DIR='+str(candidate),'xcodebuild','-version'],capture_output=True,text=True,timeout=60)
                candidates.append({'path':str(candidate),'exit':version.returncode,'version':version.stdout,'stderr':version.stderr})
            (proof/'xcode-candidates.json').write_text(json.dumps(candidates,indent=2))
            exact=[c for c in candidates if c['exit']==0 and c['version'].splitlines()[0]=='Xcode 27.0']
            assert exact,'Pinned Xcode27.0 unavailable; installed candidates retained'
            os.environ['DEVELOPER_DIR']=exact[0]['path'];summary['developer_dir']=exact[0]['path']
            run('xcode',['xcodebuild','-version']);run('sdks',['xcodebuild','-showsdks'])
            doctor=run('doctor',['python3','mobile/doctor.py','ios','environment=simulator','release=1']);(proof/'toolchain.json').write_text(doctor)
            device_set.mkdir(parents=True,exist_ok=True)
            runtimes=json.loads(sim('runtimes','list','runtimes','--json'))['runtimes']
            types=json.loads(sim('device-types','list','devicetypes','--json'))['devicetypes']
            available=[x for x in runtimes if x.get('isAvailable') and '.iOS-' in x['identifier']]
            assert available,'No installed available iOS Simulator runtime'
            sdk_version=json.loads(doctor)['toolchain']['sdk']
            available=[x for x in available if 'arm64' in x.get('supportedArchitectures',[]) and any(t['name'].startswith('iPhone') for t in x.get('supportedDeviceTypes',[]))]
            assert available,'No arm64 iOS runtime with explicitly supported iPhone types'
            runtime=sorted(available,key=lambda x:(x['version']==sdk_version,tuple(int(t) for t in x['version'].split('.'))))[-1]
            assert runtime['version']=='27.0' and runtime['buildversion']=='24A434','Recovery requires exact original iOS27.0 runtime build'
            phones=[x for x in runtime['supportedDeviceTypes'] if x['name'].startswith('iPhone')]
            assert phones
            device_type=next(x for x in types if x['identifier']==phones[0]['identifier'])
            device_set.mkdir(parents=True,exist_ok=True)
            selected=sim('create','create','Glob2-Mobile',device_type['identifier'],runtime['identifier']).strip()
            summary['simulator']={'uuid':selected,'runtime':runtime,'device_type':device_type}
            sim('boot','boot',selected);sim('boot-wait','bootstatus',selected,'-b',timeout=600)
            checkpoint_root=root/'build/ios-recovery-input'
            checkpoint=json.loads((checkpoint_root/'build-checkpoint.json').read_text())
            assert checkpoint['source_identity']['revision']==summary['source'] and not checkpoint['source_identity']['dirty']
            archive=checkpoint_root/'built-app.tar.gz'
            assert archive.stat().st_size==169216316
            assert hashlib.sha256(archive.read_bytes()).hexdigest()=='c3e1143f9dbd0a89f94c2291fdac0cc827ae83690ae211ae9ee3aa0eed0415b3'
            assert checkpoint['archive']['sha256']=='c3e1143f9dbd0a89f94c2291fdac0cc827ae83690ae211ae9ee3aa0eed0415b3'
            assert json.loads(doctor)['toolchain']['fingerprint']==checkpoint['toolchain']['toolchain']['fingerprint']
            sys.path.insert(0,str(root/'test'))
            from build_provenance import source_identity
            assert source_identity(root)==checkpoint['source_identity']
            expected={x['path']:x for x in json.loads((checkpoint_root/'app-inventory.json').read_text())}
            assert len(expected)==7938
            output=root/'build/ios-recovery-app';output.mkdir(parents=True,exist_ok=True)
            with tarfile.open(archive,'r:gz') as package:
                for member in package:
                    relative=Path(member.name)
                    assert relative.parts[0]=='Glob2.app' and not relative.is_absolute() and '..' not in relative.parts
                    assert member.isfile() or member.isdir(),'Unexpected archive member type'
                package.extractall(output,filter='data')
            app=output/'Glob2.app';actual_files={str(x.relative_to(app)):x for x in app.rglob('*') if x.is_file()}
            assert set(actual_files)==set(expected)
            for name,path in actual_files.items():
                assert path.stat().st_size==expected[name]['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==expected[name]['sha256'],name
            for receipt in ['app-inventory.json','critical-bundle-identities.json','font-bundle-closure.json','source-catalogs.json','dependency-manifests.json','build-checkpoint.json']:
                (proof/('original-'+receipt)).write_bytes((checkpoint_root/receipt).read_bytes())
            closure=json.loads((checkpoint_root/'font-bundle-closure.json').read_text())
            for entry in closure:
                name=entry['path'];assert hashlib.sha256((root/name).read_bytes()).hexdigest()==entry['source_sha256']==hashlib.sha256((app/name).read_bytes()).hexdigest()
            assert hashlib.sha256((app/'data/texts.bn.txt').read_bytes()).hexdigest()=='3b9a6d23a436c12c0d95ee64d3bf74536187c46f7d110268e58325e85e618054'
            run('codesign',['codesign','--verify','--deep','--strict',str(app)])
            run('executable-identity',['file',str(app/'Glob2')])
            summary['verified_checkpoint']={'producer_run':41266250711,'archive_sha256':checkpoint['archive']['sha256'],'app_files_verified':len(expected),'toolchain_fingerprint_matches':True,'no_build_commands_executed':True}
            sim('install','install',selected,str(app),timeout=300)
            container=Path(sim('app-data','get_app_container',selected,'org.globulation2.glob2','data').strip())
            # Pinned SDL3.4.16 cocoa SDL_SYS_GetPrefPath: NSApplicationSupportDirectory/org/app.
            # initializeMobilePaths always chooses this directory, overriding custom environment.
            assert json.loads((root/'scons/vcpkg-ports/sdl3/vcpkg.json').read_text())['version']=='3.4.16'
            assert 'SDL_GetPrefPath("Globulation2","glob2")' in (root/'mobile/MobilePaths.cpp').read_text()
            profile=container/'Library/Application Support/Globulation2/glob2';profile.mkdir(parents=True,exist_ok=True)
            prefs='version=2\nlanguage=bn\naudioPreferenceChosen=1\nthumbSideChosen=1\nintroductionOffered=1\nmute=1\n'
            assert prefs.count('\n')==6
            (profile/'preferences.txt').write_text(prefs);(proof/'seeded-preferences.txt').write_text(prefs)
            summary['actual_profile']={'relative_to_owned_app_container':'Library/Application Support/Globulation2/glob2','source':'Pinned SDL3.4.16 Cocoa SDL_SYS_GetPrefPath and production initializeMobilePaths','seed_sha256':hashlib.sha256(prefs.encode()).hexdigest()}
            run('lifecycle',['python3','mobile/ios_smoke.py','--device',selected,'--output','build/ios-bengali-recovery/lifecycle'],900)
            saved=profile/'preferences.txt'
            if saved.exists(): (proof/'persisted-preferences.txt').write_bytes(saved.read_bytes())
            lifecycle=json.loads((proof/'lifecycle/result.json').read_text());assert lifecycle['passed']
            summary['passed']=True
        except Exception as error:
            if 'container' in locals():
                summary['owned_container_preferences_paths']=[str(x.relative_to(container)) for x in container.rglob('preferences.txt')]
                summary['expected_profile_exists']=(profile/'preferences.txt').is_file() if 'profile' in locals() else False
            summary['error']=str(error);raise
        finally:
            if selected:
                try: sim('shutdown','shutdown',selected,timeout=120)
                except Exception as error:summary['cleanup_error']=str(error)
            (proof/'result.json').write_text(json.dumps(summary,indent=2))

        IOSRECOVERY
    - name: Retain bounded recovery proof and actual screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bengali-ios-runtime-recovery-942d138
        path: build/ios-bengali-recovery/
        if-no-files-found: error
        retention-days: 14
