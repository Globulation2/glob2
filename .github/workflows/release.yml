name: release package build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag (optional for packaging checks)
        required: false
        type: string
      benchmark_profiles:
        description: Run isolated GCC size profiles and paired performance/checksum measurements
        required: false
        type: boolean
        default: false
      build_flatpak:
        description: Build the Flatpak recipe
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      benchmark_profiles:
        required: false
        type: boolean
        default: false
      build_flatpak:
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GLOB2_DEV_MODE: isolated

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Validate selected revision
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
            git fetch --no-tags https://github.com/Globulation2/glob2.git \
              "refs/tags/$TAG:refs/tags/$TAG"
            version="$(python3 tools/release/release.py check --tag "$TAG")"
            revision="$(git rev-parse HEAD)"
          else
            version="$(python3 tools/release/release.py check)"
            git fetch --no-tags https://github.com/Globulation2/glob2.git master
            if ! revision="$(git merge-base HEAD FETCH_HEAD)"; then
              echo '::error::Release checkout does not share history with the public source repository.'
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Validate Android release identity
        run: python3 mobile/android_release.py ${{ inputs.tag && 'check' || 'check-candidate' }}
      - name: Validate F-Droid listing for publication
        run: python3 mobile/android_release.py check-listing
      - name: Test Android release preflight and package checks
        run: python3 -m unittest tests.build_system.test_android_release -v

  source:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Create reproducible source archive
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then
            git fetch --no-tags https://github.com/Globulation2/glob2.git \
              "refs/tags/$TAG:refs/tags/$TAG"
            python3 tools/release/release.py archive --tag "$TAG" --output artifacts/release-output
          else
            python3 tools/release/release.py archive --output artifacts/release-output
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source
          path: artifacts/release-output/*
          if-no-files-found: error

  android-package:
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - name: Install native build utilities
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends scons pkg-config unzip zip autoconf automake libtool cmake ninja-build
      - name: Install pinned Android toolchain
        run: |
          python3 mobile/setup_ndk.py
          python3 mobile/setup_tools.py
          sdk="$(python3 tools/dev_environment.py paths --field android_sdk)"
          "$sdk/cmdline-tools/19.0/bin/sdkmanager" --sdk_root="$sdk" --licenses < <(yes)
          "$sdk/cmdline-tools/19.0/bin/sdkmanager" --sdk_root="$sdk" \
            'platforms;android-36' 'build-tools;35.0.0' platform-tools
      - name: Build source dependencies and release APK
        run: |
          set -o pipefail
          code="$(python3 mobile/android_release.py code --arch '${{ matrix.arch }}')"
          sdk="$(python3 tools/dev_environment.py paths --field android_sdk)"
          python3 mobile/fdroid_build.py --version-code "$code" --android-sdk "$sdk" \
            --android-ndk "$sdk/ndk/28.2.13676358" 2>&1 \
            | tee "build/android-${{ matrix.arch }}-build.log"
          apk="build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          python3 mobile/android_release.py verify-apk --arch '${{ matrix.arch }}' --apk "$apk"
      - name: Launch x86_64 release candidate in an emulator
        if: matrix.arch == 'x86_64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 mobile/setup_tools.py --emulator
          python3 mobile/emulator.py configure --arch x86_64
          nohup python3 mobile/emulator.py adb-server > build/mobile-adb-server.log 2>&1 &
          nohup python3 mobile/emulator.py run --arch x86_64 > build/mobile-emulator.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if python3 mobile/emulator.py status --arch x86_64 >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          python3 mobile/android.py sign --arch x86_64 --release --fdroid
          python3 mobile/android.py install --arch x86_64 --release --fdroid --serial emulator-5580 --adb-port 15037
          python3 mobile/smoke.py --serial emulator-5580 --avd glob2-api35-x64 --package org.globulation2.glob2
          python3 mobile/emulator.py stop --arch x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-${{ matrix.arch }}-release-validation
          path: |
            build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.apk
            build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.sha256
            build/android/device/${{ matrix.arch }}/24/client/release/android-project/app/build/outputs/apk/release/app-release-unsigned.symbols.json
            build/fdroid-output.apk
            build/mobile-smoke/**
            build/mobile-emulator.log
            build/android-${{ matrix.arch }}-build.log
          if-no-files-found: ignore

  linux-package:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ python3 python3-venv scons pkg-config cmake ninja-build libpng-dev libjpeg-dev libwebp-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-net-dev libsdl2-ttf-dev libvorbis-dev libogg-dev \
            libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev \
            libpcre3-dev libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
      - name: Build and stage Linux client
        run: |
          stage="$PWD/artifacts/release-stage"
          scons -j2 release=1 server=0 lean_images=1 \
            BINDIR="$stage/usr/bin" INSTALLDIR="$stage/usr/share" \
            DATADIR=/usr/share install
          python3 tools/release/release.py verify-install --stage "$stage"
          scons -j2 release=1 server=0 lean_images=1 engine-tests
          LD_LIBRARY_PATH="$stage/usr/lib/glob2" build/linux/client/release/lean-images/test/glob2-engine-tests --test-suite=ImageAssets
          env -u LD_LIBRARY_PATH "$stage/usr/bin/glob2" --version
          ldd "$stage/usr/bin/glob2" | grep -F "$stage/usr/bin/../lib/glob2/libSDL2_image"
      - name: Measure original-assets Linux baseline
        run: |
          stage="$PWD/artifacts/size-baseline"
          scons -j2 release=1 server=0 lean_images=0 optimized_assets=0 \
            BINDIR="$stage/usr/bin" INSTALLDIR="$stage/usr/share" DATADIR=/usr/share install
          mkdir -p artifacts/package-sizes
          tar -C "$stage" -czf artifacts/package-sizes/baseline.tar.gz usr
          python3 tools/release/package_sizes.py report --staged-root "$stage" \
            --archive artifacts/package-sizes/baseline.tar.gz --label original-assets \
            --output artifacts/package-sizes/baseline.json
      - name: Package Linux installation
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p artifacts/release-output
          python3 tools/release/archives.py linux --stage artifacts/release-stage \
            --output "artifacts/release-output/glob2-${VERSION}-linux-x86_64-ubuntu22.04.tar.gz" \
            --report artifacts/package-sizes/linux-compression.json
          python3 tools/release/package_sizes.py report --staged-root artifacts/release-stage \
            --archive "artifacts/release-output/glob2-${VERSION}-linux-x86_64-ubuntu22.04.tar.gz" \
            --output artifacts/package-sizes/candidate.json
          python3 tools/release/package_sizes.py compare artifacts/package-sizes/baseline.json \
            artifacts/package-sizes/candidate.json --output artifacts/package-sizes/comparison.json
      - name: Compare Linux decoder performance on identical packaged images
        run: |
          python3 tools/release/benchmark_decoder.py --assets artifacts/release-stage/usr/share/glob2 \
            --baseline-runtime artifacts/size-baseline/usr/bin --candidate-runtime artifacts/release-stage/usr/bin \
            --candidate-library "$PWD/artifacts/release-stage/usr/lib/glob2/libSDL2_image.so" \
            --output artifacts/package-sizes/linux-decoder.json
      - name: Measure isolated Linux compiler profiles
        if: inputs.benchmark_profiles
        run: |
          for profile in gc lto size; do
            stage="$PWD/artifacts/profile-$profile"
            scons -j2 release=1 server=0 lean_images=1 size_optimization="$profile" \
              BINDIR="$stage/usr/bin" INSTALLDIR="$stage/usr/share" DATADIR=/usr/share install
            python3 tools/release/archives.py linux --stage "$stage" \
              --output "$PWD/artifacts/profile-$profile.tar.gz" \
              --report "artifacts/package-sizes/$profile-compression.json"
            python3 tools/release/package_sizes.py report --staged-root "$stage" --profile "$profile" \
              --archive "$PWD/artifacts/profile-$profile.tar.gz" \
              --output "artifacts/package-sizes/$profile.json"
            python3 tools/release/benchmark_profiles.py --baseline "$PWD/artifacts/release-stage/usr/bin/glob2" \
              --candidate "$stage/usr/bin/glob2" --baseline-size artifacts/package-sizes/candidate.json \
              --candidate-size "artifacts/package-sizes/$profile.json" --output "artifacts/profile-measurements/$profile"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-profile-measurements-linux
          path: artifacts/profile-measurements
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-sizes-linux
          path: artifacts/package-sizes/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: artifacts/release-output/*
          if-no-files-found: error

  distro-build:
    needs: preflight
    name: Source build on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian trixie
            image: debian:trixie
            install: >-
              apt-get update -qq && apt-get install -y --no-install-recommends
              git ca-certificates g++ python3 python3-venv scons pkg-config libsdl2-dev libsdl2-image-dev
              libsdl2-net-dev libsdl2-ttf-dev libvorbis-dev libogg-dev
              libspeex-dev libboost-dev libssl-dev zlib1g-dev libfribidi-dev
              libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev
          - name: Fedora 43
            image: fedora:43
            install: >-
              dnf install -y git gcc-c++ python3 scons pkgconf-pkg-config
              SDL2-devel SDL2_image-devel SDL2_net-devel SDL2_ttf-devel
              libvorbis-devel libogg-devel speex-devel boost-devel openssl-devel
              zlib-devel fribidi-devel pcre-devel mesa-libGL-devel mesa-libGLU-devel
              libepoxy-devel
          - name: Arch Linux
            image: archlinux:base-devel
            install: >-
              pacman -Syu --noconfirm --needed git python scons pkgconf sdl2
              sdl2_image sdl2_net sdl2_ttf libvorbis libogg speex boost openssl
              zlib fribidi pcre glu libepoxy
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            install: >-
              zypper --non-interactive install git gcc-c++ python3 scons pkg-config
              SDL2-devel SDL2_image-devel SDL2_net-devel SDL2_ttf-devel
              libvorbis-devel libogg-devel speex-devel boost-devel libopenssl-devel
              zlib-devel fribidi-devel Mesa-libGL-devel Mesa-libGLU-devel
              libepoxy-devel
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - name: Build from source
        run: |
          scons -j2 release=1 server=0
          build/linux/client/release/src/glob2 --version

  rpm-package:
    needs: [preflight, source]
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install RPM tools and build dependencies
        run: |
          dnf install -y git rpm-build gcc-c++ python3 scons pkgconf-pkg-config \
            SDL2-devel SDL2_image-devel SDL2_net-devel SDL2_ttf-devel \
            libvorbis-devel libogg-devel speex-devel boost-devel openssl-devel \
            zlib-devel fribidi-devel pcre-devel mesa-libGL-devel mesa-libGLU-devel \
            libepoxy-devel cmake make python3-devel python3-pip python3-wheel libjpeg-turbo-devel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source
          path: artifacts/release-source
      - name: Build source and binary RPMs
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          top="$GITHUB_WORKSPACE/artifacts/rpmbuild"
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "artifacts/release-source/glob2-${VERSION}.tar.gz" "$top/SOURCES/"
          python3 tools/build_asset_encoder.py fetch --sources "$top/SOURCES"
          rpmbuild -ba fedora/glob2.spec --define "_topdir $top"
          stage="$GITHUB_WORKSPACE/artifacts/rpm-size-stage"
          mkdir -p "$stage"
          rpmfile="$(find "$top/RPMS" -name 'glob2-*.rpm' ! -name '*debuginfo*' ! -name '*debugsource*' -print -quit)"
          (cd "$stage"; rpm2cpio "$rpmfile" | cpio -idm --quiet)
          python3 tools/release/package_sizes.py report --staged-root "$stage" \
            --archive "$rpmfile" --output artifacts/package-sizes/rpm.json
          mkdir -p artifacts/release-output
          find "$top/RPMS" "$top/SRPMS" -name '*.rpm' -exec cp '{}' artifacts/release-output/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-sizes-rpm
          path: artifacts/package-sizes/rpm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-rpm
          path: artifacts/release-output/*.rpm
          if-no-files-found: error

  windows-package:
    needs: preflight
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned asset encoder
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: Pillow==12.2.0
          $encoder = (Get-Command python).Source
          "GLOB2_ASSET_ENCODER_PYTHON=$encoder" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python mingw-w64-x86_64-scons
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_net mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy mingw-w64-x86_64-libsystre mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-nsis
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - name: Build and package Windows client
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          scons -j2 release=1 mingw=1 server=0 build/mingw/client/release/src/glob2.exe
          scons -j2 release=1 mingw=1 server=0 lean_images=1 build/mingw/client/release/lean-images/src/glob2.exe
          scons -j2 release=1 mingw=1 server=0 lean_images=1 engine-tests
          ./build/mingw/client/release/lean-images/src/glob2.exe --version
          image_prefix="$(python3 -c 'import json; print(json.load(open("build/mingw/client/release/lean-images/image-runtime.json"))["prefix"])')"
          PATH="$(cygpath -u "$image_prefix")/bin:$PATH" ./build/mingw/client/release/lean-images/test/glob2-engine-tests.exe --test-suite=ImageAssets
          python3 tools/release/package_windows.py \
            build/mingw/client/release/lean-images/src/glob2.exe \
            "artifacts/release-output/glob2-${VERSION}-windows-x86_64.zip" \
            --compression-report artifacts/package-sizes/windows-zip-compression.json
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall("artifacts/release-smoke")' \
            "artifacts/release-output/glob2-${VERSION}-windows-x86_64.zip"
          ./artifacts/release-smoke/Globulation2/glob2.exe --version
          python3 tools/release/package_nsis.py --stage artifacts/release-smoke/Globulation2 \
            --output "artifacts/release-output/glob2-${VERSION}-windows-x86_64-setup.exe" --version "$VERSION"
          python3 tools/release/package_windows.py build/mingw/client/release/src/glob2.exe \
            artifacts/package-sizes/baseline.zip --original-assets \
            --compression-report artifacts/package-sizes/baseline-zip-compression.json
          python3 -c 'import zipfile; zipfile.ZipFile("artifacts/package-sizes/baseline.zip").extractall("artifacts/size-baseline")'
          python3 tools/release/package_sizes.py report --staged-root artifacts/size-baseline/Globulation2 \
            --archive artifacts/package-sizes/baseline.zip --label original-assets \
            --output artifacts/package-sizes/baseline.json
          python3 tools/release/package_sizes.py report --staged-root artifacts/release-smoke/Globulation2 \
            --archive "artifacts/release-output/glob2-${VERSION}-windows-x86_64.zip" \
            --archive "artifacts/release-output/glob2-${VERSION}-windows-x86_64-setup.exe" \
            --output artifacts/package-sizes/candidate.json
          python3 tools/release/package_sizes.py compare artifacts/package-sizes/baseline.json \
            artifacts/package-sizes/candidate.json --output artifacts/package-sizes/comparison.json
      - name: Compare Windows decoder performance on identical packaged images
        run: |
          python3 tools/release/benchmark_decoder.py --assets artifacts/release-smoke/Globulation2 \
            --baseline-runtime artifacts/size-baseline/Globulation2 \
            --candidate-runtime artifacts/release-smoke/Globulation2 \
            --output artifacts/package-sizes/windows-decoder.json
      - name: Measure isolated Windows compiler profiles
        if: inputs.benchmark_profiles
        run: |
          for profile in gc lto size; do
            binary="build/mingw/client/release/size-$profile/lean-images/src/glob2.exe"
            scons -j2 release=1 mingw=1 server=0 lean_images=1 size_optimization="$profile" "$binary"
            python3 tools/release/package_windows.py "$binary" "artifacts/profile-$profile.zip"
            python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
              "artifacts/profile-$profile.zip" "artifacts/profile-$profile"
            stage="$PWD/artifacts/profile-$profile/Globulation2"
            python3 tools/release/package_sizes.py report --staged-root "$stage" --profile "$profile" \
              --archive "artifacts/profile-$profile.zip" --output "artifacts/package-sizes/$profile.json"
            python3 tools/release/benchmark_profiles.py --baseline "$PWD/artifacts/release-smoke/Globulation2/glob2.exe" \
              --candidate "$stage/glob2.exe" --baseline-size artifacts/package-sizes/candidate.json \
              --candidate-size "artifacts/package-sizes/$profile.json" --output "artifacts/profile-measurements/$profile"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-profile-measurements-windows
          path: artifacts/profile-measurements
          if-no-files-found: ignore
      - name: Validate installer, upgrade, uninstall and isolated DLL loading
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem artifacts/release-output/*-setup.exe).FullName
          $install = Join-Path $PWD 'artifacts/installer smoke'
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$install/glob2.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed client could not load its runtime' }
          New-Item -ItemType Directory -Force "$install/games" | Out-Null
          Set-Content "$install/games/user.game" 'user save'
          Set-Content "$install/unrelated.txt" 'user content'
          Set-Content "$install/obsolete.dll" 'previously shipped'
          $inventoryEncoding = [System.Text.UnicodeEncoding]::new($false, $false)
          $inventoryPath = "$install/.glob2-owned-files.txt"
          $inventory = [System.IO.File]::ReadAllText($inventoryPath, $inventoryEncoding)
          $inventory = $inventory.Replace(':GLOB2-OWNED-END:v1', "obsolete.dll`r`n:GLOB2-OWNED-END:v1")
          [System.IO.File]::WriteAllText($inventoryPath, $inventory, $inventoryEncoding)
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$install/obsolete.dll")) { throw 'Upgrade did not remove owned obsolete runtime' }
          $inventoryPath = "$install/.glob2-owned-files.txt"
          $inventoryBytes = [System.IO.File]::ReadAllBytes($inventoryPath)
          Remove-Item $inventoryPath
          $failed = Start-Process -FilePath "$install/glob2win32-uninst.exe" -ArgumentList "/S _?=$install" -Wait -PassThru
          if ($failed.ExitCode -eq 0 -or !(Test-Path "$install/glob2.exe")) { throw 'Missing inventory was treated as a successful uninstall' }
          $outside = Join-Path (Split-Path $install) 'outside.txt'
          Set-Content $outside 'outside user content'
          # Include a valid first record so prevalidation must finish before deleting anything.
          $invalidInventories = @(
            ":GLOB2-OWNED-BEGIN:v1`r`nglob2.exe`r`n..\outside.txt`r`n:GLOB2-OWNED-END:v1`r`n",
            ":GLOB2-OWNED-BEGIN:v1`r`nglob2.exe`r`n*.txt`r`n:GLOB2-OWNED-END:v1`r`n",
            ":GLOB2-OWNED-BEGIN:v1`r`nglob2.exe`r`ngames\*`r`n:GLOB2-OWNED-END:v1`r`n",
            ":GLOB2-OWNED-BEGIN:v1`r`nglob2.exe`r`n"
          )
          foreach ($invalidInventory in $invalidInventories) {
            [System.IO.File]::WriteAllText($inventoryPath, $invalidInventory, $inventoryEncoding)
            $failed = Start-Process -FilePath "$install/glob2win32-uninst.exe" -ArgumentList "/S _?=$install" -Wait -PassThru
            if ($failed.ExitCode -eq 0 -or !(Test-Path "$install/glob2.exe")) { throw 'Corrupt inventory was not rejected before cleanup' }
            if (!(Test-Path $outside) -or !(Test-Path "$install/unrelated.txt") -or !(Test-Path "$install/games/user.game")) { throw 'Invalid inventory removed user content' }
          }
          [System.IO.File]::WriteAllBytes($inventoryPath, $inventoryBytes)
          $locked = [System.IO.File]::Open("$install/glob2.exe", 'Open', 'Read', 'None')
          try {
            $failed = Start-Process -FilePath "$install/glob2win32-uninst.exe" -ArgumentList "/S _?=$install" -Wait -PassThru
            if ($failed.ExitCode -eq 0 -or !(Test-Path "$install/.glob2-owned-files.txt")) { throw 'Failed uninstall lost its recovery inventory' }
          } finally { $locked.Dispose() }
          $process = Start-Process -FilePath "$install/glob2win32-uninst.exe" -ArgumentList "/S _?=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$install/glob2.exe")) { throw 'Uninstall failed' }
          if (!(Test-Path "$install/games/user.game") -or !(Test-Path "$install/unrelated.txt")) { throw 'Uninstall removed user content' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-sizes-windows
          path: artifacts/package-sizes/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: artifacts/release-output/*
          if-no-files-found: error

  macos-package:
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - name: Install dependencies
        run: |
          brew install cmake scons sdl2 sdl2_image sdl2_net sdl2_ttf \
            libvorbis libogg speex boost openssl@3 fribidi pcre libepoxy
      - name: Build application and DMG
        run: scons -j2 release=1 server=0 package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: Glob2-*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-symbols
          path: build/darwin/client/release/symbols/
          if-no-files-found: error
          retention-days: 90

  flatpak-package:
    if: ${{ inputs.build_flatpak }}
    needs: preflight
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - name: Pin upstream source
        env:
          REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          python3 tools/release/render_flatpak.py "$REVISION" \
            flatpak/org.globulation2.Globulation2.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: glob2.flatpak
          manifest-path: flatpak/org.globulation2.Globulation2.yml
          build-dir: artifacts/flatpak-app
          cache-key: glob2-flatpak-${{ needs.preflight.outputs.revision }}
          upload-artifact: false
      - name: Record Flatpak application and download sizes
        run: |
          python3 tools/release/package_sizes.py report --staged-root artifacts/flatpak-app/files \
            --archive glob2.flatpak --compiler unrecorded \
            --output artifacts/package-sizes/flatpak.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-sizes-flatpak
          path: artifacts/package-sizes/flatpak.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-flatpak
          path: |
            glob2.flatpak
            flatpak/org.globulation2.Globulation2.yml
          if-no-files-found: error

  snap-package:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snap
      - name: Test installed snap
        env:
          SNAP: ${{ steps.snap.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP"
          snap run globulation2 --version
          python3 tools/release/package_sizes.py report --staged-root /snap/globulation2/current \
            --archive "$SNAP" --compiler unrecorded --output artifacts/package-sizes/snap.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-sizes-snap
          path: artifacts/package-sizes/snap.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.snap.outcome == 'success' }}
        with:
          name: release-snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

  compiler-profile-portability:
    if: inputs.benchmark_profiles
    needs: [linux-package, windows-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tag && 'Globulation2/glob2' || github.repository }}
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiler-profile-measurements-linux
          path: artifacts/profile-platforms/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiler-profile-measurements-windows
          path: artifacts/profile-platforms/windows
      - name: Compare complete per-tick execution across all profiles and platforms
        run: |
          python3 tools/release/check_profile_platforms.py artifacts/profile-platforms/linux \
            artifacts/profile-platforms/windows --output artifacts/profile-platforms/portability.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiler-profile-portability
          path: artifacts/profile-platforms/portability.json
