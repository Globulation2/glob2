name: Prepare, submit or publish tagged iOS App Store version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public game version tag
        required: true
        type: string
      upload_run_id:
        description: Successful owner mirror run that uploaded an App Store eligible build and provenance
        required: true
        type: string
      stage:
        description: Deliberate production action; prepare never submits and submit never publishes
        required: true
        type: choice
        options: [inspect, supersede, prepare, submit, publish]
        default: prepare
      draft_version_id:
        description: Optional editable Apple draft ID to reuse during prepare only
        required: false
        type: string
        default: ''
      replace_draft_build_id:
        description: Expected current build ID in that unsubmitted manual-release draft; leave blank to refuse replacement
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-production
  cancel-in-progress: false

jobs:
  context:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify upload run trust and exact source before obtaining store credentials
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          STAGE: ${{ inputs.stage }}
          DRAFT_VERSION_ID: ${{ inputs.draft_version_id }}
          REPLACE_DRAFT_BUILD_ID: ${{ inputs.replace_draft_build_id }}
        run: |
          set -euo pipefail
          [[ "$UPLOAD_RUN_ID" =~ ^[0-9]+$ ]]
          python3 tools/release/release.py check --tag "$TAG"
          mkdir -p artifacts/ios-production
          gh api "repos/genixpro/glob2-release/actions/runs/$UPLOAD_RUN_ID" > artifacts/ios-production/run.json
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          expected=os.environ['REPLACE_DRAFT_BUILD_ID']
          if expected:
              if (os.environ['STAGE'] not in ('prepare','supersede') or not re.fullmatch('[A-Za-z0-9-]{1,128}',os.environ['DRAFT_VERSION_ID'])
                  or not re.fullmatch('[A-Za-z0-9-]{1,128}',expected)):
                  raise SystemExit('Replacement requires prepare and explicit draft/current build IDs')
              help_text=subprocess.check_output(['python3','platforms/mobile/ios_store_release.py','--help'],text=True)
              if '--replace-draft-build-id' not in help_text:
                  raise SystemExit('The selected immutable source tag does not support explicit draft replacement')
          run=json.loads(Path('artifacts/ios-production/run.json').read_text())
          paths={'.github/workflows/ios-testflight.yml','.github/workflows/github-release.yml','.github/workflows/publish-desktop.yml'}
          if (run['repository']['id']!=1397722696 or run['actor']['id']!=6193625 or run['triggering_actor']['id']!=6193625
              or run['event']!='workflow_dispatch' or run['head_branch']!='master' or run['conclusion']!='success'
              or run['path'].split('@')[0] not in paths): raise SystemExit('Uploaded build did not come from a successful trusted mirror release workflow')
          PY
          gh run download "$UPLOAD_RUN_ID" --repo genixpro/glob2-release --name ios-upload-provenance --dir artifacts/ios-production
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'platforms/mobile')
          from ios_store_release import validate_provenance
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          validate_provenance(json.loads(Path('artifacts/ios-production/ios-upload-provenance.json').read_text()),os.environ['TAG'],commit,os.environ['UPLOAD_RUN_ID'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('commit='+commit,file=output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-ios-production-provenance
          path: artifacts/ios-production/ios-upload-provenance.json
          if-no-files-found: error
          retention-days: 1

  production:
    needs: context
    environment: ios-testflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.context.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-driver
          sparse-checkout: |
            platforms/mobile/ios_store_inspect.py
            platforms/mobile/ios_store_supersede.py
            platforms/mobile/ios_store_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-ios-production-provenance
          path: artifacts/ios-production
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare existing pinned API authentication tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-production-tools"
          "$RUNNER_TEMP/ios-production-tools/bin/pip" install --require-hashes --only-binary=:all: -r platforms/mobile/play-api-requirements.txt
      - name: Perform only the explicitly selected owner production action
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_P8_BASE64: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.context.outputs.commit }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          STAGE: ${{ inputs.stage }}
          DRAFT_VERSION_ID: ${{ inputs.draft_version_id }}
          REPLACE_DRAFT_BUILD_ID: ${{ inputs.replace_draft_build_id }}
        run: |
          set -euo pipefail
          test -n "$IOS_ASC_KEY_ID" && test -n "$IOS_ASC_ISSUER_ID" && test -n "$IOS_ASC_KEY_P8_BASE64"
          if [ "$STAGE" = inspect ]; then
            PYTHONPATH="$PWD/platforms/mobile" "$RUNNER_TEMP/ios-production-tools/bin/python" release-driver/platforms/mobile/ios_store_inspect.py \
              --provenance artifacts/ios-production/ios-upload-provenance.json \
              --tag "$TAG" --source-commit "$SOURCE_COMMIT" --run-id "$UPLOAD_RUN_ID"
            exit 0
          fi
          if [ "$STAGE" = supersede ]; then
            PYTHONPATH="$PWD/platforms/mobile" "$RUNNER_TEMP/ios-production-tools/bin/python" release-driver/platforms/mobile/ios_store_supersede.py \
              --provenance artifacts/ios-production/ios-upload-provenance.json \
              --tag "$TAG" --source-commit "$SOURCE_COMMIT" --run-id "$UPLOAD_RUN_ID" \
              --draft-version-id "$DRAFT_VERSION_ID" --replace-draft-build-id "$REPLACE_DRAFT_BUILD_ID"
            exit 0
          fi
          replacement_args=()
          if [ -n "$REPLACE_DRAFT_BUILD_ID" ]; then replacement_args=(--replace-draft-build-id "$REPLACE_DRAFT_BUILD_ID"); fi
          PYTHONPATH="$PWD/platforms/mobile" "$RUNNER_TEMP/ios-production-tools/bin/python" release-driver/platforms/mobile/ios_store_release.py "$STAGE" \
            --provenance artifacts/ios-production/ios-upload-provenance.json \
            --tag "$TAG" --source-commit "$SOURCE_COMMIT" --run-id "$UPLOAD_RUN_ID" \
            --draft-version-id "$DRAFT_VERSION_ID" "${replacement_args[@]}"
