name: Stage public release and submit optional desktop channels

# Mirror reviewed commits to the owner-controlled release repository before use.
# The upstream repository has no store credentials and these jobs cannot run there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: desktop-publication
  cancel-in-progress: false

jobs:
  context:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$TRIGGERING_ACTOR" != genixpro || "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/master ]]; then
            echo '::error::Desktop publication requires a manual dispatch from the release repository master by its owner.'
            exit 1
          fi

  github:
    needs: context
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  snap:
    needs: github
    uses: ./.github/workflows/snap-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  flathub:
    needs: github
    uses: ./.github/workflows/flathub-update.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
