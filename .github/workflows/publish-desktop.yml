name: Publish desktop channels

# Mirror reviewed commits to the owner-controlled release repository before use.
# The upstream repository has no store credentials and these jobs cannot run there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag at the mirrored HEAD
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-publication
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$REF" != refs/heads/master ]]; then
            echo '::error::Desktop publication requires the release repository, its owner account, and master.'
            exit 1
          fi

  github:
    needs: context
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  snap:
    needs: github
    uses: ./.github/workflows/snap-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  flathub:
    needs: github
    uses: ./.github/workflows/flathub-update.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
