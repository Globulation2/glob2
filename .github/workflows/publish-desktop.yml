name: Publish desktop channels

# Mirror reviewed commits to the owner-controlled release repository before use.
# The public repository has no store credentials and these jobs cannot run there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag at the mirrored HEAD
        required: true
        type: string
      upload_epic_dev:
        description: Also upload the Windows candidate to Epic Dev
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-publication
  cancel-in-progress: false

jobs:
  github:
    if: >-
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.ref == 'refs/heads/master'
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  snap:
    needs: github
    uses: ./.github/workflows/snap-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  flathub:
    needs: github
    uses: ./.github/workflows/flathub-update.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  epic_dev:
    if: ${{ inputs.upload_epic_dev }}
    needs: github
    uses: ./.github/workflows/epic-windows-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
