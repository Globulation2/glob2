name: Monitor F-Droid publication

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check all Android release variants in F-Droid
        id: fdroid
        run: python3 mobile/fdroid_monitor.py
      - name: Report publication state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.fdroid.outputs.state }}
          TAG: ${{ steps.fdroid.outputs.tag }}
          MISSING: ${{ steps.fdroid.outputs.missing_codes }}
        run: |
          title="F-Droid publication missing for $TAG"
          number="$(gh issue list --state open --limit 100 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)"
          if [[ "$STATE" == overdue && -z "$number" ]]; then
            gh issue create --title "$title" \
              --body "F-Droid has not published all $TAG Android APKs after 72 hours. Missing version codes: $MISSING. Check fdroiddata build logs and the F-Droid Monitor."
          elif [[ "$STATE" == overdue ]]; then
            gh issue edit "$number" \
              --body "F-Droid has not published all $TAG Android APKs after 72 hours. Missing version codes: $MISSING. Check fdroiddata build logs and the F-Droid Monitor."
          elif [[ "$STATE" == complete && -n "$number" ]]; then
            gh issue close "$number" --comment "All three $TAG Android APKs are published on F-Droid."
          fi
          echo "F-Droid $TAG: $STATE; missing version codes: ${MISSING:-none}" >> "$GITHUB_STEP_SUMMARY"
