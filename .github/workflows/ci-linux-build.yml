name: Linux compiler build

on:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ""
      image:
        required: true
        type: string
      runner:
        required: true
        type: string
      compiler:
        required: true
        type: string
      c_compiler:
        required: true
        type: string

      build_only:
        type: boolean
        default: false
      reuse_build:
        type: boolean
        default: false
      web_native:
        type: boolean
        default: false
      generator_only:
        type: boolean
        default: false
      coverage_profile:
        type: string
        default: full
      run_tests:
        type: boolean
        default: false
      runtime_packages:
        type: boolean
        default: false
      map_generators:
        type: boolean
        default: false
      validate_runtime:
        type: boolean
        default: false

permissions:
  contents: read

env:
  GLOB2_DEV_MODE: isolated

jobs:
  build:
    name: linux build (${{ inputs.image }}, ${{ inputs.compiler }})
    if: ${{ !inputs.reuse_build }}
    runs-on: ${{ inputs.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      # Hash the compiler binary instead of trusting its mtime, so a g++ point
      # release landing inside the base image cannot reuse the old one's
      # entries. CCACHE_SLOPPINESS is deliberately left unset: include_file_mtime
      # and include_file_ctime would make ccache trust timestamps over content,
      # and time_macros would let it cache the __DATE__/__TIME__ build banner in
      # GlobalContainerArgs.cpp.
      CCACHE_COMPILERCHECK: content
      # A ceiling, not a working size: each saved cache is pruned to the entries
      # its run used, so no build evicts what another is about to read.
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ inputs.compiler }} python3 python3-venv scons pkg-config ccache \
            cmake libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth openbox x11-utils

      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: ./.github/actions/sdl3
        with:
          cc: ${{ inputs.c_compiler }}
          cxx: ${{ inputs.compiler == 'clang-18' && 'clang++-18' || inputs.compiler }}
      - name: Build pinned SDL3 dependencies
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "LD_LIBRARY_PATH=$PWD/build/sdl3-ci/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        id: restore_the_compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ inputs.runner }}-${{ inputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-main-${{ inputs.runner }}-

      - name: Identify Linux compiler
        id: linux_compiler
        run: |
          digest=$(sha256sum "$(command -v ${{ inputs.compiler }})" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Linux object tree
        id: restore_linux_object_tree
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux/client/release/.sconsign.dblite
            build/linux/client/release/identity.json
            build/linux/client/release/configure
            build/linux/client/release/include/glob2/BuildConfig.h
            build/linux/client/release/**/*.o
            build/linux/client/release/**/*.a
          key: linux-objects-v1-${{ inputs.runner }}-${{ steps.linux_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-objects-v1-${{ inputs.runner }}-${{ steps.linux_compiler.outputs.digest }}-

      - name: Reset the cache statistics
        id: cache_ready
        run: |
          ccache -z
          rm -f build/linux/client/release/src/GlobalContainerArgs.o
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Test compiler cache integration
        if: ${{ inputs.compiler == 'g++-13' && !inputs.generator_only }}
        id: test_compiler_cache_integration
        continue-on-error: true
        run: python3 test/test-ccache.py

      - name: Build glob2 and the regression harnesses
        id: build_glob2_and_the_regression_harnesses
        run: |
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          if [ '${{ inputs.generator_only }}' = true ]; then
            targets=(map-generator-golden-test engine-tests)
          else
            targets=(build/linux/client/release/src/glob2 unit-tests engine-tests maxima-strategy-dump map-report-test map-generator-golden-test lan-test software-render-benchmark menu-colony-harness)
          fi
          if [ '${{ inputs.web_native }}' = true ]; then targets+=(transport-test); fi
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons CC=${{ inputs.c_compiler }} CXX=${{ inputs.compiler == 'clang-18' && 'clang++-18' || inputs.compiler }} -j$(nproc) release=1 server=0 "${targets[@]}"

      - name: Package built Linux test programs
        id: package_linux_test_programs
        if: steps.build_glob2_and_the_regression_harnesses.outcome == 'success'
        run: |
          if [ '${{ inputs.generator_only }}' != true ]; then test -x build/linux/client/release/src/glob2; fi
          mkdir -p artifacts/ci-native
          python3 .github/scripts/ci_build_provenance.py write --compiler '${{ inputs.compiler }}'
          python3 .github/scripts/linux_runtime_packages.py build/linux/client/release --output artifacts/ci-native/runtime-packages.txt
          find build/linux/client/release build/sdl3-ci/prefix/lib -path 'build/linux/client/release/configure' -prune -o \( -type f -o -type l \) \( -perm /111 -o -name '*.so*' \) -print0 |
            tar --null -czf artifacts/ci-native/linux-test-programs.tar.gz -T -
      - uses: actions/upload-artifact@v4
        id: upload_linux_test_programs
        if: steps.package_linux_test_programs.outcome == 'success'

        with:
          name: linux-test-programs-${{ inputs.runner }}${{ inputs.compiler == 'clang-18' && '-clang-18' || '' }}
          path: |
            artifacts/ci-native/linux-test-programs.tar.gz
            artifacts/ci-native/runtime-packages.txt
            artifacts/ci-native/runtime-packages.json
            artifacts/ci-native/provenance.json
          retention-days: 2
          if-no-files-found: error

      - name: Save Linux object tree
        id: save_linux_object_tree
        if: ${{ !cancelled() && steps.package_linux_test_programs.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux/client/release/.sconsign.dblite
            build/linux/client/release/identity.json
            build/linux/client/release/configure
            build/linux/client/release/include/glob2/BuildConfig.h
            build/linux/client/release/**/*.o
            build/linux/client/release/**/*.a
          key: linux-objects-v1-${{ inputs.runner }}-${{ steps.linux_compiler.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A run that touched a widely included header and still shows near-total
      # direct hits means the cache is not seeing the change.
      - name: Report the cache statistics
        id: report_the_cache_statistics
        continue-on-error: true
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' }}
        run: ccache -s -v

      # Keep only what this run compiled or reused (a hit refreshes an entry's
      # timestamp), so a save never carries older commits' objects forward.
      - name: Drop cache entries this run did not use
        id: drop_cache_entries_this_run_did_not_use
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"

      # Only master writes. PR branches cannot read each other's caches anyway,
      # and letting every PR save would churn the repository's cache quota and
      # evict the entries PRs restore from. Saved even when a step failed: the
      # entries are content-addressed, so objects compiled during a run whose
      # tests failed are still the right objects.
      - name: Save the compiler cache
        id: save_the_compiler_cache
        if: ${{ !cancelled() && steps.cache_ready.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ inputs.runner }}-${{ inputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-linux-${{ inputs.compiler }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore


  reuse:
    name: Reuse primary Linux build
    if: ${{ inputs.reuse_build }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-programs-${{ inputs.runner }}
          path: artifacts/ci-native
      - run: python3 .github/scripts/ci_build_provenance.py verify --compiler '${{ inputs.compiler }}'

  regressions:
    name: Linux CLI and compatibility evidence (${{ inputs.compiler }})
    if: ${{ !cancelled() && !inputs.generator_only && !inputs.build_only && (needs.build.result == 'success' || needs.reuse.result == 'success') }}
    needs: [build, reuse]
    container: ${{ inputs.validate_runtime && inputs.image || '' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Bootstrap clean runtime image
        if: ${{ inputs.validate_runtime }}
        run: apt-get update -qq && apt-get install -y --no-install-recommends sudo ca-certificates git python3 libstdc++6
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-programs-${{ inputs.runner }}${{ inputs.compiler == 'clang-18' && '-clang-18' || '' }}
          path: artifacts/ci-native
      - name: Unpack exact build and install runtime
        run: |
          tar -xzf artifacts/ci-native/linux-test-programs.tar.gz
          echo "LD_LIBRARY_PATH=$PWD/build/sdl3-ci/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          xargs sudo apt-get install -y --no-install-recommends < artifacts/ci-native/runtime-packages.txt
          sudo apt-get install -y --no-install-recommends python3
      - name: Validate translations
        if: ${{ inputs.compiler == 'g++-13' }}
        id: validate_translations
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'translation catalog' 'python3 data/check_translations.py --strict' \
            --check 'translation tests' 'python3 test/test_translations.py' \
            --check 'font coverage' 'GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix python3 test/test_font_coverage.py'
      - name: Exercise production CLI and retain continuation traces
        if: ${{ !cancelled() }}
        run: python3 test/test_cli_smoke.py --binary build/linux/client/release/src/glob2 --artifacts artifacts/cli-smoke --junit artifacts/cli-smoke.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-linux-${{ inputs.compiler }}
          path: |
            artifacts/cli-smoke/
            artifacts/cli-smoke.xml
          if-no-files-found: ignore

      - name: Execute shared JavaScript corpus
        id: execute_shared_javascript_corpus
        run: python3 test/check_javascript_corpus.py --build-dir build/linux/client/release --output artifacts/javascript-corpus

      - name: Verify frozen JavaScript simulation profile
        id: verify_frozen_javascript_simulation_profile
        run: python3 test/check_javascript.py build/linux/client/release/src/glob2 --output artifacts/javascript-profile

      - name: Retain released simulation compatibility evidence
        run: python3 test/check_telemetry_simulation.py build/linux/client/release/src/glob2 --output artifacts/released-compatibility

      - name: Upload JavaScript simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-profile-linux-${{ inputs.compiler }}
          path: |
            artifacts/javascript-profile
            artifacts/javascript-corpus
            artifacts/released-compatibility

      - name: Test Maxima strategy configuration and policies
        id: test_maxima_strategy_configuration_and_policies
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'Maxima strategy config' 'MAXIMA_STRATEGY_DUMP=build/linux/client/release/test/MaximaStrategyDump GLOB2_BUILD_DIR=build/linux/client/release GLOB2_USER_DIR="$(mktemp -d)" python3 test/maxima/MaximaStrategyConfigTest.py' \
            --check 'Maxima policy tests' 'python3 -m unittest discover -s test/maxima -p "*Test.py"'

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-regressions-${{ inputs.compiler }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore

  tests:
    name: Linux tests (${{ inputs.runner }}, shard ${{ matrix.shard }}/4)
    needs: [build, reuse]
    container: ${{ inputs.validate_runtime && inputs.image || '' }}
    if: ${{ !cancelled() && !inputs.build_only && inputs.run_tests && (needs.build.result == 'success' || needs.reuse.result == 'success') }}
    env:
      CI_RUNNER_FAMILY: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Bootstrap clean runtime image
        if: ${{ inputs.validate_runtime }}
        run: apt-get update -qq && apt-get install -y --no-install-recommends sudo ca-certificates git python3 libstdc++6
      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fetch immutable package indexes to avoid mirror-sync mismatches,
          # and bound network stalls without weakening signature verification.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::By-Hash "force";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq


      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: actions/download-artifact@v4
        id: download_linux_test_programs
        with:
          name: linux-test-programs-${{ inputs.runner }}
          path: artifacts/ci-native
      - name: Unpack built Linux test programs
        id: unpack_linux_test_programs
        run: |
          tar -xzf artifacts/ci-native/linux-test-programs.tar.gz
          echo "LD_LIBRARY_PATH=$PWD/build/sdl3-ci/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install executable runtime dependencies
        run: |
          if [ "${{ inputs.runtime_packages }}" = true ]; then
            xargs sudo apt-get install -y --no-install-recommends < artifacts/ci-native/runtime-packages.txt
            sudo apt-get install -y --no-install-recommends python3 libgl1 libglu1-mesa libepoxy0 libgl1-mesa-dri xvfb xauth openbox x11-utils
            python3 .github/scripts/linux_runtime_packages.py build/linux/client/release --verify
          else
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git ${{ inputs.compiler }} python3 python3-venv scons pkg-config ccache \
            libfreetype-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libvorbis-dev libogg-dev libspeex-dev \
            libboost-date-time-dev libboost-thread-dev libboost-system-dev libssl-dev \
            zlib1g-dev libfribidi-dev libpcre3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libepoxy-dev libgl1-mesa-dri xvfb xauth openbox x11-utils
          fi

      - name: Plan native and auxiliary shard workloads
        id: shard_plan
        run: python3 test/ci_native_shard_plan.py --build-dir build/linux/client/release --timing-profile test/ci-timings/${{ inputs.runner }}.json --auxiliary-jobs test/ci-native-auxiliary.json --coverage-profile ${{ inputs.coverage_profile }} --count 4
      - name: Run the unit tests
        if: ${{ steps.shard_plan.outputs.run_the_unit_tests == format('{0}', matrix.shard) }}
        id: run_the_unit_tests
        continue-on-error: true
        run: python3 test/run_tests.py --binary unit --build-dir build/linux/client/release --display-jobs 1 --junit artifacts/tests/unit-junit.xml --write-timings artifacts/tests/unit.timings.json
      - name: Run the engine tests
        id: run_the_engine_tests
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        # The [map-generators] contract runs in the linux-map-generators telemetry job.
        run: python3 test/run_tests.py --binary engine --coverage-profile ${{ inputs.coverage_profile }} --write-inventory artifacts/tests/engine.inventory.json --build-dir build/linux/client/release --display-jobs 1 --fullscreen --shard ${{ matrix.shard }}/4 --exclude-tag map-generators --junit artifacts/tests/engine-junit.xml --timing-profile test/ci-timings/${{ inputs.runner }}.json --auxiliary-jobs test/ci-native-auxiliary.json --write-timings artifacts/tests/engine.timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-inventory-${{ inputs.runner }}-${{ matrix.shard }}
          path: |
            artifacts/tests/*.inventory.json
            artifacts/tests/*.timings.json
          if-no-files-found: error
      - name: Diagnose accelerated renderer crashes
        if: ${{ always() && steps.run_the_engine_tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GLOB2_TEST_DISPLAY: 1
          GLOB2_TEST_FULLSCREEN: 1
          SDL_AUDIODRIVER: dummy
        run: |
          # Retain the original failure; this separate invocation only collects a trace.
          if ! python3 - <<'PYTRACE'
          import xml.etree.ElementTree as ET
          report = ET.parse('artifacts/tests/engine-junit.xml')
          crashes = [case for case in report.iter('testcase')
                     if 'each accelerated backend uploads surface revisions independently' in case.get('name', '')
                     and case.find('error') is not None]
          raise SystemExit(0 if crashes else 1)
          PYTRACE
          then
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends gdb
          xvfb-run -a -s '-screen 0 1600x1400x24 -noreset' \
            gdb --batch -ex run -ex 'thread apply all bt' -ex 'info sharedlibrary' \
            --args build/linux/client/release/test/glob2-engine-tests \
            '-tc=each accelerated backend uploads surface revisions independently [display]' \
            --no-breaks=true > artifacts/tests/accelerated-renderer-gdb.log 2>&1

      - name: Upload native test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-${{ inputs.runner }}-${{ matrix.shard }}
          path: artifacts/tests/
          if-no-files-found: ignore

      - name: Test map JSON reports
        if: ${{ steps.shard_plan.outputs.test_map_json_reports == format('{0}', matrix.shard) }}
        id: test_map_json_reports
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'map report' 'python3 test/test_map_report.py build/linux/client/release/src/glob2 build/linux/client/release/test/MapReportHarness' \
            --check 'map telemetry' 'python3 test/test_map_telemetry.py'
      - name: Upload map JSON reports and command log
        id: upload_map_json_reports_and_command_log
        continue-on-error: true
        if: ${{ always() && steps.shard_plan.outputs.test_map_json_reports == format('{0}', matrix.shard) }}
        uses: actions/upload-artifact@v4
        with:
          name: map-report-${{ inputs.runner }}
          path: artifacts/map-report/

      - name: Test headless map CLI with the shared preview renderer
        if: ${{ steps.shard_plan.outputs.test_headless_map_cli_with_the_shared_preview_renderer == format('{0}', matrix.shard) }}
        id: test_headless_map_cli_with_the_shared_preview_renderer
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'generation only' 'python3 test/test_map_cli.py build/linux/client/release/src/glob2 --generation-only' \
            --check 'map CLI' 'python3 test/test_map_cli.py build/linux/client/release/src/glob2' \
            --check 'map image conversion' 'python3 test/test_map_image.py build/linux/client/release/src/glob2'
      - name: Upload map CLI previews and command log
        id: upload_map_cli_previews_and_command_log
        continue-on-error: true
        if: ${{ always() && steps.shard_plan.outputs.test_headless_map_cli_with_the_shared_preview_renderer == format('{0}', matrix.shard) }}
        uses: actions/upload-artifact@v4
        with:
          name: map-cli-${{ inputs.runner }}
          path: |
            artifacts/map-cli/
            artifacts/map-image/

      - name: Test tournament protocol, AI configuration and main CLI
        if: ${{ steps.shard_plan.outputs.test_tournament_protocol_ai_configuration_and_main_cli == format('{0}', matrix.shard) }}
        id: test_tournament_protocol_ai_configuration_and_main_cli
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check tournaments 'python3 test/test_tournaments.py' \
            --check 'tournament pipeline' 'python3 test/test_tournament_pipeline.py' \
            --check 'distributed map telemetry' 'python3 test/test_distributed_map_telemetry.py' \
            --check 'distributed game telemetry' 'python3 test/test_distributed_game_telemetry.py' \
            --check 'map fairness' 'python3 test/test_map_fairness_tournament.py' \
            --check 'map generation study' 'python3 test/test_map_generation_study.py' \
            --check 'fairness model' 'python3 test/test_fairness_model.py' \
            --check 'tournament CLI' 'python3 test/tournament_cli_integration.py --binary build/linux/client/release/src/glob2 --output artifacts/tournament-cli'
      - name: Retain tournament CLI compatibility evidence
        id: retain_tournament_cli_compatibility_evidence
        continue-on-error: true
        if: ${{ always() && steps.shard_plan.outputs.test_tournament_protocol_ai_configuration_and_main_cli == format('{0}', matrix.shard) }}
        uses: actions/upload-artifact@v4
        with:
          name: tournament-cli-${{ inputs.runner }}
          path: artifacts/tournament-cli/
          if-no-files-found: ignore

      - name: Verify save continuation traces
        if: ${{ steps.shard_plan.outputs.verify_save_continuation_traces == format('{0}', matrix.shard) }}
        id: verify_save_continuation_traces
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'shared runtime save continuation' 'python3 test/check_shared_runtime_save_continuation.py build/linux/client/release/src/glob2' \
            --check 'Maxima save continuation fixture' 'python3 test/maxima/check_save_continuation_fixture.py build/linux/client/release/src/glob2'

      - name: Verify default gradient schedule against cross-platform checksums
        if: ${{ steps.shard_plan.outputs.verify_default_gradient_schedule_against_cross_platform == format('{0}', matrix.shard) }}
        id: verify_default_gradient_schedule_against_cross_platform
        continue-on-error: true
        run: python3 test/check_telemetry_simulation.py build/linux/client/release/src/glob2

      - name: Verify parallel compute and save continuation
        if: ${{ steps.shard_plan.outputs.verify_parallel_compute_and_save_continuation == format('{0}', matrix.shard) }}
        id: verify_parallel_compute_and_save_continuation
        continue-on-error: true
        run: |
          python3 test/ci_run_commands.py \
            --check 'parallel compute' 'python3 test/check_parallel_compute.py build/linux/client/release/src/glob2' \
            --check 'gradient pipeline' 'python3 test/check_gradient_pipeline.py build/linux/client/release/src/glob2'
      - name: Build and run the LAN session regression
        if: ${{ steps.shard_plan.outputs.build_and_run_the_lan_session_regression == format('{0}', matrix.shard) }}
        id: build_and_run_the_lan_session_regression
        continue-on-error: true
        run: |
          python3 test/run_lan_session_test.py build/linux/client/release/src/LANSessionHarness
          python3 test/run_lan_session_test.py build/linux/client/release/src/LANSessionHarness \
            --play 30 --output artifacts/lan-play-test

      - name: Test front-end colony isolation and menu navigation
        if: ${{ steps.shard_plan.outputs.test_front_end_colony_isolation_and_menu_navigation == format('{0}', matrix.shard) }}
        id: test_front_end_colony_isolation_and_menu_navigation
        continue-on-error: true
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/linux/client/release/test/MenuColonyHarness check data/menu/colony.bin
          ./build/linux/client/release/test/MenuColonyHarness navigation unused

      - name: Retain browser/native simulation trace
        if: ${{ steps.shard_plan.outputs.retain_browser_native_simulation_trace == format('{0}', matrix.shard) }}
        id: retain_browser_native_simulation_trace
        continue-on-error: true
        run: python3 test/run-browser-determinism.py build/linux/client/release/src/glob2 artifacts/browser-determinism/native
      - uses: actions/upload-artifact@v4
        if: ${{ steps.shard_plan.outputs.retain_browser_native_simulation_trace == format('{0}', matrix.shard) }}
        id: upload_artifact_1
        continue-on-error: true
        with:
          name: browser-determinism-${{ inputs.runner }}
          path: artifacts/browser-determinism/native/

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-tests-${{ inputs.compiler }}-${{ matrix.shard }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore


  audit:
    name: Audit native shard coverage (${{ inputs.runner }})
    needs: tests
    if: ${{ !cancelled() && inputs.run_tests }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-test-results-${{ inputs.runner }}-*
          path: artifacts/ci-inventories
      - run: python3 .github/scripts/ci_inventory.py artifacts/ci-inventories --shards 4

  generators:
    name: Map generators (${{ inputs.runner }}, ${{ matrix.suite }})
    needs: [build, reuse]
    if: ${{ !cancelled() && !inputs.build_only && inputs.map_generators && (needs.build.result == 'success' || needs.reuse.result == 'success') }}
    runs-on: ${{ inputs.runner }}
    env:
      CCACHE: 1
      CCACHE_DIR: /tmp/glob2-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.coverage_profile == 'full' && '["sweep-a","sweep-b","telemetry"]' || '["golden","telemetry"]') }}
    steps:
      - uses: actions/checkout@v4
        id: actions_checkout_v4_1
        with:
          ref: ${{ inputs.revision || github.sha }}

      # Main builds already include both programs. Reuse the exact binaries;
      # map-only diffs skip that build and keep the standalone path below.
      - uses: actions/download-artifact@v4
        id: download_linux_test_programs
        with:
          name: linux-test-programs-${{ inputs.runner }}
          path: artifacts/ci-native
      - name: Unpack built Linux test programs
        id: unpack_linux_test_programs
        run: |
          tar -xzf artifacts/ci-native/linux-test-programs.tar.gz
          echo "LD_LIBRARY_PATH=$PWD/build/sdl3-ci/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install executable runtime dependencies
        run: |
          sudo apt-get update -qq
          xargs sudo apt-get install -y --no-install-recommends < artifacts/ci-native/runtime-packages.txt
          sudo apt-get install -y --no-install-recommends python3 libgl1 libglu1-mesa libepoxy0 libgl1-mesa-dri xvfb xauth openbox x11-utils
          python3 .github/scripts/linux_runtime_packages.py build/linux/client/release --verify

      - name: Check secondary-platform golden rows
        if: ${{ matrix.suite == 'golden' }}
        run: timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest glob2-golden-rows --require-rows

      - name: Check golden maps and sweep colony counts
        id: check_golden_maps_and_sweep_colony_counts
        if: ${{ startsWith(matrix.suite, 'sweep-') }}
        continue-on-error: true
        run: |
          # The two jobs divide the four independent sweep shards between runners.
          # Run golden rows alongside the first pair of shards.
          golden() { log=$1; shift; timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest "$@" > "$log" 2>&1; }
          if [ '${{ matrix.suite }}' = sweep-a ]; then
            golden /tmp/golden-rows.log glob2-golden-rows --require-rows & rows=$!
            shards=(0 1)
          else
            shards=(2 3)
          fi
          sweeps=()
          for shard in "${shards[@]}"; do
            golden /tmp/golden-sweep-$shard.log glob2-golden-sweep-$shard --sweep $shard/4 & sweeps+=($!)
          done
          status=0
          if [ '${{ matrix.suite }}' = sweep-a ]; then
            if ! wait $rows; then
              status=1
              golden /tmp/golden-print.log glob2-golden-print --print || true
              cat /tmp/golden-print.log
            fi
            cat /tmp/golden-rows.log
          fi
          for i in "${!shards[@]}"; do
            wait ${sweeps[$i]} || status=1
            cat /tmp/golden-sweep-${shards[$i]}.log
          done
          [ $status = 0 ]

      - name: Check generator telemetry equivalence and cost
        id: check_generator_telemetry_equivalence_and_cost
        if: ${{ matrix.suite == 'telemetry' }}
        continue-on-error: true
        run: |
          # These checks use separate profiles and can share the runner's cores.
          timeout 600s ./build/linux/client/release/src/MapGeneratorGoldenTest glob2-telemetry-ci --telemetry > /tmp/map-telemetry.log 2>&1 & telemetry=$!
          defaults=
          if [ '${{ inputs.coverage_profile }}' = full ]; then
            python3 test/run_tests.py --binary engine --build-dir build/linux/client/release --tag map-generators --junit artifacts/tests/map-generators-junit.xml > /tmp/map-defaults.log 2>&1 & defaults=$!
          fi
          status=0
          wait "$telemetry" || status=1
          if [ -n "$defaults" ]; then wait "$defaults" || status=1; cat /tmp/map-defaults.log; fi
          cat /tmp/map-telemetry.log
          [ "$status" -eq 0 ]

      - name: Summarize CI failures
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 test/ci_step_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-observation-generators-${{ inputs.compiler }}-${{ matrix.suite }}
          path: artifacts/ci-observation/
          if-no-files-found: ignore
