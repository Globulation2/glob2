name: Steam Windows package

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/steam-windows-package.yml
      - tools/package_steam_windows.py
      - test/test_steam_windows_package.py
      - .github/workflows/steam-windows-upload.yml
      - docs/development/reference.md

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-ccache
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check packaging helper
        run: python -m unittest discover -s test -p test_steam_windows_package.py
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-
      - name: Build release client
        run: |
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1 server=0 build/mingw/client/release/src/glob2.exe
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always()
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage Steam depot files
        run: |
          python tools/package_steam_windows.py \
            --sdl-runtime build/sdl3-ci/prefix/bin \
            --source . \
            --exe build/mingw/client/release/src/glob2.exe \
            --runtime "$(cygpath -w /mingw64/bin)" \
            --output artifacts/steam/windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glob2-steam-windows-${{ github.sha }}
          path: artifacts/steam/windows/
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: fixture
          sparse-checkout: games/cross-replay.game.gz
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glob2-steam-windows-${{ github.sha }}
          path: ${{ runner.temp }}/glob2-depot
      - name: Run staged game without build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depot = Join-Path $env:RUNNER_TEMP 'glob2-depot'
          $env:GLOB2_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'glob2-profile'
          $env:GLOB2_ASSET_DIR = $depot
          Set-Location $depot
          & .\glob2.exe --nox "$env:GITHUB_WORKSPACE\fixture\games\cross-replay.game.gz" 10 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
