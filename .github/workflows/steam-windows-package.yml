name: Steam Windows package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable public release tag
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    outputs:
      source_sha:
        value: ${{ jobs.package.outputs.source_sha }}

# Packaging belongs to explicit release calls/dispatches. Its literal prefix
# keeps callable packaging distinct from the release caller's concurrency group.
concurrency:
  group: steam-windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      cli_version: ${{ steps.check.outputs.cli_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public release tag and source commit
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          version="$(python3 tools/release/release.py check --tag "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f src/app/cli/CommandLine.h; then
            grep -Eq 'Version = 2;' src/app/cli/CommandLine.h
            echo 'cli_version=2' >> "$GITHUB_OUTPUT"
          else
            echo 'cli_version=1' >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: preflight
    outputs:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.ref == 'refs/heads/master'
    runs-on: windows-2022
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned asset encoder
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: Pillow==12.2.0
          $encoder = (Get-Command python).Source
          "GLOB2_ASSET_ENCODER_PYTHON=$encoder" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make mingw-w64-x86_64-nasm mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-scons
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libsystre mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - name: Check packaging helper
        run: python -m unittest discover -s test -p test_steam_windows_package.py
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-
      - name: Build release client
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}"
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          echo "$PWD/build/sdl3-ci/prefix/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons -j$(nproc) release=1 mingw=1 server=0 lean_images=1 build/mingw/client/release/lean-images/src/glob2.exe
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always()
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage Steam depot files
        run: |
          python tools/package_steam_windows.py \
            --sdl-runtime build/sdl3-ci/prefix/bin \
            --source . \
            --exe build/mingw/client/release/lean-images/src/glob2.exe \
            --runtime "$(cygpath -w /mingw64/bin)" \
            --output artifacts/steam/windows
          git rev-parse HEAD > artifacts/steam/windows/source-commit.txt
          (cd artifacts/steam/windows && sha256sum source-commit.txt >> SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glob2-steam-windows-${{ needs.preflight.outputs.source_sha }}
          path: artifacts/steam/windows/
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    needs: [preflight, package]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
          path: fixture
          sparse-checkout: games/cross-replay.game.gz
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glob2-steam-windows-${{ needs.preflight.outputs.source_sha }}
          path: ${{ runner.temp }}/glob2-depot
      - name: Run staged game without build tools
        shell: pwsh
        env:
          CLI_VERSION: ${{ needs.preflight.outputs.cli_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $depot = Join-Path $env:RUNNER_TEMP 'glob2-depot'
          $env:GLOB2_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'glob2-profile'
          $env:GLOB2_ASSET_DIR = $depot
          Set-Location $depot
          $save = "$env:GITHUB_WORKSPACE\fixture\games\cross-replay.game.gz"
          switch ($env:CLI_VERSION) {
            '1' { $repeatArgs = @('--nox', $save, '10', '1') }
            '2' { $repeatArgs = @('game', 'repeat', $save, '--ticks', '10', '--runs', '1') }
            default { throw 'Unsupported source CLI version' }
          }
          & .\glob2.exe @repeatArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
