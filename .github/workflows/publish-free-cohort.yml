name: Publish a qualified free release cohort

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable public version tag for this new release cohort
        required: true
        type: string
      bundle_url:
        description: HTTPS tar.gz containing final packages, source archive and schema-2 inventory
        required: true
        type: string
      bundle_sha256:
        description: Reviewed final bundle SHA-256
        required: true
        type: string
      qualification_url:
        description: HTTPS schema-2 qualification for these exact final bytes and profiles
        required: true
        type: string
      qualification_sha256:
        description: Reviewed qualification SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-all-platform-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'genixpro/glob2-release' &&
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.triggering_actor == 'genixpro' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'
    environment: github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source and reviewed final bytes
        env:
          TAG: ${{ inputs.tag }}
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          QUALIFICATION_URL: ${{ inputs.qualification_url }}
          QUALIFICATION_SHA256: ${{ inputs.qualification_sha256 }}
        run: |
          set -euo pipefail
          python3 tools/release/release.py check --tag "$TAG"
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          for prefix in ('BUNDLE', 'QUALIFICATION'):
              url=urlsplit(os.environ[prefix+'_URL'])
              if url.scheme!='https' or not url.hostname or url.username or url.password:
                  raise SystemExit('Evidence must use HTTPS without credentials')
              if not re.fullmatch('[0-9a-f]{64}',os.environ[prefix+'_SHA256']):
                  raise SystemExit('Invalid reviewed SHA-256')
          PY
          mkdir -p artifacts
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$BUNDLE_URL" --output artifacts/cohort.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$QUALIFICATION_URL" --output artifacts/qualification.json
          echo "$BUNDLE_SHA256  artifacts/cohort.tar.gz" | sha256sum --check
          echo "$QUALIFICATION_SHA256  artifacts/qualification.json" | sha256sum --check
          python3 tools/release/staged_bundle.py artifacts/cohort.tar.gz artifacts/cohort
          python3 tools/release/downloads_manifest.py --staged --artifacts artifacts/cohort \
            --inventory artifacts/cohort/package-inventory.json --qualification artifacts/qualification.json \
            --tag "$TAG" --source-commit "$(git rev-parse HEAD)" \
            --output artifacts/cohort/downloads-manifest.json --checksums artifacts/cohort/SHA256SUMS
      - name: Publish the immutable selected cohort
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_GH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('artifacts/cohort')
          def digest(path):
              with path.open('rb') as source: return hashlib.file_digest(source, 'sha256').hexdigest()
          expected={p.name:digest(p) for p in root.iterdir()}
          # An existing public tag is immutable. An interrupted draft can be resumed
          # only after comparing all previously uploaded bytes.
          result=subprocess.run(['gh','api','repos/Globulation2/glob2/releases/tags/'+os.environ['TAG']],capture_output=True,text=True)
          if result.returncode == 0:
              release=json.loads(result.stdout)
              if not release['draft']: raise SystemExit('Published releases cannot be changed')
              names=[asset['name'] for asset in release['assets']]
              if len(names)!=len(set(names)) or not set(names)<=set(expected):
                  raise SystemExit('Existing draft contains assets outside this qualified cohort')
              existing=Path('artifacts/existing'); existing.mkdir()
              if release['assets']: subprocess.run(['gh','release','download',os.environ['TAG'],'--repo','Globulation2/glob2','--dir',str(existing)],check=True)
              for path in existing.iterdir():
                  if path.name not in expected or digest(path)!=expected[path.name]:
                      raise SystemExit('Existing draft differs from this qualified cohort')
              missing=[str(root/name) for name in expected if not (existing/name).exists()]
              if missing: subprocess.run(['gh','release','upload',os.environ['TAG'],'--repo','Globulation2/glob2',*missing],check=True)
          else:
              if '404' not in result.stderr: raise SystemExit(result.stderr)
              subprocess.run(['gh','release','create',os.environ['TAG'],'--repo','Globulation2/glob2','--verify-tag','--draft','--generate-notes',*[str(root/name) for name in expected]],check=True)
          PY
          gh release edit "$TAG" --repo Globulation2/glob2 --draft=false
          echo 'Published selected qualified channels. Other channels remain unavailable.' >> "$GITHUB_STEP_SUMMARY"
