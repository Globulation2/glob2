name: macOS capability map observations
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GLOB2_DEV_MODE: isolated
jobs:
  observations:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install development dependencies
        run: brew install cmake freetype libpng jpeg-turbo scons pkgconf opusfile opus libogg speex openssl@3 boost fribidi libepoxy
      - uses: ./.github/actions/sdl3
        with:
          cc: clang
          cxx: clang++
      - name: Build exact golden observation tool
        run: |
          mkdir -p artifacts/capability-map-goldens
          openssl="$(brew --prefix openssl@3)"
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons release=1 server=0 -j3 map-generator-golden-test \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib" > artifacts/capability-map-goldens/build.log 2>&1
      - name: Observe existing capability outputs without updating baselines
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          { git rev-parse HEAD; git rev-parse HEAD^; uname -a; clang++ --version; shasum -a256 build/darwin/client/release/src/MapGeneratorGoldenTest; brew list --versions; } > artifacts/capability-map-goldens/provenance.txt
          build/darwin/client/release/src/MapGeneratorGoldenTest glob2-capability-goldens --print --only=swamp,river,islands,crater-lakes,shattered-coast > artifacts/capability-map-goldens/observed-rows.txt
          build/darwin/client/release/src/MapGeneratorGoldenTest glob2-capability-goldens-repeat --print --only=swamp,river,islands,crater-lakes,shattered-coast > artifacts/capability-map-goldens/repeated-rows.txt
          cmp artifacts/capability-map-goldens/observed-rows.txt artifacts/capability-map-goldens/repeated-rows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-map-goldens-macos-arm64
          path: artifacts/capability-map-goldens/
          if-no-files-found: error
