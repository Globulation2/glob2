name: macOS development validation
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source revision to validate
        type: string
        required: true
      coverage_profile:
        description: Native regression coverage profile
        type: choice
        options: [compatibility, full]
        default: full
      ios_localization:
        description: Run only focused unsigned iOS simulator localization qualification
        type: boolean
        default: false
      locale:
        description: Reviewed localization to qualify (currently th)
        type: string
        default: th
  workflow_call:
    inputs:
      revision:
        type: string
        default: ""
      coverage_profile:
        type: string
        default: compatibility
concurrency:
  group: macos-development-${{ github.ref }}-${{ inputs.revision }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}
permissions:
  contents: read
env:
  GLOB2_DEV_MODE: isolated
jobs:
  native:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ios_localization) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install development dependencies
        run: brew install cmake freetype libpng jpeg-turbo scons pkgconf opusfile opus libogg speex openssl@3 boost fribidi libepoxy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: asset_encoder_python
        with:
          python-version: '3.12'
      - name: Select the pinned asset encoder interpreter
        run: echo "GLOB2_ASSET_ENCODER_PYTHON=$(python3 tools/package_assets.py --encoder-python)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/sdl3
        with:
          cc: clang
          cxx: clang++
      - name: Compile unsigned game and tests
        id: build
        run: |
          openssl="$(brew --prefix openssl@3)"
          python3 scons/sdl3_dependencies.py --prefix build/sdl3-ci/prefix --work build/sdl3-ci/sources --jobs 2
          export PATH="$PWD/build/sdl3-ci/prefix/bin:$PATH"
          GLOB2_SDL3_PREFIX=build/sdl3-ci/prefix scons release=1 server=0 -j2 \
            build/darwin/client/release/src/glob2 unit-tests engine-tests map-generator-golden-test \
            CXXFLAGS="-I$openssl/include" LINKFLAGS="-L$openssl/lib"
      - name: Execute selected regression cases and continuation
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 test/ci_run_commands.py \
            --check 'macOS regression cases' 'python3 test/run_tests.py --binary engine --build-dir build/darwin/client/release --coverage-profile ${{ inputs.coverage_profile }} --no-display --junit artifacts/tests/engine-junit.xml --exclude-tag map-generators --write-inventory artifacts/tests/engine.inventory.json' \
            --check 'unit tests' 'python3 test/run_tests.py --binary unit --build-dir build/darwin/client/release --no-display --junit artifacts/tests/unit-junit.xml' \
            --check 'CLI continuation' 'python3 test/test_cli_smoke.py --binary build/darwin/client/release/src/glob2 --artifacts artifacts/cli-smoke'
      - name: Retain native simulation and scripting evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          python3 test/run-browser-determinism.py build/darwin/client/release/src/glob2 artifacts/browser-determinism --engine-binary build/darwin/client/release/test/glob2-engine-tests
          python3 test/check_javascript.py build/darwin/client/release/src/glob2 --output artifacts/javascript-profile
          python3 test/check_javascript_corpus.py --build-dir build/darwin/client/release --output artifacts/javascript-corpus
      - name: Verify accepted generator fingerprints and retain observations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/sdl3-ci/prefix/lib"
          mkdir -p artifacts/generator-check-profile
          python3 test/ci_run_commands.py \
            --check 'accepted generator fingerprints' 'build/darwin/client/release/src/MapGeneratorGoldenTest artifacts/generator-check-profile --require-rows' \
            --check 'generator fingerprints' 'python3 test/collect_generator_evidence.py collect build/darwin/client/release/src/MapGeneratorGoldenTest artifacts/generator-evidence --platform macos-arm64' \
            --check 'resource design fingerprints' "python3 test/run_tests.py --binary engine --build-dir build/darwin/client/release --in-process --no-display --filter 'MapGeneratorDefaults/Explicit designs preserve topology*' --artifacts artifacts/generator-evidence/designs --junit artifacts/generator-evidence/designs-junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-observations-macos
          path: artifacts/generator-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-determinism-macos
          path: artifacts/browser-determinism/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-profile-macos
          path: |
            artifacts/javascript-corpus/
            artifacts/javascript-profile/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-validation
          path: |
            artifacts/tests/
            artifacts/cli-smoke/

  ios-localization:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_localization }}
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned build drivers
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-localization-tools"
          "$RUNNER_TEMP/ios-localization-tools/bin/pip" install scons==4.11.1 cmake==4.4.3
          echo "$RUNNER_TEMP/ios-localization-tools/bin" >> "$GITHUB_PATH"
          brew install autoconf automake libtool nasm pkgconf
      - name: Select and verify the existing pinned Xcode
        id: ios_toolchain
        run: python3 mobile/ios_localization_qa.py select-xcode
      - name: Restore validated simulator dependencies
        uses: actions/cache@v4
        with:
          path: build/ios/simulator/arm64/15.0/client/release/vcpkg-installed
          key: ios-simulator-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios_toolchain.outputs.fingerprint }}-${{ hashFiles('mobile/toolchain.json', 'mobile/vcpkg.json', 'mobile/dependencies.py', 'mobile/triplets/**', 'scons/vcpkg-ports/**', 'scons/mobile_toolchain.py') }}
      - name: Build pinned simulator dependencies and unsigned release app
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-localization
          python3 mobile/dependencies.py --target ios --environment simulator --release --jobs 2 2>&1 | tee artifacts/ios-localization/dependencies.log
          python3 mobile/ios.py build --environment simulator --release --jobs 2 2>&1 | tee artifacts/ios-localization/build.log
      - name: Qualify actual simulator bundle and native lifecycle
        env:
          QA_LOCALE: ${{ inputs.locale }}
        run: python3 mobile/ios_localization_qa.py run --locale "$QA_LOCALE"
      - name: Clean up only the recorded owned simulator
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python3 mobile/ios_localization_qa.py cleanup
      - name: Preserve the tested app and symbols
        if: ${{ !cancelled() }}
        run: |
          product=build/ios/simulator/arm64/15.0/client/release/xcode-project/build/Release-iphonesimulator
          if test -d "$product/Glob2.app"; then
            if test -d "$product/Glob2.app.dSYM"; then
              tar -C "$product" -czf artifacts/ios-localization/app.tar.gz Glob2.app Glob2.app.dSYM
            else
              tar -C "$product" -czf artifacts/ios-localization/app.tar.gz Glob2.app
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        with:
          name: ios-localization-${{ inputs.locale }}-${{ github.run_attempt }}
          path: artifacts/ios-localization/
          if-no-files-found: error
