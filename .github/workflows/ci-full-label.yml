name: full matrix on request

# Pull requests run the fast gate (ci-fast.yml). Labelling one ci:full runs the full
# development matrix (build.yml) on its head revision; later pushes rerun it while
# the label stays. See "Hosted verification and regression detection" in
# docs/development/verification.md.
on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

# Runs that will not verify anything (another label added, or no ci:full label)
# get their own group, so they never cancel a full run already in progress.
concurrency:
  group: ci-full-${{ github.ref }}${{ !(contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) && format('-idle-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

permissions:
  contents: read
  actions: read

jobs:
  full:
    name: Full matrix (ci:full)
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full') }}
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ github.event.pull_request.head.sha }}
