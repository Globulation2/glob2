name: Propose Flathub update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flathub-update
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner-controlled release repository and dispatch
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID" != 1397722696 || "$ACTOR_ID" != 6193625 || "$TRIGGERING_ACTOR" != genixpro || "$EVENT_NAME" != workflow_dispatch || "$REF" != refs/heads/master ]]; then
            echo '::error::Flathub publication requires a manual dispatch from the release repository master by its owner.'
            exit 1
          fi

  credentials:
    needs: context
    runs-on: ubuntu-24.04
    environment: flathub-update
    steps:
      - name: Require Flathub fork and token
        env:
          FORK: ${{ vars.FLATHUB_FORK }}
          FORK_TOKEN: ${{ secrets.FLATHUB_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$FORK_TOKEN" ]]; then
            echo '::error::Missing FLATHUB_GH_TOKEN in the flathub-update environment.'
            exit 1
          fi
          if [[ ! "$FORK" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo '::error::Missing or invalid FLATHUB_FORK variable.'
            exit 1
          fi

  build:
    needs: credentials
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Globulation2/glob2
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag and render pinned manifest
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git \
            "refs/tags/$TAG:refs/tags/$TAG"
          python3 tools/release/release.py check --tag "$TAG"
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          python3 tools/release/render_flatpak.py "$revision" \
            flatpak/org.globulation2.Globulation2.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: glob2.flatpak
          manifest-path: flatpak/org.globulation2.Globulation2.yml
          cache-key: glob2-flatpak-${{ steps.source.outputs.revision }}
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flathub-candidate
          path: flatpak/org.globulation2.Globulation2.yml
          if-no-files-found: error

  propose:
    needs: build
    runs-on: ubuntu-24.04
    environment: flathub-update
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flathub-candidate
          path: artifacts/flathub
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_GH_TOKEN }}
          FORK: ${{ vars.FLATHUB_FORK }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          [[ "$FORK" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          branch="glob2-${TAG}-${GITHUB_RUN_ID}"
          gh repo clone "$FORK" flathub-recipe
          cd flathub-recipe
          git switch -c "$branch"
          cp ../artifacts/flathub/org.globulation2.Globulation2.yml \
            org.globulation2.Globulation2.yml
          git add org.globulation2.Globulation2.yml
          git -c user.name='Globulation 2 release bot' \
            -c user.email='glob2-devel@nongnu.org' \
            commit -m "Update Globulation 2 to $TAG"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --repo flathub/org.globulation2.Globulation2 \
            --base master --head "${FORK%%/*}:$branch" \
            --title "Update Globulation 2 to $TAG" \
            --body "Pin the upstream source to $TAG. Built by the manually dispatched Globulation 2 release workflow."
          echo "Proposed Flathub update from public tag $TAG; Flathub review remains." >> "$GITHUB_STEP_SUMMARY"
