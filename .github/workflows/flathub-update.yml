name: Propose Flathub update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vVERSION tag at the mirrored HEAD
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flathub-update
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository_id == 1397722696 &&
      github.actor_id == 6193625 &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify tag and render pinned manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          git fetch --no-tags https://github.com/Globulation2/glob2.git \
            "refs/tags/$TAG:refs/tags/$TAG"
          python3 tools/release/release.py check --tag "$TAG"
          python3 tools/release/render_flatpak.py "$GITHUB_SHA" \
            flatpak/org.globulation2.Globulation2.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: glob2.flatpak
          manifest-path: flatpak/org.globulation2.Globulation2.yml
          cache-key: glob2-flatpak-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flathub-candidate
          path: flatpak/org.globulation2.Globulation2.yml
          if-no-files-found: error

  propose:
    needs: build
    runs-on: ubuntu-24.04
    environment: flathub-update
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flathub-candidate
          path: artifacts/flathub
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_GH_TOKEN }}
          FORK: ${{ vars.FLATHUB_FORK }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          [[ "$FORK" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          branch="glob2-${TAG}-${GITHUB_RUN_ID}"
          gh repo clone "$FORK" flathub-recipe
          cd flathub-recipe
          git switch -c "$branch"
          cp ../artifacts/flathub/org.globulation2.Globulation2.yml \
            org.globulation2.Globulation2.yml
          git add org.globulation2.Globulation2.yml
          git -c user.name='Globulation 2 release bot' \
            -c user.email='glob2-devel@nongnu.org' \
            commit -m "Update Globulation 2 to $TAG"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --repo flathub/org.globulation2.Globulation2 \
            --base master --head "${FORK%%/*}:$branch" \
            --title "Update Globulation 2 to $TAG" \
            --body "Pin the upstream source to $TAG. Built by the manually dispatched Globulation 2 release workflow."
          echo "Proposed Flathub update $TAG from $GITHUB_SHA; Flathub review remains." >> "$GITHUB_STEP_SUMMARY"
