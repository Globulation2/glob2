# APK packaging holds the indexed artwork bundle in memory while Zipflinger writes it.
# Gradle's default 512 MiB heap is too small for the complete asset inventory.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# The Google Play build's Age Signals library (platforms/mobile/android-play) depends
# on AndroidX; AGP refuses AndroidX dependencies unless this is on. Builds without
# that library have no AndroidX dependencies, so it changes nothing for them.
android.useAndroidX=true
