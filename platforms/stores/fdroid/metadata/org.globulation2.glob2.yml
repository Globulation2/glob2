Categories:
  - Strategy Game
License: GPL-3.0-or-later
AuthorName: Globulation 2 contributors
WebSite: https://www.globulation2.org/
SourceCode: https://github.com/Globulation2/glob2
IssueTracker: https://github.com/Globulation2/glob2/issues

RepoType: git
Repo: https://github.com/Globulation2/glob2.git

Builds:
  - versionName: 0.11.0.0
    versionCode: 1100001
    commit: v0.11.0.0
    timeout: 10800
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends git python3 python3-pip python3-venv
        g++ make cmake ninja-build scons pkg-config unzip zip autoconf automake libtool
        curl perl nasm
    output: build/fdroid-output.apk
    rm:
      - .github/ci/history.json.gz
      - .github/ci/model.json.gz
      - test/fixtures
      - test/maxima/fixtures
      - platform/apps/engine-agent/fixtures/ais
      - datasrc
      - games
    prebuild: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
    scanignore:
      - maps/*.map.gz
      - campaigns/*.map.gz
      - data/menu/colony.bin
    build: python3 platforms/mobile/fdroid_build.py --version-code $$VERCODE$$ --android-sdk
      $$SDK$$ --android-ndk $$NDK$$
    ndk: 28.2.13676358

