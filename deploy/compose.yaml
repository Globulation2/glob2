# Self-hosted Globulation 2 platform: everything an instance needs.
# Setup, operations and upgrades: docs/hosting/README.md.
#
#   caddy            public TLS edge: web app, web client, /api, /realtime, /relay
#   postgres         state, job queue, pub/sub, leader lock
#   init             one-shot: first signing key, relay and agent keys, database
#                    roles and passwords, migrations (the only superuser client)
#   platform-api     REST, realtime, sign-in, JWKS, /internal (N replicas)
#   platform-worker  engine-job results, matchmaker, ratings, schedules
#   engine-agent     engine jobs for one sim version (N replicas); no database
#                    access, only platform-api's internal engine API
#   relay            match WebSockets (N replicas)
#
# Database roles (docs/hosting/README.md, "Database roles"): glob2 is the
# postgres image's superuser and only init uses it; migrations run as
# glob2_migrator, platform-api as glob2_api, platform-worker as glob2_worker.
# init generates each role's password into its own volume, mounted only by the
# service that uses it.
#
# Configuration: deploy/.env (copy .env.example) and deploy/instance.yaml
# (copy platform/instance.example.yaml).
name: glob2-platform

x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: ['/tmp:size=64m,mode=1777']
  logging:
    driver: local
    options: {max-size: 20m, max-file: '5'}

x-platform-image: &platform-image
  image: ${GLOB2_PLATFORM_IMAGE:-glob2-platform:development}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: platform
    args: {JOBS: '${GLOB2_BUILD_JOBS:-4}'}

x-platform-environment: &platform-environment
  PUBLIC_ORIGIN: ${GLOB2_PUBLIC_ORIGIN:-https://localhost:8443}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INSTANCE_CONFIG: /etc/glob2/instance.yaml
  SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-25}
  JWT_KEYS_DIR: /var/lib/glob2/keys
  JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-}
  # Bearer key relays present on /internal/v1 (generated by init; one entry
  # per line, `<key>` or `<relayId>:<key>`). RELAY_KEYS in .env adds more.
  RELAY_KEYS_FILE: /var/lib/glob2/relay/relay.key
  # Bearer key engine agents present on /internal/v1/engine (generated by init).
  ENGINE_AGENT_KEYS_FILE: /var/lib/glob2/engine-agent/agent.key
  # Never in a service's environment (env_file below would otherwise copy it).
  POSTGRES_PASSWORD: ''

x-instance-config: &instance-config
  type: bind
  source: ${GLOB2_INSTANCE_CONFIG:-./instance.yaml}
  target: /etc/glob2/instance.yaml
  read_only: true

services:
  postgres:
    <<: *hardening
    image: ${GLOB2_POSTGRES_IMAGE:-postgres:16-alpine}
    user: '70:70'
    shm_size: 256m
    tmpfs: ['/tmp:size=64m,mode=1777', '/var/run/postgresql:size=1m,uid=70,gid=70,mode=0775']
    environment:
      POSTGRES_USER: glob2
      POSTGRES_DB: glob2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, pg_isready, -U, glob2, -d, glob2]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  init:
    <<: [*hardening, *platform-image]
    restart: 'no'
    command: [glob2-platform-init]
    environment:
      <<: *platform-environment
      # Superuser, for creating the roles (and handing an older database's
      # objects to glob2_migrator); migrations then run as glob2_migrator.
      ADMIN_DATABASE_URL: postgres://glob2:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/glob2
      DATABASE_URL: postgres://glob2_migrator@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/migrator/password
      DB_MIGRATOR_PASSWORD_FILE: /var/lib/glob2/db/migrator/password
      DB_API_PASSWORD_FILE: /var/lib/glob2/db/api/password
      DB_WORKER_PASSWORD_FILE: /var/lib/glob2/db/worker/password
    volumes:
      - signing-keys:/var/lib/glob2/keys
      - relay-secret:/var/lib/glob2/relay
      - engine-agent-secret:/var/lib/glob2/engine-agent
      - db-migrator-secret:/var/lib/glob2/db/migrator
      - db-api-secret:/var/lib/glob2/db/api
      - db-worker-secret:/var/lib/glob2/db/worker
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  platform-api:
    <<: [*hardening, *platform-image]
    command: [node, apps/api/src/main.ts]
    environment:
      AI_STUDIO_OPENAI_API_KEY: ${AI_STUDIO_OPENAI_API_KEY:-}
      AI_STUDIO_STRIPE_SECRET_KEY: ${AI_STUDIO_STRIPE_SECRET_KEY:-}
      AI_STUDIO_STRIPE_WEBHOOK_SECRET: ${AI_STUDIO_STRIPE_WEBHOOK_SECRET:-}
      GENERATOR_STUDIO_OPENAI_API_KEY: ${GENERATOR_STUDIO_OPENAI_API_KEY:-}
      GENERATOR_STUDIO_STRIPE_SECRET_KEY: ${GENERATOR_STUDIO_STRIPE_SECRET_KEY:-}
      GENERATOR_STUDIO_STRIPE_WEBHOOK_SECRET: ${GENERATOR_STUDIO_STRIPE_WEBHOOK_SECRET:-}
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_api@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/api/password
      HIVE_OPENAI_API_KEY: ${HIVE_OPENAI_API_KEY:-}
      HIVE_STRIPE_SECRET_KEY: ${HIVE_STRIPE_SECRET_KEY:-}
      HIVE_STRIPE_WEBHOOK_SECRET: ${HIVE_STRIPE_WEBHOOK_SECRET:-}
      MAP_STRIPE_SECRET_KEY: ${MAP_STRIPE_SECRET_KEY:-}
      MAP_STRIPE_WEBHOOK_SECRET: ${MAP_STRIPE_WEBHOOK_SECRET:-}
      TERRAIN_STRIPE_SECRET_KEY: ${TERRAIN_STRIPE_SECRET_KEY:-}
      TERRAIN_STRIPE_WEBHOOK_SECRET: ${TERRAIN_STRIPE_WEBHOOK_SECRET:-}
      MUSIC_STRIPE_SECRET_KEY: ${MUSIC_STRIPE_SECRET_KEY:-}
      MUSIC_STRIPE_WEBHOOK_SECRET: ${MUSIC_STRIPE_WEBHOOK_SECRET:-}
    # Provider secrets named in instance.yaml (`clientSecretEnv: …`) come from .env.
    env_file:
      - path: ${GLOB2_ENV_FILE:-.env}
        required: false
    volumes:
      - signing-keys:/var/lib/glob2/keys:ro
      - relay-secret:/var/lib/glob2/relay:ro
      - engine-agent-secret:/var/lib/glob2/engine-agent:ro
      - db-api-secret:/var/lib/glob2/db/api:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    # backend: postgres, relays, Caddy. egress: OIDC discovery and token calls.
    networks: [backend, egress]
    deploy:
      replicas: ${GLOB2_API_REPLICAS:-2}
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      init: {condition: service_completed_successfully}

  platform-worker:
    <<: [*hardening, *platform-image]
    command: [node, apps/worker/src/main.ts]
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      WARM_MAPS_PER_ENTRY: ${WARM_MAPS_PER_ENTRY:-2}
      WARM_MAPS_MAX_PER_ENTRY: ${WARM_MAPS_MAX_PER_ENTRY:-8}
      # Only platform-api checks relay and agent keys.
      RELAY_KEYS_FILE: ''
      ENGINE_AGENT_KEYS_FILE: ''
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend]
    deploy:
      replicas: ${GLOB2_WORKER_REPLICAS:-1}
    stop_grace_period: 40s
    depends_on:
      init: {condition: service_completed_successfully}

  # One service per sim version served. To keep serving an older version (its
  # verify-match jobs, its rooms), add a second service with that version's
  # image; see docs/hosting/README.md, "Sim versions".
  music-worker:
    <<: *hardening
    image: ${GLOB2_MUSIC_IMAGE:-glob2-music-worker:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: music-worker
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      RELAY_KEYS_FILE: ''
      ENGINE_AGENT_KEYS_FILE: ''
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend]
    tmpfs: ['/tmp:size=6g,mode=1777']
    mem_limit: 12g
    cpus: 2
    pids_limit: 64
    stop_grace_period: 32m
    depends_on:
      init: {condition: service_completed_successfully}

  ai-music-worker:
    <<: *hardening
    profiles: [ai-music]
    # Bubblewrap creates nested user/mount/PID namespaces. Keep confinement,
    # with the scoped profiles installed as described in the hosting guide.
    security_opt:
      - no-new-privileges:true
      - seccomp=${GLOB2_AI_MUSIC_SECCOMP_PROFILE:-./security/ai-music-seccomp.json}
      - apparmor=${GLOB2_AI_MUSIC_APPARMOR_PROFILE:-glob2-ai-music}
      - systempaths=unconfined
    platform: linux/amd64
    image: ${GLOB2_AI_MUSIC_IMAGE:-glob2-ai-music-worker:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ai-music-worker
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      MUSIC_OPENAI_API_KEY: ${MUSIC_OPENAI_API_KEY:-}
      RELAY_KEYS_FILE: ''
      ENGINE_AGENT_KEYS_FILE: ''
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend, egress]
    tmpfs: ['/tmp:size=6g,mode=1777']
    mem_limit: 12g
    cpus: 2
    pids_limit: 96
    stop_grace_period: 40s
    depends_on:
      init: {condition: service_completed_successfully}

  skin-render-worker:
    <<: *hardening
    image: ${GLOB2_SKIN_RENDER_IMAGE:-glob2-skin-render-worker:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: skin-render-worker
      args: {JOBS: '${GLOB2_BUILD_JOBS:-4}'}
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      RELAY_KEYS_FILE: ''
      ENGINE_AGENT_KEYS_FILE: ''
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend]
    tmpfs: ['/tmp:size=512m,mode=1777']
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 6m
    depends_on:
      init: {condition: service_completed_successfully}

  ai-map-worker:
    <<: *hardening
    profiles: [ai-maps]
    image: ${GLOB2_AI_MAP_IMAGE:-glob2-ai-map-worker:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ai-map-worker
      args: {JOBS: '${GLOB2_BUILD_JOBS:-4}'}
    command: [node, apps/ai-map-worker/src/main.ts]
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      ENGINE_AGENT_KEYS_FILE: ''
      MAP_OPENAI_API_KEY: ${MAP_OPENAI_API_KEY:-}
      RELAY_KEYS_FILE: ''
      SHUTDOWN_GRACE_SECONDS: 290
    tmpfs: ['/tmp:size=1024m,mode=1777']
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend, egress]
    depends_on:
      init: {condition: service_completed_successfully}
    stop_grace_period: 5m

  ai-terrain-worker:
    <<: *hardening
    profiles: [ai-terrain]
    image: ${GLOB2_AI_TERRAIN_IMAGE:-glob2-ai-terrain-worker:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ai-terrain-worker
      args: {JOBS: '${GLOB2_BUILD_JOBS:-4}'}
    command: [node, apps/ai-terrain-worker/src/main.ts]
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      ENGINE_AGENT_KEYS_FILE: ''
      TERRAIN_OPENAI_API_KEY: ${TERRAIN_OPENAI_API_KEY:-}
      RELAY_KEYS_FILE: ''
      SHUTDOWN_GRACE_SECONDS: 290
    tmpfs: ['/tmp:size=1024m,mode=1777']
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend, egress]
    depends_on:
      init: {condition: service_completed_successfully}
    stop_grace_period: 5m

  ai-building-worker:
    <<: *hardening
    profiles: [ai-building]
    image: ${GLOB2_AI_BUILDING_IMAGE:-glob2-ai-building-worker:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ai-building-worker
      args: {JOBS: '${GLOB2_BUILD_JOBS:-4}'}
    command: [node, apps/ai-building-worker/src/main.ts]
    environment:
      <<: *platform-environment
      DATABASE_URL: postgres://glob2_worker@postgres:5432/glob2
      DATABASE_PASSWORD_FILE: /var/lib/glob2/db/worker/password
      ENGINE_AGENT_KEYS_FILE: ''
      BUILDING_OPENAI_API_KEY: ${BUILDING_OPENAI_API_KEY:-}
      RELAY_KEYS_FILE: ''
      SHUTDOWN_GRACE_SECONDS: 290
    tmpfs: ['/tmp:size=1024m,mode=1777']
    volumes:
      - db-worker-secret:/var/lib/glob2/db/worker:ro
      - blobs:/var/lib/glob2/blobs
      - *instance-config
    networks: [backend, egress]
    depends_on:
      init: {condition: service_completed_successfully}
    stop_grace_period: 5m

  engine-agent:
    <<: *hardening
    # Asset-capable engines require nested Bubblewrap namespaces. Reuse the
    # confined namespace policy also used by the recipe worker.
    security_opt:
      - no-new-privileges:true
      - seccomp=${GLOB2_ENGINE_SECCOMP_PROFILE:-./security/ai-music-seccomp.json}
      - apparmor=${GLOB2_ENGINE_APPARMOR_PROFILE:-glob2-engine}
      - systempaths=unconfined
    image: ${GLOB2_ENGINE_AGENT_IMAGE:-glob2-engine-agent:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: engine-agent
      args:
        JOBS: '${GLOB2_BUILD_JOBS:-4}'
        GLOB2_SIM_VERSION: ${GLOB2_SIM_VERSION:-}
    # Engine scratch (generated maps, verification replays) lives here.
    tmpfs: ['/tmp:size=${GLOB2_ENGINE_SCRATCH_SIZE:-1g},mode=1777']
    # It runs the engine on uploaded files, so it gets no database or blob
    # store: jobs, results and blobs go through platform-api's internal API.
    environment:
      PUBLIC_ORIGIN: ${GLOB2_PUBLIC_ORIGIN:-https://localhost:8443}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-25}
      ENGINE_CONCURRENCY: ${ENGINE_CONCURRENCY:-1}
      ENGINE_SET_VALIDATION: ${ENGINE_SET_VALIDATION:-0}
      PLATFORM_INTERNAL_URL: http://platform-api:8080
      ENGINE_AGENT_KEY_FILE: /var/lib/glob2/engine-agent/agent.key
    volumes: [engine-agent-secret:/var/lib/glob2/engine-agent:ro]
    networks: [backend]
    deploy:
      replicas: ${GLOB2_ENGINE_AGENT_REPLICAS:-1}
    stop_grace_period: 40s
    depends_on:
      init: {condition: service_completed_successfully}
      platform-api: {condition: service_healthy}

  relay:
    <<: *hardening
    image: ${GLOB2_RELAY_IMAGE:-glob2-relay:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: relay
      args: {JOBS: '${GLOB2_BUILD_JOBS:-4}'}
    environment:
      # Each replica registers wss://<origin host>/relay/<container id> under a
      # stable relay id relay-<n> claimed on the spool volume (relay-entrypoint.sh).
      GLOB2_PUBLIC_ORIGIN: ${GLOB2_PUBLIC_ORIGIN:-https://localhost:8443}
      GLOB2_RELAY_PLATFORM_URL: http://platform-api:8080
      # Fetch ticket keys on the backend network, not from the public jwksUrl
      # the registration response names.
      GLOB2_RELAY_JWKS_URL: http://platform-api:8080/.well-known/jwks.json
      GLOB2_RELAY_KEY_FILE: /var/lib/glob2/relay/relay.key
      GLOB2_RELAY_REGION: ${GLOB2_RELAY_REGION:-default}
      GLOB2_RELAY_ALLOWED_ORIGINS: ${GLOB2_PUBLIC_ORIGIN:-https://localhost:8443}
      GLOB2_RELAY_TRUSTED_PROXIES: ${GLOB2_PROXY_ADDRESS:-172.30.89.10}
      GLOB2_RELAY_MAX_MATCHES: ${GLOB2_RELAY_MAX_MATCHES:-200}
      GLOB2_RELAY_DRAIN_TIMEOUT_SECONDS: ${GLOB2_RELAY_DRAIN_SECONDS:-1800}
    volumes:
      - relay-secret:/var/lib/glob2/relay:ro
      - relay-spool:/var/spool/glob2-relay
    networks: [backend]
    deploy:
      replicas: ${GLOB2_RELAY_REPLICAS:-1}
    # Longer than the drain deadline, so running matches can finish.
    stop_grace_period: ${GLOB2_RELAY_STOP_GRACE:-31m}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:7495/readyz']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      init: {condition: service_completed_successfully}
      platform-api: {condition: service_healthy}

  caddy:
    <<: *hardening
    image: ${GLOB2_CADDY_IMAGE:-glob2-caddy:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: caddy
      args:
        GLOB2_WEBSITE_URL: ${GLOB2_WEBSITE_URL:-}
        GLOB2_DOWNLOAD_URL: ${GLOB2_DOWNLOAD_URL:-}
    # Permit standard HTTP/TLS ports only within this network namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    environment:
      GLOB2_DOMAIN: ${GLOB2_DOMAIN:-localhost}
      GLOB2_ADDITIONAL_DOMAIN: ${GLOB2_ADDITIONAL_DOMAIN:-}
      GLOB2_REDIRECT_DOMAINS: ${GLOB2_REDIRECT_DOMAINS:-http://redirect.invalid}
      GLOB2_TLS_MODE: ${GLOB2_TLS_MODE:-auto}
      GLOB2_EDGE_TRUSTED_PROXIES: ${GLOB2_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - '${GLOB2_BIND:-127.0.0.1}:${GLOB2_HTTP_PORT:-8080}:80'
      - '${GLOB2_BIND:-127.0.0.1}:${GLOB2_HTTPS_PORT:-8443}:443'
      - '${GLOB2_BIND:-127.0.0.1}:${GLOB2_HTTPS_PORT:-8443}:443/udp'
    volumes:
      - type: bind
        source: ${GLOB2_WEB_CLIENT_DIR:-./web-client}
        target: /srv/play
        read_only: true
        bind: {create_host_path: true}
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: ${GLOB2_PROXY_ADDRESS:-172.30.89.10}
      public: {}
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2015/livez']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      platform-api: {condition: service_healthy}

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${GLOB2_BACKEND_SUBNET:-172.30.89.0/24}
          # Keep dynamic service addresses away from Caddy's fixed proxy address.
          ip_range: ${GLOB2_BACKEND_IP_RANGE:-172.30.89.128/25}
  egress: {}
  public: {}

volumes:
  postgres-data: {}
  blobs: {}
  signing-keys: {}
  relay-secret: {}
  engine-agent-secret: {}
  db-migrator-secret: {}
  db-api-secret: {}
  db-worker-secret: {}
  relay-spool: {}
  caddy-data: {}
  caddy-config: {}
