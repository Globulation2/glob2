RepoType: git
Repo: https://github.com/Globulation2/glob2.git

Builds:
  - versionName: 0.9.5.0
    versionCode: 905001
    commit: v0.9.5.0
    ndk: 28.2.13676358
    timeout: 10800
    rm:
      - test/fixtures
      - test/maxima/fixtures
      - tests
      - datasrc
      - games
    # Legacy game maps are gzip-compressed data. colony.bin is a menu save
    # snapshot generated by tools/MenuColonyHarness.cpp; none are executable.
    scanignore:
      - maps/*.map.gz
      - campaigns/*.map.gz
      - data/menu/colony.bin
    prebuild: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends git python3 python3-pip g++ make cmake ninja-build scons pkg-config unzip zip autoconf automake libtool curl perl nasm
    build: python3 mobile/fdroid_build.py --version-code $$VERCODE$$ --android-sdk $$SDK$$ --android-ndk $$NDK$$
    output: build/fdroid-output.apk
