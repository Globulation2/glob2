<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Copyright (C) 2026 glob2 contributors

     Farm area marker (the farm-areas experiment), hand-authored for glob2.
     Eight animation frames on a 128x128 canvas, the 4x high-resolution size of
     the 32x32 classic area markers. Like the guard dots and clearing sickles,
     the motif is sparse on a transparent ground: five seedlings, each swaying
     about its base with its own phase. tools/artwork/render_authored.py renders
     group "frameN" to data/highres/v1/area-farmN.png (128px) and
     data/gfx/area-farmN.png (32px). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- A two-leaf seedling standing on its origin: stem, two leaves, outline. -->
    <g id="seedling" transform="scale(1.3)">
      <path d="M0 0 C 0.5 -5, -0.5 -9, 0 -14" fill="none" stroke="#0a4a1c" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M0 -10 C -3 -15, -10 -16, -13 -12 C -9 -8, -3 -8, 0 -10 Z" fill="#8cf06a" stroke="#0a4a1c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 -13 C 3 -19, 10 -21, 13 -17 C 9 -12, 3 -11, 0 -13 Z" fill="#c4ff86" stroke="#0a4a1c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 0 C 0.5 -5, -0.5 -9, 0 -14" fill="none" stroke="#e6ffb0" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="0.8" rx="5" ry="1.8" fill="#0a4a1c" opacity="0.55"/>
    </g>
  </defs>
  <g id="frame0" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(0.0)"/>
    <use href="#seedling" transform="translate(86 30) rotate(11.0)"/>
    <use href="#seedling" transform="translate(56 74) rotate(0.5)"/>
    <use href="#seedling" transform="translate(22 108) rotate(-10.5)"/>
    <use href="#seedling" transform="translate(100 98) rotate(8.9)"/>
  </g>
  <g id="frame1" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(7.8)"/>
    <use href="#seedling" transform="translate(86 30) rotate(7.5)"/>
    <use href="#seedling" transform="translate(56 74) rotate(-7.4)"/>
    <use href="#seedling" transform="translate(22 108) rotate(-9.8)"/>
    <use href="#seedling" transform="translate(100 98) rotate(1.7)"/>
  </g>
  <g id="frame2" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(11.0)"/>
    <use href="#seedling" transform="translate(86 30) rotate(-0.3)"/>
    <use href="#seedling" transform="translate(56 74) rotate(-11.0)"/>
    <use href="#seedling" transform="translate(22 108) rotate(-3.4)"/>
    <use href="#seedling" transform="translate(100 98) rotate(-6.5)"/>
  </g>
  <g id="frame3" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(7.8)"/>
    <use href="#seedling" transform="translate(86 30) rotate(-8.0)"/>
    <use href="#seedling" transform="translate(56 74) rotate(-8.1)"/>
    <use href="#seedling" transform="translate(22 108) rotate(5.0)"/>
    <use href="#seedling" transform="translate(100 98) rotate(-10.9)"/>
  </g>
  <g id="frame4" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(0.0)"/>
    <use href="#seedling" transform="translate(86 30) rotate(-11.0)"/>
    <use href="#seedling" transform="translate(56 74) rotate(-0.5)"/>
    <use href="#seedling" transform="translate(22 108) rotate(10.5)"/>
    <use href="#seedling" transform="translate(100 98) rotate(-8.9)"/>
  </g>
  <g id="frame5" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(-7.8)"/>
    <use href="#seedling" transform="translate(86 30) rotate(-7.5)"/>
    <use href="#seedling" transform="translate(56 74) rotate(7.4)"/>
    <use href="#seedling" transform="translate(22 108) rotate(9.8)"/>
    <use href="#seedling" transform="translate(100 98) rotate(-1.7)"/>
  </g>
  <g id="frame6" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(-11.0)"/>
    <use href="#seedling" transform="translate(86 30) rotate(0.3)"/>
    <use href="#seedling" transform="translate(56 74) rotate(11.0)"/>
    <use href="#seedling" transform="translate(22 108) rotate(3.4)"/>
    <use href="#seedling" transform="translate(100 98) rotate(6.5)"/>
  </g>
  <g id="frame7" class="frame">
    <use href="#seedling" transform="translate(26 40) rotate(-7.8)"/>
    <use href="#seedling" transform="translate(86 30) rotate(8.0)"/>
    <use href="#seedling" transform="translate(56 74) rotate(8.1)"/>
    <use href="#seedling" transform="translate(22 108) rotate(-5.0)"/>
    <use href="#seedling" transform="translate(100 98) rotate(10.9)"/>
  </g>
</svg>
