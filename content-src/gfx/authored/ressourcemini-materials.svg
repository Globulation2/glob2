     Carried-material icons, frames 8-11 (gold, metal, glass, fabric): the
     later materials' classic icons are 16x16 frames holding a small lump in
     the middle. Hand-authored for glob2 on a 64x64 canvas, the 4x
     high-resolution size of data/gfx/ressourcemini8-11.png. Each is drawn in
     the style of its map resource (faceted gold and iron ore, silica crystals,
     cotton bolls), at the classic icon's size and place, with light from the
     upper left; the classic icons are much duller than that art, so these keep
     its brightness and lean only halfway toward the classic colour. The classic frames stay as they are.
     tools/artwork/render_authored.py renders group "frameN" to
     data/highres/v1/ressourceminiN.png. -->
