     The farm area's zone-strip button (gamegui frame 58), hand-authored for
     glob2 like area-farm.svg: the zone's colour as a 1px frame at 4..27, the
     same frame the forbidden, guard and clearing buttons use, around two of the
     marker's seedlings. Classic size only; gamegui has no high-resolution layer.
     tools/artwork/render_authored.py renders it to data/gfx/gamegui58.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <g id="seedling">
      <path d="M0 0 C 0.5 -5, -0.5 -9, 0 -14" fill="none" stroke="#0a4a1c" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M0 -10 C -3 -15, -10 -16, -13 -12 C -9 -8, -3 -8, 0 -10 Z" fill="#8cf06a" stroke="#0a4a1c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 -13 C 3 -19, 10 -21, 13 -17 C 9 -12, 3 -11, 0 -13 Z" fill="#c4ff86" stroke="#0a4a1c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 0 C 0.5 -5, -0.5 -9, 0 -14" fill="none" stroke="#e6ffb0" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="4.5" y="4.5" width="23" height="23" fill="none" stroke="#00c850" stroke-width="1" shape-rendering="crispEdges"/>
  <use href="#seedling" transform="translate(12 24) scale(0.46) rotate(-6)"/>
  <use href="#seedling" transform="translate(19.5 18) scale(0.46) rotate(8)"/>
</svg>
