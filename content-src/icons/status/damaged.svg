<style>.fill{fill:#fff;stroke:#12141e;stroke-width:1.5;stroke-linejoin:round;paint-order:stroke}.line{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.heavy{stroke-width:3.2}.cut{fill:none;stroke:#12141e;stroke-width:1.6;stroke-linecap:round}.edge.line{stroke:#12141e;stroke-width:5.2}.edge.thin{stroke-width:4.6}.edge.heavy{stroke-width:5.8}</style>
<!-- Fire: one classic flame. A round-bottomed bulb tapers to a single main tip that sways up and slightly left; a shallow lick swells from each shoulder, merged into the body by gentle notches rather than cut apart, so it reads as one blob of flame at 12 px instead of three prongs. Solid white silhouette, point-up: the opposite of the point-down heart, and the shoulder licks keep it from reading as a water drop. Spans x 3.8-20.7, y 1.1-21.1. -->
