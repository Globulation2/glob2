<!-- Hungry: an upright three-tine fork beside a straight-spined knife, never crossed. Tines and slots sit on the 2.4-unit grid of the 10 px frame (head x 2.4-14.4, slots 4.6-7.4 and 9.4-12.2 as dark fills), so all three tines stay separate at the in-game size; the knife blade (x 16.4-21.6) is wider than its handle and ends in a convex slant to the tip. Spans x 2.4-21.6, y 3.8-21.6, with the top corners kept clear of the disc rim. -->
