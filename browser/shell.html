<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Globulation 2</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;outline:none;touch-action:none}
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600" tabindex="0" aria-label="Globulation 2" oncontextmenu="event.preventDefault()"></canvas>
<script>
const canvas = document.getElementById('canvas');
function fitCanvas() {
  if (!canvas.width || !canvas.height) return;
  const scale = Math.min(innerWidth / canvas.width, innerHeight / canvas.height);
  canvas.style.width = canvas.width * scale + 'px';
  canvas.style.height = canvas.height * scale + 'px';
}
addEventListener('resize', fitCanvas);
new MutationObserver(fitCanvas).observe(canvas, {attributes:true,attributeFilter:['width','height']});
fitCanvas();
var Module = {
  noInitialRun: true,
  canvas,
  browserLog: [],
  print(text) { Module.browserLog.push(String(text)); console.log(text); },
  printErr(text) { Module.browserLog.push(String(text)); console.error(text); },
  preRun: [function() {
    ENV.HOME = '/home/web_user';
    FS.mkdirTree('/home/web_user');
    Module.saveMount = FS.mount(IDBFS, {autoPersist:true}, '/home/web_user').mount;
    addRunDependency('browser-saves');
    FS.syncfs(true, err => {
      Module.storageRestore = err ? 'failed' : 'ready';
      if (err) Module.printErr('Save restore failed: ' + err);
      removeRunDependency('browser-saves');
    });
  }],
  onRuntimeInitialized() {
    const scale = Math.max(1, 800 / innerWidth, 600 / innerHeight);
    const width = Math.round(innerWidth * scale);
    const height = Math.round(innerHeight * scale);
    canvas.focus();
    Module.callMain(['-s', width + 'x' + height, '-F', '-G']);
  },
  onGameExit(code) {
    Module.print('Game exited with code ' + code + '. Reload the page to restart.');
  },
  onAbort(reason) { Module.printErr('Game stopped: ' + reason); }
};
async function localFileDigest(directory, name, extension) {
  if (!/^[A-Za-z0-9 _.-]+$/.test(name) || name.includes('..') || !name.endsWith('.' + extension))
    throw Error('Invalid local file name');
  const path = '/home/web_user/.glob2/' + directory + '/' + name;
  if (!FS.analyzePath(path).exists) return null;
  const data = FS.readFile(path);
  const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', data));
  return Object.freeze({size:data.length, sha256:Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('')});
}
// Read-only observability shared by developer tools and automated assertions.
Object.defineProperty(window, 'glob2Diagnostics', {value: Object.freeze({
  snapshot() {
    return Object.freeze({version:1, screen:Module.glob2Screen || 'loading',
      tick:Module.glob2Tick || 0, frames:Module.glob2Frames || 0,
      paused:Boolean(Module.glob2Paused), width:canvas.width, height:canvas.height,
      restore:Module.storageRestore || 'restoring',
      persisting:Boolean(Module.saveMount?.idbPersistState),
      audio:Module.SDL2?.audioContext?.state || 'inactive'});
  },
  saves() {
    const path = '/home/web_user/.glob2/games';
    return FS.analyzePath(path).exists ? FS.readdir(path).filter(n => n.endsWith('.game')).sort() : [];
  },
  saveDigest(name) { return localFileDigest('games', name, 'game'); },
  mapDigest(name) { return localFileDigest('maps', name, 'map'); }
})});
function focusGame() {
  canvas.focus();
  Module.SDL2?.audioContext?.resume();
}
canvas.addEventListener('pointerdown', focusGame);
canvas.addEventListener('keydown', () => Module.SDL2?.audioContext?.resume());
</script>
{{{ SCRIPT }}}
</body>
</html>
