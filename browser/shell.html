<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-visual">
<link rel="icon" href="data:,">
<title>Globulation 2</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07110f}
body{display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 50% 42%,rgba(83,142,92,.3),transparent 34%),
  radial-gradient(circle at 18% 16%,rgba(178,143,65,.14),transparent 26%),
  linear-gradient(145deg,#12251f 0%,#07110f 58%,#020605 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:
  linear-gradient(30deg,transparent 48%,rgba(255,255,255,.045) 49%,rgba(255,255,255,.045) 51%,transparent 52%);
  background-size:28px 28px}
canvas{display:block;outline:none;touch-action:none;opacity:0;transition:opacity .2s ease}
body.ready canvas{opacity:1}
#loading{position:fixed;z-index:1;display:grid;justify-items:center;gap:14px;color:#e8edcf;
  text-align:center;text-shadow:0 2px 8px #000;transition:opacity .2s ease}
body.ready #loading{opacity:0;pointer-events:none}
#loading strong{font:700 clamp(24px,5vw,46px)/1 Georgia,serif;letter-spacing:.04em;color:#f2df94}
#loading-status{min-height:1.4em;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#c2cba9}
.loader{width:42px;height:42px;border:4px solid rgba(232,237,207,.2);border-top-color:#e4c969;
  border-radius:50%;animation:spin .85s linear infinite;box-shadow:0 0 24px rgba(228,201,105,.18)}
#loading-progress{display:grid;justify-items:center;gap:8px;width:min(320px,calc(100vw - 32px))}
#loading-progress[hidden]{display:none}
#loading-bar{width:100%;height:8px;border-radius:4px;background:rgba(232,237,207,.16);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(232,237,207,.12)}
#loading-bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#b28f41,#e4c969);transition:width .25s linear}
#loading-detail{font-size:14px;font-variant-numeric:tabular-nums;color:#e8edcf}
#loading-note{max-width:min(360px,calc(100vw - 32px));margin:0;font-size:13px;line-height:1.45;color:#aeb79a}
#loading-retry{font:600 15px system-ui,sans-serif;padding:10px 22px;min-height:44px;border:0;border-radius:6px;
  background:#e4c969;color:#173226;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loader{animation:none;border-color:#e4c969}canvas,#loading,#loading-bar>span{transition:none}}
</style>
</head>
