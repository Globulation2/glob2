name: globulation2
base: core24
adopt-info: glob2
summary: Real time strategy with automatic unit task assignment
description: |
  Globulation 2 is a real time strategy game that lets players assign
  units to tasks rather than directing each unit individually.
license: GPL-3.0-or-later
website: https://globulation2.org/
source-code: https://github.com/Globulation2/glob2
issues: https://github.com/Globulation2/glob2/issues
icon: data/icons/glob2-icon-256x256.png
grade: stable
confinement: strict

apps:
  globulation2:
    command: usr/bin/glob2
    common-id: org.globulation2.Globulation2
    desktop: usr/share/applications/org.globulation2.Globulation2.desktop
    environment:
      GLOB2_ASSET_DIR: $SNAP/usr/share/glob2
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib
    plugs:
      - audio-playback
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - wayland
      - x11

parts:
  glob2:
    plugin: nil
    source: .
    parse-info:
      - data/org.globulation2.Globulation2.metainfo.xml
    build-packages:
      - nasm
      - pkg-config
      - libva-dev
      - g++
      - python3
      - python3-venv
      - scons
      - cmake
      - ninja-build
      - libpng-dev
      - libjpeg-dev
      - libwebp-dev
      - libfreetype-dev
      - libx11-dev
      - libxext-dev
      - libxcursor-dev
      - libxi-dev
      - libxrandr-dev
      - libasound2-dev
      - libpulse-dev
      - libwayland-dev
      - libxkbcommon-dev
      - libvorbis-dev
      - libogg-dev
      - libspeex-dev
      - libboost-dev
      - libssl-dev
      - zlib1g-dev
      - libfribidi-dev
      - libpcre3-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - libepoxy-dev
    stage-packages:
      - libva2
      - libva-drm2
      - libx11-6
      - libxext6
      - libxcursor1
      - libxi6
      - libxrandr2
      - libxss1
      - libasound2t64
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libpng16-16t64
      - libjpeg-turbo8
      - libfreetype6
      - libvorbisfile3
      - libogg0
      - libspeex1
      - libfribidi0
      - libpcre3
      - libpulse0
      - libgl1
      - libglu1-mesa
      - libepoxy0
      - libssl3t64
    override-build: |
      craftctl set version="$(python3 tools/release/release.py check)"
      python3 scons/sdl3_dependencies.py --prefix "$CRAFT_PART_BUILD/build/sdl3/prefix" --work "$CRAFT_PART_BUILD/build/sdl3/sources"
      export GLOB2_SDL3_PREFIX="$CRAFT_PART_BUILD/build/sdl3/prefix"
      scons -j2 release=1 server=0 lean_images=1 \
        BINDIR="$CRAFT_PART_INSTALL/usr/bin" \
        INSTALLDIR="$CRAFT_PART_INSTALL/usr/share" \
        DATADIR=/usr/share install
      python3 tools/release/release.py verify-install --stage "$CRAFT_PART_INSTALL"
      sed -i 's|^Icon=glob2$|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/glob2.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/org.globulation2.Globulation2.desktop"
