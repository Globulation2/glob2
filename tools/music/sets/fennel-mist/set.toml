# Soundtrack set "fennel-mist": see composition.py for the score and its form.
# Samples are pinned file by file in samples.lock; level references are frozen in levels.toml.
title = "Fennel Mist"
method = "symbolic-acoustic"
license = "GPL-3.0-or-later"
ai_generated = false
shipped = true
# 0 keeps the approved humanisation (seeded from the set id); any other value is a new performance.
seed = 0
description = """An original slow pastoral score in E Dorian (4/4, 72 bpm, 24 bars): bassoon and horn under a flute descant, with harp and strings. Calm is the low lead, descant, harp and quiet pads; building adds semiquaver harp, pizzicato and soft hand drums; combat hands the tune to horn over a semiquaver spiccato engine, tremolo violas, tuba and a drum line."""
credits = [
