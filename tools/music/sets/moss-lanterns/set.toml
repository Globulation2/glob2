# Soundtrack set "moss-lanterns": see composition.py for the score and its form.
# Samples are pinned file by file in samples.lock; level references are frozen in levels.toml.
title = "Moss Lanterns"
method = "symbolic-acoustic"
license = "GPL-3.0-or-later"
ai_generated = false
shipped = true
# 0 keeps the approved humanisation (seeded from the set id); any other value is a new performance.
seed = 0
description = """An original chamber score in G minor (4/4, 92 bpm, 32 bars) for flute, clarinet, oboe, harp, glockenspiel and strings, echoing the key, tempo and high woodwind lead of the original soundtrack. A theme, a development in Bb, a G major lift with a chromatic-mediant climax, and a varied return. Calm is lead, counter-line and rolled harp; building adds pizzicato, walking bass and hand percussion; combat adds spiccato strings, horn, timpani and a light drum line."""
credits = [
    "Composed for Globulation 2 as a score written in code (composition.py), performed and mixed by the glob2music pipeline.",
    "Samples: VSCO 2 Community Edition, Versilian Studios (Sam Gossner), CC0 1.0.",
    "Rendered with sfizz 1.2.3 (BSD-2-Clause).",
]

# The bus chain in glob2music.score.mix already high-passes at 32 Hz; a second high-pass
# in master.finish would only thin the low end the maintainer approved.
[master]
highpass_hz = 0.0
