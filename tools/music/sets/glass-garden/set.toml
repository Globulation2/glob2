# Soundtrack set "glass-garden": see composition.py for the score and its form, patches.py
# for the Surge XT sound design, and recipe.py for how they are rendered and mixed.
title = "Glass Garden"
method = "symbolic-synth"
license = "GPL-3.0-or-later"
ai_generated = false
shipped = true
# 0 keeps the approved humanisation (seeded from the set id); any other value is a new performance.
seed = 0
description = """An original electronic score in D Dorian (4/4, 96 bpm, 32 bars, 80 s), echoing the original soundtrack's tempo, D/G minor centre, walking bass and mallet plucks in a warm synthesised voice: an FM bell lead with gliding legato, a PWM pad, a woody reed counter-line, a pulse-pluck arpeggio and a round bass on Surge XT patches designed for this set, with a modal kalimba, water-droplet blips and wooden and skin drums synthesised in NumPy. Theme, an answer cadencing in F, a development through G minor, Eb and C minor to an A7(b9) climax, and a varied return. Calm is lead, pad, kalimba and long bass notes; building adds the counter-line, a quaver arpeggio, syncopated bass and hand percussion; combat adds a semiquaver arpeggio, driving bass, frame drum, snaps, log drums, toms and taiko.

Approved by the maintainer by ear (October 2026). Surge renders are made deterministic as far as Surge allows (no analog drift, retriggered oscillators, key-triggered LFOs, a fresh instance per part): rebuilds agree to about 50 dB under the signal after encoding, and the shipped Oggs are the exact reference."""
credits = [
    "Composed for Globulation 2 as a score written in code (composition.py), with synthesiser patches designed for it (patches.py); performed and mixed by the glob2music pipeline.",
    "Rendered with Surge XT 1.3.4 (GPL-3.0), starting every patch from its CC0 Init state; no factory presets or samples.",
    "Kalimba, droplet and percussion voices are own-work NumPy synthesis (glob2music/backends/dsp.py).",
]

# The mix (mixdown.py) high-passes every stem itself; the approved master had no extra
# high-pass, so the shared 20 Hz one is off.
[master]
highpass_hz = 0.0
