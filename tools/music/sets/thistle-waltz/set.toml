title = "Thistle Waltz"
method = "symbolic-acoustic"
license = "GPL-3.0-or-later"
ai_generated = false
shipped = true
# 0 keeps the approved humanisation (seeded from the set id); any other value is a new performance.
seed = 0
description = """An original folk waltz in D major (3/4, 126 bpm, 48 bars) for alto and tenor recorder, ocarina, kalimba, folk harp and hand drums with strings. An 8+8 tune, a B minor middle on ocarina, the tune an octave up at the climax, and a quiet coda through bVII and bVI. Calm is lead, rolled harp and kalimba; building adds a pizzicato waltz rhythm, marimba and frame drum; combat adds spiccato strings, horn, timpani and darbuka."""
credits = [
    "Composed for Globulation 2 as a score written in code (composition.py), performed and mixed by the glob2music pipeline.",
