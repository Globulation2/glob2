description = """An original jig in A major / A Mixolydian (6/8, dotted crotchet 92, 56 bars) for flute, clarinet, oboe and glockenspiel over harp and strings, with an F# minor section and a sudden C major turn. Calm is lead, counter-lines and a jig-rhythm harp; building adds a pizzicato oom-pah, marimba and hand drums; combat re-arranges the same tune over a galloping low riff with tuba, low brass, horns and a drum line."""
