# Calibration corpus for glob2music.qa (python3 -m glob2music calibrate).
#
# Every entry is reproducible from the repository: approved sets are the files the
# game ships (content/data/zik/), and rejected sets are read from a pinned commit of the
# parked draft PR that held the first generated soundtracks (extracted into the
# git-ignored tools/music/build/calibration/). Run calibrate before changing any
# threshold in glob2music/spec.py: every "good" set must keep passing and every
# "bad" set must keep failing the check that explains its rejection.
#
# verdict: "good" = approved by the maintainer's listening, "bad" = rejected by ear,
# "reference" = the original soundtrack. `why` records the listening verdict.
# A set with a sets/<id>/set.toml is checked with that manifest's spec and waivers
# (the original's waivers live in sets/original/set.toml), exactly as `check <id>`.
#
# Other rejected candidates (the unfiltered synth sets, the ACE-Step folk prompts,
# Toy Soldiers and an earlier, low-contrast adaptation of Curious Critters) were
# never committed, so they cannot be re-measured here; their measurements are
# recorded in docs/assets/music-pipeline.md and in the QA module docstrings.

[[set]]
id = "original"
verdict = "reference"
path = "content/data/zik/original"
why = "The shipped 2000s soundtrack; the benchmark for feel."

[[set]]
id = "moss-lanterns"
verdict = "good"
path = "content/data/zik/moss-lanterns"
why = "Approved (ships as moss-lanterns, rebuilt with the dropout fixes)."

